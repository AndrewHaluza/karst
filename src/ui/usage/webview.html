<!--
  Karst token-usage webview (§ token consumption stats). Self-contained: no
  external assets (the webview CSP forbids them). Renders from the `state`
  postMessage the host pushes (state.ts → UsageState) and posts filter intent
  back (messages.ts → UsageWebviewMessage).

  It decides NOTHING. Every count arrives pre-formatted, every label
  pre-resolved, every share pre-computed — the same split the dashboard uses,
  because a number formatted here would be a second implementation of a rule
  that already lives host-side (UI-R31). The only local state is which control
  has focus.

  Styles are the shared design system's (docs/ui/DESIGN-SYSTEM.md): the
  `--k-*` tokens and `.k-*` primitives, so this view reads as one product with
  every other webview rather than carrying its own palette and button shapes.
-->
<!--KARST_CSP-->
<style>
  /*KARST_DS_CSS*/

  *{box-sizing:border-box}
  body{margin:0;background:var(--k-bg);color:var(--k-text);
    font-family:var(--k-font-ui);font-size:var(--k-text-base);padding:var(--k-space-8) var(--k-space-9)}
  .hidden{display:none}

  .uhead{display:flex;align-items:center;gap:var(--k-space-6);flex-wrap:wrap;margin-bottom:var(--k-space-6)}
  .uhead h1{font-size:var(--k-text-xl);margin:0}
  .uhead .sub{color:var(--k-text-dim);font-size:var(--k-text-sm)}
  /* The range picker sits at the right of the header for the same reason the
     dashboard's binding toggle does: it changes what every number below means,
     so it must be visible from anywhere on the page without scrolling. */
  .ranges{margin-left:auto;display:flex;gap:var(--k-space-2)}

  .err{border:var(--k-border-w) solid var(--k-danger);border-radius:var(--k-radius-lg);
    padding:var(--k-space-5) var(--k-space-6);margin-bottom:var(--k-space-6);
    color:var(--k-danger);font-size:var(--k-text-md)}

  /* Totals strip. A wide-enough minimum column so a 1.2M and a 3 sit in the
     same grid; expressed as token arithmetic rather than a raw breakpoint. */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--k-space-9) * 5),1fr));
    gap:var(--k-space-5);margin-bottom:var(--k-space-8)}
  .stat{border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-lg);
    background:var(--k-surface);padding:var(--k-space-5) var(--k-space-6)}
  .stat .k{font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.04em;color:var(--k-text-dim)}
  .stat .v{font-family:var(--k-font-mono);font-size:var(--k-text-2xl);margin-top:var(--k-space-2);
    line-height:var(--k-leading-tight)}
  .stat .n{font-size:var(--k-text-2xs);color:var(--k-text-faint);margin-top:var(--k-space-1);min-height:var(--k-space-6)}
  .stat.flag .v{color:var(--k-warning)}

  /* Token-driven `auto-fit` collapses to one column on a narrow panel instead
     of a hardcoded breakpoint — CSS media features cannot reference a --k-*
     custom property, so this is the token-only equivalent. */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--k-space-9) * 12),1fr));
    gap:var(--k-space-6);margin-bottom:var(--k-space-8)}
  .panel{border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-lg);
    background:var(--k-surface);overflow:hidden}
  .phead{display:flex;align-items:center;gap:var(--k-space-4);
    padding:var(--k-space-5) var(--k-space-6);border-bottom:var(--k-border-w) solid var(--k-border);
    font-size:var(--k-text-md);font-weight:var(--k-weight-semibold)}
  .phead .count{margin-left:auto;font-family:var(--k-font-mono);font-size:var(--k-text-xs);
    color:var(--k-text-dim);font-weight:var(--k-weight-normal)}
  .pbody{padding:var(--k-space-3) var(--k-space-6) var(--k-space-5)}

  /* One breakdown row: label, bar, count. The bar is the comparison; the number
     is the answer. Width comes from state.share — never computed here. */
  .brow{padding:var(--k-space-3) 0}
  .brow + .brow{border-top:var(--k-border-w) solid var(--k-border)}
  .brow .line{display:flex;align-items:baseline;gap:var(--k-space-4)}
  .brow .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .brow .amt{margin-left:auto;font-family:var(--k-font-mono);font-size:var(--k-text-md);flex:none}
  .brow .pct{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);color:var(--k-text-faint);flex:none;
    width:calc(var(--k-space-9) + var(--k-space-8));text-align:right}
  .bar{height:var(--k-space-2);border-radius:var(--k-radius-xs);background:var(--k-surface-sunken);
    margin-top:var(--k-space-2);overflow:hidden}
  /* The two breakdown panels answer different questions (by-stage vs by-model)
     and sit side by side, so they must not share a hue — that is what the
     ordered `--k-series-*` tokens are for. They are categorical, NOT status:
     `--k-info` means "running", and borrowing it for a chart series would make
     one colour carry two claims. */
  .bar > i{display:block;height:100%;background:var(--k-series-1);border-radius:var(--k-radius-xs)}
  .panel.models .bar > i{background:var(--k-series-2)}
  .brow .meta{font-size:var(--k-text-2xs);color:var(--k-text-faint);margin-top:var(--k-space-1)}
  .est{color:var(--k-warning)}

  table{width:100%;border-collapse:collapse;font-size:var(--k-text-md)}
  /* The table scrolls inside its own frame; the page never scrolls sideways. */
  .tscroll{overflow-x:auto}
  th{text-align:left;font-weight:var(--k-weight-semibold);font-size:var(--k-text-2xs);text-transform:uppercase;
    letter-spacing:.04em;color:var(--k-text-dim);padding:var(--k-space-4) var(--k-space-6);
    border-bottom:var(--k-border-w) solid var(--k-border);white-space:nowrap}
  th.num,td.num{text-align:right;font-family:var(--k-font-mono)}
  th[aria-sort]{color:var(--k-text)}
  th[aria-sort]::after{content:" \2193"}
  td{padding:var(--k-space-4) var(--k-space-6);border-bottom:var(--k-border-w) solid var(--k-border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--k-surface-hover)}
  td.tkt{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  td.tkt .k-btn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
  td.tkt span.plain{color:var(--k-text-dim)}

  .pager{display:flex;align-items:center;gap:var(--k-space-5);padding:var(--k-space-4) var(--k-space-6);
    font-size:var(--k-text-xs);color:var(--k-text-dim)}
  .pager .spacer{margin-left:auto}
</style>

<div class="uhead">
  <h1>Token usage</h1>
  <span class="sub" id="sub"></span>
  <div class="ranges" id="ranges"></div>
</div>

<div class="err hidden" id="err"></div>

<div id="body" class="hidden">
  <div class="stats" id="stats"></div>
  <div class="grid">
    <div class="panel stages">
      <div class="phead">By stage<span class="count" id="stageCount"></span></div>
      <div class="pbody" id="stages"></div>
    </div>
    <div class="panel models">
      <div class="phead">By model<span class="count" id="modelCount"></span></div>
      <div class="pbody" id="models"></div>
    </div>
  </div>
  <div class="panel">
    <div class="phead">By ticket<span class="count" id="tktCount"></span></div>
    <div class="tscroll">
      <table>
        <thead><tr id="thead"></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </div>
</div>

<div class="k-empty hidden" id="empty">
  <div class="k-empty-title">No AI token usage recorded yet</div>
  <div class="k-empty-hint" id="emptyHint"></div>
</div>

<script>
  /*KARST_DS_JS*/

  const vscode = acquireVsCodeApi();
  const post = (msg) => vscode.postMessage(msg);
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  // Columns of the per-ticket table. `sort` is the key posted back when the
  // header is clicked; a column without one is not sortable. The set matches
  // USAGE_SORTS host-side — an unknown key is rejected there, never applied.
  const COLUMNS = [
    { key: 'ticket', label: 'Ticket' },
    { key: 'calls', label: 'Calls', sort: 'calls', num: true },
    { key: 'input', label: 'Input', sort: 'input', num: true },
    { key: 'output', label: 'Output', sort: 'output', num: true },
    { key: 'total', label: 'Total', sort: 'total', num: true },
    { key: 'last', label: 'Last call', sort: 'recent', num: true },
  ];

  let lastState = null;
  // The last error string already surfaced through the toast, so a re-render
  // of an unchanged rejected query does not re-announce it (UI-R27).
  let lastErrorShown = null;

  /** An ISO stamp as the viewer's local date. The host sends the instant. */
  const localDate = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    return isNaN(d.getTime()) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };

  // Range presets — a real selectable chip (UI-R08, UI-R09), not a bespoke
  // bordered-button toggle: the same primitive `sidebar`'s facet pills use.
  const renderRanges = (state) => {
    const wrap = el('ranges');
    wrap.innerHTML = state.ranges.map((r) =>
      `<button type="button" class="k-chip" data-range="${esc(r.id)}" aria-pressed="${r.id === state.rangeId}">${esc(r.label)}</button>`,
    ).join('');
    for (const btn of wrap.querySelectorAll('[data-range]')) {
      karstAction(btn, (requestId) => post({ type: 'set-range', range: btn.dataset.range, requestId }));
    }
  };

  const statCard = (label, value, note, flag) =>
    `<div class="stat${flag ? ' flag' : ''}"><div class="k">${esc(label)}</div>` +
    `<div class="v">${esc(value)}</div><div class="n">${esc(note || '')}</div></div>`;

  const renderStats = (t) => {
    el('stats').innerHTML = [
      statCard('Total tokens', t.totalDisplay, t.totalExact),
      statCard('Input', t.inputDisplay, ''),
      statCard('Output', t.outputDisplay, ''),
      statCard('Cache read', t.cacheReadDisplay, ''),
      statCard('Calls', String(t.calls), t.erroredCalls ? `${t.erroredCalls} failed` : ''),
      // Estimated calls get their own tile rather than a footnote: whether the
      // headline number was measured or approximated changes how it may be used.
      statCard('Estimated', String(t.estimatedCalls), t.estimatedCalls ? 'counts approximated' : 'all measured', t.estimatedCalls > 0),
    ].join('');
  };

  const renderBreakdown = (node, rows) => {
    if (!rows.length) { node.innerHTML = '<div class="brow"><div class="meta">nothing in this range</div></div>'; return; }
    node.innerHTML = rows.map((r) =>
      '<div class="brow">' +
        '<div class="line">' +
          `<span class="lbl" title="${esc(r.label)}">${esc(r.label)}</span>` +
          `<span class="amt" title="${esc(r.totalExact)} tokens">${esc(r.totalDisplay)}</span>` +
          `<span class="pct">${esc(r.share)}%</span>` +
        '</div>' +
        `<div class="bar"><i style="width:${Number(r.share) || 0}%"></i></div>` +
        `<div class="meta">${esc(r.calls)} call${r.calls === 1 ? '' : 's'} · in ${esc(r.inputDisplay)} · out ${esc(r.outputDisplay)}` +
          (r.estimated ? ' · <span class="est">estimated</span>' : '') +
        '</div>' +
      '</div>',
    ).join('');
  };

  const renderTable = (state) => {
    const thead = el('thead');
    thead.innerHTML = COLUMNS.map((c) => {
      const cls = c.num ? ' class="num"' : '';
      if (!c.sort) return `<th${cls}>${esc(c.label)}</th>`;
      const sorted = c.sort === state.sort ? ' aria-sort="descending"' : '';
      // A real, keyboard-reachable control inside the header cell — not a
      // click handler on the <th> itself (UI-R09).
      return `<th${cls}${sorted}><button type="button" class="k-btn k-btn--link" data-sort="${esc(c.sort)}">${esc(c.label)}</button></th>`;
    }).join('');
    for (const btn of thead.querySelectorAll('[data-sort]')) {
      karstAction(btn, (requestId) => post({ type: 'set-sort', sort: btn.dataset.sort, requestId }));
    }

    const tbody = el('tbody');
    tbody.innerHTML = state.tickets.map((t) => {
      // A row with no ticket is spend recorded before the ticket existed; it has
      // no dashboard to open, so it is plain text rather than a dead button.
      const name = t.ticketId === null
        ? `<span class="plain">${esc(t.label)}</span>`
        : `<button type="button" class="k-btn k-btn--link" data-ticket="${esc(t.ticketId)}" title="${esc(t.label)}" aria-label="${esc(t.label)}">${esc(t.label)}</button>`;
      return '<tr>' +
        `<td class="tkt">${name}</td>` +
        `<td class="num">${esc(t.calls)}</td>` +
        `<td class="num">${esc(t.inputDisplay)}</td>` +
        `<td class="num">${esc(t.outputDisplay)}</td>` +
        `<td class="num" title="${esc(t.totalExact)} tokens">${esc(t.totalDisplay)}${t.estimated ? ' <span class="est">≈</span>' : ''}</td>` +
        `<td class="num">${esc(localDate(t.lastAt))}</td>` +
      '</tr>';
    }).join('');
    for (const btn of tbody.querySelectorAll('[data-ticket]')) {
      karstAction(btn, (requestId) => post({ type: 'open-dashboard', ticketId: Number(btn.dataset.ticket), requestId }));
    }

    const p = state.page;
    const first = p.groups === 0 ? 0 : p.offset + 1;
    const last = p.offset + state.tickets.length;
    const prevOffset = Math.max(0, p.offset - p.limit);
    const nextOffset = p.offset + p.limit;
    // Disabled means "unavailable" (page bounds), not "loading" — no
    // aria-busy on a statically disabled control, and a title says why
    // (UI-R17, UI-R19).
    const prevTitle = p.hasPrev ? 'Show the previous page of tickets' : 'No earlier page';
    const nextTitle = p.hasNext ? 'Show the next page of tickets' : 'No further page';
    const pager = el('pager');
    pager.innerHTML =
      `<span>${first}–${last} of ${p.groups}</span><span class="spacer"></span>` +
      `<button type="button" class="k-btn k-btn--secondary k-btn--sm" data-page="${prevOffset}" title="${prevTitle}"${p.hasPrev ? '' : ' disabled'}>Previous</button>` +
      `<button type="button" class="k-btn k-btn--secondary k-btn--sm" data-page="${nextOffset}" title="${nextTitle}"${p.hasNext ? '' : ' disabled'}>Next</button>`;
    for (const btn of pager.querySelectorAll('[data-page]')) {
      karstAction(btn, (requestId) => post({ type: 'set-page', offset: Number(btn.dataset.page), requestId }));
    }
  };

  const render = (state) => {
    if (!state) return;
    lastState = state;
    renderRanges(state);

    el('err').textContent = state.error || '';
    el('err').classList.toggle('hidden', !state.error);
    // A rejected query is announced through the one shared live region
    // (the toast) rather than a second live region on #err (UI-R27), and only
    // once per distinct error so an unrelated re-render does not re-announce it.
    if (state.error) {
      if (state.error !== lastErrorShown) karstToast('error', state.error);
      lastErrorShown = state.error;
    } else {
      lastErrorShown = null;
    }

    const rangeLabel = (state.ranges.find((r) => r.id === state.rangeId) || {}).label || '';
    el('sub').textContent = rangeLabel;

    // An error is not an empty range: showing the empty state under a rejected
    // query would claim nothing was spent when nothing was asked.
    const showEmpty = state.empty && !state.error;
    el('empty').classList.toggle('hidden', !showEmpty);
    el('emptyHint').textContent = `Nothing was recorded for ${rangeLabel.toLowerCase()}. Try a wider range, or run an AI-backed action (ticket analysis, PR description).`;
    el('body').classList.toggle('hidden', state.empty || !!state.error);
    if (state.empty || state.error) return;

    renderStats(state.totals);
    el('stageCount').textContent = state.byStage.length;
    el('modelCount').textContent = state.byModel.length;
    el('tktCount').textContent = state.page.groups;
    renderBreakdown(el('stages'), state.byStage);
    renderBreakdown(el('models'), state.byModel);
    renderTable(state);
  };

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg) return;
    if (msg.type === 'state') render(msg.state);
    else if (msg.type === 'action-result') karstSettle(msg.requestId, msg.ok, msg.message);
  });

  // The host pushes on open, but a webview that was restored (or reloaded)
  // missed it — ask, rather than render a blank page.
  post({ type: 'request-state' });
</script>
