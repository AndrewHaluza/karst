<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--KARST_CSP-->
  <title>Ticket changes</title>
  <style>
  /*KARST_DS_CSS*/

    body {
      margin: 0;
      padding: var(--k-space-7);
      /* Rebuilt from token steps rather than left as a raw length — close to
         the panel's prior 220px floor, not exact, since it is a layout
         constraint (the smallest this view stays usable at), not a design
         value with a token of its own. */
      min-width: calc(var(--k-space-9) * 8);
      color: var(--k-text);
      background: var(--k-bg);
      font: var(--vscode-font-weight) var(--k-text-base)/var(--k-leading-normal) var(--k-font-ui);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--k-space-6);
      padding-bottom: var(--k-space-6);
      border-bottom: var(--k-border-w) solid var(--k-border);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: var(--k-space-3);
    }
    /* The tree/list switcher, the same shape as usage's range selector: two
       `.k-chip` toggle buttons; `aria-pressed` carries the engaged mode
       (UI-R26). "Tree" is the default (folders first, then files); "List" is
       the flat all-files view. */
    .view-toggle { display: flex; gap: var(--k-space-2); }
    h1 {
      margin: 0;
      font-size: var(--k-text-xl);
      font-weight: var(--k-weight-semibold);
      letter-spacing: -0.01em;
    }
    #summary {
      margin-top: var(--k-space-1);
      color: var(--k-text-dim);
      font-family: var(--k-font-mono);
      font-size: var(--k-text-sm);
      font-variant-numeric: tabular-nums;
    }
    .filter { display: block; margin-block: var(--k-space-6); }
    .filter input { width: 100%; }
    #notice {
      margin-bottom: var(--k-space-6);
      padding: var(--k-space-4) var(--k-space-5);
      color: var(--k-danger);
      border-left: calc(var(--k-border-w) * 3) solid var(--k-danger);
      background: var(--k-surface);
    }
    #notice[hidden] { display: none; }
    #repos {
      display: grid;
      gap: var(--k-space-5);
    }
    details, summary { min-width: 0; }
    summary {
      position: relative;
      cursor: pointer;
      user-select: none;
    }
    summary::-webkit-details-marker { display: none; }
    /* A real, explicitly hidden element rather than `content:` on ::before: a
       generated-content character can be read aloud by some screen readers
       (there is no way to put aria-hidden on a pseudo-element), so the
       chevron is DOM now and carries its own aria-hidden. Optically centred
       against the row, not dropped at its top: an absolutely positioned
       marker takes its static position from the first line box, so a
       two-line repo header or a baseline-aligned commit row left the chevron
       riding high. Anchoring to the summary's own middle holds at every row
       height and in both states — the open rotation carries the same offset. */
    .chev {
      position: absolute;
      top: 50%;
      left: var(--k-space-3);
      line-height: 1;
      color: var(--k-text-dim);
      font-family: var(--k-font-mono);
      transform: translateY(-50%);
      transform-origin: center;
      transition: transform var(--k-dur-fast) var(--k-ease-standard);
    }
    details[open] > summary > .chev { transform: translateY(-50%) rotate(90deg); }
    .repo {
      min-width: 0;
      border: var(--k-border-w) solid var(--k-border);
      border-left: calc(var(--k-border-w) * 3) solid var(--k-border);
      background: var(--k-bg);
    }
    .repo[open] { border-left-color: var(--k-focus); }
    .repo > summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: var(--k-space-6);
      padding: var(--k-space-4) var(--k-space-5) var(--k-space-4) var(--k-space-8);
      background: var(--k-surface);
      list-style-position: inside;
    }
    .repo[open] > summary { border-bottom: var(--k-border-w) solid var(--k-border); }
    .repo > summary > span:first-child { min-width: 0; }
    .repo > summary strong,
    .repo > summary small {
      display: block;
      overflow-wrap: anywhere;
    }
    .repo > summary strong { font-weight: var(--k-weight-semibold); }
    .repo > summary small,
    .repo > summary > span:last-child {
      color: var(--k-text-dim);
      font-family: var(--k-font-mono);
      font-size: var(--k-text-md);
      font-variant-numeric: tabular-nums;
    }
    .repo > summary > span:last-child { text-align: right; }
    .group {
      margin: 0 var(--k-space-5) 0 var(--k-space-6);
      border-left: var(--k-border-w) solid var(--k-border);
    }
    .group + .group { border-top: var(--k-border-w) solid var(--k-border); }
    .group > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--k-space-5);
      padding: var(--k-space-4) var(--k-space-4) var(--k-space-4) var(--k-space-8);
      color: var(--k-text-dim);
      font-family: var(--k-font-mono);
      font-size: var(--k-text-xs);
      font-weight: var(--k-weight-semibold);
      letter-spacing: 0.055em;
    }
    .group > summary span {
      min-width: 2ch;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .commit {
      margin-left: var(--k-space-5);
      /* Was color-mix(in srgb, var(--line) 72%, transparent) — a computed
         literal standing in for "a bit fainter than the group/repo border".
         The plain border token already reads as the subtler divider at this
         nesting depth, so it carries the same hierarchy without a second,
         undocumented opacity-of-a-token concept. */
      border-top: var(--k-border-w) solid var(--k-border);
    }
    .commit > summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      gap: var(--k-space-3);
      align-items: baseline;
      padding: var(--k-space-3) var(--k-space-4) var(--k-space-3) var(--k-space-8);
      list-style-position: inside;
    }
    /* The hash sits directly ahead of the subject with only the layout's own
       gap between them — the old 84px alignment rail was the "huge space"
       between the marker column and the paths. Selectable on purpose: a commit
       hash is something the reader retypes into git, so `summary`'s
       user-select:none is lifted here (the click handler keeps a drag-select
       from toggling the row). */
    .commit > summary code {
      overflow: hidden;
      color: var(--k-link);
      font-family: var(--k-font-mono);
      text-overflow: ellipsis;
      user-select: text;
      cursor: text;
    }
    /* Row action, shown on hover like VS Code's own list rows — and on focus, so
       it is reachable without a pointer. It carries the FULL hash, not the
       abbreviation on screen. Appearance (background/border/padding/radius) is
       entirely the .k-iconbtn primitive's; only the show-on-hover visibility is
       screen-local layout. */
    .copy-hash {
      align-self: center;
      opacity: 0;
    }
    .commit > summary:hover .copy-hash,
    .copy-hash:focus-visible,
    .copy-hash.is-success { opacity: 1; }
    .commit > summary > span {
      color: var(--k-text-dim);
      font-family: var(--k-font-mono);
      font-size: var(--k-text-md);
      font-variant-numeric: tabular-nums;
    }
    .commit-meta {
      padding: 0 var(--k-space-4) var(--k-space-3) var(--k-space-8);
      color: var(--k-text-dim);
      font-size: var(--k-text-md);
      overflow-wrap: anywhere;
    }
    /* A real interactive treatment from the ghost button variant plus the row
       modifier (full width, left-aligned, and a success flash that is the row's
       own highlight instead of a check badge — see designComponents), with grid
       placement only local (STYLE-GUIDE §4): no local background/border/padding/
       radius/font-size, so this can never again de-style into an unrecognizable
       row the way the old reset (border:0; border-radius:0; text-align:left)
       did. The two columns are status letter then path — tight, with only the
       layout's own gap between them, replacing the old 84px rail that put a
       huge empty gap between the M/D/A letter and the path. */
    .file {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: var(--k-space-3);
      margin-top: var(--k-space-1);
    }
    /* The primitive's own ::before spinner is a flex-model leading icon; on a
       grid row it would otherwise insert itself as a THIRD column ahead of the
       status cell. Pin it into the status's cell instead, where the status
       glyph — which it temporarily stands in for — already lives. */
    .file[aria-busy="true"]::before { grid-column: 1; grid-row: 1; justify-self: end; }
    .file[aria-busy="true"] .status { visibility: hidden; }
    .file-path {
      grid-column: 2;
      overflow-wrap: anywhere;
      font-family: var(--k-font-mono);
    }
    .status {
      grid-column: 1;
      grid-row: 1;
      min-width: 2ch;
      font-family: var(--k-font-mono);
      font-weight: var(--k-weight-semibold);
      text-align: center;
    }
    /* One meaning, one token. The GitHub default palette for change markers:
       A green, D red, M amber, and gray for a rename — a rename is a path
       change, not a content change, so it reads as the neutral "unchanged"
       tone rather than borrowing a change colour. --k-pending is the ramp's
       gray (idle/skipped), exactly the neutral GitHub reserves for
       non-content changes. */
    .status-added { color: var(--k-success); }
    .status-modified { color: var(--k-warning); }
    .status-deleted { color: var(--k-danger); }
    .status-renamed { color: var(--k-pending); }
    /* File row actions — small icon buttons shown on hover like the commit
       copy-hash button. Full-width grid so the actions sit at the end. */
    .file-actions {
      display: flex;
      gap: var(--k-space-1);
      opacity: 0;
    }
    .file-row:hover .file-actions,
    .file-actions:focus-within { opacity: 1; }
    .file-actions button {
      padding: 0;
      min-width: auto;
      font-size: var(--k-text-md);
      line-height: 1;
    }
    /* Directory rows (tree mode): a native <details>/<summary> disclosure
       (UI-R09), so aria-expanded and keyboard operation come from the browser.
       Indentation is recursive — every nesting level adds one --k-space-5 to
       .dir-body's left padding, so depth needs no per-level counter. */
    .dir > summary {
      position: relative;
      display: flex;
      align-items: center;
      gap: var(--k-space-3);
      padding: var(--k-space-2) var(--k-space-3) var(--k-space-2) var(--k-space-8);
    }
    .dir > summary:hover { background: var(--k-surface-hover); }
    .dir > summary .dir-name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-family: var(--k-font-mono);
    }
    .dir > summary .dir-count {
      margin-left: auto;
      min-width: 2ch;
      color: var(--k-text-dim);
      font-family: var(--k-font-mono);
      font-size: var(--k-text-md);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .dir-body {
      padding-left: var(--k-space-5);
      border-left: var(--k-border-w) solid var(--k-border);
    }
    .error {
      padding-bottom: var(--k-space-5);
      border-left-color: var(--k-danger);
    }
    .error h2 {
      margin: 0;
      padding: var(--k-space-4) var(--k-space-5);
      background: var(--k-surface);
      font-size: var(--k-text-lg);
    }
    .error p {
      margin: var(--k-space-5) var(--k-space-5) var(--k-space-1);
      color: var(--k-danger);
      overflow-wrap: anywhere;
    }
    .error small {
      display: block;
      margin-inline: var(--k-space-5);
      color: var(--k-text-dim);
    }
    .clean-state {
      text-align: left;
      border-style: solid;
      border-left: calc(var(--k-border-w) * 3) solid var(--k-success);
    }
    /* The canonical visually-hidden-but-announced clip pattern needs exactly a
       1x1px box; --k-border-w is the one token that is legitimately 1px, so it
       is reused here rather than left as a raw length. */
    .sr {
      position: absolute;
      width: var(--k-border-w);
      height: var(--k-border-w);
      padding: 0;
      margin: calc(var(--k-border-w) * -1);
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 440px) {
      /* A viewport breakpoint, not a design value: @media conditions cannot
         read a custom property at all, so no --k-* token applies here — this
         440px has no token-based alternative. */
      body { padding: var(--k-space-5); }
      header { align-items: flex-start; }
      .repo > summary { grid-template-columns: 1fr; gap: var(--k-space-1); }
      .repo > summary > span:last-child { text-align: left; }
      .group { margin-right: var(--k-space-3); margin-left: var(--k-space-4); }
      .commit > summary {
        grid-template-columns: auto minmax(0, 1fr) auto;
      }
      /* The count drops under the subject; the copy action stays on the hash's
         own row, where the thing it copies is. */
      .commit > summary > span { grid-column: 2; grid-row: 2; }
      .commit-meta { padding-left: var(--k-space-8); }
    }
    @media (prefers-reduced-motion: reduce) {
      .chev, .copy-hash { transition: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Ticket changes</h1>
      <div id="summary" aria-live="polite"></div>
    </div>
    <div class="header-actions">
      <div class="view-toggle">
        <button id="viewTree" type="button" class="k-chip">Tree</button>
        <button id="viewFlat" type="button" class="k-chip">List</button>
      </div>
      <button id="refresh" type="button" class="k-btn k-btn--secondary">Refresh</button>
    </div>
  </header>
  <label class="filter">
    <span class="sr">Filter files or commits</span>
    <input id="filter" type="search" class="k-input" placeholder="Filter files or commits…" />
  </label>
  <div id="notice" role="status" hidden></div>
  <main id="repos" aria-live="polite"></main>
  <script>
  /*KARST_DS_JS*/

    const vscode = acquireVsCodeApi();
    const summary = document.getElementById('summary');
    const refresh = document.getElementById('refresh');
    const filter = document.getElementById('filter');
    const repos = document.getElementById('repos');
    const notice = document.getElementById('notice');
    const viewTree = document.getElementById('viewTree');
    const viewFlat = document.getElementById('viewFlat');
    const restored = vscode.getState();
    let lastState = restored?.state || null;
    let loading = Boolean(restored?.loading);
    // Tree is the default (folders first, then files); the List chip switches
    // to the flat all-files view. Persisted so a panel reload keeps the user's
    // choice.
    let viewMode = restored?.viewMode === 'flat' ? 'flat' : 'tree';
    // Only deviations from the default (everything expanded) are recorded, so
    // the set stays bounded by what the user actually collapsed.
    const collapsedDirs = new Set();
    // The filter forces the flat list while it is active (VS Code source
    // control does the same): a matching file hidden inside a collapsed
    // directory would otherwise be invisible, and non-matching siblings would
    // show in the same worktree row.
    let activeNeedle = '';

    const esc = karstEsc;
    const includes = (value, needle) => String(value ?? '').toLowerCase().includes(needle);

    function fileMatches(file, needle) {
      return includes(file.path, needle) || includes(file.oldPath, needle);
    }

    function commitMatches(commit, needle) {
      return [commit.hash, commit.shortHash, commit.subject, commit.author]
        .some((value) => includes(value, needle))
        || commit.files.some((file) => fileMatches(file, needle));
    }

    function worktreeMatches(worktree, needle) {
      return [worktree.label, worktree.branch, worktree.baseRef]
        .some((value) => includes(value, needle))
        || worktree.commits.some((commit) => commitMatches(commit, needle))
        || [...worktree.staged, ...worktree.unstaged, ...worktree.untracked]
          .some((file) => fileMatches(file, needle));
    }

    const STATUS = { added: 'A', modified: 'M', deleted: 'D', renamed: 'R' };
    // Colour is never the only carrier (UI-R28): the bare letter is decorative
    // and the meaningful name is the accessible one, exactly like a .k-dot.
    const STATUS_LABEL = { added: 'Added', modified: 'Modified', deleted: 'Deleted', renamed: 'Renamed' };
    const CHEV = '<span class="chev" aria-hidden="true">›</span>';

    function fileRow(file, isStaged) {
      const shown = file.oldPath ? `${file.oldPath} → ${file.path}` : file.path;
      const label = STATUS_LABEL[file.status] || 'Modified';
      const actions = `<span class="file-actions">`
        + `<button type="button" class="k-iconbtn" data-open-file="${esc(file.changeId)}" aria-label="Open file" title="Open file">↗</button>`
        + `<button type="button" class="k-iconbtn" data-discard="${esc(file.changeId)}" aria-label="Discard changes" title="Discard changes">↩</button>`
        + (isStaged ? `<button type="button" class="k-iconbtn" data-unstage="${esc(file.changeId)}" aria-label="Unstage" title="Unstage">⊖</button>` : '')
        + `</span>`;
      return `<div class="file-row">`
        + `<button type="button" class="k-btn k-btn--ghost k-btn--row file" data-change-id="${esc(file.changeId)}">`
        + `<span class="file-path">${esc(shown)}</span>`
        + `<span class="status status-${esc(file.status)}" role="img" aria-label="${esc(label)}">${STATUS[file.status] || 'M'}</span>`
        + `</button>`
        + actions
        + `</div>`;
    }

    function compareNames(a, b) {
      const x = a.toLowerCase();
      const y = b.toLowerCase();
      return x < y ? -1 : x > y ? 1 : 0;
    }

    function dirCount(dir) {
      const childTotal = [...dir.children.values()]
        .reduce((total, child) => total + dirCount(child), 0);
      return dir.files.length + childTotal;
    }

    function dirHtml(dir, groupKey, parentPath, isStaged) {
      const path = parentPath ? `${parentPath}/${dir.name}` : dir.name;
      const key = `${groupKey}:${path}`;
      const open = !collapsedDirs.has(key);
      const subdirs = [...dir.children.values()].sort((a, b) => compareNames(a.name, b.name));
      const files = [...dir.files].sort((a, b) => compareNames(a.path, b.path));
      const count = files.length + subdirs.reduce((total, child) => total + dirCount(child), 0);
      return `<details class="dir" data-dir="${esc(key)}"${open ? ' open' : ''}>`
        + `<summary>${CHEV}<span class="dir-name">${esc(dir.name)}</span>`
        + `<span class="dir-count">${count}</span></summary>`
        + `<div class="dir-body">`
        + subdirs.map((child) => dirHtml(child, groupKey, path, isStaged)).join('')
        + files.map((f) => fileRow(f, isStaged)).join('')
        + `</div></details>`;
    }

    function treeHtml(files, groupKey, isStaged) {
      const root = { name: '', children: new Map(), files: [] };
      for (const file of files) {
        const parts = file.path.split('/');
        const leaf = parts.pop() ?? '';
        let node = root;
        for (const part of parts) {
          let child = node.children.get(part);
          if (!child) {
            child = { name: part, children: new Map(), files: [] };
            node.children.set(part, child);
          }
          node = child;
        }
        // The full path stays on the row: fileRow renders a rename as
        // `old → new`, which needs both parts. Sorting by full path is the
        // same as sorting by leaf within one directory.
        node.files.push(file);
      }
      const subdirs = [...root.children.values()].sort((a, b) => compareNames(a.name, b.name));
      const filesAtRoot = [...root.files].sort((a, b) => compareNames(a.path, b.path));
      return subdirs.map((dir) => dirHtml(dir, groupKey, '', isStaged)).join('')
        + filesAtRoot.map((f) => fileRow(f, isStaged)).join('');
    }

    function filesList(files, groupKey, isStaged) {
      if (viewMode !== 'tree' || activeNeedle) return files.map((f) => fileRow(f, isStaged)).join('');
      return treeHtml(files, groupKey, isStaged);
    }

    function pendingGroup(label, files, key, isStaged) {
      if (!files.length) return '';
      return `<details class="group" open><summary>${CHEV}${esc(label)}`
        + `<span>${files.length}</span></summary>${filesList(files, key || label, isStaged)}</details>`;
    }

    const COPY_GLYPH = '⧉';

    // No literal space between the hash and the subject: they are separate grid
    // items, so the gap is the layout's, and a stray text node would print as a
    // second one after the hash.
    function commitRow(commit, index) {
      return `<details class="commit"${index === 0 ? ' open' : ''}>`
        + `<summary>${CHEV}<code data-hash>${esc(commit.shortHash)}</code>${esc(commit.subject)}`
        + `<button type="button" class="k-iconbtn copy-hash" data-copy-hash="${esc(commit.hash)}"`
        + ` aria-label="Copy commit hash" title="Copy commit hash">${COPY_GLYPH}</button>`
        + `<span>${commit.files.length}</span></summary>`
        + `<div class="commit-meta">${esc(commit.author)} · ${esc(commit.authoredAt)}</div>`
        + `${filesList(commit.files, `commit:${commit.hash}`)}</details>`;
    }

    function worktreeRow(worktree) {
      if (worktree.error) {
        return `<section class="repo error"><h2>${esc(worktree.label)}</h2>`
          + `<p>${esc(worktree.error)}</p>`
          + `<small>Refresh to try this repository again.</small></section>`;
      }
      const pending = worktree.staged.length + worktree.unstaged.length + worktree.untracked.length;
      const changed = worktree.commits.length + pending > 0;
      const subtitle = `${worktree.branch || 'detached'} ↔ ${worktree.baseRef || 'unknown base'}`;
      return `<details class="repo"${changed ? ' open' : ''}>`
        + `<summary>${CHEV}<span><strong>${esc(worktree.label)}</strong>`
        + `<small>${esc(subtitle)}</small></span>`
        + `<span>${worktree.commits.length} commits · ${pending ? `${pending} pending` : 'clean'}</span>`
        + `</summary>`
        + `${worktree.commits.length
          ? `<details class="group" open><summary>${CHEV}COMMITS<span>${worktree.commits.length}</span></summary>`
            + `${worktree.commits.map(commitRow).join('')}</details>`
          : ''}`
        + pendingGroup('STAGED CHANGES', worktree.staged, 'staged', true)
        + pendingGroup('CHANGES', worktree.unstaged, 'unstaged', false)
        + pendingGroup('UNTRACKED FILES', worktree.untracked, 'untracked', false)
        + `</details>`;
    }

    function render(state, isLoading) {
      lastState = state;
      loading = isLoading;
      const needle = filter.value.trim().toLowerCase();
      activeNeedle = needle;
      summary.textContent = state
        ? `${state.worktreeCount} worktrees · ${state.commitCount} commits · ${state.pendingCount} pending`
        : 'No worktrees';
      const visible = state
        ? state.worktrees.filter((worktree) => !needle || worktreeMatches(worktree, needle))
        : [];
      const allClean = state && state.worktrees.length > 0
        && state.commitCount === 0 && state.pendingCount === 0
        && state.worktrees.every((worktree) => !worktree.error);
      const rows = visible.map(worktreeRow).join('');
      if (visible.length) {
        repos.innerHTML = (allClean
          ? '<div class="k-empty clean-state"><div class="k-empty-title">All ticket worktrees are clean. There are no commits or pending files to diff.</div></div>'
          : '') + rows;
      } else if (needle) {
        repos.innerHTML = '<div class="k-empty"><div class="k-empty-title">No changes match this filter. Clear the filter to see all repositories.</div></div>';
      } else if (loading) {
        repos.innerHTML = '<div class="k-empty"><div class="k-empty-title">Loading ticket worktrees…</div></div>';
      } else {
        repos.innerHTML = '<div class="k-empty"><div class="k-empty-title">No ticket worktrees. Create or attach worktrees, then refresh.</div></div>';
      }
      // No text swap (UI-R18): "Refresh" stays "Refresh"; aria-busy plus the
      // primitive's own spinner carries the pending meaning instead.
      refresh.disabled = loading;
      refresh.setAttribute('aria-busy', loading ? 'true' : 'false');
      vscode.setState({ state: lastState, loading, viewMode });
    }

    function applyViewToggle() {
      viewTree.setAttribute('aria-pressed', viewMode === 'tree' ? 'true' : 'false');
      viewFlat.setAttribute('aria-pressed', viewMode === 'flat' ? 'true' : 'false');
    }

    // Purely presentational: nothing posts to the host, so no pending state
    // (UI-R11 applies to async controls; this is immediate and local).
    viewTree.addEventListener('click', () => {
      viewMode = 'tree';
      applyViewToggle();
      render(lastState, loading);
    });
    viewFlat.addEventListener('click', () => {
      viewMode = 'flat';
      applyViewToggle();
      render(lastState, loading);
    });
    // The `toggle` event does not bubble, so the listener is on the capture
    // phase. Only directory rows carry data-dir; repo/group/commit disclosures
    // keep their native (re-render-reset) behaviour.
    document.addEventListener('toggle', (event) => {
      const details = event.target;
      if (!details || details.dataset?.dir === undefined) return;
      if (details.open) collapsedDirs.delete(details.dataset.dir);
      else collapsedDirs.add(details.dataset.dir);
    }, true);

    refresh.addEventListener('click', () => {
      render(lastState, true);
      vscode.postMessage({ type: 'refresh' });
    });
    filter.addEventListener('input', () => render(lastState, loading));
    // Optimistic (UI-R15): the host owns the clipboard write, and this is the
    // one legitimate case for showing success before it is confirmed — a
    // failed copy is silently recoverable by clicking again, so the
    // confirmation does not wait for a round trip. The label is what flashes,
    // so the confirmation reaches a screen reader too and is not a purely
    // visual beat. This reuses the shared .is-success state class rather than
    // a bespoke "copied" one, so it also picks up --k-success for free.
    const COPIED_MS = 1200; // matches --k-dur-flash-copy
    function flashCopied(button) {
      if (button.dataset.flash) clearTimeout(Number(button.dataset.flash));
      button.textContent = '✓';
      button.classList.add('is-success');
      button.setAttribute('aria-label', 'Copied');
      button.dataset.flash = String(setTimeout(() => {
        button.textContent = COPY_GLYPH;
        button.classList.remove('is-success');
        button.setAttribute('aria-label', 'Copy commit hash');
        delete button.dataset.flash;
      }, COPIED_MS));
    }

    document.addEventListener('click', (event) => {
      const copy = event.target.closest('[data-copy-hash]');
      if (copy) {
        // The button sits inside a <summary>: without this the copy would also
        // collapse the commit it belongs to.
        event.preventDefault();
        vscode.postMessage({ type: 'copy-hash', hash: copy.dataset.copyHash });
        flashCopied(copy);
        return;
      }
      const openFileBtn = event.target.closest('[data-open-file]');
      if (openFileBtn) {
        event.preventDefault();
        vscode.postMessage({ type: 'open-file', changeId: openFileBtn.dataset.openFile });
        return;
      }
      const discardBtn = event.target.closest('[data-discard]');
      if (discardBtn) {
        event.preventDefault();
        vscode.postMessage({ type: 'discard', changeId: discardBtn.dataset.discard });
        return;
      }
      const unstageBtn = event.target.closest('[data-unstage]');
      if (unstageBtn) {
        event.preventDefault();
        vscode.postMessage({ type: 'unstage', changeId: unstageBtn.dataset.unstage });
        return;
      }
      // A drag that ends on the hash is a selection, not a click on the
      // disclosure — toggling there would drop the selection the user just made.
      // A plain click still toggles, which is the row's prior behaviour.
      const selection = document.getSelection?.();
      if (event.target.closest('code[data-hash]') && selection && !selection.isCollapsed) {
        event.preventDefault();
        return;
      }
      const row = event.target.closest('[data-change-id]');
      if (!row) return;
      // Opening a diff is a "handoff" async action (DESIGN-SYSTEM §5.1): the
      // host hands off to a VS Code diff editor. Delegated the same as every
      // other click here (rows are re-created on each render), so pending is
      // entered on the row itself via the same mechanics karstAction uses —
      // dropped while pending (UI-R12), watchdog-guarded (UI-R14), and settled
      // by the host's action-result (UI-R13) instead of the native toast being
      // the only thing that ever said anything.
      if (karstIsPending(row) || row.disabled) return;
      const requestId = karstRequestId();
      karstBeginPending(row, requestId);
      vscode.postMessage({ type: 'open-diff', changeId: row.dataset.changeId, requestId });
    });
    window.addEventListener('message', (event) => {
      const msg = event.data;
      if (!msg || typeof msg !== 'object') return;
      if (msg.type === 'loading') {
        notice.hidden = true;
        render(msg.state || lastState, true);
      } else if (msg.type === 'state') {
        notice.hidden = true;
        render(msg.state, false);
      } else if (msg.type === 'error') {
        render(lastState, false);
        notice.textContent = `Could not refresh ticket changes: ${msg.message}. Refresh to try again.`;
        notice.hidden = false;
      } else if (msg.type === 'action-result') {
        karstSettle(msg.requestId, msg.ok, msg.message);
      }
    });
    applyViewToggle();
    render(lastState, loading);
  </script>
</body>
</html>
