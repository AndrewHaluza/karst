<!--
  Karst "Servers & resources" webview — React app shell.

  The page is the React app in src/ui/resources/app/** (bundled to
  app.webview.js by scripts/build-webview-send.mjs) and injected here by
  injectResourcesApp in place of the KARST_RESOURCES_APP marker below. Two tabs
  share one document: Servers (the project-wide control plane) and Resources (the
  resource monitor's cost view). This file keeps the shared runtime (design-system
  CSS/JS, palette) and the Resources tab's stylesheet; the Servers tab's
  stylesheet is servers.webview.css, injected at KARST_RESOURCES_APP_CSS.

  The app decides NOTHING. Every number arrives pre-formatted, every label
  pre-resolved, every verb's availability pre-computed host-side (state.ts,
  serversState.ts) — a value formatted here would be a second implementation of a
  rule that already lives host-side (UI-R31). The only local state is the selected
  tab (the URL hash is its source of truth, UI-R47), which legend series is
  muted and the table sort order — pure presentation.

  Every confirmation is HOST-side (UI-R33): the webview posts only a unit key, a
  `servers.id` or a `tickets.id`; the host re-resolves it against a fresh read
  and confirms before it signals anything.
-->
<!--KARST_CSP-->
<style>
  /*KARST_DS_CSS*/
  /*KARST_RESOURCES_APP_CSS*/

  *{box-sizing:border-box}
  body{max-width:var(--k-content-max-wide);margin:0;margin-inline:auto;background:var(--k-bg);color:var(--k-text);
    font-family:var(--k-font-ui);font-size:var(--k-text-base);padding:var(--k-space-8) var(--k-space-9)}
  .hidden{display:none}

  .rhead{display:flex;align-items:center;gap:var(--k-space-6);flex-wrap:wrap;margin-bottom:var(--k-space-6)}
  .rhead .titles{min-width:0}
  .rhead h1{font-size:var(--k-text-xl);margin:0}
  .rhead .sub{color:var(--k-text-dim);font-size:var(--k-text-sm);margin-top:var(--k-space-1)}
  .live{color:var(--k-text-faint);font-size:var(--k-text-2xs);margin:var(--k-space-1) var(--k-space-0) var(--k-space-4);display:flex;align-items:center;gap:var(--k-space-2);flex-wrap:wrap}
  .rhead .actions{margin-left:auto;display:flex;gap:var(--k-space-2)}
  [hidden]{display:none !important}

  /* The one polite status region the app announces through (UI-R27): visually
     hidden, present in the accessibility tree. */
  .k-live-region{
    position:absolute;width:var(--k-space-4);height:var(--k-space-4);
    margin:var(--k-space-0);padding:var(--k-space-0);
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);
    white-space:nowrap;border:var(--k-border-w) solid transparent;
  }

  .note{border:var(--k-border-w) solid var(--k-warning);border-radius:var(--k-radius-lg);
    padding:var(--k-space-5) var(--k-space-6);margin-bottom:var(--k-space-6);
    color:var(--k-warning);font-size:var(--k-text-md)}
  .note.plain{border-color:var(--k-border);color:var(--k-text-dim)}

  /* Totals strip — the summary rail: attributed footprint + proven waste. */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--k-space-9) * 5),1fr));
    gap:var(--k-space-5);margin-bottom:var(--k-space-4)}
  .stat{border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-lg);
    background:var(--k-surface);padding:var(--k-space-5) var(--k-space-6)}
  .stat .k{font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.04em;color:var(--k-text-dim)}
  .stat .v{font-family:var(--k-font-mono);font-size:var(--k-text-2xl);margin-top:var(--k-space-2);
    line-height:var(--k-leading-tight)}
  .stat .n{font-size:var(--k-text-2xs);color:var(--k-text-faint);margin-top:var(--k-space-1);min-height:var(--k-space-6)}
  .stat.flag .v{color:var(--k-warning)}
  .summaryMeta{color:var(--k-text-faint);font-size:var(--k-text-2xs);margin:0 0 var(--k-space-6)}

  /* Trend + Monitor sit side by side on a wide panel and stack on a narrow one —
     the same token-driven auto-fit the usage panel uses (no px breakpoint). */
  .gridTop{display:grid;grid-template-columns:repeat(auto-fit,minmax(calc(var(--k-space-9) * 12),1fr));
    gap:var(--k-space-5);align-items:stretch;margin-bottom:var(--k-space-6)}
  .panel{border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-lg);
    background:var(--k-surface);overflow:hidden;margin-bottom:var(--k-space-6)}
  .gridTop .panel{margin-bottom:0}
  .phead{display:flex;align-items:center;gap:var(--k-space-4);
    padding:var(--k-space-5) var(--k-space-6);border-bottom:var(--k-border-w) solid var(--k-border);
    font-size:var(--k-text-md);font-weight:var(--k-weight-semibold)}
  .phead .count{margin-left:auto;font-family:var(--k-font-mono);font-size:var(--k-text-xs);
    color:var(--k-text-dim);font-weight:var(--k-weight-normal)}
  .pbody{padding:var(--k-space-3) var(--k-space-6) var(--k-space-5)}

  /* Trend chart: a legend, a scale note, and the plot itself. */
  .trendHead{display:flex;align-items:center;gap:var(--k-space-4);margin-bottom:var(--k-space-3);flex-wrap:wrap}
  .legend{display:flex;gap:var(--k-space-2)}
  .legendBtn{display:inline-flex;align-items:center;gap:var(--k-space-2);min-height:var(--k-control-h-sm);
    padding:0 var(--k-space-4);border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-pill);
    background:var(--k-surface-sunken);color:var(--k-text-dim);font-size:var(--k-text-2xs);cursor:pointer}
  .legendBtn[aria-pressed="true"]{color:var(--k-text)}
  .legendBtn[aria-pressed="false"]{opacity:.42}
  .legendBtn .swatch{width:var(--k-space-5);height:var(--k-space-1);border-radius:var(--k-radius-pill);display:inline-block;flex:none}
  .swCpu{background:var(--k-series-2)}
  .swRss{background:var(--k-series-1)}
  .scaleNote{margin-left:auto;font-family:var(--k-font-mono);font-size:var(--k-text-2xs);color:var(--k-text-faint);white-space:nowrap}
  .chartWrap{position:relative;height:calc(var(--k-space-9) * 4);background:var(--k-surface-sunken);
    border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-sm);overflow:hidden;
    --yaxis-w:calc(var(--k-space-9) * 3)}
  .chartWrap .plot{position:absolute;top:0;right:0;bottom:0;left:var(--yaxis-w);width:auto;
    height:100%;display:block;overflow:visible}
  .series-rss{fill:none;stroke:var(--k-series-1);stroke-width:calc(var(--k-space-1) / 2)}
  .series-cpu{fill:none;stroke:var(--k-series-2);stroke-width:calc(var(--k-space-1) / 2)}
  .series-rss.muted,.series-cpu.muted{opacity:.08}
  .gridline{stroke:var(--k-border);stroke-width:var(--k-border-w);opacity:.5}
  .spark-empty{fill:var(--k-text-faint);font-family:var(--k-font-ui);font-size:var(--k-text-sm)}
  .chartTicks{position:absolute;left:var(--yaxis-w);bottom:var(--k-space-1);width:calc(100% - var(--yaxis-w));
    height:var(--k-space-4);fill:var(--k-text-faint);font-size:var(--k-text-2xs);pointer-events:none;overflow:visible}
  .chartTicks text{dominant-baseline:central}
  .chartScale{position:absolute;top:var(--k-space-2);left:calc(var(--yaxis-w) + var(--k-space-4));
    color:var(--k-text-faint);font-size:var(--k-text-2xs);pointer-events:none;display:flex;gap:var(--k-space-5);font-family:var(--k-font-mono)}
  .chartScale .cpu{color:var(--k-series-2)}
  .chartScale .rss{color:var(--k-series-1)}

  /* Y-axis labels: one value pair per gridline, sitting in the reserved gutter
     to the left of the plot. They are SVG text at percentage coordinates (no
     inline style anywhere in the app). The cpu/rss colors are the series
     identity, so a muted series dims its own label too (UI-R28 — never an
     invented label). */
  .chartY{position:absolute;left:0;top:0;width:var(--yaxis-w);height:100%;pointer-events:none;
    font-family:var(--k-font-mono);font-size:var(--k-text-2xs);overflow:visible}
  .chartY .yTick{text-anchor:end;dominant-baseline:central}
  .chartY .cpu{fill:var(--k-series-2)}
  .chartY .rss{fill:var(--k-series-1)}
  .chartY .muted{opacity:.25}

  /* Monitor facts lane. */
  .laneFacts{display:grid;gap:var(--k-space-1)}
  .factRow{min-height:var(--k-control-h-md);display:flex;align-items:center;justify-content:space-between;
    gap:var(--k-space-6);border-bottom:var(--k-border-w) solid var(--k-border);padding:var(--k-space-1) var(--k-space-2)}
  .factRow:last-child{border-bottom:none}
  .factLabel{color:var(--k-text-dim);font-size:var(--k-text-2xs)}
  .factValue{font-family:var(--k-font-mono);font-size:var(--k-text-xs);text-align:right;white-space:nowrap}
  .factValue.attn{color:var(--k-warning)}

  table{width:100%;border-collapse:collapse;font-size:var(--k-text-md)}
  .tscroll{overflow-x:auto}
  th{text-align:left;font-weight:var(--k-weight-semibold);font-size:var(--k-text-2xs);text-transform:uppercase;
    letter-spacing:.04em;color:var(--k-text-dim);padding:var(--k-space-4) var(--k-space-6);
    border-bottom:var(--k-border-w) solid var(--k-border);white-space:nowrap}
  th.num,td.num{text-align:right;font-family:var(--k-font-mono)}
  td{padding:var(--k-space-4) var(--k-space-6);border-bottom:var(--k-border-w) solid var(--k-border);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--k-surface-hover)}
  td.mono{font-family:var(--k-font-mono)}
  td.ellipsis{max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attrib{font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.04em;color:var(--k-text-dim)}

  /* The unattributed lane: a PID column as wide as six digits, a command column
     that absorbs ALL the freed space (the `width:100%` + max-width:0 flex trick
     the dashboard's service-name column uses) so the full command line is
     readable, and numeric columns pinned to `width:1%` so they shrink to their
     content instead of grabbing a share of the slack. */
  .utable th.pid,.utable td.pid{width:6ch}
  .utable th.cmd,.utable td.cmd{width:100%}
  .utable td.cmd{min-width:0;max-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .utable th.amt,.utable td.amt{width:1%;white-space:nowrap}

  /* A ticket cell: the key is the identity, the title rides beneath it. */
  .ticketCell{display:grid;gap:var(--k-space-1)}
  .ticketCell .tkey{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text);font-weight:var(--k-weight-semibold)}
  .ticketCell .ttitle{font-size:var(--k-text-2xs);color:var(--k-text-faint);max-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ticketCell .baseline{font-size:var(--k-text-2xs);color:var(--k-text-faint)}

  /* A waste row: reason, size, and either a Stop control or a visible
     explanation of why it cannot be stopped (UI-R19 — never title-only). */
  .wrow{display:flex;align-items:center;gap:var(--k-space-4);padding:var(--k-space-3) 0}
  .wrow + .wrow{border-top:var(--k-border-w) solid var(--k-border)}
  .wrow .reason{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wrow .amt{margin-left:auto;font-family:var(--k-font-mono);font-size:var(--k-text-md);flex:none}
  .wrow .why{color:var(--k-text-faint);font-size:var(--k-text-2xs);flex:none}
  .wrow .k-btn{flex:none}
  .meta{color:var(--k-text-faint);font-size:var(--k-text-2xs)}

  .drow{display:grid;grid-template-columns:minmax(0,1fr) var(--k-space-8);gap:var(--k-space-4);padding:var(--k-space-3) 0}
  .drow + .drow{border-top:var(--k-border-w) solid var(--k-border)}
  .drow .path{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--k-font-mono);font-size:var(--k-text-md)}
  .drow .amt{font-family:var(--k-font-mono);font-size:var(--k-text-md);text-align:right;flex:none}
  /* A <progress>: the share is its value, so no element needs an inline width. */
  .diskTrack{display:block;appearance:none;width:100%;height:var(--k-space-2);border:0;
    background:var(--k-surface-sunken);border-radius:var(--k-radius-xs);overflow:hidden}
  .diskTrack::-webkit-progress-bar{background:var(--k-surface-sunken)}
  .diskTrack::-webkit-progress-value{background:var(--k-series-1);border-radius:var(--k-radius-xs)}
  .diskTrack::-moz-progress-bar{background:var(--k-series-1);border-radius:var(--k-radius-xs)}
  .measure-row{display:flex;align-items:center;gap:var(--k-space-4);margin-bottom:var(--k-space-3)}
</style>

<div id="root"></div>

<script>
  /*KARST_DS_JS*/

  /*KARST_RESOURCES_APP*/
</script>

<style>/*KARST_PALETTE*/</style>
