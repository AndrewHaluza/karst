      ? `<button type="button" class="k-iconbtn ib t-open" data-act="${CONSOLE_ACT}"`
        + ` data-console="${esc(consoleStage)}"`
        + ` aria-label="View this stage's console output in the dashboard"`
        + ` title="View this stage's console output in the dashboard">${svgIcon('terminal-2')}</button>`
      : '';
    const detail = `<span class="op-detail ${esc(p.status)}${consoleBtn ? ' detail-console' : ''}">`
      + (p.detail ? `<span class="op-detail-text">${esc(p.detail)}</span>` : '')
      + consoleBtn
      + `</span>`;
    const footer = p.footer && p.footer.length
      ? `<div class="session-foot">${p.footer.map((f, i) => `<span${i === p.footer.length - 1 ? ' class="session-rule"' : ''}>${esc(f)}</span>`).join('')}</div>`
      : '';
    // The delivery receipt is NOT a disclosure: its overview — hero, receipt
    // grid and Timing strip — stays visible, and only the detail lines sit
    // behind the receipt's own inner <details> (869egdr2u-fu1). The row
    // renders as the static summary with the body always beneath it, so the
    // overview stats are never behind a chevron the user did not open.
    if (p.evidence && p.evidence.kind === 'receipt') {
      // The body carries the row's identity whether or not the summary above
      // it survives: `data-proc-id` is how every surface addresses a process.
      const body = `<div class="op-body receipt-body" data-proc-id="${esc(key)}">`
        + `${evidenceBodyHtml(p.evidence)}${footer}</div>`;
      // A receipt that HAS a hero already states the delivery, in the green
      // banner that is the design's one delivered header. The process summary
      // above it said the same thing a second time in a weaker voice
      // ("Delivery receipt · 1 current pull request merged"), so it is dropped
      // — the body alone is the row. A receipt with no hero (nothing delivered
      // yet) keeps its summary, which is then the only thing that speaks.
      if (p.evidence.hero) return body;
      return `<div class="op op-static" data-proc-id="${esc(key)}">`
        + `${glyph}${name}${detail}${tail}<span></span></div>${body}`;
    }
    // A body exists if ANY of the evidence's shapes carries something. The
    // generic `rows` array is only one of them: a `prs`/`commits`/`receipt`
    // evidence renders from `branches`/`repos`/`blocks`, and testing `rows`
    // alone made such a row static — a disclosure with content behind it and
    // no way to open it.
    const hasEv = hasEvidenceBody(p.evidence);
    const hasFooter = !!(p.footer && p.footer.length);
    if (!hasEv && !hasFooter) {
      return `<div class="op"><div class="op-static" data-proc-id="${esc(key)}">`
        + `${glyph}${name}${detail}${tail}<span></span></div></div>`;
    }
    // The body is ALWAYS in the markup. <details> is what shows and hides it,
    // and rendering it only when already open meant the very first click
    // expanded an empty disclosure — the row opened, the chevron rotated, and
    // no evidence appeared until some later state push re-rendered it.
    const body = `<div class="op-body">${hasEv ? evidenceBodyHtml(p.evidence) : ''}${footer}</div>`;
    const cls = `op ${esc(p.status)}${p.status === 'run' ? ' live' : ''}`
      + `${p.status === 'fail' ? ' failed-source' : p.status === 'wait' ? ' waiting-source' : ''}`;
    return `<details class="${cls}" data-proc-id="${esc(key)}"${open ? ' open' : ''}>`
      + `<summary>${glyph}${name}${detail}${tail}<span class="chev" aria-hidden="true"></span></summary>`
      + `${body}</details>`;
  }

  // Live overlays, in order of precedence: a `completed` process row replaces
  // the snapshot's same-id row (or appends), and an `active` operation rides
  // the header without touching the rows. The snapshot that follows retires
  // both (see the state handler).
  function overlayProcesses(view) {
    const live = liveOps[view.stageKey];
    if (!live || !live.completed) return view.processes;
    const id = live.completed.id;
    if (!view.processes.some((p) => p.id === id)) return view.processes.concat(live.completed);
    // A live event is a STATUS update, not a snapshot. It carries no evidence,
    // so overwriting the row wholesale deleted evidence already on screen. Keep
    // every field the event does not speak to; the next snapshot is
    // authoritative and retires the overlay entirely.
    return view.processes.map((p) => (p.id === id ? { ...p, ...live.completed, evidence: live.completed.evidence ?? p.evidence } : p));
  }

  // Which process kinds render OPEN on the FIRST render: the session's own
  // timeline is the approval screenshot's starting state — no click needed.
  // Gates/findings/PRs/receipts stay closed until asked for.
  const DEFAULT_OPEN_PROCESS_KINDS = new Set(['session']);

  // A disclosure's open state for this render: the user's persisted sets win
  // once touched (`openProcesses` = opened, `closedProcesses` = collapsed — a
  // key in neither was never touched), else the default-open kinds above.
  function processOpen(p, key) {
    if (openProcesses.has(key)) return true;
    if (closedProcesses.has(key)) return false;
    const hasBody = hasEvidenceBody(p.evidence) || !!(p.footer && p.footer.length);
    // A RUNNING process opens itself: its body is the only place the work
    // becomes visible (gate rows land one at a time as each finishes), and a
    // collapsed row made a live stage look like nothing was happening.
    return hasBody && (DEFAULT_OPEN_PROCESS_KINDS.has(p.kind) || p.status === 'run');
  }

  function renderInside(state, sel) {
    const view = (state.insideViews || {})[sel];
    if (!view) { el('inside').innerHTML = ''; return; }

    // "Not the current stage" is only meaningful when there IS one. On a ticket
    // that never started, every stage is equally uncurrent and the bar would be
    // noise offering a way back to nowhere.
    const viewing = state.stageCurrent && sel !== state.stageCurrent;
    const back = viewing ? STAGE_TITLE[state.stageCurrent] || state.stageCurrent : '';
    const vbar = viewing
      ? `<div class="vbar"><span>Viewing ${esc(view.title)} — not the current stage.</span>`
        + `<span class="sp"><button type="button" class="k-btn k-btn--ghost k-btn--sm" data-back`
        + ` title="Return the strip to the stage the ticket is actually on">Back to ${esc(back)}</button></span></div>`
      : '';

    // The header IS the current operation. The ephemeral progress event wins
    // while one is in flight; the snapshot's own derived line is the fallback,
    // so a panel opened after those events (or reopened) still says what the
    // stage is doing. A live op is run/wait/fail only — never a verdict.
    const live = liveOps[view.stageKey];
    const lop = (live && live.active) || view.live || null;
    const lstatus = lop ? (lop.status || 'run') : '';
    // No status WORD beside the glyph: the spinning arc already says "running"
    // and the amber bars say "waiting", exactly as the process rows below
    // decided (`processRowHtml` — "a second textual 'Completed' beside the
    // duration was ours, not the design's"). The word survives as the glyph's
    // accessible name, so nothing that cannot see the animation loses it.
    const alive = lop
      ? `<span class="glyph ${esc(lstatus)}" aria-label="${esc(statusWord(lstatus))}"></span>`
        + `<strong>${esc(lop.label || '')}</strong>`
        + (lop.detail ? `<span class="sep">·</span><span class="live-copy">${esc(lop.detail)}</span>` : '')
        + (lop.duration ? `<span class="sep">·</span><span class="duration">${esc(lop.duration)}</span>` : '')
      : '';

    const procs = overlayProcesses(view);
    // The console (terminal detailed mode) entry point lives in the GATES
    // row's description area, not the header (869e7n906-fu1): that row's
    // summary IS the gate run this console renders, so the button sits beside
    // the text that names it. Availability is still the host-derived
    // `view.console` flag — only the stage key travels on, so the click
    // handler posts exactly the stage whose log is available.
    const consoleStage = view.console ? view.stageKey : null;
    const body = procs.length
      ? `<div class="ledger">${procs.map((p) => processRowHtml(p, `${view.stageKey}:${p.id}`, processOpen(p, `${view.stageKey}:${p.id}`), consoleStage)).join('')}</div>`
      : `<div class="blurb">${esc(view.blurb)}</div>`;

    // The prototype's block: viewing bar, then the three-cell header (stage
    // title · live operation · meta), then the ledger. The fourth cell — the
    // ⋯ menu — renders ONLY when the host's availability verdict says the
    // CURRENT stage offers the recovery action (`state.sendBack`); everywhere
    // else the header stays the same three cells, so scope/impl/fix/done,
    // an in-flight run and a landed ship offer no menu at all.
    const sb = state.sendBack;
    const actions = sb && sb.available && view.stageKey === sb.stage;
    const menuOpen = actions && stageMenuStage === view.stageKey;
    const stageMenu = actions
      ? `<span class="stageMenuWrap">`
        + `<button type="button" class="k-iconbtn stageMenuBtn" data-stage-menu="${esc(view.stageKey)}"`
        + ` aria-label="Stage actions" aria-haspopup="menu"`
        + ` aria-expanded="${menuOpen ? 'true' : 'false'}">${karstIcon('dots', 16)}</button>`
        + (menuOpen
          ? `<div class="stageMenu" role="menu" aria-label="Stage actions">`
            + `<button type="button" class="menuButton" role="menuitem" data-act="send-back-to-implement"`
            + ` title="Move this ticket back to Implement — UAT and Review will run again">`
            + `${karstIcon('history', 16)}<span>Send back to Implement</span></button>`
            + `</div>`
          : '')
        + `</span>`
      : '';
    el('inside').innerHTML = `<section class="inside${viewing ? ' viewing' : ''}" aria-labelledby="inside-title">${vbar}`
      + `<div class="inside-head${actions ? ' has-actions' : ''}"${view.title ? ` title="${esc(view.title)}"` : ''}>`
      + `<span class="inside-title" id="inside-title">Inside ${esc(view.stageKey)}</span>`
      + `<span class="inside-live ${esc(lstatus)}">${alive}</span>`
      + `<span class="inside-meta">${esc(view.clock)}</span>`
      + `${stageMenu}</div>${body}</section>`;
  }

  // A LIVE repaint is the same snapshot re-read — nothing structural changed,
  // only the running rows' clocks and the header meta advanced. Rebuilding the
  // whole block (as a live repaint once did) recreated every running spinner
  // element and restarted its CSS animation once a second — the visible
  // "spinner glitch every few moments" — and re-derived every disclosure from
  // the open/closed sets. Update the mutable running-clock text in place; a
  // real push renders the block authoritatively.
  function updateInsideLive(state) {
    const sel = selectedStage || state.presentedStage || state.stageCurrent || 'scope';
    const view = (state.insideViews || {})[sel];
    const block = el('inside');
    if (!view || !block) return;
    const meta = block.querySelector('.inside-meta');
    if (meta && view.clock) meta.textContent = view.clock;
    // The header live op's elapsed time, if the stage is showing one.
    const live = liveOps[view.stageKey];
    const lop = (live && live.active) || view.live || null;
    if (lop && lop.duration) {
      const hd = block.querySelector('.inside-live .duration');
      if (hd) hd.textContent = lop.duration;
    }
    // Each RUNNING row's elapsed facts.
    for (const p of view.processes) {
      if (p.status !== 'run') continue;
      const row = block.querySelector(`[data-proc-id="${view.stageKey}:${p.id}"]`);
      if (!row) continue;
      if (p.time) {
        const t = row.querySelector('.op-time');
        if (t) t.textContent = p.time;
      }
      if (p.duration) {
        const d = row.querySelector('.op-tail .duration');
        if (d) d.textContent = p.duration;
      }
    }
  }

  // The blocked banner: why karst could not ask the CURRENT stage's question
  // (`parkGateStage`/`clearStageBlock`, § blocked state visible), plus the one
  // recovery action. Reads `state.currentStage.blocked` only — a stage that
  // isn't the ticket's current one is never the thing a Resume click here
  // could act on, so there is nothing to show for it.
  function renderBlocked(state) {
    const box = el('blocked');
    const cell = state.currentStage;
    const blocked = cell && cell.blocked;
    // `awaiting-merge` is the only block a retry cannot clear, and it is not a
    // fault at all: ship's own work is done and the PRs are open, so this is a
    // normal wait for one of them to land. That wait is ALREADY surfaced twice
    // over — the header's "Waiting to merge" chip (`state.ship` waiting-merge)
    // and the Inside ship view's merge process rows (per-repo PR state,
    // conflict paths) — so a third surface saying it would be the legacy
    // blocked banner this fault chain exists to remove. Only a resumable block
    // (a real fault with a recovery action) renders the banner. The flag is
    // the host's verdict (`blockedDetail`, model/stepper.ts), never a
    // reason-string match here.
    const show = blocked && blocked.resumable !== false;
    box.classList.toggle('hidden', !show);
    if (!show) { box.innerHTML = ''; return; }
    // A resumable block is a real fault — the banner carries the reason and
    // the Resume action that can clear it.
    const title = `${STAGE_TITLE[cell.stageKey] || cell.stageKey} is blocked`;
    box.innerHTML = `<div class="ftitle">${esc(title)}</div>`
      + `<div class="freason">${esc(blocked.reason)}</div>`
      + `<div class="facts"><button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="stage-resume"`
      // `data-stagekey`, NOT `data-stage`: the rail's view-selection click
      // handler matches ANY `[data-stage]` ancestor (closest()), and this
      // button living inside the blocked banner must never also reselect
      // which stage's Inside panel is showing.
      + ` data-stagekey="${esc(cell.stageKey)}"`
      + ` title="Clear the block and let karst try this stage again">Resume</button></div>`;
  }

  let toastTimer = 0;
  function showToast(message) {
    const t = el('toast');
    if (!t) return;
    t.textContent = message;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1400);
  }

  // The header ship action. The host's `state.ship` union is the placement
  // truth; the webview's own in-flight `shipRequestId` (set by the click,
  // settled by resolveShipping) additionally holds "Shipping…" across the
  // pushes before the ship stage reads `running`.
  function renderShip(state) {
    const btn = el('confirmShip');
    const wait = el('shipWait');
    if (!btn || !wait) return;
    const slot = state.ship || { kind: 'none' };
    const inFlight = !!shipRequestId;
    wait.classList.add('hidden');
    if (slot.kind === 'waiting-merge') {
      btn.hidden = true;
      btn.setAttribute('aria-busy', 'false');
      btn.disabled = false;
      wait.classList.remove('hidden');
      wait.title = slot.repos > 0 ? `Waiting for ${slot.repos} ${slot.repos === 1 ? 'repo' : 'repos'} to be merged` : 'Waiting for the pull requests to be merged';
      return;
    }
    if (slot.kind === 'confirm' || slot.kind === 'retry') {
      btn.hidden = false;
      btn.textContent = slot.kind === 'retry' ? 'Retry ship' : 'Confirm ship';
      btn.setAttribute('aria-busy', 'false');
      btn.disabled = false;
    } else if (slot.kind === 'shipping' || inFlight) {
      btn.hidden = false;
      btn.textContent = 'Shipping…';
      btn.setAttribute('aria-busy', 'true');
      btn.disabled = true;
    } else {
      btn.hidden = true;
      btn.setAttribute('aria-busy', 'false');
      btn.disabled = false;
    }
    if (shipDone === 'success') showToast('Shipped ✓');
  }

  // Decide whether an incoming snapshot ends the in-flight ship. Keyed off host
  // truth (the ship stage's own status), never the copy: while the ship runs
  // the stage sits at `running`, so every push would otherwise rebuild the
  // plain "Confirm ship" line and wipe the spinner. Success = advanced past
  // ship; error = ship landed failed (the Now line then explains
  // it). The in-flight marker is `shipRequestId` — the old `shipping` flag is
  // gone with the legacy ship-progress overlay it drove (Finding 12).
  function resolveShipping(state) {
    const requestId = shipRequestId;
    if (!requestId) return;
    const atShip = state.stageCurrent === 'ship';
    const failed = atShip && state.currentStage && state.currentStage.status === 'failed';
    shipRequestId = null;
    if (failed) {
      // The failed Now line is the explicit error state.
      karstSettle(requestId, false);
    } else if (!atShip) {
      shipDone = 'success';
      karstSettle(requestId, true);
      setTimeout(() => { shipDone = null; render(lastState); }, 2400);
    }
    // else still at ship (running) → hold the sentence across this push, and
    // leave requestId in place (restored below) so a later push can still
    // settle it.
    if (!failed && atShip) shipRequestId = requestId;
  }

  // ---------------------------------------------------------------------
  // Servers panel
  // ---------------------------------------------------------------------
  const isOnline = (s) => s.status === 'running';
  const addrOf = (s) => `${s.host || 'localhost'}:${s.port}`;

  const svgIcon = (name, size) => (
    karstIcon(name, size)
  );

  /* Each action keeps its OWN resting hue, off the same status ramp the
     stepper uses — hue is the fastest way to tell Stop from Start before any
     label is read. The word is still on every button, so hue accelerates, it
     never carries. Keyed by the ACTION's tone (docs/ui/ICONS.md §4): the
     glyph is the Tabler icon, the hue is what the action means. */
  const TONE = {
    'external-link': 'open',
    copy: 'copy',
    refresh: 'restart',
    'player-stop': 'stop',
    'player-play': 'start',
  };

  /**
   * An icon action. The visible label IS the icon, so the word survives as both
   * aria-label (screen readers) and title (hover) — nothing is conveyed by shape
   * alone, and the two carry the SAME string (UI-R21). A disabled button keeps
   * that string as WHY: a greyed icon with no explanation is a dead end the
   * user cannot tell from a broken one, for a screen-reader user exactly as
   * much as a sighted one.
   */
  const iact = (action, id, label, icon, disabledWhy) => (
    `<button type="button" class="k-iconbtn ib t-${TONE[icon] || 'open'}" data-act="${action}"`
    + `${id != null ? ` data-id="${id}"` : ''}`
    + `${icon === 'copy' ? ' data-copy' : ''}`
    + `${disabledWhy ? ' disabled' : ''}`
    + ` aria-label="${esc(disabledWhy || label)}" title="${esc(disabledWhy || label)}">`
    + `${svgIcon(icon)}</button>`
  );

  // Row actions come in two groups: Open and Copy operate on the ADDRESS and sit
  // flush against it; Restart and Stop operate on the PROCESS.
  const addrActions = (s) => (
    isOnline(s)
      ? iact('open-server', s.id, 'Open in browser', 'external-link')
        + iact('copy-server-url', s.id, 'Copy URL', 'copy')
      : ''
  );

  // An offline row is retained, not deleted, so it can be started again. Open,
  // Copy and Stop are all meaningless on it.
  const lifeActions = (s) => (
    isOnline(s)
      ? iact('restart-server', s.id, 'Restart', 'refresh')
        + iact('stop-server', s.id, 'Stop', 'player-stop')
      : iact('spin-servers', null, 'Start service', 'player-play')
  );

  /**
   * Whole-ticket controls, rendered into the panel HEADER. They act on every
   * service, so they must survive the states where the body has no rows — the
   * empty body is exactly when Start matters most. Each disables itself when it
   * would be a no-op and explains that in its title.
   *
   * Start and Restart post different actions but the host binds both to a
   * re-spin (a spin already stops everything first); they stay distinct by
   * AVAILABILITY, which is what this function computes.
   */
  function panelOps(state) {
    // Nothing in scope can ever run: these would be permanent dead affordances,
    // so they are absent rather than disabled.
    if (state.hasRunnableRepos === false) return '';
    const list = state.servers;
    const none = list.length === 0;
    const anyOffline = list.some((s) => !isOnline(s));
    const anyRunning = list.some(isOnline);
    const startWhy = !none && !anyOffline ? 'Every service is already running' : null;
    const restartWhy = none ? 'No services to restart' : null;
    const stopWhy = !anyRunning ? 'No service is running' : null;
    return iact('spin-servers', null, 'Start all services', 'player-play', startWhy)
      + iact('restart-servers', null, 'Restart all services', 'refresh', restartWhy)
      + iact('stop-servers', null, 'Stop all services', 'player-stop', stopWhy);
  }

  /**
   * The two empty states stay distinct, and the distinction is the point: one is
   * a PROMPT (nothing is running — the header's Start fixes that), the other a
   * STATEMENT of fact (nothing here can run, and the header controls are gone
   * with it). Neither carries a button; the action lives in the header.
   */
  function serversEmpty(state) {
    if (state.hasRunnableRepos === false) {
      return `<div class="estate dead"><span class="emark">${svgIcon('circle-x')}</span>`
        + `<div><div class="ehead">No runnable services in scope</div>`
        + `<div class="esub">This ticket scopes only repositories without a service`
        + ` block, so there is nothing here to run.</div></div></div>`;
    }
    return `<div class="estate"><span class="emark">${svgIcon('server-2')}</span>`
      + `<div><div class="ehead">No servers running</div>`
      + `<div class="esub">Start the services in scope to get their local`
      + ` addresses here.</div></div></div>`;
  }

  function serverRow(s) {
    const on = isOnline(s);
    const status = on ? 'running' : 'offline';
    // role=img + aria-label is what keeps a bare dot from being invisible to a
    // screen reader now that the word is gone; title gives the pointer the same
    // word. Never colour alone: filled disc vs hollow ring still differ, and an
    // offline row reads "—" where an address would be.
    const dot = `<span class="glyph ${on ? 'on' : 'off'}" role="img"`
      + ` aria-label="${status}" title="${status}"></span>`;
    const addr = on
      ? `<span class="full">${esc(addrOf(s))}</span><span class="short">:${esc(s.port)}</span>`
      : '—';
    return `<tr><td class="c-dot">${dot}</td>`
      + `<td class="c-name" title="${esc(s.service)}">${esc(s.service)}</td>`
      + `<td class="c-addr${on ? '' : ' off'}"`
      + ` title="${on ? esc(addrOf(s)) : 'offline — no address'}">${addr}</td>`
      + `<td class="c-addrops"><span class="g">${addrActions(s)}</span></td>`
      + `<td class="c-acts"><span class="g">${lifeActions(s)}</span></td></tr>`;
  }

  function renderServers(state) {
    const servers = state.servers;
    el('srvCount').textContent = servers.length ? `${servers.length}` : '';
    el('srvOps').innerHTML = panelOps(state);
    if (!servers.length) {
      el('servers').innerHTML = serversEmpty(state);
      return;
    }
    // The filter earns its row only once scanning is actually hard.
    const needle = srvFilter.trim().toLowerCase();
    const filterable = servers.length > 6;
    const bar = filterable
      ? `<div class="filter"><label class="sr" for="srvFilter">Filter services</label>`
        + `<input id="srvFilter" class="k-input" type="search" placeholder="Filter ${servers.length} services…"`
        + ` value="${esc(srvFilter)}" data-filter></div>`
      : '';
    const shown = filterable && needle
      ? servers.filter((s) => s.service.toLowerCase().includes(needle))
      : servers;
    const rows = shown.map(serverRow).join('')
      || `<tr><td colspan="5"><div class="nomatch">No service matches`
        + ` “${esc(srvFilter)}”.</div></td></tr>`;
    // The address-ops column sits UNDER the Address header (colspan 2): Open and
    // Copy are part of the address, so the header says so.
    el('servers').innerHTML = `${bar}<div class="scroll"><table>`
      + `<thead><tr><th scope="col"><span class="sr">Status</span></th>`
      + `<th scope="col">Service</th><th scope="col" colspan="2">Address</th>`
      + `<th scope="col" style="text-align:right">Actions</th></tr></thead>`
      + `<tbody>${rows}</tbody></table></div>`;
  }

  function renderWorktrees(wts) {
    el('wtCount').textContent = wts.length ? `${wts.length}` : '';
    el('wtChanges').disabled = wts.length === 0;
    el('worktrees').innerHTML = wts.length ? wts.map((w) => {
      const stats = worktreeStats[w.repo];
      const totals = stats
        ? `<span class="wstats"><span class="wadd">+${stats.additions}</span> <span class="wdel">−${stats.deletions}</span></span>`
        : '';
      const branch = w.branch
        ? `<span class="wbranch"><span class="wbr">${esc(w.branch)}</span>`
          // Optimistic (UI-R15): the host does the clipboard write and cannot
          // fail in a way the user must act on, so flashCopied confirms
          // without waiting for a round trip — see flashCopied() below.
          + `<button type="button" class="k-iconbtn ib t-copy" data-act="copy-worktree-branch" data-branch="${esc(w.branch)}" data-copy aria-label="Copy branch name" title="Copy branch name">${svgIcon('copy')}</button></span>`
        : '';
      return `<div class="wt"><span class="wrepo">${esc(w.repoDisplay || w.repo)}</span>`
        + branch + totals + `<span class="wacts">`
        + `<button type="button" class="k-iconbtn ib t-open" data-act="open-worktree-terminal" data-path="${esc(w.path)}"`
        + ` aria-label="Open terminal" title="Open a terminal in this worktree">${svgIcon('terminal-2')}</button>`
        + `<button type="button" class="k-iconbtn ib t-copy" data-act="open-worktree-folder" data-path="${esc(w.path)}"`
        + ` aria-label="Reveal in file explorer" title="Reveal this worktree in the file explorer">${svgIcon('folder')}</button>`
        // Only karst-extension checkouts can become a dev host (the host probes
        // `launchable` when it builds the state). A foreign repo's worktree
        // gets no button at all — a dead control on every app repo is noise.
        + (w.launchable
          ? `<button type="button" class="k-iconbtn ib t-start" data-act="launch-worktree-extension" data-path="${esc(w.path)}"`
            + ` aria-label="Launch dev host" title="Build this worktree and open its extension in a new dev window">${svgIcon('play-bug')}</button>`
          : '')
        + `</span></div>`;
    }).join('') : '<div class="empty">No worktrees.</div>';
  }

  // Mergeability under a PR row. Every string is the host's
  // (`buildMergeCheckPanelRows`) — the webview only places them. A repo with no
  // check renders NOTHING: never asked is not the same as clean, and the one
  // thing this panel must not do is reassure about a question nobody put.
  //
  // The headline is bounded (verdict, count, base ref, age), so it fits the line
  // it is given. Everything unbounded — the path list, git's own error prose —
  // lives in the disclosure, which is where it can wrap and be selected. A row
  // the host gave no `detailsLabel` renders no disclosure at all.
  function mergeLine(m) {
    if (!m) return '';
    const act = m.state === 'conflicted'
      ? `<button type="button" class="k-btn k-btn--secondary k-btn--sm mgbtn" data-act="resolve-conflicts" data-repo="${esc(m.repo)}"`
        + ` title="Hand this repo's conflict to an agent session">Resolve conflicts</button>`
      : '';
    // The relative age drifts between state pushes; the absolute stamp does not.
    const title = m.checkedTitle ? ` title="checked ${esc(m.checkedTitle)}"` : '';
    const body = m.reason
      ? `<div class="mgreason">${esc(m.reason)}</div>`
      : (m.files || []).map((f) => `<div class="mgfile">${esc(f)}</div>`).join('');
    // Re-open exactly the disclosures the user had open before this render —
    // see `openMergeRepos` above.
    const openAttr = openMergeRepos.has(m.repo) ? ' open' : '';
    const details = m.detailsLabel
      ? `<details class="mgd"${openAttr} data-repo="${esc(m.repo)}"><summary>${esc(m.detailsLabel)}</summary>`
        + `<div class="mgdbody">${body}</div></details>`
      : '';
    return `<div class="mgwrap mg-${esc(m.state)}">`
      + `<div class="mg"><span class="mgdot" aria-hidden="true"></span>`
      + `<span class="mgtext"${title}>${esc(m.headline)}</span>${act}</div>`
      + details
      + `</div>`;
  }

  // The merge control. Rendered from the host's verdict (`canMerge` +
  // `mergeBlockedReason`) — the webview never decides that a PR is mergeable, and
  // never phrases the reason it isn't.
  //
  // Merging is IRREVERSIBLE, so the click only asks: the host puts a modal in
  // front of the user (which also chooses the strategy) before anything runs.
  // `.k-btn--danger` (UI-R10b) marks it as the one irreversible action on this
  // panel. The pending state (aria-busy, via `mergeRequests`) exists so a click
  // on an irreversible action is never silent while that dialog is up, and it
  // is cleared by the next state push — including the one the host sends after
  // a cancel, so the button can never stick (see `mergeRequests`' own comment).
  function mergeButton(p) {
    if (p.status === 'merged') return '';
    if (mergeRequests[p.repo]) {
      return `<button type="button" class="k-btn k-btn--danger k-btn--sm mgbtn" aria-busy="true" disabled`
        + ` title="Confirm the merge in the dialog">Merge</button>`;
    }
    if (!p.canMerge) {
      return `<button type="button" class="k-btn k-btn--secondary k-btn--sm mgbtn" disabled title="${esc(p.mergeBlockedReason)}">Merge</button>`;
    }
    const num = p.number ? ` #${p.number}` : '';
    return `<button type="button" class="k-btn k-btn--danger k-btn--sm mgbtn" data-act="merge-pr" data-repo="${esc(p.repo)}"`
      + ` title="Merge PR${esc(num)} into ${esc(p.baseRef || 'its base')} — cannot be undone">Merge</button>`;
  }

  // The metadata line under a PR: from-to, when it was opened, when it merged, and
  // how many comments it carries. Every part is a host-rendered string that is ''
  // when the fact is absent, so a PR karst has not fully probed simply shows less
  // — never a blank field, a placeholder, or "Invalid Date".
  function prMetaLine(p) {
    const bits = [
      p.branches ? `<span class="pbranch">${esc(p.branches)}</span>` : '',
      p.opened ? `<span>${esc(p.opened)}</span>` : '',
      p.merged ? `<span class="pmerged">${esc(p.merged)}</span>` : '',
    ].filter(Boolean);
    if (!bits.length) return '';
    return `<div class="pmeta">${bits.join('<span class="psep">·</span>')}</div>`;
  }

  // Comments collapse by default: the count is the fact a reader scans for, the
  // bodies are what they open when it matters. A PR with none renders nothing at
  // all rather than an empty disclosure.
  function prComments(p) {
    if (!p.commentsLabel) return '';
    const rows = p.comments.map((c) => (
      `<div class="pcm"><span class="pcmwho">${esc(c.author || 'unknown')}</span>`
      + (c.when ? `<span class="pcmwhen">${esc(c.when)}</span>` : '')
      + `<div class="pcmbody">${esc(c.body)}</div></div>`
    )).join('');
    return `<details class="pcms"><summary>${esc(p.commentsLabel)}</summary>${rows}</details>`;
  }

  function renderPrs(prs, mergeChecks) {
    const byRepo = {};
    for (const m of (mergeChecks || [])) byRepo[m.repo] = m;
    el('prCount').textContent = prs.length ? `${prs.length}` : '';
    // The refresh stays live even with zero PRs: "none yet" is exactly the answer
    // a user wants to re-ask right after a ship.
    const refresh = el('prRefresh');
    const refreshing = !!prRefreshId;
    if (refreshing) refresh.setAttribute('aria-busy', 'true');
    else refresh.removeAttribute('aria-busy');
    refresh.disabled = refreshing;
    // aria-label and title stay the SAME string in both states (UI-R21) — an
    // icon-only control's accessible name and its tooltip must never diverge.
    const refreshName = refreshing
      ? 'Re-checking pull requests…'
      : 'Re-check pull request status and mergeability now';
    refresh.title = refreshName;
    refresh.setAttribute('aria-label', refreshName);
    el('prs').innerHTML = prs.length ? prs.map((p) => (
      `<div class="prrow"><div class="pr"><span class="k-chip pst pst-${esc(p.status || 'unknown')}">${esc(p.status || '')}</span>`
      // The DISPLAY path, per the worktree path-display preference — the same
      // string the worktree rows show for this repo.
      + `<span class="prepo">${esc(p.repoDisplay || p.repo)}</span>`
      + `<span class="ptitle">${esc(p.url || '')}</span>`
      + `<span class="pnum">#${esc(p.number)}</span>`
      + `<span class="pacts"><button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="open-pr" data-url="${esc(p.url)}" title="Open this pull request">Open</button>`
      + mergeButton(p)
      + `</span></div>`
      + prMetaLine(p)
      + mergeLine(byRepo[p.repo])
      + prComments(p)
      + `</div>`
    )).join('') : '<div class="empty">No pull requests.</div>';
  }

  // The header's ticket identity: provider mark + copy-key button + a SEPARATE
  // board link (the key no longer doubles as the link — a regular click copies
  // the key, and the anchor opens the board). The provider icon is the shared
  // injected badge; the key's `title` stays the plain affordance, never the
  // dynamic copy label, so a screen reader and a tooltip cannot drift.
  //
  // The preview button is where the ticket's data becomes readable: it is
  // ALWAYS present — every ticket has data, a manual one bound via "Create in
  // ClickUp" as much as a fetched one — and opens the slide-over drawer. The
  // old provider-mark `title` hover carried the whole brief on a tiny icon,
  // where a tooltip that truncates and cannot be scrolled was no preview at
  // all.
  function renderTicketIdentity(state) {
    const label = state.key || `#${state.ticketId}`;
    const keyBtn = el('keyBtn');
    keyBtn.textContent = label;
    keyBtn.setAttribute('aria-label', `Copy ticket key ${label}`);
    keyBtn.title = 'Copy ticket key';
    const mark = el('providerMark');
    if (mark) mark.innerHTML = providerIconHtml(state.provider);
    const prevBtn = el('ticketDataBtn');
    if (prevBtn) prevBtn.hidden = false;
    const link = el('boardLink');
    if (!link) return;
    if (state.ticketUrl) {
      link.hidden = false;
      link.setAttribute('data-url', state.ticketUrl);
    } else {
      link.hidden = true;
      link.removeAttribute('data-url');
    }
  }

  // The roomy dashboard keeps the plain title as primary content; the parent
  // relationship renders as separate secondary metadata when the ticket is a
  // follow-up (model/followUp.ts). Absence renders nothing, never a placeholder.
  function renderParentRef(state) {
    const ref = el('parentRef');
    if (!ref) return;
    ref.hidden = !state.parent;
    ref.innerHTML = state.parent ? 'Follow-up of ' + esc(state.parent.key) : '';
  }

  function renderAgentHeader(state) {
    const s = state.agentSession;
    const core = el('agentCore');
    if (core) core.innerHTML = agentBadgeHtml(state.agentSession.provider);
    const model = el('agentModel');
    if (model) model.textContent = state.agentSession.modelLabel;
    const st = state.agentState || 'none';
    const dot = el('agentDot');
    if (dot) {
      dot.classList.remove('idle', 'running', 'waiting', 'none');
      dot.classList.add(st);
    }
    const liveText = el('agentLiveText');
    if (liveText) liveText.textContent = st;
    const btn = el('agentButton');
    if (btn) {
      if (s.canSwitch) {
        btn.disabled = false;
        btn.title = 'Switch the agent core and model';
      } else {
        btn.disabled = true;
        btn.title = 'Cannot switch while a fix recovery is running';
      }
    }
  }

  // The agent-switch popover stages a draft core/model selection and does
  // nothing until Switch agent… is clicked. The draft is a suggestion, never
  // authority: the `switch-agent` message the host re-validates (isKnownProvider
  // + model-choice membership) before it confirms or persists.
  let draftCore = null;
  let draftModel = '';

  function populateAgentPopover() {
    const s = lastState && lastState.agentSession;
    if (!s) return;
    draftCore = s.provider;
    draftModel = s.modelId || '';
    renderCoreSelect();
    renderModelSelect();
    updateSwitchState();
  }

  function renderCoreSelect() {
    const menu = el('coreMenu');
    if (!menu || !lastState) return;
    const cores = lastState.agentSwitch.cores || [];
    menu.innerHTML = cores.map((c) =>
      `<div class="drop-item${c.id === draftCore ? ' active' : ''}" role="option"`
      + ` data-value="${esc(c.id)}" aria-selected="${c.id === draftCore ? 'true' : 'false'}">`
      + agentBadgeHtml(c.id) + '</div>').join('');
    const trigger = el('coreTrigger');
    if (trigger) {
      trigger.innerHTML = '<span class="sel-label">' + agentBadgeHtml(draftCore || cores[0]?.id || '') + '</span>'
        + '<span class="chev" aria-hidden="true"></span>';
    }
  }

  function renderModelPopup() {
    const listEl = el('modelList');
    if (!listEl || !lastState) return;
    const models = (lastState.agentSwitch.models || {})[draftCore] || [];
    let html = '<div class="model-item' + (draftModel === '' ? ' active' : '') + '" role="option"'
      + ' data-model-id="" aria-selected="' + (draftModel === '' ? 'true' : 'false') + '">'
      + '<div><div class="model-name">No default (agent picks)</div>'
      + '<div class="model-sub">Let the provider choose.</div></div></div>';
    if (models.length === 0) {
      html += '<div class="model-empty">No models listed for ' + esc(AGENT_PROVIDER_LABELS[draftCore] || draftCore || '') + '.</div>';
    } else {
      html += '<div class="model-group-label">' + agentBadgeHtml(draftCore || '') + '</div>';
      for (const m of models) {
        const id = m.model || '';
        html += '<div class="model-item' + (id === draftModel ? ' active' : '') + '" role="option"'
          + ' data-model-id="' + esc(id) + '" aria-selected="' + (id === draftModel ? 'true' : 'false') + '">'
          + '<div><div class="model-name">' + esc(m.label) + '</div>'
          + '<div class="model-sub">' + esc(id) + '</div></div></div>';
      }
    }
    listEl.innerHTML = html;
    // Update the hidden value carrier
    const sel = el('modelSelect');
    if (sel) {
      sel.innerHTML = models.map((m) =>
        `<option value="${esc(m.model || '')}">${esc(m.label)}</option>`).join('');
      if (models.some((m) => (m.model || '') === draftModel)) sel.value = draftModel;
      else { draftModel = ''; sel.value = ''; }
    }
    // Update trigger label
    const trigger = el('modelTrigger');
    if (trigger) {
      const currentModel = models.find((m) => (m.model || '') === draftModel);
      const label = currentModel ? currentModel.label : (draftModel || '');
      trigger.innerHTML = '<span class="sel-label">' + agentIdentityHtml(draftCore || '', label, true) + '</span>'
        + '<span class="chev" aria-hidden="true"></span>';
    }
  }

  function renderModelSelect() { renderModelPopup(); }

  function updateSwitchState() {
    const btn = el('switchBtn');
    const s = lastState && lastState.agentSession;
    if (!btn || !s) return;
    const changed = draftCore !== s.provider || (draftModel || null) !== (s.modelId || null);
    btn.disabled = !changed;
  }

  function openAgentPopover() {
    const btn = el('agentButton');
    if (btn && btn.disabled) return;
    populateAgentPopover();
    // Close any open select-shells from a previous popover opening
    document.querySelectorAll('.select-shell.is-open').forEach((s) => {
      s.classList.remove('is-open');
      s.querySelector('.dropdown, .model-pop')?.classList.remove('open');
    });
    const pop = el('agentPopover');
    pop.classList.remove('hidden');
    pop.classList.add('open');
    if (btn) btn.setAttribute('aria-expanded', 'true');
  }

  function openMenuPopover() {
    const pop = el('menuPopover');
    pop.classList.remove('hidden');
    pop.classList.add('open');
    el('moreBtn').setAttribute('aria-expanded', 'true');
  }

  function closePopovers() {
    const agent = el('agentPopover');
    agent.classList.add('hidden');
    agent.classList.remove('open');
    const menu = el('menuPopover');
    menu.classList.add('hidden');
    menu.classList.remove('open');
    el('agentButton').setAttribute('aria-expanded', 'false');
    el('moreBtn').setAttribute('aria-expanded', 'false');
  }

  // Popover open/close runs alongside — not instead of — the stage-selection
  // and [data-act] document listeners below. A click on either trigger toggles
  // its popover; a click anywhere else (outside any .popover) closes both.
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (t && t.closest('#agentButton')) {
      const opening = el('agentPopover').classList.contains('hidden');
      closePopovers();
      if (opening) openAgentPopover();
      return;
    }
    if (t && t.closest('#moreBtn')) {
      const opening = el('menuPopover').classList.contains('hidden');
      closePopovers();
      if (opening) openMenuPopover();
      return;
    }
    if (t && t.closest('.popover')) return;
    closePopovers();
  });

  // Core dropdown pick
  el('coreMenu').addEventListener('click', (e) => {
    const item = e.target.closest && e.target.closest('[data-value]');
    if (!item) return;
    draftCore = item.dataset.value || null;
    renderCoreSelect();
    renderModelPopup();
    updateSwitchState();
    const shell = item.closest('.select-shell');
    if (shell) { shell.classList.remove('is-open'); shell.querySelector('.dropdown')?.classList.remove('open'); }
  });
  // Model dropdown pick
  el('modelPop').addEventListener('click', (e) => {
    const item = e.target.closest && e.target.closest('[data-model-id]');
    if (!item) return;
    draftModel = item.dataset.modelId || '';
    renderModelPopup();
    updateSwitchState();
    const shell = item.closest('.select-shell');
    if (shell) { shell.classList.remove('is-open'); shell.querySelector('.model-pop')?.classList.remove('open'); }
  });
  // Model search filter
  el('modelSearch')?.addEventListener('input', (e) => {
    const q = (e.target.value || '').trim().toLowerCase();
    const models = (lastState?.agentSwitch.models || {})[draftCore] || [];
    const listEl = el('modelList');
    if (!listEl) return;
    if (!q) { renderModelPopup(); return; }
    let html = '<div class="model-item' + (draftModel === '' ? ' active' : '') + '" role="option"'
      + ' data-model-id="" aria-selected="' + (draftModel === '' ? 'true' : 'false') + '">'
      + '<div><div class="model-name">No default (agent picks)</div></div></div>';
    html += '<div class="model-group-label">' + agentBadgeHtml(draftCore || '') + '</div>';
    for (const m of models) {
      const id = m.model || '';
      const hay = (m.label + ' ' + id).toLowerCase();
      if (hay.includes(q)) {
        html += '<div class="model-item' + (id === draftModel ? ' active' : '') + '" role="option"'
          + ' data-model-id="' + esc(id) + '" aria-selected="' + (id === draftModel ? 'true' : 'false') + '">'
          + '<div><div class="model-name">' + esc(m.label) + '</div>'
          + '<div class="model-sub">' + esc(id) + '</div></div></div>';
      }
    }
    if (html.indexOf('model-item') === -1) {
      html = '<div class="model-empty">No models match "' + esc(e.target.value) + '".</div>';
    }
    listEl.innerHTML = html;
  });
  el('modelSearch')?.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const shell = el('modelShell');
      if (shell) { shell.classList.remove('is-open'); shell.querySelector('.model-pop')?.classList.remove('open'); }
    }
  });
  // Agent core dropdown open/close (inside the agent popover)
  el('coreTrigger')?.addEventListener('click', (e) => {
    e.stopPropagation();
    const shell = el('coreShell');
    if (!shell) return;
    const opening = !shell.classList.contains('is-open');
    // Close any other open shell
    document.querySelectorAll('.select-shell.is-open').forEach((s) => {
      s.classList.remove('is-open');
      s.querySelector('.dropdown, .model-pop')?.classList.remove('open');
    });
    if (opening) {
      shell.classList.add('is-open');
      shell.querySelector('.dropdown')?.classList.add('open');
    }
  });
  // Agent model dropdown open/close
  el('modelTrigger')?.addEventListener('click', (e) => {
    e.stopPropagation();
    const shell = el('modelShell');
    if (!shell) return;
    const opening = !shell.classList.contains('is-open');
    document.querySelectorAll('.select-shell.is-open').forEach((s) => {
      s.classList.remove('is-open');
      s.querySelector('.dropdown, .model-pop')?.classList.remove('open');
    });
    if (opening) {
      shell.classList.add('is-open');
      shell.querySelector('.model-pop')?.classList.add('open');
      el('modelSearch')?.focus();
    }
  });
  // Close open shells on outside click
  document.addEventListener('click', (e) => {
    if (e.target.closest && e.target.closest('.select-shell')) return;
    document.querySelectorAll('.select-shell.is-open').forEach((s) => {
      s.classList.remove('is-open');
      s.querySelector('.dropdown, .model-pop')?.classList.remove('open');
    });
  });
  el('switchBtn').addEventListener('click', () => {
    if (el('switchBtn').disabled) return;
    closePopovers();
    // No requestId: the popover closes and the host owns the outcome (confirm
    // modal + relaunch); a stale/cancelled switch surfaces as a host toast or
    // the next state push, never as an invented verdict (UI-R14/R31).
    post({ type: 'switch-agent', provider: draftCore, model: draftModel || null });
  });
  el('linkViews').addEventListener('change', () => {
    // Payload-free like the old bind button: the host owns the preference and
    // answers with the `bind` message, which is the terminal outcome (UI-R13).
    post({ type: 'toggle-bind' });
  });

  // ---- ticket-data preview drawer ----
  // A pure webview-local surface: the brief and description already ride
  // DashboardState, so opening it posts nothing and needs no host ack (UI-R31
  // — no verdict is invented, there is simply no round trip). Focus moves into
  // the dialog on open and returns to the trigger on close, per the
  // modal-dialog contract.
  let ticketDataTrigger = null;
  // Compose the drawer's body. The fetched brief is the rich provider context
  // (title/description/details) and wins verbatim when present. A manual
  // ticket has NO brief — even one bound to a provider via "Create in ClickUp"
  // (binding sets sourceRef/ticketUrl, never brief) — so fall back to the
  // ticket's own data: heading + the user's prompt. textContent, never
  // innerHTML: brief and description are user/provider-authored, so they are
  // data, not structure.
  function ticketDataText(state) {
    const brief = (state.brief || '').trim();
    if (brief) return brief;
    const heading = [state.key || `#${state.ticketId}`, state.title]
      .filter((v) => v)
      .join(' — ');
    const lines = [`# ${heading}`];
    const prompt = (state.description || '').trim();
    if (prompt) lines.push('', prompt);
    return lines.join('\n');
  }
  function openTicketData() {
    const state = lastState;
    if (!state) return;
    const body = el('ticketDataBody');
    body.textContent = ticketDataText(state);
    ticketDataTrigger = document.activeElement;
    el('ticketDataScrim').classList.add('open');
    el('ticketDataDrawer').classList.add('open');
    el('ticketDataDrawer').setAttribute('aria-hidden', 'false');
    el('ticketDataClose').focus();
  }
  function closeTicketData() {
    el('ticketDataScrim').classList.remove('open');
    el('ticketDataDrawer').classList.remove('open');
    el('ticketDataDrawer').setAttribute('aria-hidden', 'true');
    if (ticketDataTrigger && ticketDataTrigger.focus) ticketDataTrigger.focus();
  }
  el('ticketDataClose').addEventListener('click', closeTicketData);
  el('ticketDataScrim').addEventListener('click', closeTicketData);

  // ---------------------------------------------------------------------
  // Artifacts: shelf, index, detail (docs/design/artifacts/README.md)
  // ---------------------------------------------------------------------

  // The origin chip, ONE closed shape on every artifact surface (shelf card,
  // index row, detail's Produced-by row). The mark is a secondary carrier;
  // the LABEL is the identity (UI-R28) — never an icon alone. Native:
  // `<core icon> <Core> · Native`; karst: `<karst mark> Karst[ · <Core>]`.
  // The karst mark is the CURRENT monochrome silhouette (media/karst-mark.svg,
  // viewBox 0 0 215 215 — the old three-node graph is gone; see
  // brandAssets.test.ts), inlined because the webview CSP forbids external
  // assets. It is a PRODUCT-IDENTITY exception, not an interaction icon — it
  // stays outside the Tabler catalog (docs/ui/ICONS.md §5).
  const KARST_MARK =
    '<svg class="kmark" viewBox="0 0 215 215" aria-hidden="true" focusable="false">'
    + '<path d="M 96 20 L 25 67 L 25 156 L 98 203 L 98 180 L 44 145 L 44 78 L 97 44 Z" fill="currentColor"/>'
    + '<path d="M 151 42 L 138 58 L 170 78 L 170 144 L 138 165 L 150 180 L 188 156 L 188 67 Z" fill="currentColor"/>'
    + '<circle cx="106.5" cy="111.5" r="26.5" fill="currentColor"/></svg>';

  function originChip(origin) {
    const o = origin || { kind: 'karst', core: null };
    const coreLabel = o.core && AGENT_PROVIDER_LABELS[o.core]
      ? AGENT_PROVIDER_LABELS[o.core]
      : (o.core || '');
    if (o.kind === 'native') {
      return '<span class="art-origin"'
        + ` aria-label="${esc(coreLabel + ' native artifact')}">`
        + `${agentIconHtml(o.core)}<span>${esc(coreLabel)} · Native</span></span>`;
    }
    const label = o.core ? `Karst · ${coreLabel}` : 'Karst';
    return '<span class="art-origin"'
      + ` aria-label="${esc(o.core ? 'karst artifact for ' + coreLabel : 'karst artifact')}">`
      + `${KARST_MARK}<span>${esc(label)}</span></span>`;
  }

  // Workflow-state word, mirroring the rail's domain wording — never a
  // "status" label glued beside the semantic title (UI-R28b keeps the glyphs
  // icon-only; here the WORD is the carrier, so it is text).
  const ART_STATUS_WORD = {
    passed: 'Passed', failed: 'Failed', attention: 'Needs attention', info: 'In progress',
  };
  const ART_STATUS_CLASS = {
    passed: 'passed', failed: 'failed', attention: 'attention', info: 'info',
  };

  function artifactStatusHtml(a) {
    const word = ART_STATUS_WORD[a.status] || a.status;
    return `<span class="art-status ${ART_STATUS_CLASS[a.status] || 'info'}">${esc(word)}</span>`;
  }

  function artifactStaleHtml(a) {
    return a.freshness === 'stale'
      ? '<span class="art-stale" title="No longer validates the current implementation">Stale</span>'
      : '';
  }

  // One shelf preview card. The semantic title is the subject; the origin chip
  // and status ride the meta row; raw filenames NEVER appear on the shelf
  // (spec §4.4) — resources only exist inside the detail view.
  function artifactCardHtml(a) {
    return `<button type="button" class="artcard" data-art-open="${esc(a.id)}"`
      + ` aria-label="Open ${esc(a.title)}">`
      + `<span class="artcard-title">${esc(a.title)}`
      + (a.scope ? `<span class="art-sub">· ${esc(a.scope)}</span>` : '') + `</span>`
      + `<span class="artcard-summary">${esc(a.summary)}</span>`
      + `<span class="artcard-meta">${artifactStatusHtml(a)}${artifactStaleHtml(a)}`
      + `${originChip(a.origin)}</span></button>`;
  }

  // The shelf: absent while the ticket has no artifact (spec §4.1 — never an
  // empty section). Previews are state.artifacts.slice(0,3): the host SORTS
  // by semantic priority, so the first three ARE the three most useful
  // outputs, stably ordered (spec §5).
  function renderArtifacts(state) {
    const panel = el('artPanel');
    const body = el('artifacts');
    if (!panel || !body) return;
    const all = state.artifacts || [];
    panel.classList.toggle('hidden', all.length === 0);
    if (all.length === 0) { body.innerHTML = ''; return; }
    // The one count lives in the "View all N" button — the panel header
    // carries no `.count` of its own (the two would repeat the same number).
    const total = el('artTotal');
    if (total) total.textContent = String(all.length);
    body.innerHTML = `<div class="artcards">${all.slice(0, 3).map(artifactCardHtml).join('')}</div>`;
  }

  // The index: artifacts grouped by producing stage, empty groups omitted
  // (spec §10). Rows are real buttons (UI-R09), each carrying its semantic
  // name, one useful summary line, status/staleness and the origin chip.
  function renderArtIndex(state) {
    const all = state.artifacts || [];
    const groups = ['impl', 'uat', 'review', 'ship']
      .map((stage) => ({ stage, items: all.filter((a) => a.stage === stage) }))
      .filter((g) => g.items.length > 0);
    const rows = (g) => g.items.map((a) =>
      `<li><button type="button" class="artrow" data-art-open="${esc(a.id)}">`
      + `<span class="artrow-body"><span class="artrow-title">${esc(a.title)}</span>`
      + `<span class="artrow-summary">${esc(a.summary)}</span></span>`
      + `${artifactStatusHtml(a)}${artifactStaleHtml(a)}${originChip(a.origin)}`
      + `<span class="arw" aria-hidden="true">›</span></button></li>`).join('');
    const header = state.key ? `${esc(state.key)} · ${esc(state.title || '')}` : esc(state.title || '');
    return `<div class="arthead">`
      + `<button type="button" class="k-btn k-btn--ghost k-btn--sm" data-art="back" title="Return to the ticket dashboard">← Ticket</button>`
      + `<h2>${header}</h2>`
      + `<span class="artsub">Artifacts · ${all.length}</span></div>`
      + groups.map((g) =>
        `<section class="artgroup" aria-label="${esc((ART_STAGE_LABEL[g.stage] || g.stage))} artifacts">`
        + `<div class="artgroup-title">${esc(ART_STAGE_LABEL[g.stage] || g.stage)}</div>`
        + `<ul class="artrows">${rows(g)}</ul></section>`).join('');
  }

  const ART_STAGE_LABEL = { impl: 'Implement', uat: 'UAT', review: 'Review', ship: 'Ship' };

  function artifactMetricsHtml(a) {
    if (!a.metrics || !a.metrics.length) return '';
    return `<div class="artmetrics">${a.metrics.map((m) =>
      `<span class="artmetric"><span class="am-label">${esc(m.label)}</span>${esc(m.value)}</span>`
    ).join('')}</div>`;
  }

  function artifactFindingsHtml(a) {
    if (!a.findings || !a.findings.length) return '';
    const items = a.findings.map((f) =>
      `<div class="artfinding ${esc(f.severity || '')}">`
      + `<div class="af-title">${esc(f.severity.toUpperCase())} · ${esc(f.title)}</div>`
      + (f.detail ? `<div class="af-detail">${esc(f.detail)}</div>` : '')
      + (f.file
        // The file location IS the open-file control (UI-R09c) when the host
        // attached the capability; with none it stays plain text.
        ? `<div class="af-detail">${f.action
          ? `<a class="obj-link file-link" href="#" data-act="inside-action"`
            + ` data-action-id="${esc(f.action.actionId)}"`
            + ` title="Open this file in an editor">${esc(f.file)}${f.line != null ? `:${esc(String(f.line))}` : ''}</a>`
          : esc(f.file) + (f.line != null ? `:${esc(String(f.line))}` : '')}</div>`
        : '')
      + `</div>`).join('');
    return `<section class="artsection" aria-label="Findings"><div class="artheading">Findings</div>${items}</section>`;
  }

  function artifactGatesHtml(a) {
    if (!a.gates || !a.gates.length) return '';
    // The console (xterm) entry: a gate stage's artifact log is previewed in
    // the terminal "detailed mode" — the same data-console stage the inside
    // gates row carries, resolved host-side from the stage's artifactPath. Only
    // the gate stages (uat/review) record a log, so only they offer it.
    const consoleBtn = a.stage === 'uat' || a.stage === 'review'
      ? `<button type="button" class="k-iconbtn ib t-open" data-act="${CONSOLE_ACT}"`
        + ` data-console="${esc(a.stage)}"`
        + ` aria-label="View this stage's console output in the dashboard"`
        + ` title="View this stage's console output in the dashboard">${svgIcon('terminal-2')}</button>`
      : '';
    const rows = a.gates.map((g) => {
      // Each gate's outcome is a COLOURED STATE — green pass / red fail — not
      // a text label: the dot carries the state (UI-R28 keeps the word as its
      // accessible name), and the exit code stays as the row's detail.
      const state = g.exitCode === 0 ? 'pass' : g.exitCode === null ? 'note' : 'fail';
      const word = state === 'pass' ? 'passed' : state === 'fail' ? 'failed' : 'no script';
      return `<div class="artgate"><span class="ag-state ${state}">`
        + `<span class="ag-dot" role="img" aria-label="${esc(word)}"></span></span>`
        + `<span class="ag-name">${esc(g.name)}</span>`
        + `<span class="ag-code">${g.exitCode === null ? 'no script' : `exit ${esc(String(g.exitCode))}`}</span></div>`;
    }).join('');
    return `<section class="artsection" aria-label="Gate runs">`
      + `<div class="artheading">Gate runs${consoleBtn ? `<span class="sp">${consoleBtn}</span>` : ''}</div>`
      + `${rows}</section>`;
  }

  function artifactPrsHtml(a) {
    if (!a.prs || !a.prs.length) return '';
    const rows = a.prs.map((p) => {
      // The PR number IS the open-PR control (UI-R09c) — a link, never inert
      // text beside a duplicate button, so the redundant "Open PR" button is
      // gone. With no url the number stays plain text and the status word
      // carries the row.
      const number = p.number
        ? (p.url
          ? `<a class="obj-link pr-link" href="#" data-act="open-pr" data-url="${esc(p.url)}"`
            + ` title="Open this pull request on the host">#${esc(String(p.number))}</a>`
          : `<span class="pr-link">#${esc(String(p.number))}</span>`)
        : '';
      return `<li><span class="af-name">${esc(p.repo)}${number ? ` · ${number}` : ''}</span>`
        + (p.status ? `<span class="pr-status ${esc(p.status)}">${esc(p.status)}</span>` : '')
        + `</li>`;
    }).join('');
    return `<section class="artsection" aria-label="Pull requests"><div class="artheading">Pull requests</div><ul class="artfiles">${rows}</ul></section>`;
  }

  function artifactCommitsHtml(a) {
    if (!a.commits || !a.commits.length) return '';
    const rows = a.commits.map((c) => {
      // The commit SHA IS the open-commit control (UI-R09c) — a link when the
      // host attached the capability, plain text when it did not.
      const sha = c.action
        ? `<a class="obj-link commit-link" href="#" data-act="inside-action"`
          + ` data-action-id="${esc(c.action.actionId)}" title="Open this commit on the host">${esc(c.sha.slice(0, 7))}</a>`
        : `<span class="commit-sha">${esc(c.sha.slice(0, 7))}</span>`;
      return `<li><span class="af-name">${sha} · ${esc(c.message)}</span></li>`;
    }).join('');
    return `<section class="artsection" aria-label="Commits"><div class="artheading">Commits</div><ul class="artfiles">${rows}</ul></section>`;
  }

  // The plan artifact's task list: each node of the plan with its current
  // progress. The status is a COLOURED STATE (the shipped `.k-dot` primitive,
  // gap G1) with the state word only as the dot's accessible name (UI-R28) —
  // the task LABEL is the visible carrier, exactly like the gate rows.
  const ART_TASK_STATUS = {
    todo: { cls: 'todo', word: 'to do' },
    doing: { cls: 'doing', word: 'in progress' },
    done: { cls: 'done', word: 'done' },
    blocked: { cls: 'blocked', word: 'blocked' },
    cancelled: { cls: 'cancelled', word: 'cancelled' },
  };

  function artifactTasksHtml(a) {
    if (!a.tasks || !a.tasks.length) return '';
    const rows = a.tasks.map((t) => {
      const state = ART_TASK_STATUS[t.status] || ART_TASK_STATUS.todo;
      return `<div class="arttask">`
        + `<span class="at-state ${state.cls}"><span class="at-dot" role="img" aria-label="${esc(state.word)}"></span></span>`
        + `<span class="at-label">${esc(t.label)}</span>`
        + `<span class="at-kind">${esc(t.kind)}${t.visits ? ` · ${esc(t.visits)}` : ''}</span></div>`;
    }).join('');
    return `<section class="artsection" aria-label="Plan tasks"><div class="artheading">Tasks</div>${rows}</section>`;
  }

  // Detail is SEMANTIC-FIRST, files LAST (spec §11): the result, the metrics,
  // artifact-specific content, then provenance, then the raw files with their
  // explicit "Open in editor" escape into VS Code (spec §12). Opening is a
  // host round trip through artifact-open-resource — never automatic.
  function artifactDetailHtml(a, from) {
    const backLabel = from === 'index' ? '← Artifacts' : '← Ticket';
    const backTitle = from === 'index'
      ? 'Return to the artifacts index' : 'Return to the ticket dashboard';
    const files = a.resources && a.resources.length
      ? `<section class="artsection" aria-label="Underlying files"><div class="artheading">Underlying files</div><ul class="artfiles">`
        + a.resources.map((r, i) =>
          `<li><span class="af-name">${esc(r.name)}</span>`
          + `<button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="artifact-open-resource"`
          + ` data-artifact-id="${esc(a.id)}" data-index="${i}"`
          + ` title="Open ${esc(r.name)} in the editor">Open in editor ↗</button></li>`).join('')
        + `</ul></section>`
      : '';
    return `<div class="arthead">`
      + `<button type="button" class="k-btn k-btn--ghost k-btn--sm" data-art="back" title="${backTitle}">${backLabel}</button></div>`
      + `<div class="artdetail">`
      + `<div class="arthero"><span class="art-title">${esc(a.title)}</span>`
      + `${artifactStatusHtml(a)}${artifactStaleHtml(a)}</div>`
      + `<div class="artcard-summary">${esc(a.summary)}</div>`
      + (a.freshness === 'stale'
        ? `<p class="art-stale art-stale-note">Implementation changed after this verification — rerun the stage before treating this result as evidence for the current code.</p>`
        : '')
      + artifactMetricsHtml(a)
      + artifactTasksHtml(a)
      + artifactFindingsHtml(a)
      + artifactGatesHtml(a)
      + artifactPrsHtml(a)
      + artifactCommitsHtml(a)
      + `<section class="artsection" aria-label="Details"><div class="artheading">Details</div><div class="artmeta">`
      + `<span class="am-key">Stage</span><span>${esc(ART_STAGE_LABEL[a.stage] || a.stage)}</span>`
      + `<span class="am-key">Produced by</span>${originChip(a.origin)}`
      + `<span class="am-key">Version</span><span>${esc(a.currentVersionLabel || '')} · ${a.freshness}</span>`
      + (a.createdAt
        ? `<span class="am-key">Created</span><span>${esc(new Date(a.createdAt).toLocaleString())}</span>` : '')
      + `</div></section>`
      + files
      + `</div>`;
  }

  // The index/detail surface: renders into #artView and swaps the dashboard
  // body via body.art-nav, so the SAME webview hosts all three surfaces (spec
  // §7 — no second Karst tab, no drawer, no split).
  function renderArtView() {
    const box = el('artView');
    if (!box) return;
    if (!artView || !lastState) {
      box.classList.add('hidden');
      box.innerHTML = '';
      document.body.classList.remove('art-nav');
      return;
    }
    box.classList.remove('hidden');
    document.body.classList.add('art-nav');
    if (artView === 'index') {
      box.innerHTML = renderArtIndex(lastState);
    } else {
      const a = (lastState.artifacts || []).find((x) => x.id === artView.id);
      // A stale view state (the artifact vanished — evidence was deleted):
      // fall back to the index rather than rendering a dead detail.
      if (!a) { artView = 'index'; box.innerHTML = renderArtIndex(lastState); return; }
      box.innerHTML = artifactDetailHtml(a, artView.from);
    }
  }

  // The terminal's colors resolve the DESIGN TOKENS the host already injected
  // (UI-R04): background/foreground come from the editor's own colors, so
  // their contrast is the theme's contract (UI-R29). The ANSI 16 ramp stays
  // xterm's standard palette. `getComputedStyle` resolves the var(--vscode-*)
  // chains to concrete values inside the webview.
  function termTokens() {
    const cs = typeof getComputedStyle === 'function'
      ? getComputedStyle(document.documentElement)
      : null;
    const tok = (name, fallback) => (cs && cs.getPropertyValue(name).trim()) || fallback;
    return {
      bg: tok('--k-bg', '#1e1e1e'),
      fg: tok('--k-text', '#cccccc'),
      cursor: tok('--k-focus', '#3794ff'),
      selection: tok('--k-surface-selected', 'rgba(127,127,127,.4)'),
      font: tok('--k-font-mono', 'monospace'),
      size: parseFloat(tok('--k-text-base', '')) || 13,
    };
  }

  function termTheme(t) {
    return {
      background: t.bg,
      foreground: t.fg,
      cursor: t.cursor,
      selectionBackground: t.selection,
    };
  }

  // The console surface: full-body swap via body.term-nav, exactly like the
  // artifact surface. Rendered ONLY on open/close — render() never calls this,
  // so a state push (up to one a second while running) cannot recreate
  // #termHost out from under the live Terminal instance.
  function renderTermView() {
    const box = el('termView');
    if (!box) return;
    if (!termView) {
      box.classList.add('hidden');
      box.innerHTML = '';
      document.body.classList.remove('term-nav');
      return;
    }
    box.classList.remove('hidden');
    document.body.classList.add('term-nav');
    const title = STAGE_TITLE[termView] || termView;
    box.innerHTML = `<div class="thead"><span class="ttitle">Console · ${esc(title)}</span>`
      + `<span class="sp"><button type="button" class="k-btn k-btn--ghost k-btn--sm" data-term="close"`
      + ` title="Close the console view">Close</button></span></div>`
      + `<div class="tstatus" id="tstatus" role="status">${esc(termLoading ? 'Loading console output…' : '')}</div>`
      + `<div id="termHost" class="termhost"></div>`;
    initTerminal();
  }

  // A real <button> Console entry (UI-R09) posting the closed-vocabulary
  // stage-log-request; the host's stage-log answer is the outcome (UI-R13).
  function openTerminal(stage) {
    if (termView === stage && term) return;
    if (termView) closeTerminal();
    termView = stage;
    termLoading = true;
    renderTermView();
    post({ type: 'stage-log-request', stage });
  }

  function closeTerminal() {
    if (term) { try { term.dispose(); } catch (e) { /* renderer teardown */ } term = null; }
    termFit = null;
    if (termResize) { termResize.disconnect(); termResize = null; }
    termView = null;
    termLoading = false;
    renderTermView();
  }

  // Create the Terminal only on first open of a view. Guarded for the test
  // harness (no real xterm in the VM): an absent library degrades to a visible
  // refusal, never a silent blank.
  function initTerminal() {
    if (term) return;
    if (typeof Terminal === 'undefined' || typeof FitAddon === 'undefined') {
      const host = el('termHost');
      if (host) host.innerHTML = '<div class="blurb">Console rendering is unavailable in this build.</div>';
      return;
    }
    const t = termTokens();
    const host = el('termHost');
    if (!host) return;
    term = new Terminal({
      convertEol: true,        // the artifact log uses bare \n; xterm expects \r\n
      disableStdin: true,      // a log viewer, never an input surface
      cursorBlink: false,
      scrollback: 10000,       // 1 MiB of output is ~10k+ lines at common widths
      fontFamily: t.font,
      fontSize: t.size,
      theme: termTheme(t),
      allowProposedApi: true,  // FitAddon's addon lifecycle
    });
    termFit = new FitAddon.FitAddon();
    term.loadAddon(termFit);
    term.open(host);
    termFit.fit();
    if (typeof ResizeObserver !== 'undefined' && host) {
      // fit lives on the ADDON, not the terminal — `term.fit` does not exist.
      termResize = new ResizeObserver(() => termFit && termFit.fit());
      termResize.observe(host);
    }
  }

  // Scroll preservation (spec §9): each surface keeps its own position.
  function artScrollTop() {
    const root = document.documentElement || document.body;
    return typeof root.scrollTop === 'number' ? root.scrollTop : 0;
  }

  function artSaveScroll() {
    if (!artView) artScrolls.ticket = artScrollTop();
    else if (artView === 'index') artScrolls.index = artScrollTop();
    else artScrolls.detail[artView.id] = artScrollTop();
  }

  function artRestoreScroll() {
    const key = !artView ? 'ticket' : artView === 'index' ? 'index' : 'detail';
    const target = key === 'detail' && artView !== 'index' ? (artScrolls.detail[artView.id] || 0) : artScrolls[key] || 0;
    const root = document.documentElement || document.body;
    root.scrollTop = target;
  }

  function openArtifactIndex() {
    artSaveScroll();
    artView = 'index';
    renderArtView();
    artRestoreScroll();
    persist();
  }

  function openArtifact(id, from) {
    artSaveScroll();
    artView = { id, from };
    renderArtView();
    artRestoreScroll();
    persist();
  }

  // Back is deterministic (spec §7.3): detail→its origin, index→ticket.
  function artifactBack() {
    artSaveScroll();
    if (!artView) return;
    artView = artView === 'index' ? null : (artView.from === 'index' ? 'index' : null);
    renderArtView();
    artRestoreScroll();
    persist();
  }

  // Keyboard focus across a repaint. The host re-pushes the snapshot once a
  // second while a stage is running, and every section is rebuilt by innerHTML
  // assignment, which blurs whatever the user had focused. The action ids are
  // snapshot-scoped, so they cannot identify the same control across two
  // renders — its POSITION among the page's controls plus its own `data-act`
  // can. Restoring only on an exact match is the point: a page whose shape
  // changed must never move focus onto a DIFFERENT control than the one the
  // user was on.
  // An element's own `id` is preferred and is what covers the controls that
  // carry no action at all — the services filter INPUT is the one that made
  // this mandatory: it is rebuilt with the panel, so a repaint mid-typing threw
  // away the caret, and with no `data-act` a controls-only rule did not even
  // see it. Its caret offsets ride along; the value itself already survives in
  // `srvFilter`.
  function focusMark() {
    const active = document.activeElement;
    if (!active || !active.getAttribute) return null;
    const id = active.id || '';
    const act = active.getAttribute('data-act') || '';
    if (!id && !act) return null;
    const mark = { id: id, act: act, index: -1, start: null, end: null };
    if (!id) {
      const controls = Array.prototype.slice.call(document.querySelectorAll('[data-act]'));
      mark.index = controls.indexOf(active);
      if (mark.index < 0) return null;
    }
    if (typeof active.selectionStart === 'number') {
      mark.start = active.selectionStart;
      mark.end = active.selectionEnd;
    }
    return mark;
  }

  function restoreFocus(mark) {
    if (!mark) return;
    let target = null;
    if (mark.id) {
      target = document.getElementById(mark.id);
      // An id that came back on a control with a DIFFERENT action is not the
      // same control.
      if (target && mark.act && target.getAttribute('data-act') !== mark.act) target = null;
    } else {
      const controls = Array.prototype.slice.call(document.querySelectorAll('[data-act]'));
      const candidate = controls[mark.index];
      if (candidate && candidate.getAttribute('data-act') === mark.act) target = candidate;
    }
    if (!target) return;
    target.focus();
    if (mark.start !== null && typeof target.setSelectionRange === 'function') {
      try { target.setSelectionRange(mark.start, mark.end); } catch (err) { /* not a text field */ }
    }
  }

  // Whether a LIVE repaint (a host re-push of data the panel already has) may
  // redraw right now. Two states make it unsafe, and both are the user being
  // mid-interaction:
  //
  //  - an inside action is in flight. Those controls' pending state is keyed to
  //    the DOM element that was clicked (see the delegated click handler), so
  //    rebuilding the block would drop the `aria-busy`/disabled pair while the
  //    request is still outstanding. Scoped to `#inside`: ship/merge/refresh
  //    track their pending state in view state and re-render it correctly, and
  //    they are exactly the multi-minute operations the repaint exists for.
  //  - a text selection is being made. Replacing text nodes collapses it, and
  //    a selection that dies once a second cannot be copied.
  //
  // A deferred repaint is not a lost one: the data is kept as `lastState` and
  // the next tick (or any real push) draws it.
  function liveRepaintSafe() {
    if (document.querySelector('#inside [aria-busy="true"]')) return false;
    const selection = window.getSelection ? window.getSelection() : null;
    if (selection && selection.rangeCount > 0 && !selection.isCollapsed) return false;
    return true;
  }

  function render(state) {
    const mark = focusMark();
    lastState = state;
    // Selection defaults to the current stage; with none (nothing has run) it
    // falls back to scope — the one the user is about to start.
    const sel = selectedStage || state.presentedStage || state.stageCurrent || 'scope';
    el('title').textContent = state.title || '(untitled)';
    renderParentRef(state);
    renderTicketIdentity(state);
    renderAgentHeader(state);
    renderTrack(state.rail, state.approach, sel);
    renderInside(state, sel);
    renderBlocked(state);
    renderShip(state);
    renderServers(state);
    renderWorktrees(state.worktrees);
    renderPrs(state.prs, state.mergeChecks);
    renderArtifacts(state);
    renderArtView();
    renderFollowUp(state);
    restoreFocus(mark);
  }

  // Follow-up only makes sense once the work shipped — same gate the
  // createFollowUpTicket command enforces server-side. The menu item lives in
  // the … controls menu, shown only at `done`.
  function renderFollowUp(state) {
    el('followUpItem').classList.toggle('hidden', state.stageCurrent !== 'done');
  }

  // One toggle row for one resolved gate. A real <button> (UI-R09), never a
  // clickable div — data-stage/data-name/data-disabled carry everything the
  // click handler needs to post `set-disabled-gates` without guessing at the
  // ticket's current selection.
  function gateRow(stage, opt) {
    const label = (opt.disabled ? 'Enable ' : 'Disable ') + opt.name + ' for this ticket';
    const enabled = !opt.disabled;
    return `<div class="gateRow${opt.disabled ? ' off' : ''}">`
      + `<span class="gateName">${esc(opt.name)}</span>`
      + `<label class="k-switch gateSwitch" role="switch" aria-checked="${enabled ? 'true' : 'false'}"`
      + ` aria-label="${esc(label)}" title="${esc(label)}"`
      + ` data-act="set-disabled-gates" data-stage="${esc(stage)}" data-name="${esc(opt.name)}"`
      + ` data-disabled="${opt.disabled ? '1' : '0'}">`
      + `<input type="checkbox" tabindex="-1">`
      + `<span class="k-switch-track"></span>`
      + `</label></div>`;
  }

  function renderMenuGates() {
    const body = el('menuGates');
    if (!body) return;
    const uat = gateOptions.uat || [];
    const review = gateOptions.review || [];
    if (!uat.length && !review.length) {
      body.innerHTML = '<div class="menuBlurb">No gates resolved for this ticket yet.</div>';
      return;
    }
    const group = (title, stage, opts) => opts.length
      ? `<div class="gateGroup"><div class="gateHead">${esc(title)}</div>`
        + opts.map((o) => gateRow(stage, o)).join('') + '</div>'
      : '';
    body.innerHTML = group('UAT', 'uat', uat) + group('Review', 'review', review);
  }

  function renderBind() {
    const label = el('linkViewsLabel');
    if (label) label.setAttribute('aria-checked', bindEnabled ? 'true' : 'false');
    const box = el('linkViews');
    if (box) box.checked = bindEnabled;
  }

  const persist = () => vscode.setState({ state: lastState, sel: selectedStage, srvFilter: srvFilter, artView: artView, artScrolls: artScrolls });

  function select(stage) {
    selectedStage = stage;
    // Selecting a stage closes the current header's ⋯ menu — the menu belongs
    // to the stage header being shown, and the header is about to change.
    stageMenuStage = null;
    render(lastState);
    persist();
  }

  // The … menu's Edit ticket / Create follow-up items post through the generic
  // delegated `[data-act]` handler below (data-act is set in their markup,
  // above) — the same pending lifecycle every other posting control gets,
  // rather than a bespoke listener.

  // Filtering is local and never round-trips to the host. Re-rendering replaces
  // the input element, so focus and caret are restored explicitly — otherwise
  // the field loses focus after the first keystroke and typing stops dead.
  el('servers').addEventListener('input', (e) => {
    const box = e.target.closest('[data-filter]');
    if (!box) return;
    srvFilter = box.value;
    const caret = box.selectionStart;
    render(lastState);
    const next = el('servers').querySelector('[data-filter]');
    if (next) {
      next.focus();
      try { next.setSelectionRange(caret, caret); } catch { /* type=search may refuse */ }
    }
    persist();
  });

  // Clicking a stage re-points the strip. Purely local — no host round trip, so
  // it stays instant and survives every state push.
  document.addEventListener('click', (e) => {
    // The needs-you button navigates for the kinds the rail must not act on
    // itself (multi-repo waits, per-repo conflicts, an open session); the acting
    // kinds carry `data-act` and reach the posting handler below. Checked
    // BEFORE the stage hook, because it lives inside a segment that also
    // carries one.
    const goBtn = e.target.closest('[data-goto]');
    if (goBtn) { gotoAction(goBtn.dataset.go); return; }
    // Artifact navigation: Back (detail→origin, index→ticket) and opening an
    // artifact (shelf card or index row). Local, like stage selection.
    const artNav = e.target.closest('[data-art]');
    if (artNav) {
      if (artNav.dataset.art === 'back') { artifactBack(); return; }
      if (artNav.dataset.art === 'index') { openArtifactIndex(); return; }
    }
    const artOpen = e.target.closest('[data-art-open]');
    if (artOpen) {
      const from = artView === 'index' ? 'index' : 'ticket';
      openArtifact(artOpen.dataset.artOpen, from);
      return;
    }
    const termBtn = e.target.closest('[data-term]');
    if (termBtn) {
      if (termBtn.dataset.term === 'close') closeTerminal();
      return;
    }
    // The current stage header's ⋯ menu: a purely local toggle. The button
    // carries no `data-act` (nothing posts) and no `data-stage` (nothing
    // selects) — this is the only place it is handled.
    const menuBtn = e.target.closest('[data-stage-menu]');
    if (menuBtn) {
