<!--
  Karst ticket dashboard webview (T3.2). Self-contained: no external assets
  (webview CSP forbids them). Renders from the `state` postMessage the host
  pushes (state.ts → DashboardState) and posts action messages back
  (messages.ts → WebviewMessage). Styles ported from design/orchestrator-mockup.html.
-->
<!--KARST_CSP-->
<style>
  /*KARST_DS_CSS*/

  :root{
    /* Status colors come from the shared ramp (--k-pending|running|attention|
       passed|failed, injected via /*KARST_PALETTE*\/ below) and are consumed
       directly as var(--k-*) everywhere in this file (UI-R05/R06: one token
       per meaning, declared once, never redeclared or given a second name).
       --k-surface is the opaque mask the rail nodes fill with to hide the
       connector running under them — it used to be a local `--panel-bg` here
       with its own hex fallback; that fallback is now the one in
       designSystem.ts, so a theme without editorWidget.background still gets
       the same opaque floor. */

    /* One header height for every panel in the grid. The headers carry
       different contents — bare text, icon buttons, a text button — and
       letting each size itself put the Worktrees body 2px below the Servers
       body beside it, so the whole block read as drifted. Padding alone
       cannot fix that: the tallest control still sets the height. Composed
       from tokens (a large control + one padding step + the hairline)
       rather than a bare 39px literal (UI-R04). */
    --phead-h:calc(var(--k-control-h-lg) + var(--k-space-4) + var(--k-border-w));
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--k-bg);color:var(--k-text);font-family:var(--k-font-ui);font-size:var(--k-text-base);padding:var(--k-space-8) var(--k-space-9)}
  a{color:var(--k-link);text-decoration:none}
  /* Toggled by the render fns (fault card, impl phases) — without this rule the
     `hidden` class was a no-op and an empty box still drew its border. */
  .hidden{display:none}

  .dhead{display:flex;align-items:center;gap:var(--k-space-5);margin-bottom:var(--k-space-2)}
  .dhead h1{font-size:var(--k-text-xl);margin:0}
  .dhead h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dhead .agent{margin-left:auto;font-size:var(--k-text-xs);color:var(--k-text-dim);font-family:var(--k-font-mono)}
  /* The key pill IS the board link: provider mark + key + arrow, one target.
     A separate link chip echoed the key (both print the board's id), so the
     two collapse into one. The board ref/brief demote to the tooltip.
     Manual (no board) is the same pill, dashed and inert — built on the shared
     `.k-chip` primitive (UI-R08: one pill shape, one radius, for every chip in
     this file), with only content-specific bits (monospace, the hover arrow
     shift) layered on top. */
  .dhead .keypill{font-family:var(--k-font-mono)}
  .dhead a.keypill .arw{color:var(--k-link);transition:transform var(--k-dur-fast) var(--k-ease-standard)}
  .dhead a.keypill:hover .arw{transform:translate(var(--k-space-1),calc(var(--k-space-1) * -1))}
  /* Inert: dashed border + default cursor say plainly "not a control" — a
     plain span, never a link, so nothing implies it is clickable (the
     `.k-chip` informational form: no role, no tabindex). */
  .dhead .keypill.local{border-style:dashed;color:var(--k-text-dim);
    background:transparent;cursor:default}
  /* The terminal binding. Off is the default, so the resting look is quiet —
     an outline, like every other non-primary control here. On is not a hover
     shade but a filled chip: the button reports a mode that changes what
     clicking a TAB does, and a state that subtle reads as "nothing happened".
     Built on `.k-btn--ghost` (quiet outline at rest) with the pressed state
     re-themed to the primary action fill. */
  .dhead .bindtoggle .dot{width:var(--k-space-3);height:var(--k-space-3);border-radius:var(--k-radius-circle);
    background:currentColor;opacity:.45}
  .dhead .bindtoggle[aria-pressed="true"]{color:var(--k-action-fg);
    background:var(--k-action-bg);border-color:transparent}
  .dhead .bindtoggle[aria-pressed="true"] .dot{opacity:1}
  @media (prefers-reduced-motion:reduce){.dhead a.keypill:hover .arw{transform:none}}
  /* Shared ticketing-provider badge (icon + brand name) — single source in
     src/model/providerIdentity.ts, injected here at load (CSP forbids a
     shared stylesheet). */
  /*KARST_PROVIDER_CSS*/

  /* The stage graph as a circuit, not a line. The main rail runs scope → impl →
     uat → review → ship → done; `fix` is a RETURN CHANNEL below it, because
     STAGE_GRAPH only reaches fix on a failed verdict and returns it to review on
     a pass. Drawing fix inline claimed a forward path that does not exist.

     The CONNECTORS carry state, not just the nodes. Status is never color alone —
     each node also carries a glyph and a distinct shape (filled / hollow /
     broken), so the rail survives colorblindness and high-contrast themes. */
  .stepper{margin:var(--k-space-8) 0 var(--k-space-9);
    padding:calc(var(--k-space-6) + var(--k-space-1)) var(--k-space-4) var(--k-space-4);
    border:var(--k-border-w) solid var(--k-border);
    border-radius:calc(var(--k-radius-lg) + var(--k-border-w));background:var(--k-surface)}
  /* The rail scrolls inside itself on a narrow panel; the page never scrolls sideways. */
  /* padding-top is LOAD-BEARING, not spacing. overflow-x:auto forces overflow-y
     to compute to `auto` as well, so this box clips vertically too — and the
     nodes sit flush against its content top. The selection ring paints 4px above
     the node and the focus outline 5px, so both were sliced off flat and the
     selected circle rendered as an open arc. 6px is the outline's reach; the
     stepper gives back the same 6px from its own padding so nothing moves. */
  .railwrap{overflow-x:auto;padding-top:var(--k-space-3)}
  /* Column geometry is DERIVED, never hardcoded: the rail is a flex row of
     `--cols` equal columns, so column n centers at (n + 0.5) / cols. Every
     attachment point below is a calc() off these vars (written inline from
     state.rail.geometry), so adding or removing a stage moves the loop with it
     instead of silently detaching it. */
  /* 560px is the rail's minimum readable width at 7 columns — a component
     dimension, not a spacing value; the closed 0–26px space scale has no step
     anywhere near it (UI-R04 exception, same category as a @media breakpoint). */
  .track{min-width:560px}
  .main{display:flex;align-items:flex-start}
  /* Each column carries its stage's color via the shared stg-<stage> token
     (model/stagePalette), the SAME token the sidebar chip uses — so a stage is
     the identical hue in both views. `color` here is the stage identity; the
     node's FILL and SHAPE below still encode status, so hue and status stay two
     independent reads. A stageKey with no stg-* class falls through to this
     neutral default rather than rendering uncolored. */
  .st{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0;
    color:var(--k-pending);--stg-color:var(--k-pending)}
  .st .seg{position:absolute;top:calc(var(--k-space-7) - var(--k-border-w));left:-50%;width:100%;
    height:var(--k-space-1);background:var(--k-border);z-index:0}
  .st:first-child .seg{display:none}
  .st .seg.lit{background:var(--k-passed);opacity:.55}
  .st .seg.active{background:var(--k-running)}
  .st .seg.broken{background-color:transparent;
    background-image:repeating-linear-gradient(90deg,var(--k-failed) 0 var(--k-space-2),transparent var(--k-space-2) var(--k-space-4))}
  /* The node IS the control — a button, so Tab and Enter work for free. */
  /* Pending is a hollow ring in the stage's hue (border + glyph both
     currentColor, inherited from .st). Status changes the FILL, not the color. */
  .st .node{width:var(--k-control-h-lg);height:var(--k-control-h-lg);border-radius:var(--k-radius-circle);
    display:grid;place-items:center;
    background:var(--k-surface);border:calc(var(--k-border-w) * 2) solid var(--stg-color);color:var(--stg-color);
    position:relative;z-index:1;font-size:var(--k-text-base);font-weight:700;line-height:1;
    padding:0;cursor:pointer;font-family:inherit}
  .st .node:hover{filter:brightness(1.25)}
  /* Focus is --k-focus, NOT the selection ring's --k-series-2. The selection
     ring ends 4px out; a --k-series-2 outline at offset 3px overlaps it in the
     same colour, so the two fused into one fat purple slab and a keyboard user
     landing on the already-selected node saw no focus change at all. Two
     colours at two radii keep selection and focus independently readable —
     doubled off the base focus tokens rather than the standard 1px/1px, which
     is what every OTHER focusable here (buttons, keypill, the approach
     summary) uses. */
  .st .node:focus-visible{outline:calc(var(--k-focus-w) * 2) solid var(--k-focus);
    outline-offset:calc(var(--k-focus-offset) + var(--k-space-1))}
  /* The label IS the stage color — the same string and hue as the sidebar chip.
     Inherits from .st, so it can never drift from the node above it. */
  .st .lbl{margin-top:calc(var(--k-space-4) + var(--k-border-w));font-size:var(--k-text-2xs);
    letter-spacing:.06em;text-transform:uppercase;color:inherit;text-align:center}
  .st .meta{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);color:var(--k-text-faint);
    margin-top:calc(var(--k-space-1) + var(--k-border-w));height:var(--k-space-6)}
  /* Passed/running FILL the node in the stage hue; the glyph knocks out against
     it. Hue still says which stage, fill says it is done/working. */
  .st.done .node{background:var(--stg-color);border-color:var(--stg-color);color:var(--k-success-fg)}
  /* Skipped is the one status that leaves the stage ramp: a stage that never ran
     has no identity to assert, so it reads neutral gray. */
  .st.skipped .node{background:var(--k-pending);border-color:var(--k-pending);color:var(--k-success-fg);opacity:.55}
  /* No pulse on a running node: it carries a spinner, and two simultaneous
     animations on one node-sized mark read as noise. */
  .st.running .node{background:var(--stg-color);border-color:var(--stg-color);color:var(--k-success-fg)}
  /* Failed reads as a break in the circuit: hollow + dashed, never filled — in
     the stage's hue (fix's is red, which is also its status meaning). */
  .st.failed .node{background:transparent;border-color:var(--stg-color);border-style:dashed;color:var(--stg-color)}
  /* Selection is a RING, never a fill — status already owns fill and the stage
     owns hue, and all three must stay independently readable, so the ring keeps
     its own off-ramp purple (the shared categorical token, UI-R08). */
  .st.sel .node{box-shadow:0 0 0 var(--k-space-1) var(--k-surface),0 0 0 calc(var(--k-space-2) * 1) var(--k-series-2)}
  /* Scale only — never opacity. The one node this drives (armed fix) sits ON the
     bracket's bottom edge, and its fill is what MASKS that edge. Fading the node
     to .72 made the dashed bracket show through the fill and through the
     selection ring, so the node read as broken exactly when it matters most. */
  @keyframes node-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

  /* Running = a live spinner, not a glyph. ⟳ misreads as "reload/retry", which
     is the wrong affordance on a node that is now clickable. An animating ring
     is the one mark that reads as work in progress. Under reduced motion it
     stops as a broken ring — still shape-distinct from ✓ ✕ · –, so status never
     rides on color alone. */
  .spin{display:block;border-radius:var(--k-radius-circle);border:calc(var(--k-border-w) * 2) solid currentColor;
    border-top-color:transparent;animation:spin var(--k-dur-spin) linear infinite}
  .st .spin{width:var(--k-text-base);height:var(--k-text-base)}
  .oglyph .spin{width:var(--k-space-4);height:var(--k-space-4);margin:0 auto;
    border-width:calc(var(--k-border-w) * 1.5);color:var(--k-running)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .loop.armed .fixnode .node{animation:none}
    .spin{animation:none}
  }

  /* ── the branch band ──────────────────────────────────────────────────── */
  /* ONE band carries both branches off the rail: fix hangs at the gate columns,
     impl's approach at impl's column. Two grid rows — row 1 is the branch level,
     row 2 is where impl's disclosure expands, clear of both branches. 62px is
     twice the node control size plus its border — the band's height falls out
     of the geometry it hosts, not the spacing scale. */
  .loop{position:relative;display:grid;
    grid-template-rows:calc(var(--k-control-h-lg) * 2 + var(--k-border-w) * 2) auto;
    margin-top:var(--k-space-3)}
  .loop .drop{position:absolute;top:0;height:var(--k-control-h-lg);
    left:calc((var(--uat) + 0.5) / var(--cols) * 100%);
    right:calc(100% - (var(--review) + 0.5) / var(--cols) * 100%);
    border:calc(var(--k-border-w) * 2) dashed var(--k-border);border-top:none;
    border-radius:0 0 var(--k-radius-xl) var(--k-radius-xl)}
  /* Armed changes color, never style: a solid rounded bracket reads as a box
     drawn around the fix node; dashed keeps reading as a path. */
  .loop.armed .drop{border-color:var(--k-failed)}
  /* fix ─pass→ review: parallel to review's descender, offset a fixed distance
     off the token scale so the two edges read as a channel rather than one
     ambiguous line. */
  .loop .ret{position:absolute;top:var(--k-space-2);width:var(--k-space-1);height:var(--k-space-9);background:var(--k-border);
    left:calc((var(--review) + 0.5) / var(--cols) * 100% + var(--k-space-8))}
  .loop .ret::before{content:"▲";position:absolute;top:calc(var(--k-space-5) * -1);left:calc(var(--k-space-2) * -1);
    font-size:var(--k-text-2xs);line-height:1;color:var(--k-border)}
  .loop.armed .ret{background:var(--k-running)}
  .loop.armed .ret::before{color:var(--k-running)}
  .loop .retlbl{position:absolute;top:var(--k-space-3);font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    color:var(--k-text-faint);white-space:nowrap;
    left:calc((var(--review) + 0.5) / var(--cols) * 100% + var(--k-space-8) + var(--k-space-6))}
  .loop.armed .retlbl{color:var(--k-running)}
  .loop .faillbl{position:absolute;top:var(--k-space-3);font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    color:var(--k-text-faint);white-space:nowrap;transform:translateX(-100%);padding-right:var(--k-space-4);
    left:calc((var(--uat) + 0.5) / var(--cols) * 100%)}
  .loop.armed .faillbl{color:var(--k-failed)}

  /* Node on the bracket's bottom edge, name and status on ONE line beneath it.
     Beside the node they run into the bracket's right descender; as two stacked
     lines they cost too much vertical space to say two words. */
  /* fix carries its own stage hue (stg-fix, added in the markup) exactly like a
     rail node — currentColor here is that hue, so the ring, label, and armed
     fill all read as one stage. */
  .loop .fixnode{position:absolute;top:calc(var(--k-space-7) + var(--k-border-w));display:flex;flex-direction:column;
    align-items:center;gap:var(--k-space-2);
    left:calc((var(--uat) + var(--review) + 1) / 2 / var(--cols) * 100%);
    transform:translateX(-50%)}
  .loop .fixnode .node{width:var(--k-control-h-md);height:var(--k-control-h-md);border-radius:var(--k-radius-circle);
    display:grid;place-items:center;
    background:var(--k-surface);border:calc(var(--k-border-w) * 2) dashed var(--stg-color);color:var(--stg-color);
    font-size:var(--k-text-md);font-weight:700;flex:none;padding:0;cursor:pointer;font-family:inherit}
  .loop .fixnode .node:hover{filter:brightness(1.25)}
  /* --k-focus, not --k-series-2 — same fusion with the selection ring as the
     rail nodes above. */
  .loop .fixnode .node:focus-visible{outline:calc(var(--k-focus-w) * 2) solid var(--k-focus);
    outline-offset:calc(var(--k-focus-offset) + var(--k-space-1))}
  .loop .fixnode .cl{display:flex;align-items:baseline;gap:var(--k-space-3);white-space:nowrap}
  .loop .fixnode .lbl{font-size:var(--k-text-2xs);letter-spacing:.06em;text-transform:uppercase;color:inherit}
  .loop .fixnode .cap{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);color:var(--k-text-faint);white-space:nowrap}
  /* Armed FILLS the ring (status: the loop is live); hue stays fix's. No token
     matches this pulse's cadence — it is a one-off animation timing, not a
     spacing/color/radius value, so UI-R04 does not cover it; flagged here
     rather than inventing a --k-dur step nobody else would reuse. */
  .loop.armed .fixnode .node{border-style:solid;border-color:var(--stg-color);
    background:var(--stg-color);color:var(--k-success-fg);
    animation:node-pulse 1.7s ease-in-out infinite}
  .loop.armed .fixnode .cap{color:var(--k-attention)}
  /* A fix pass is a resolved/healthy attempt even though review runs next to
     revalidate it. Paint that stored success green instead of leaving the
     branch looking like an unresolved red retry. */
  .loop .fixnode.done .node{--stg-color:var(--k-passed);border-style:solid;
    border-color:var(--stg-color);background:var(--stg-color);
    color:var(--k-success-fg)}
  .loop .fixnode.done .lbl{color:var(--k-passed)}
  .loop .fixnode.sel .node{box-shadow:0 0 0 var(--k-space-1) var(--k-surface),0 0 0 var(--k-space-2) var(--k-series-2)}
  .loop .fixnode.sel .lbl{color:var(--k-text)}

  /* fix is optional, so it defaults collapsed: the whole return channel is
     dropped and row 1 shrinks to the approach chip it still has to carry. Only
     the toggle remains, sitting where the bracket would be. Armed never collapses
     (renderRail omits the class), so a live loop is always drawn. */
  .loop.collapsed{grid-template-rows:auto auto}
  /* A dim stage-hued pill in fix's own colour (stg-fix on the button), so the
     affordance still reads as "the fix loop" while it is hidden. Centred on the
     branch, exactly where the fix node would sit. Built on `.k-chip` (UI-R08);
     only position and the dashed "inert while collapsed" treatment stay local. */
  .fixtoggle{position:absolute;top:var(--k-space-1);left:calc((var(--uat) + var(--review) + 1) / 2 / var(--cols) * 100%);
    transform:translateX(-50%);font-family:var(--k-font-mono);letter-spacing:.04em;
    border-style:dashed;white-space:nowrap;line-height:1.4}
  /* When the branch is shown, the toggle steps aside to the band's right edge so
     it never overlaps the fix node it now sits beside. */
  .fixtoggle.open{left:auto;right:var(--k-space-1);transform:none}

  /* impl's stem drops from the rail and STOPS at the approach chip — the same
     move the bracket makes into the fix node. Running it the full band height
     left a line dangling past the chip, which read as two unrelated marks. */
  .loop .implstem{position:absolute;top:0;height:calc(var(--k-space-8) + var(--k-border-w));width:var(--k-space-1);background:var(--k-border);
    left:calc((var(--impl) + 0.5) / var(--cols) * 100%)}
  .loop .implstem.on{background:var(--k-running)}

  /* ── impl's approach: named on the rail, detail on demand ─────────────── */
  /* display:contents is what lets the summary chip sit in row 1 while the detail
     panel expands into row 2, clear of both branches, with no extra wrapper. */
  .approach{display:contents}
  /* Centered ON impl's stem, exactly as the fix node centers on its bracket.
     Width cap: the gap to the bracket, doubled (the chip is centered, so only
     half reaches right), minus the `fail` edge label that hangs to the bracket's
     LEFT — the nearest thing this can hit — plus a gutter (72px: geometry
     derived from the rail's own layout, not a spacing value). */
  .branch-slot{grid-row:1;justify-self:start;align-self:start;margin-top:calc(var(--k-space-8) + var(--k-border-w));
    margin-left:calc((var(--impl) + 0.5) / var(--cols) * 100%);
    transform:translateX(-50%);
    max-width:calc((var(--uat) - var(--impl)) / var(--cols) * 200% - 72px);
    display:inline-flex;align-items:center;min-width:0}
  .approach > summary{list-style:none;cursor:pointer}
  .approach > summary::-webkit-details-marker{display:none}
  .approach > summary:hover .aid{background:var(--k-surface-hover);border-color:var(--k-text-dim)}
  /* Primitives style :focus-visible on <button>/<a>/<input>; a <summary> is
     neither, so it gets no ring from the generic rule and needs its own —
     otherwise a keyboard user tabbing to the approach disclosure sees nothing. */
  .approach > summary:focus-visible .aid{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  /* The chevron rides INSIDE the chip: beside it, it detached from both the stem
     and the chip and read as a stray glyph. */
  .approach .chev{color:var(--k-text-faint);font-size:var(--k-text-2xs);transition:transform var(--k-dur-fast) var(--k-ease-standard);flex:none}
  .approach[open] .chev{transform:rotate(180deg)}
  @media (prefers-reduced-motion:reduce){.approach .chev{transition:none}}
  /* A long id truncates rather than pushing into the fix branch; the full value
     stays in the title. Built on `.k-chip` (UI-R08: one pill shape for keypill,
     fixtoggle, this, and the PR status chip below); only monospace + truncation
     stay local. */
  .approach .aid,.noapproach .none{font-family:var(--k-font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* max-width:100% is what makes the cap bite — the slot's max-width alone lets
     a nowrap chip overflow it. */
  .approach .aid{display:inline-flex;align-items:center;gap:var(--k-space-3);max-width:100%}
  .approach .aid .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .approach.active .aid{border-color:var(--k-running);color:var(--k-text)}
  .approach.done .aid{border-color:var(--k-passed);color:var(--k-passed)}
  /* No approach at all (manual ticket): a plain inert chip, never an empty
     disclosure the user can open onto nothing. */
  .noapproach .none{border-style:dashed;color:var(--k-text-faint)}

  .approach .detail{grid-row:2;margin:var(--k-space-1) 0 0;
    margin-left:calc((var(--impl) + 0.5) / var(--cols) * 100% - var(--k-space-4));
    border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-md);
    padding:var(--k-space-4) var(--k-space-2) var(--k-space-3);max-width:640px}
  .phrow{display:flex;align-items:baseline;gap:var(--k-space-5);padding:var(--k-space-2) var(--k-space-5);border-radius:var(--k-radius-md)}
  .phrow:hover{background:var(--k-surface-hover)}
  .phrow .pi{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);color:var(--k-text-faint);width:var(--k-space-6);flex:none}
  .phrow .pn{font-size:var(--k-text-sm)}
  .approach .foot{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);color:var(--k-text-faint);
    padding:var(--k-space-4) var(--k-space-5) 0;margin-top:var(--k-space-3);border-top:var(--k-border-w) solid var(--k-border);opacity:.85}

  /* ── activity strip: what happens inside the SELECTED stage ───────────── */
  .act{margin:var(--k-space-7) var(--k-space-3) var(--k-space-1);border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-lg)}
  .act .ahead{display:flex;align-items:center;gap:var(--k-space-4);padding:var(--k-space-4) var(--k-space-6);border-bottom:var(--k-border-w) solid var(--k-border)}
  .act .aname{font-size:var(--k-text-md);font-weight:var(--k-weight-semibold)}
  .act .adot{width:var(--k-space-3);height:var(--k-space-3);border-radius:var(--k-radius-circle);background:var(--k-running);flex:none}
  .act .adot.wait{background:var(--k-attention)} .act .adot.idle{background:var(--k-pending)}
  .act .adot.fail{background:var(--k-failed)} .act .adot.done{background:var(--k-passed)}
  .act .adot.pend{background:transparent;border:calc(var(--k-border-w) * 2) solid var(--k-pending);width:var(--k-space-4);height:var(--k-space-4)}

     back. Without this the strip silently contradicts the Now line. */
  .act.viewing{border-color:var(--k-series-2)}
  .act .vbar{display:flex;align-items:center;gap:var(--k-space-4);padding:var(--k-space-3) var(--k-space-6);font-size:var(--k-text-xs);
    color:var(--k-text-dim);background:var(--k-surface-hover);border-bottom:var(--k-border-w) solid var(--k-border)}
  .act .vbar .sp{margin-left:auto}
  .act .blurb{padding:var(--k-space-5) var(--k-space-7);font-size:var(--k-text-sm);color:var(--k-text-dim)}
  .act .ops{padding:var(--k-space-2) var(--k-space-3) var(--k-space-4)}
  .op{display:flex;align-items:center;gap:var(--k-space-5);padding:var(--k-space-2) var(--k-space-4);border-radius:var(--k-radius-md)}
  .op:hover{background:var(--k-surface-hover)}
  .op .oglyph{width:calc(var(--k-space-6) + var(--k-space-1));text-align:center;font-size:var(--k-text-xs);color:var(--k-text-faint)}
  .op.pass .oglyph{color:var(--k-passed)} .op.run .oglyph{color:var(--k-running)}
  .op.fail .oglyph{color:var(--k-failed)} .op.wait .oglyph{color:var(--k-attention)}
  /* 82px has no scale match — the name column's minimum is set by the longest
     op label karst emits ("Implementation"), not a spacing value. */
  .op .oname{font-size:var(--k-text-md);min-width:82px}
  .op .ocmd{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-dim);flex:1;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  .op .odur{font-family:var(--k-font-mono);font-size:var(--k-text-sm);color:var(--k-text-faint)}
  .op.pending{opacity:.5}
  /* A gate the repo cannot answer, or a phase karst cannot observe, is not a
     failure — say so plainly instead of dressing it as a status. */
  .op.note .ocmd{font-style:italic;opacity:.75}

  /* The fault card — the one loud element on the page, because a failure is the
     one moment the user MUST read. Machine truth (reason, timings) is monospace. */
  .fault{margin:var(--k-space-7) var(--k-space-3) var(--k-space-1);padding:var(--k-space-5) var(--k-space-6);
    border-left:calc(var(--k-border-w) * 3) solid var(--k-failed);
    border-radius:0 var(--k-radius-md) var(--k-radius-md) 0;background:var(--vscode-inputValidation-errorBackground,transparent)}
  .fault .ftitle{font-size:var(--k-text-md);font-weight:var(--k-weight-semibold);margin-bottom:var(--k-space-3)}
  .fault .freason{font-family:var(--k-font-mono);font-size:var(--k-text-sm);white-space:pre-wrap;word-break:break-word}
  .fault .fmeta{font-family:var(--k-font-mono);font-size:var(--k-text-sm);color:var(--k-text-dim);margin-top:calc(var(--k-space-4) - var(--k-border-w))}
  .fault .facts{margin-top:var(--k-space-6)}

  /* The "Now" line — one plain sentence naming what is happening and the next
     action the user controls. Built host-side (state.now) so the copy is tested. */
  .now{display:flex;flex-wrap:wrap;align-items:center;gap:var(--k-space-5);margin:var(--k-space-6) var(--k-space-3) var(--k-space-1);padding-top:calc(var(--k-space-6) - var(--k-border-w));
    border-top:var(--k-border-w) solid var(--k-border);font-size:var(--k-text-md);color:var(--k-text)}
  .now .ntext{flex:1}
  .now .now-sub{flex-basis:100%;font-size:var(--k-text-xs);color:var(--k-text-dim)}
  /* The ship-in-progress spinner rides in the Now line at the gate-node size.
     .spin is display:block, so it needs an explicit box here. */
  .now .spin{width:var(--k-text-base);height:var(--k-text-base);flex:none;color:var(--k-running)}
  /* The resolved-success flash: a brief "Shipped ✓" beside the settled line. */

  .now .shipbadge.ok{color:var(--k-passed)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--k-space-7)}
  .panel{border:var(--k-border-w) solid var(--k-border);border-radius:calc(var(--k-radius-lg) + var(--k-border-w));background:var(--k-surface);overflow:hidden}
  .panel.span{grid-column:1 / -1}
  .phead{display:flex;align-items:center;gap:var(--k-space-4);min-height:var(--phead-h);padding:var(--k-space-4) var(--k-space-7);
    border-bottom:var(--k-border-w) solid var(--k-border);font-size:var(--k-text-md);font-weight:var(--k-weight-semibold)}
  .phead .count{margin-left:auto;font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-faint);font-weight:var(--k-weight-normal)}
  /* An icon-only panel control, built on `.k-iconbtn` (UI-R07) — quiet until

     button there would read as the panel's subject. */

  .pbody{padding:var(--k-space-3) var(--k-space-4) var(--k-space-5)}
  .empty{padding:var(--k-space-7) var(--k-space-6);color:var(--k-text-faint);font-size:var(--k-text-md)}

  .wt,.pr{display:flex;align-items:center;gap:var(--k-space-5);padding:var(--k-space-4) var(--k-space-3);border-radius:var(--k-radius-md)}
  .wt:hover,.pr:hover{background:var(--k-surface-hover)}
  /* 74px has no scale match — set by the longest repo label karst has shown in
     practice, not a spacing value. */
  .wt .wrepo{font-size:var(--k-text-md);min-width:74px}
  .wt .wacts,.pr .pacts{margin-left:auto;display:flex;gap:var(--k-space-2)}
  .wt .wbranch{display:flex;align-items:center;gap:var(--k-space-1);min-width:0;flex:1}
  .wt .wbr{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .wt .wstats{display:flex;gap:var(--k-space-3);font-family:var(--k-font-mono);font-size:var(--k-text-xs);white-space:nowrap}
  .wt .wadd{color:var(--k-passed)}
  .wt .wdel{color:var(--k-failed)}
  /* Built on `.k-chip` (UI-R08: the same pill primitive as keypill/fixtoggle/
     approach .aid); only the monospace uppercase treatment stays local. Every
     status renders one of the variants below, so the chip's own default fill
     never shows in practice. */
  .pr .pst{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.4px}
  /* Live PR state at a glance: open green, merged purple (the shared
     categorical token, UI-R08), closed red, draft muted — every fill is paired
     with the SAME "text on a filled surface" token the design system already
     defines for success/danger (UI-R29: paired tokens, never a hand-picked
     foreground). */
  .pr .pst-open{background:var(--k-success);color:var(--k-success-fg)}
  .pr .pst-merged{background:var(--k-series-2);color:var(--k-success-fg)}
  .pr .pst-closed{background:var(--k-danger);color:var(--k-danger-fg)}
  .pr .pst-draft,.pr .pst-unknown{background:var(--k-text-faint);color:var(--k-success-fg)}
  .pr .pnum{font-family:var(--k-font-mono);color:var(--k-link)}
  .pr .ptitle{flex:1;font-size:var(--k-text-md)}
  /* Merge verdict, indented under its PR so it reads as a fact ABOUT that PR and

  .mg .mgdot{width:var(--k-space-4);height:var(--k-space-4);border-radius:var(--k-radius-circle);flex:none}
  .mg-clean .mgdot{background:var(--k-success)}
  .mg-conflicted .mgdot{background:var(--k-danger)}
  .mg-unknown .mgdot{border:calc(var(--k-border-w) * 2) solid var(--k-pending);width:var(--k-space-3);height:var(--k-space-3)}

     forty-file conflict cannot push the rest of the panel off screen. */

  /* <summary> is not a <button>/<a>/<input>, so it gets no ring from the
     primitives' generic :focus-visible rule (same reasoning as the approach
     disclosure above). */

    font-size:var(--k-text-xs);color:var(--k-text-dim)}
  .pmeta .pbranch{font-family:var(--k-font-mono);color:var(--k-text)}
  .pmeta .pmerged{color:var(--k-series-2)}
  .pmeta .psep{color:var(--k-text-faint)}

  .pcms summary{cursor:pointer;color:var(--k-link);width:fit-content}
  .pcms summary:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  .pcm{margin:var(--k-space-3) 0 0;padding-left:var(--k-space-4);border-left:var(--k-space-1) solid var(--k-border)}
  .pcm .pcmwho{font-weight:var(--k-weight-semibold);font-size:var(--k-text-xs)}
  .pcm .pcmwhen{margin-left:var(--k-space-3);font-size:var(--k-text-sm);color:var(--k-text-faint)}
  .pcm .pcmbody{white-space:pre-wrap;color:var(--k-text-dim);font-size:var(--k-text-sm);margin-top:var(--k-space-1)}
  /* The merge control is `.k-btn--danger` (UI-R10b: the one irreversible action
     on this panel), built in markup — no bespoke color rule left here. */
  .mgbtn{flex:none}

  /* agent pill (colored by state) */
  .agent-pill{display:inline-flex;align-items:center;gap:var(--k-space-3)}
  .agent-pill .dot{width:var(--k-space-3);height:var(--k-space-3);border-radius:var(--k-radius-circle)}

  /* ===================== Servers panel ==================================
     One service is ONE LINE at every width. The panel reacts to its own grid
     column rather than the viewport, so containment is scoped to it — .panel
     is shared with Worktrees and Pull requests, which need none of this. */
  /* Visually hidden, still announced — for labels the layout drops but a screen
     reader still needs (the dot-only Status header, the filter's label). */
  .sr{position:absolute;width:var(--k-border-w);height:var(--k-border-w);padding:0;margin:calc(var(--k-border-w) * -1);overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .svpanel{container-type:inline-size}
  /* Whole-ticket controls live in the HEADER because they act on every service
     and must survive the states where the body has no rows to hang a button
     off — the empty body is exactly when Start matters most. The count
     therefore gives up the auto margin it keeps in the other panels. */
  .svpanel .phead{padding-right:var(--k-space-5)}
  .svpanel .phead .count{margin-left:0}
  .svpanel .phead .pops{margin-left:auto;display:flex;gap:var(--k-space-1)}
  .svpanel .pbody{padding:0}

  /* Icon buttons — inline SVG off a sprite (no icon font, no external asset:
     the webview CSP forbids both). Icon-only is what lets four actions share a
     row without the action column outgrowing the data. The label is not lost,
     it moves to aria-label + title, so the word survives for both pointer and
     screen reader. Built on `.k-iconbtn` (UI-R07: sizing, hover surface, focus
     ring, and the disabled/pending states all come from the primitive); `.ib`
     stays a LAYOUT+colour-only local class — the glyph's own size, and each
     action's resting hue off the shared status ramp. */

    transition:transform var(--k-dur-fast) var(--k-ease-standard)}

     stepper uses — hue is the fastest way to tell Stop from Start before any
     label is read. The word is still on every button, so hue accelerates, it
     never carries. */
  .ib.t-open{color:var(--k-running)}
  .ib.t-copy{color:var(--k-series-2)}
  .ib.t-restart{color:var(--k-attention)}
  .ib.t-stop{color:var(--k-failed)}
  .ib.t-start{color:var(--k-passed)}
  .ib.ok{color:var(--k-passed)}

     when offline, and the dot carries its word to pointer and screen reader. */
  .svpanel .glyph{flex:0 0 auto;display:inline-block;border-radius:var(--k-radius-circle)}
  .svpanel .glyph.on{width:var(--k-space-4);height:var(--k-space-4);background:var(--k-passed)}
  .svpanel .glyph.off{width:calc(var(--k-space-4) + var(--k-border-w));height:calc(var(--k-space-4) + var(--k-border-w));background:transparent;border:calc(var(--k-border-w) * 2) solid var(--k-pending)}

  .svpanel .filter{display:flex;align-items:center;gap:var(--k-space-4);padding:var(--k-space-4) var(--k-space-5);
    border-bottom:var(--k-border-w) solid var(--k-border)}
  /* Built on `.k-input` — the local rule is layout only (it fills the filter row). */
  .svpanel .filter input{flex:1;min-width:0}
  /* 288px has no scale match — a scroll cap sized to the panel, not a spacing
     value (same category as the merge-conflict list's 180px above). */
  .svpanel .scroll{max-height:288px;overflow-y:auto;overflow-x:hidden}
  .svpanel table{width:100%;border-collapse:collapse;font-size:var(--k-text-md)}
  .svpanel thead th{position:sticky;top:0;z-index:1;background:var(--k-surface);
    text-align:left;font-weight:var(--k-weight-semibold);font-size:var(--k-text-2xs);text-transform:uppercase;
    letter-spacing:.6px;color:var(--k-text-faint);padding:calc(var(--k-space-3) + var(--k-border-w)) var(--k-space-5);
    border-bottom:var(--k-border-w) solid var(--k-border);white-space:nowrap}
  .svpanel tbody tr:hover,.svpanel tbody tr:focus-within{background:var(--k-surface-hover)}
  .svpanel td{padding:var(--k-space-2) var(--k-space-5);vertical-align:middle}
  /* Status is the DOT only — no word. A word over a small dot only crowded the
     header, so that header is screen-reader-only. */
  .svpanel td.c-dot{width:1%;padding-right:0;line-height:0}
  /* The NAME column absorbs all the slack, which pushes the address and its two
     ops into one right-hand group. The address is right-aligned inside a
     shrink-wrapped column, and that is what makes Open/Copy sit flush against
     the value on EVERY row instead of after a ragged gap. */
  .svpanel td.c-name{font-size:var(--k-text-md);max-width:0;width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .svpanel td.c-addr{font-family:var(--k-font-mono);font-size:var(--k-text-sm);color:var(--k-text-dim);
    white-space:nowrap;width:1%;text-align:right;padding-right:calc(var(--k-space-3) - var(--k-border-w))}
  .svpanel td.c-addr.off{font-style:italic;color:var(--k-text-faint)}
  .svpanel td.c-addr .short{display:none}
  .svpanel td.c-addrops{width:1%;padding-left:0;padding-right:0}
  /* The gap between the address group and the lifecycle group is the only thing
     separating them — keep it wider than the gap inside each group. */
  .svpanel td.c-acts{text-align:right;white-space:nowrap;width:1%;padding-left:var(--k-space-6)}
  .svpanel td .g{display:inline-flex;gap:var(--k-space-1);justify-content:flex-end}

  /* Narrow COMPACTS, it does not restack: one service stays one line, which is
     the whole point of this design. 400px cannot be a token: @container
     conditions cannot read a custom property, so no --k-* applies here (same
     exception as a @media breakpoint). */
  @container (max-width: 400px){
    /* SPECIFICITY TRAP — do not simplify these back to bare `td`. A
       class-qualified `td.c-acts` (0,2,1) out-specifies a bare `td` (0,1,1)
       REGARDLESS of source order, so a reset written as `td{width:auto}` never
       lands: the 1% action column survived into narrow and wrapped every icon
       onto its own line. The re-qualification is the fix. */
    .svpanel td.c-acts{width:auto}
    .svpanel thead th{padding:var(--k-space-3);font-size:var(--k-text-2xs)}
    .svpanel td{padding:var(--k-space-2) var(--k-space-3)}
    /* At this width "localhost:5173" ellipsises to "localhost…" — showing the
       part that never varies and hiding the part that does. Both strings are in
       the DOM so the swap is CSS, not a JS width probe; the full address stays
       on the cell's title either way. */
    .svpanel td.c-addr{font-size:var(--k-text-xs)}
    .svpanel td.c-addr .full{display:none}
    .svpanel td.c-addr .short{display:inline}
  }

  /* Empty states. Dense: mark + headline on one line, the reason under it, and
     no button — Start lives in the header where it works in every state. */
  .svpanel .estate{display:flex;align-items:flex-start;gap:var(--k-space-5);
    padding:calc(var(--k-space-6) + var(--k-space-1)) calc(var(--k-space-6) + var(--k-space-1)) calc(var(--k-space-6) + var(--k-space-1) + var(--k-border-w))}
  .svpanel .estate .emark{display:flex;align-items:center;justify-content:center;
    width:var(--k-control-h-sm);height:var(--k-control-h-sm);border-radius:var(--k-radius-circle);flex:none;margin-top:calc(var(--k-border-w) * -1);
    background:var(--k-surface-hover);color:var(--k-text-faint)}
  .svpanel .estate .emark svg{width:var(--k-text-base);height:var(--k-text-base);display:block}
  .svpanel .estate .ehead{font-size:var(--k-text-md);font-weight:var(--k-weight-semibold);color:var(--k-text)}
  .svpanel .estate .esub{font-size:var(--k-text-sm);color:var(--k-text-dim);line-height:1.45;margin-top:var(--k-space-1)}
  /* The dead end gets no action anywhere, so it also gets no emphasis — the
     block stays at description weight to read as a statement, not a prompt. */
  .svpanel .estate.dead .ehead{color:var(--k-text-dim);font-weight:var(--k-weight-medium)}
  .svpanel .nomatch{padding:calc(var(--k-space-6) + var(--k-space-1));color:var(--k-text-faint);font-size:var(--k-text-md)}
</style>

      <rect x="5.5" y="2.5" width="8" height="8" rx="1.5"/>
      <path d="M10.5 10.5V12A1.5 1.5 0 0 1 9 13.5H4A1.5 1.5 0 0 1 2.5 12V7A1.5 1.5 0 0 1 4 5.5h1.5"/>
    </g>
    <g id="i-diff" fill="none" stroke="currentColor" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 2.5v11M2.5 4 4 2.5 5.5 4M12 13.5v-11M10.5 12 12 13.5l1.5-1.5"/>
      <path d="M4 8h5a3 3 0 0 0 3-3"/>
    </g>
    <g id="i-terminal" fill="none" stroke="currentColor" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2.5" width="12" height="11" rx="1.5"/>
      <path d="m4.5 6 2 2-2 2M8.5 10h3"/>
    </g>
    <g id="i-folder" fill="none" stroke="currentColor" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 5.5h12v6A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5z"/>
      <path d="M2 5.5V4A1.5 1.5 0 0 1 3.5 2.5H7l1.5 2H14v1"/>
    </g>
    <g id="i-restart" fill="none" stroke="currentColor" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M13.2 2.6v3.2H10"/>
    </g>
    <g id="i-stop" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <rect x="4.2" y="4.2" width="7.6" height="7.6" rx="1.3" fill="currentColor"/>
    </g>
    <g id="i-start" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
      <path d="M5.2 3.4 12 8l-6.8 4.6z" fill="currentColor"/>

    <!-- Copy confirmation: an icon button has no text to swap, so the glyph is
         what flashes. -->
    <g id="i-check" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round">

    <!-- Empty-state marks: a rack of services, and a struck-through circle for

    <g id="i-rack" fill="none" stroke="currentColor" stroke-width="1.3"
       stroke-linecap="round" stroke-linejoin="round">
      <rect x="2.5" y="2.5" width="11" height="4.5" rx="1.2"/>
      <rect x="2.5" y="9" width="11" height="4.5" rx="1.2"/>
      <path d="M5 4.75h.01"/><path d="M5 11.25h.01"/>
    </g>
    <g id="i-ban" fill="none" stroke="currentColor" stroke-width="1.3"
       stroke-linecap="round" stroke-linejoin="round">
