      // Read the dashed dataset key exactly as the attribute is written — the
      // harness (and any caller) must not need a camelCase guess.
      const stage = menuBtn.dataset['stage-menu'];
      stageMenuStage = stageMenuStage === null ? stage : null;
      render(lastState);
      return;
    }
    // A click anywhere else closes the open ⋯ menu, like every other popover —
    // unless it lands on the menu itself (its item's data-act handler runs in
    // the [data-act] listener that follows and closes it there).
    if (stageMenuStage !== null && !e.target.closest('.stageMenu')) {
      stageMenuStage = null;
    }
    const node = e.target.closest('[data-stage]');
    if (node) { select(node.dataset.stage); return; }
    if (e.target.closest('[data-back]')) select(null);
  });

  // Esc mirrors one Back step (spec §8): detail → its origin, index → ticket,
  // ticket → no artifact-navigation action. The stage header's ⋯ menu also
  // dismisses on Esc, like any dialog.
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && el('ticketDataDrawer').classList.contains('open')) { closeTicketData(); return; }
    if (e.key === 'Escape' && stageMenuStage !== null) { stageMenuStage = null; render(lastState); return; }
    if (e.key === 'Escape' && termView) { closeTerminal(); return; }
    if (e.key === 'Escape' && artView) artifactBack();
    // Gate switch keyboard toggle (Space/Enter)
    if ((e.key === ' ' || e.key === 'Enter') && e.target && e.target.closest && e.target.closest('.gateSwitch')) {
      e.preventDefault();
      e.target.closest('.gateSwitch').click();
    }
  });

  // Tracks which merge disclosures (`.mgd`) are open, so the next render — fired
  // by a state push or an inside-progress tick, not by this click — restores
  // exactly the ones the user had open. Listens in the CAPTURE phase: `toggle`
  // does not bubble in every engine, so a bubble-phase delegate on `#prs` could
  // silently miss it.
  document.addEventListener('toggle', (e) => {
    const node = e.target && e.target.closest && e.target.closest('.mgd');
    if (!node || !node.dataset.repo) return;
    const next = new Set(openMergeRepos);
    if (node.open) next.add(node.dataset.repo);
    else next.delete(node.dataset.repo);
    openMergeRepos = next;
  }, true);

  // Optimistic feedback for the copy button (UI-R15) — the host does the actual
  // clipboard write, and a webview that cannot confirm a write is not something
  // the user needs to act on (the click is trivially repeatable), so this
  // confirms without waiting for a round trip. Never used for a mutation.
  function flashCopied(btn) {
    // An icon button has no text to swap, so the GLYPH is what flashes — and the
    // confirmation moves onto aria-label too, so it is not a purely visual beat
    // for anyone reading the button by name.
    if (btn.classList.contains('ib')) {
      const prevHtml = btn.innerHTML;
      const prevLabel = btn.getAttribute('aria-label');
      btn.innerHTML = svgIcon('check');
      btn.setAttribute('aria-label', 'Copied');
      btn.classList.add('ok');
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = prevHtml;
        btn.setAttribute('aria-label', prevLabel);
        btn.classList.remove('ok');
        btn.disabled = false;
      }, 1200);
      return;
    }
    const prev = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 1200);
  }

  // Delegate clicks (buttons + the ticket-link anchor) → action messages
  // (messages.ts routeAction). A no-payload action (e.g. spin-servers) posts
  // just its type.
  //
  // Rows here render by full innerHTML replacement (every `state` push and
  // every `inside-progress` tick calls render()), so a per-element `karstAction`
  // binding — which keys pending state to the ONE element it was bound to —
  // would go stale the instant a re-render swaps that element out from under
  // it. This delegated handler instead calls the runtime's underlying pieces
  // (karstRequestId / karstBeginPending / karstIsPending) directly, the same
  // fix `sidebar` and `diffs` already apply to the same problem, so every
  // control still gets the four required properties: pending on click,
  // non-re-triggerable, a terminal result, and a watchdog.
  //
  // ship-ticket / merge-pr / refresh-prs are the exception: extension.ts does
  // not await their inner promise (each fires a multi-second-to-multi-minute
  // network operation and returns immediately), so the generic host ack would
  // arrive and settle the control almost instantly — long before the real
  // work finishes. Those three carry NO requestId on the wire and settle
  // themselves from the next meaningful `state` push instead (§
  // DESIGN-SYSTEM.md 5.1: a mutating action "settles on the host's result, OR
  // THE NEXT state push") — see resolveShipping() and the `state` handler
  // below. merge-pr's payload also stays exactly `{type:'merge-pr', repo}`
  // regardless (UI-R37): the strategy is the host's question to the user, and
  // widening the wire payload here would be the same failure the omitted
  // `method` already guards against.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    e.preventDefault();
    const act = btn.dataset.act;

    // Confirm ship kicks off slow backend work (model call + gh pr create).
    // Guard against double-submit and show that the click registered BEFORE
    // the host is even asked — no window where the button looks inert with
    // work underway. The in-flight marker is the pending requestId, which
    // resolveShipping() settles from the next meaningful state push (the old
    // `shipping` flag is gone with the legacy ship-progress overlay).
    if (act === 'ship-ticket') {
      if (shipRequestId) return;
      shipDone = null;
      shipRequestId = karstRequestId();
      karstBeginPending(btn, shipRequestId);
      render(lastState);
      post({ type: act });
      return;
    }
    // Merging is irreversible and the host answers with a modal first, so the
    // button must both stop repeating the request and show that the click
    // landed. See resolveMergeOutcome() for how mergeRequests[repo] settles.
    if (act === 'merge-pr') {
      const repo = btn.dataset.repo;
      if (!repo || mergeRequests[repo]) return;
      const requestId = karstRequestId();
      karstBeginPending(btn, requestId);
      mergeRequests = { ...mergeRequests, [repo]: requestId };
      render(lastState);
      post({ type: act, repo });
      return;
    }
    // Same reason as the two above: the work is a slow host round trip (gh
    // per PR, git fetch per repo), so show it landed and stop it repeating.
    if (act === 'refresh-prs') {
      if (prRefreshId) return;
      prRefreshId = karstRequestId();
      karstBeginPending(btn, prRefreshId);
      if (lastState) render(lastState);
      post({ type: act });
      return;
    }
    // Send back to Implement: the host answers with a confirmation MODAL and
    // then a state push (confirm, dismiss, refusal or throw — always). The
    // pending item is settled by resolveSendBackOutcome() on that push, the
    // same contract merge-pr documents; the in-flight requestId is what stops
    // a second click re-opening the modal while one is up.
    if (act === 'send-back-to-implement') {
      if (sendBackRequestId) return;
      stageMenuStage = null;
      sendBackRequestId = karstRequestId();
      karstBeginPending(btn, sendBackRequestId);
      if (lastState) render(lastState);
      post({ type: act });
      return;
    }

    // Pending is set locally on click (UI-R11): the round trip is the thing
    // being reported, so it can never also be the thing that starts the
    // report. The label never changes while pending — the spinner (via
    // karstBeginPending) carries that meaning, not a text swap.
    if (act === 'set-disabled-gates') {
      if (karstIsPending(btn) || btn.disabled) return;
      const requestId = karstRequestId();
      karstBeginPending(btn, requestId);
      post({
        type: act,
        stage: btn.dataset.stage,
        name: btn.dataset.name,
        disabled: btn.dataset.disabled !== '1',
        requestId,
      });
      return;
    }

    // The terminal console view: open it and post the closed-vocabulary
    // stage-log-request. No requestId — the host answers with the `stage-log`
    // message itself (ok or error), which is the terminal outcome (UI-R13).
    // Reads `data-console`, never `data-stage` (the rail's select listener
    // matches any `[data-stage]` ancestor via closest() and must not re-point
    // the strip for a console click).
    if (act === CONSOLE_ACT) {
      const stage = btn.dataset.console;
      if (!stage) return;
      openTerminal(stage);
      return;
    }

    // The ticket-data preview is purely local: the brief already rides
    // DashboardState, so there is NO host message to post — handled before
    // the posting path, exactly like CONSOLE_ACT, so a host that knows
    // nothing about this action never receives a message it cannot answer.
    if (act === 'preview-ticket-data') {
      openTicketData();
      return;
    }

    // Every other posting control settles on the host's genuine `action-result`
    // ack (UI-R11–R14): pending on click, dropped (not queued) on a repeat,
    // and the runtime's own watchdog covers a host that never answers.
    if (karstIsPending(btn) || btn.disabled) return;
    const requestId = karstRequestId();
    karstBeginPending(btn, requestId);
    if (btn.dataset.id) post({ type: act, serverId: Number(btn.dataset.id), requestId });
    else if (btn.dataset.branch) post({ type: act, branch: btn.dataset.branch, requestId });
    else if (btn.dataset.path) post({ type: act, path: btn.dataset.path, requestId });
    else if (btn.dataset.url) post({ type: act, url: btn.dataset.url, requestId });
    // The repo NAMES the conflict; the host resolves it to a worktree itself.
    else if (btn.dataset.repo) post({ type: act, repo: btn.dataset.repo, requestId });
    // stage-resume: the message carries ITS OWN ticketId/stageKey (the host
    // validates both against the ticket it actually owns before touching the
    // store — see messages.ts) rather than trusting the panel's notion of
    // "current", which a stale render could have gotten wrong.
    else if (btn.dataset.stagekey) {
      post({ type: act, ticketId: lastState.ticketId, stageKey: btn.dataset.stagekey, requestId });
    }
    // inside-action: the message carries ONLY the opaque actionId (messages.ts
    // drops any payload with a companion field) — never a path, URL, PR
    // number, repo, or stage as authority. The host resolves the id against
    // its snapshot-scoped allowlist.
    else if (btn.dataset.actionId) {
      post({ type: act, actionId: btn.dataset.actionId, requestId });
    }
    // artifact-open-resource: the artifact id + a resource INDEX — never a
    // path. The host re-derives the artifacts and resolves both, so a crafted
    // message cannot aim the editor at an arbitrary file (messages.ts).
    else if (btn.dataset.artifactId && btn.dataset.index !== undefined) {
      post({
        type: act,
        artifactId: btn.dataset.artifactId,
        index: Number(btn.dataset.index),
        requestId,
      });
    }
    else post({ type: act, requestId });
    // Optimistic clipboard confirmation (UI-R15) rides ALONGSIDE the pending
    // state above, not instead of it — the button still reports whatever the
    // host's real ack says, same as every other control.
    if (btn.hasAttribute('data-copy')) flashCopied(btn);
  });

  // The inside ledger's disclosure state. A process row IS a native
  // <details>/<summary> (B3); persisting the `toggle` — keyed by the row's
  // OWN data-proc-id, the composite `${stageKey}:${p.id}` the renderer looks
  // up (Task 0.1) — restores exactly the rows the user had open next render.
  // Explicit COLLAPSES also land in `closedProcesses` (Task 3, Step 5) so a
  // default-open row the user closed stays closed. Capture phase, like .mgd.
  //
  // The toggled element IS the process row itself: only rows carry
  // `data-proc-id`, so the target's OWN attribute is the row key — never a
  // `closest()` onto an ancestor class. A nested disclosure inside a row's
  // body (a receipt's inner "Details", a merge-check detail, PR comments) is
  // a different <details> with no data-proc-id and must not record the row
  // as toggled.
  document.addEventListener('toggle', (e) => {
    const node = e.target;
    if (!node || node.tagName !== 'DETAILS' || !node.dataset || !node.dataset.procId) return;
    const key = node.dataset.procId;
    const next = new Set(openProcesses);
    if (node.open) next.add(key);
    else next.delete(key);
    openProcesses = next;
    const closed = new Set(closedProcesses);
    if (node.open) closed.delete(key);
    else closed.add(key);
    closedProcesses = closed;
  }, true);

  // Settle every outstanding merge request against the fresh PR list. `merged`
  // is the one outcome the webview can actually verify — the host reports
  // nothing else back over this channel — so a repo that came back merged
  // settles `true` (success flash + toast); anything else settles `null`
  // (unknown), never `false`. Claiming FAILED would misreport a user who
  // simply cancelled the host's confirmation dialog, which is not a failure;
  // distinguishing a real refusal from a cancel needs a host-side signal this
  // webview does not have (see the PR panel's own header comment).
  function resolveMergeOutcome(state) {
    if (!Object.keys(mergeRequests).length) return;
    const prByRepo = {};
    for (const p of (state.prs || [])) prByRepo[p.repo] = p;
    for (const [repo, requestId] of Object.entries(mergeRequests)) {
      const merged = prByRepo[repo] && prByRepo[repo].status === 'merged';
      karstSettle(requestId, merged ? true : null, merged ? 'Merged.' : undefined);
    }
    // A state push is the host's answer to every outstanding merge request —
    // success, refusal, or a cancelled confirmation (the host pushes either
    // way, via extension.ts's `finally`). Clearing here is what stops a
    // button sticking on "Merge" (pending) forever.
    mergeRequests = {};
  }

  // Settle an in-flight "Send back to Implement" against the fresh snapshot.
  // The one outcome the webview can verify is the ticket actually moving to
  // impl (extension.ts confirms via modal, then always pushes). Anything else
  // — the user dismissed the modal, the host refused, or the ticket moved
  // elsewhere — settles `null` (unknown), never `false`: a dismissal is not a
  // failure, and the difference between "refused" and "cancelled" is a
  // host-side signal this webview does not have (the same reasoning as
  // resolveMergeOutcome).
  function resolveSendBackOutcome(state) {
    if (!sendBackRequestId) return;
    const moved = state.stageCurrent === 'impl';
    karstSettle(
      sendBackRequestId,
      moved ? true : null,
      moved ? 'Sent back to Implement.' : 'The ticket was not moved.',
    );
    sendBackRequestId = null;
  }

  // Re-measure the track when the DOM did not change but its available width
  // did. `renderTrack` calls place() itself on the render path; these three cover
  // the rest — a panel drag, the document finishing, and web fonts settling. A
  // track measured against pre-layout metrics reports no overflow and degrades
  // one step too late, which is why `load` and `fonts.ready` are here at all.
  window.addEventListener('resize', place);
  window.addEventListener('load', place);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg) return;
    // Transient inside-progress events (the inside redesign): the live header
    // for the ONE operation now running, and the completed process row that
    // replaces the snapshot's same-id row until the next full snapshot. Ship
    // rides this same union (Finding 12) — the legacy `ship-progress` stream
    // is gone. The host pushes a snapshot when the stage moves, which retires
    // the overlay (see the state handler below) — the overlay is a same-tick
    // update, never a state source. A `cleared` event covers
    // cancellation/supersession with no invented result.
    if (msg.type === 'inside-progress') {
      const e = msg.event;
      if (!e) return;
      if (e.kind === 'active') {
        liveOps[e.stage] = { active: e.live, processId: e.processId };
      } else if (e.kind === 'completed') {
        liveOps[e.stage] = { completed: e.process };
      } else if (e.kind === 'cleared') {
        delete liveOps[e.stage];
      }
      if (lastState) render(lastState);
      return;
    }
    // The terminal console answer. The host ALWAYS answers a stage-log-request
    // (ok or error) — this message is the terminal outcome (UI-R13). A stale
    // answer for a view that has since closed (or moved to another stage) is
    // dropped, not rendered.
    if (msg.type === 'stage-log') {
      if (!termView || termView !== msg.stage) return;
      termLoading = false;
      const status = el('tstatus');
      if (msg.result.kind === 'ok') {
        if (status) status.textContent = msg.result.truncated ? 'Console output truncated' : '';
        if (term) term.write(msg.result.content);
      } else {
        if (status) status.textContent = '';
        const host = el('termHost');
        if (host) host.innerHTML = `<div class="blurb">${esc(msg.result.message)}</div>`;
      }
      return;
    }
    // The window's terminal binding. Host-owned: it is one preference shared by
    // every open dashboard, so the webview renders what it is told and never
    // decides — the click posts `toggle-bind` and waits for this message back.
    if (msg.type === 'bind') {
      bindEnabled = msg.enabled === true;
      renderBind();
      return;
    }
    if (msg.type === 'worktree-stats') {
      worktreeStats = Object.fromEntries(
        (msg.stats || []).map((stats) => [stats.repo, stats]),
      );
      if (lastState) renderWorktrees(lastState.worktrees || []);
      return;
    }
    // The togglable gate names, resolved async/host-side like worktree-stats.
    // Overwrites the whole section (never merged) — the host recomputed it
    // from scratch, and a merge could keep a name the current manifest no
    // longer resolves.
    if (msg.type === 'gate-options') {
      gateOptions = msg.options || { uat: [], review: [] };
      renderMenuGates();
      return;
    }
    // The terminal result of an async action (§ DESIGN-SYSTEM.md 5.3, UI-R13).
    // ship-ticket/merge-pr/refresh-prs never reach here (they carry no
    // requestId on the wire, by design — see the click handler above); every
    // other posting control settles through this one line.
    if (msg.type === 'action-result') {
      karstSettle(msg.requestId, msg.ok, msg.message);
      return;
    }
    if (msg.type === 'state') {
      // A LIVE repaint carries no news — it is the same snapshot re-read so the
      // running rows and their clocks stay current. Defer it while the user is
      // mid-interaction rather than redrawing over them; keep the data, so the
      // next tick draws it. A non-live push always renders: it is reporting
      // something that actually happened.
      if (msg.live && !liveRepaintSafe()) {
        lastState = msg.state;
        return;
      }
      // Resolve an in-flight ship FIRST, so render() draws either the held
      // spinner or the settled line — never a flash of the stale "Confirm ship".
      resolveShipping(msg.state);
      // Likewise merge — settle every outstanding request against the fresh
      // PR list before rendering, so the button's pending state and its
      // terminal toast land in the same frame.
      resolveMergeOutcome(msg.state);
      // Likewise the recovery action — the host pushes a snapshot after the
      // modal (confirm or cancel), which is what settles the pending item.
      resolveSendBackOutcome(msg.state);
      // Likewise the refresh icon: the host pushes state when the sweep settles
      // even if no verdict moved, precisely so the spin has an end. The result
      // is always reported ok:true — the webview cannot itself distinguish "PR
      // status changed" from "confirmed unchanged", and both are a successful
      // refresh (UI-R31: no verdict is invented here).
      if (prRefreshId) {
        karstSettle(prRefreshId, true);
        prRefreshId = null;
      }
      // The full snapshot supersedes the inside live overlay: progress.ts is
      // explicit that the snapshot is authoritative. A snapshot that actually
      // CONTAINS the process retires the overlay — for `completed`, any
      // presence (its row is the final one); for `active`, only a terminal
      // row, because an unrelated push mid-gate must not drop the live header
      // while the same row still reads `run` in the snapshot. Absence keeps
      // the overlay: a snapshot that does not know the process cannot answer
      // about it.
      const views = msg.state.insideViews || {};
      for (const stage of Object.keys(liveOps)) {
        const entry = liveOps[stage];
        const procs = (views[stage] || {}).processes || [];
        const id = entry.completed ? entry.completed.id : entry.processId;
        if (!id) continue;
        const row = procs.find((p) => p.id === id);
        if (row && (entry.completed || row.status !== 'run')) delete liveOps[stage];
      }
      // The matching async totals message follows this snapshot. Until then,
      // omit numbers rather than showing values for an older working tree.
      // NOT on a live repaint: that push deliberately re-runs no loader (it is
      // a store read, nothing more), so no totals message follows it and
      // clearing here would blank the numbers once a second and never refill
      // them. The tree they describe has not changed either — a repaint is the
      // same worktrees, re-read.
      if (!msg.live) worktreeStats = {};
      // A live repaint is the same snapshot re-read — only the running rows'
      // clocks advanced. A full render would rebuild the inside block and
      // recreate the running spinner elements (restarting their CSS animation
      // once a second) and re-derive every disclosure from the open/closed
      // sets. Update the mutable running-clock text in place instead; a real
      // push still renders authoritatively.
      if (msg.live) {
        lastState = msg.state;
        updateInsideLive(msg.state);
        return;
      }
      // Never touches selectedStage, so a full re-render preserves the user's
      // selection for free — including during a run, when pushes are frequent.
      render(msg.state);
      // Persisting is for surviving a reload, so only a push that carries news
      // needs to write: a repaint would rewrite the same snapshot every second.
      if (!msg.live) persist();
    }
  });

  // Restore last state on reload before the host re-pushes. Tolerates the
  // pre-envelope shape a panel open across an upgrade may have persisted.
  const prev = vscode.getState();
  const restored = prev && prev.state ? prev : prev ? { state: prev, sel: null } : null;
  if (restored && restored.state) {
    selectedStage = restored.sel || null;
    srvFilter = restored.srvFilter || '';
    // The artifact surface + scrolls are view state like selection; an old
    // build's persisted state simply has none.
    artView = restored.artView || null;
    artScrolls = restored.artScrolls || { ticket: 0, index: 0, detail: {} };
    render(restored.state);
    artRestoreScroll();
  }
</script>
