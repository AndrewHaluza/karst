<!--
  Karst ticket dashboard webview (T3.2). Self-contained: no external assets
  (webview CSP forbids them). Renders from the `state` postMessage the host
  pushes (state.ts → DashboardState) and posts action messages back
  (messages.ts → WebviewMessage). Styles ported from design/orchestrator-mockup.html.
-->
<!--KARST_CSP-->
<style>
  /*KARST_DS_CSS*/
  /*KARST_XTERM_CSS*/
  /*KARST_AGENT_CSS*/

  :root{
    /* Status colors come from the shared ramp (--k-pending|running|attention|
       passed|failed, injected via /*KARST_PALETTE*\/ below) and are consumed
       directly as var(--k-*) everywhere in this file (UI-R05/R06: one token
       per meaning, declared once, never redeclared or given a second name).
       --k-surface is the opaque mask the rail nodes fill with to hide the
       connector running under them — it used to be a local `--panel-bg` here
       with its own hex fallback; that fallback is now the one in
       designSystem.ts, so a theme without editorWidget.background still gets
       the same opaque floor. */

    /* One header height for every panel in the grid. The headers carry
       different contents — bare text, icon buttons, a text button — and
       letting each size itself put the Worktrees body 2px below the Servers
       body beside it, so the whole block read as drifted. Padding alone
       cannot fix that: the tallest control still sets the height. Composed
       from tokens (a large control + one padding step + the hairline)
       rather than a bare 39px literal (UI-R04). */
    --phead-h:calc(var(--k-control-h-lg) + var(--k-space-4) + var(--k-border-w));
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--k-bg);color:var(--k-text);font-family:var(--k-font-ui);font-size:var(--k-text-base);padding:var(--k-space-8) var(--k-space-9)}
  a{color:var(--k-link);text-decoration:none}
  /* Toggled by the render fns (blocked banner, impl phases, artifact panels) —
     without this rule the `hidden` class was a no-op and an empty box still
     drew its border. */
  .hidden{display:none}
  /* The header's staged controls (#confirmShip, #boardLink) toggle the `hidden`
     ATTRIBUTE — semantically the right tool (it drops them from the a11y tree
     and tab order, which the class cannot). But the component CSS
     (.k-btn/.k-iconbtn) sets display:inline-flex, and author CSS overrides
     the UA `[hidden]{display:none}` no matter its specificity — so without an
     author rule the attribute was a no-op and Confirm ship stayed visible the
     whole way through Implementation (869ehahjh-fu1). Same fix the diffs
     webview needed for its notice. Same specificity as the component rules,
     so it must sit AFTER the injected design-system CSS (which it does — the
     marker is at the top of this <style>) to win the cascade. */
  [hidden]{display:none}

  .dhead h1.ticketTitle{min-width:0;flex:1;margin:0 var(--k-space-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--k-text-xl)}
  .ticketKey{min-height:var(--k-hit-min);padding:0 var(--k-space-3);border:0;border-radius:var(--k-radius-sm);background:transparent;color:var(--k-text-dim);font-family:var(--k-font-mono);font-size:var(--k-text-xs);cursor:pointer}
  .ticketKey:hover{background:var(--k-surface-hover);color:var(--k-text)}
  .ticketParent{display:block;margin-top:var(--k-space-3);color:var(--k-text-dim);font-size:var(--k-text-xs);font-family:var(--k-font-mono)}
  .headerActions{display:flex;align-items:center;gap:var(--k-space-2);flex:none;margin-left:auto}
  .agentWrap,.menuWrap{position:relative}
  .agentButton{max-width:calc(var(--k-space-8) * 20);min-height:var(--k-control-h-lg);padding:0 var(--k-space-4);border:var(--k-border-w) solid transparent;border-radius:var(--k-radius-sm);background:transparent;color:var(--k-text);display:inline-flex;align-items:center;gap:var(--k-space-3);cursor:pointer;min-width:0}
  .agentButton:hover:not(:disabled){background:var(--k-surface-hover);border-color:var(--k-border)}
  .agentButton:disabled{opacity:.72;cursor:default}
  .agentButton .agentSep{color:var(--k-text-faint);flex:none}
  .agentMeta{min-width:0;max-width:calc(var(--k-space-8) * 9);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--k-text-dim);font-family:var(--k-font-mono);font-size:var(--k-text-xs)}
  .agentLive{display:inline-flex;align-items:center;gap:var(--k-space-2);color:var(--k-text-dim);font-size:var(--k-text-xs);white-space:nowrap;flex:none}
  .agentLiveDot{width:var(--k-space-3);height:var(--k-space-3);border-radius:var(--k-radius-circle);background:var(--k-pending);flex:none}
  .agentLiveDot.running{background:var(--k-running)}
  .agentLiveDot.waiting{background:var(--k-attention)}
  /* The header + controls-menu icons are sized EXPLICITLY. An inline k-icon
     svg carries no intrinsic size — the shared `.k-icon` rule applies only
     the stroke treatment — so an unsized one renders at the browser's default
     replaced-object size: in the agent button's unclipped flex row that
     ballooned to ~275px and inflated the whole header. Every other icon in
     this file carries its size (the panel headers' width/height attributes,
     `.ib svg`); these five did not. */
  .dhead .k-icon{width:var(--k-space-7);height:var(--k-space-7)}
  /* The two popovers — agent switch form + ticket-controls menu (UI-R04: composed
     from control-height tokens, no raw widths). */
  .popover{display:none;position:absolute;z-index:50;top:calc(100% + var(--k-space-3));right:0;border:var(--k-border-w) solid var(--k-border-strong);border-radius:var(--k-radius-lg);background:var(--k-surface);box-shadow:var(--k-elev-2)}
  .popover.hidden{display:none}
  .popover.open{display:block}
  .agentPopover{width:calc(var(--k-control-h-lg) * 14);padding:0}
  .menuPopover{width:calc(var(--k-control-h-lg) * 12);padding:var(--k-space-4)}
  .agentForm{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:var(--k-space-3) var(--k-space-4);padding:var(--k-space-4);align-items:center}
  /* The label column is max-content, never a fixed step: "Agent core" is wider
     than any spacing token, and a 20px column let the right-aligned label spill
     out of the popover's left edge and over whatever sat beside it. `contents`
     dissolves the row wrapper so label + control place straight into the two
     columns; the help line takes the control column, so it can never drift from
     the controls' indent. */
  .fieldRow{display:contents}
  .fieldLabel{margin:0;color:var(--k-text-faint);font-size:var(--k-text-xs);font-weight:var(--k-weight-medium);line-height:1;text-align:right;white-space:nowrap}
  .fieldControl{min-width:0}
  .fieldHelp{grid-column:2;color:var(--k-text-faint);font-size:var(--k-text-xs);line-height:1.35}
  .popActions{display:flex;justify-content:flex-end;padding:var(--k-space-4);border-top:var(--k-border-w) solid var(--k-border)}
  .menuButton{width:100%;min-height:var(--k-control-h-lg);display:flex;align-items:center;gap:var(--k-space-4);border:0;border-radius:var(--k-radius-sm);background:transparent;color:var(--k-text);padding:0 var(--k-space-4);cursor:pointer;text-align:left}
  .menuButton:hover{background:var(--k-surface-hover)}
  .menuButton .k-icon{color:var(--k-text-dim);flex:none}
  .menuHeading{margin:var(--k-space-2) var(--k-space-4) var(--k-space-3);color:var(--k-text-faint);font-size:var(--k-text-2xs);font-weight:var(--k-weight-semibold);letter-spacing:.06em;text-transform:uppercase}
  .menuDivider{height:1px;background:var(--k-border);margin:var(--k-space-3)}
  .settingRow{display:flex;align-items:center;gap:var(--k-space-5);padding:var(--k-space-3) var(--k-space-4)}
  .settingCopy{min-width:0;flex:1}
  .settingTitle{font-size:var(--k-text-md);font-weight:var(--k-weight-medium)}
  .settingHelp{margin-top:1px;color:var(--k-text-faint);font-size:var(--k-text-2xs);line-height:1.35}
  .k-switch{position:relative;display:inline-flex;align-items:center;cursor:pointer}
  .k-switch input{position:absolute;opacity:0;pointer-events:none}
  .gateGroup{margin:0 var(--k-space-3) var(--k-space-3);border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-md);overflow:hidden}
  .gateHead{min-height:var(--k-control-h-sm);display:flex;align-items:center;padding:0 var(--k-space-4);background:var(--k-surface-sunken);color:var(--k-text-faint);font-size:var(--k-text-2xs);font-weight:var(--k-weight-semibold);letter-spacing:.06em;text-transform:uppercase}
  .gateRow{min-height:var(--k-control-h-lg);display:flex;align-items:center;gap:var(--k-space-4);padding:0 var(--k-space-4);border-top:var(--k-border-w) solid var(--k-border)}
  .gateName{flex:1;font-family:var(--k-font-mono);font-size:var(--k-text-xs)}
  .gateSwitch{margin-left:auto}
  /* Select shell / dropdown — shared agent-switch picker (same pattern as
     Settings → General, adapted to dashboard design tokens). */
  .select-shell{position:relative;min-width:0}
  .select-trigger{width:100%;min-height:var(--k-control-h-lg);display:flex;align-items:center;gap:var(--k-space-3);
    padding:var(--k-space-2) calc(var(--k-space-8) + var(--k-space-3)) var(--k-space-2) var(--k-space-4);
    text-align:left;position:relative;cursor:pointer;overflow:hidden;
    background:var(--k-surface);color:var(--k-text);
    border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-sm);
    font:inherit;font-size:var(--k-text-base)}
  .select-trigger:hover{border-color:var(--k-focus)}
  .select-trigger:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  .select-trigger .chev{position:absolute;right:var(--k-space-4);top:50%;transform:translateY(-50%);
    width:var(--k-space-6);height:var(--k-space-6);flex:none;margin:var(--k-space-0);
    background:var(--chevron) no-repeat center/var(--k-space-6)}
  .select-trigger .sel-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:var(--k-space-2)}
  .select-shell.is-open{z-index:calc(var(--k-z-drawer) + 1)}
  .dropdown{position:absolute;top:calc(100% + var(--k-space-2));left:var(--k-space-0);right:var(--k-space-0);
    min-width:100%;z-index:var(--k-z-drawer);display:none;
    background:var(--k-surface);border:var(--k-border-w) solid var(--k-border-strong);
    border-radius:var(--k-radius-md);padding:var(--k-space-2);box-shadow:var(--k-elev-2)}
  .dropdown.open{display:block}
  .drop-item{display:flex;align-items:center;gap:var(--k-space-3);padding:var(--k-space-3) var(--k-space-4);
    border-radius:var(--k-radius-sm);cursor:pointer;font-size:var(--k-text-base)}
  .drop-item:hover{background:var(--k-surface-hover);color:var(--k-text)}
  .drop-item.active,.drop-item[aria-selected="true"]{background:var(--k-surface-hover);color:var(--k-text)}
  .model-pop{position:absolute;top:calc(100% + var(--k-space-2));left:var(--k-space-0);right:var(--k-space-0);
    min-width:calc(var(--k-space-8) * 12);z-index:var(--k-z-drawer);display:none;overflow:hidden;
    background:var(--k-surface);border:var(--k-border-w) solid var(--k-border-strong);
    border-radius:var(--k-radius-md);box-shadow:var(--k-elev-2)}
  .model-pop.open{display:block}
  .model-search{padding:var(--k-space-3);border-bottom:var(--k-border-w) solid var(--k-border)}
  .model-search input{width:100%}
  .model-scroll{max-height:calc(var(--k-space-8) * 12);overflow:auto}
  .model-group-label{padding:var(--k-space-2) var(--k-space-4);color:var(--k-text-faint);font-size:var(--k-text-2xs);
    font-weight:var(--k-weight-semibold);letter-spacing:.06em;text-transform:uppercase}
  .model-empty{padding:var(--k-space-4);color:var(--k-text-faint);font-size:var(--k-text-xs);text-align:center}
  .model-item{display:flex;align-items:center;justify-content:space-between;gap:var(--k-space-3);
    padding:var(--k-space-3) var(--k-space-4);border-radius:var(--k-radius-sm);cursor:pointer}
  .model-item:hover{background:var(--k-surface-hover)}
  .model-item:hover .model-sub,.model-item:hover .model-tag{color:var(--k-text);opacity:.8}
  .model-item.active,.model-item[aria-selected="true"]{background:var(--k-surface-hover);color:var(--k-text)}
  .model-item.active .model-sub,.model-item.active .model-tag{color:inherit;opacity:.8}
  .model-item .model-name{font-weight:500;font-size:var(--k-text-base)}
  .model-item .model-sub{font-size:var(--k-text-xs);color:var(--k-text-dim);margin-top:var(--k-space-1)}
  .model-item .model-tag{font-size:var(--k-text-2xs);color:var(--k-text-faint);flex:0 0 auto}
  .menuBlurb{padding:var(--k-space-4);color:var(--k-text-faint);font-size:var(--k-text-xs)}
  /* Shared ticketing-provider badge (icon + brand name) — single source in
     src/model/providerIdentity.ts, injected here at load (CSP forbids a
     shared stylesheet). */
  /*KARST_PROVIDER_CSS*/

  /* The stage graph as ONE OBJECT the ticket travels through, not seven circles
     joined by connectors with a band beneath. The current stage is the WIDE
     segment and every other is compact — that is what fits seven stages into a
     narrow panel, and it is what removed the old 560px floor and the sideways
     scroll with it.

     `fix` is NOT a segment. STAGE_GRAPH reaches it only by a failed verdict and
     its only edge returns to uat, so nothing can ever be after it; it is a retry
     cycle on the gate that failed, and it is drawn INSIDE that gate (.fixm).
     Drawing it as a seventh station bought permanent layout for a stage most
     tickets never enter, and left a control on screen reading `fix idle`.

     Status is never colour alone (UI-R28): every state also carries a distinct
     glyph, failed adds a hatch, and needs-you adds the reason in words plus the
     action — so the track survives colourblindness and high-contrast themes. */
  .stepper{margin:var(--k-space-8) 0 var(--k-space-9);
    padding:calc(var(--k-space-6) + var(--k-space-1)) var(--k-space-4) var(--k-space-4);
    border:var(--k-border-w) solid var(--k-border);
    border-radius:calc(var(--k-radius-lg) + var(--k-border-w));background:var(--k-surface)}
  .railwrap{padding-top:var(--k-space-3)}

  /* Named geometry handles. The notch depth is what the horizontal paddings and
     the clip-path below are BOTH derived from, so the two can never drift apart —
     that is why it is a variable rather than three copies of one number. All but
     the lane height resolve to scale tokens; the lane height is a component
     dimension with no scale match (the closed 0–26px scale stops well short of a
     control strip), the same UI-R04 exception the deleted 560px floor carried. */
  .track{position:relative;--trk-h:46px;
    --trk-notch:var(--k-space-6);--trk-tick-w:var(--k-space-2);--trk-tick-h:var(--k-space-6);
    /* Half the lane and the length of one chevron edge. Both exist only so the
       focus ring below can be inset PERPENDICULARLY to that edge; they are
       derived from the two dimensions above, never written down, so a change to
       either keeps the ring parallel to the shape it outlines. */
    --trk-half:calc(var(--trk-h) / 2);
    --trk-diag:hypot(var(--trk-notch),var(--trk-half));
    /* The lane's radius as seen from INSIDE its border — what a ring flush to the
       first or last segment must curve by to sit on the lane's own corner rather
       than be cut square by it. */
    --trk-r:calc(var(--k-radius-lg) - var(--k-border-w))}

  /* overflow-x:auto, NEVER hidden. The three degradation steps below keep the
     track inside its lane at every width a VS Code panel can be dragged to (300px,
     measured across the eight cases in docs/design/stages/variant-e-track.html),
     so this scrollbar is unreachable in practice — but if a width ever gets past
     them, the honest failure is a scrollbar the user can act on. overflow:hidden
     is what turned an over-wide track into an INVISIBLE defect: the current
     segment's own action button was clipped away with nothing to say so. */
  .lane{display:flex;align-items:stretch;height:var(--trk-h);
    border-radius:var(--k-radius-lg);background:var(--k-surface-sunken);
    border:var(--k-border-w) solid var(--k-border);
    overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}

  /* A segment is a WRAPPER, not a button: it holds the select control and, when
     the stage is parked on the user, the action control too — and a <button> may
     not contain a <button> (nested, the parser closes the outer one and the whole
     track loses its structure). The chevron clip and the wash live here.

     Each segment carries its stage's colour via the shared stg-<stage> token
     (model/stagePalette), the SAME token the sidebar chip uses, so a stage is the
     identical hue in both views. A stageKey with no stg-* class falls through to
     this neutral default rather than rendering uncoloured. */
  /* NOTE: this rule deliberately sets NEITHER `color` NOR `--stg-color`. The
     stage hue arrives on the same element from the injected `stg-<stage>` classes
     (model/stagePalette), whose specificity is (0,1,0) — a scoped `.track .seg`
     is (0,2,0) and would beat them at any source order, which paints every
     travelled segment neutral grey and silently kills the one thing the wash
     exists to say. The old `.st` rule tied at (0,1,0) and lost to the later
     injection; scoping is what broke that. Status classes below are (0,3,0) and
     override the hue ON PURPOSE. */
  .track .seg{position:relative;display:flex;align-items:center;gap:var(--k-space-3);
    flex:0 0 auto;min-width:0;
    padding:0 var(--k-space-6) 0 calc(var(--trk-notch) + var(--k-space-5));
    clip-path:polygon(0 0,calc(100% - var(--trk-notch)) 0,100% 50%,
      calc(100% - var(--trk-notch)) 100%,0 100%,var(--trk-notch) 50%);
    margin-left:calc(var(--trk-notch) * -1);
    transition:background var(--k-dur-base) var(--k-ease-standard)}
  .track .seg:first-child{margin-left:0;padding-left:var(--k-space-6);
    clip-path:polygon(0 0,calc(100% - var(--trk-notch)) 0,100% 50%,
      calc(100% - var(--trk-notch)) 100%,0 100%)}
  .track .seg:last-child{padding-right:var(--k-space-7);
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%,var(--trk-notch) 50%)}
  .track .seg:hover{background:var(--k-surface-hover)}

  /* The select control fills the wrapper, so the WHOLE segment is the hit area
     while still being one real <button> for Tab and Enter (UI-R09). */
  .track .seg .pick{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer}
  /* The rectangular baseline, and the fallback if the ring below cannot be
     computed. It is honest about what it is: two bars, because an `outline` is
     a rectangle and the chevron clip cuts its left and right strokes away. */
  .track .seg .pick:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);
    outline-offset:calc(var(--k-focus-offset) * -1)}

  /* Selection is a MARK, never a fill — status already owns fill and the stage
     owns hue, and all three must stay independently readable, so it keeps its
     own off-ramp purple (the shared categorical token, UI-R08).
     This is the BASELINE, replaced by the chevron ring above wherever that can
     be computed. It is an inset shadow on the SEGMENT rather than a ring on the
     inset `.pick` because `clip-path` clips a child's rendering: a rectangular
     ring lost its left and right strokes inside the two notches, and at the ends
     of the lane its square corners sat inside the lane's own `--k-radius-lg`, so
     the mark read as SHIFTED off the block it marks. An underline is clipped by
     the very polygon that draws the segment, so it cannot disagree with the
     shape — it just says less than the ring does. */
  .track .seg.sel{box-shadow:inset 0 calc(var(--k-border-w) * -3) 0 var(--k-series-2)}

  /* ── the selection and focus rings, in the segment's own shape ───────────
     An outline (or an inset shadow — same rectangle) cannot outline a chevron:
     `clip-path` clips a CHILD's rendering, so the vertical strokes fall inside
     the two notches and are cut, leaving a border that visibly does not close
     around the arrow it belongs to. The first attempt at that was the selection
     ring; the underline it became read as a stray bottom border on the segment,
     which is the same complaint from the other side — a mark that is not the
     shape it marks. So the ring is drawn as a SHAPE: `.pick` is filled and
     clipped to the chevron MINUS a smaller chevron (`evenodd`), which leaves
     exactly the band between them.

     ONE shape, two states. Selection wears the shared categorical purple
     (UI-R08) and focus wears `--k-focus` and OUTRANKS it — a focused segment is
     already the selected one in every case the user can reach by keyboard, and
     two concentric bands say nothing the colour does not. `aria-pressed` carries
     selection either way, so nothing is lost while the ring is showing focus.

     The inner chevron is the outer one offset PERPENDICULARLY — not by the same
     px horizontally and vertically, which would splay the diagonals and taper
     the ring. For an edge of length `--trk-diag` over a half-height of
     `--trk-half`, an inset of `q` moves the tip by `q · diag / half` and the
     top/bottom corners by `q · (diag ∓ notch) / half` (the notch is concave on
     the left, convex on the right — hence the two signs). All three fall out of
     the two dimensions the segment is already drawn from, so the ring stays
     parallel to the shape at any lane height or notch depth.

     The outer boundary IS the segment's own polygon, written out verbatim rather
     than inset: an inset one read as a hairline gap all the way round, and at the
     ends of the lane its square corners sat inside the lane's `--k-radius-lg` —
     the same "mark shifted off its block" complaint in a smaller form. Flush, the
     lane's own rounded overflow clips the ring exactly as it clips the segment,
     so the corners agree by construction instead of by arithmetic.

     The hole is joined to the outer boundary by a ZERO-AREA SLIT, and every point
     of it is load-bearing. `polygon()` is ONE contour with no move-to, so the two
     implicit connectors that reach the hole REPLACE whatever inner edge they jump
     across — and that edge is simply gone from the shape, taking its band with it.
     Both earlier orderings lost the left stroke that way: same-direction contours
     cross in the middle of it, reversed ones drop the inner notch edge. So the
     outer loop is CLOSED first (its start point repeated), and the inner loop both
     starts and ends at the same point, which makes the two connectors coincident
     and opposite — they cancel, and every real edge survives.

     @supports, because a browser without `hypot()` (or without length division
     in `calc()`) would drop the `clip-path` and keep the `background` — a solid
     fill over the whole segment. The guard keeps such a browser on the plain
     outline and the underline above, both of which still say what they mean. */
  @supports (width: calc(1px * hypot(1px,1px) / 1px)){
    .track .seg.sel{box-shadow:none}
    .track .seg.sel .pick,
    .track .seg .pick:focus-visible{
      /* q: how far the inner edge sits from the segment's edge, i.e. the ring's
         own width. Two focus widths, not one — a 1px band is what the diagonals
         eat first, and neither of these marks may be the thing that degrades. */
      --rq:calc(var(--k-focus-w) * 2);
      --rt:calc(var(--rq) * var(--trk-diag) / var(--trk-half));
      --rr:calc(var(--rq) * (var(--trk-diag) - var(--trk-notch)) / var(--trk-half));
      --rl:calc(var(--rq) * (var(--trk-diag) + var(--trk-notch)) / var(--trk-half));
      background:var(--k-series-2);
      clip-path:polygon(evenodd,
        0 0,
        calc(100% - var(--trk-notch)) 0,
        100% 50%,
        calc(100% - var(--trk-notch)) 100%,
        0 100%,
        var(--trk-notch) 50%,
        0 0,
        var(--rl) var(--rq),
        calc(var(--trk-notch) + var(--rt)) 50%,
        var(--rl) calc(100% - var(--rq)),
        calc(100% - var(--trk-notch) - var(--rr)) calc(100% - var(--rq)),
        calc(100% - var(--rt)) 50%,
        calc(100% - var(--trk-notch) - var(--rr)) var(--rq),
        var(--rl) var(--rq))}
    /* The ends of the lane have one notch, not two — same rule as the segment
       shapes above, and for the same reason: a wedge at the outer end would
       point at nothing. A square corner insets by q in both axes, and takes the
       lane's radius: `clip-path` cannot round a corner, so a flush ring met the
       lane's rounded end square and the lane's own overflow cut the difference
       away. `border-radius` clips the fill, so the two curve together. */
    .track .seg:first-child.sel .pick,
    .track .seg:first-child .pick:focus-visible{
      border-radius:var(--trk-r) 0 0 var(--trk-r);
      clip-path:polygon(evenodd,
        0 0,
        calc(100% - var(--trk-notch)) 0,
        100% 50%,
        calc(100% - var(--trk-notch)) 100%,
        0 100%,
        0 0,
        var(--rq) var(--rq),
        var(--rq) calc(100% - var(--rq)),
        calc(100% - var(--trk-notch) - var(--rr)) calc(100% - var(--rq)),
        calc(100% - var(--rt)) 50%,
        calc(100% - var(--trk-notch) - var(--rr)) var(--rq),
        var(--rq) var(--rq))}
    .track .seg:last-child.sel .pick,
    .track .seg:last-child .pick:focus-visible{
      border-radius:0 var(--trk-r) var(--trk-r) 0;
      clip-path:polygon(evenodd,
        0 0,
        100% 0,
        100% 100%,
        0 100%,
        var(--trk-notch) 50%,
        0 0,
        var(--rl) var(--rq),
        calc(var(--trk-notch) + var(--rt)) 50%,
        var(--rl) calc(100% - var(--rq)),
        calc(100% - var(--rq)) calc(100% - var(--rq)),
        calc(100% - var(--rq)) var(--rq),
        var(--rl) var(--rq))}
    /* Last, so focus wins the colour on a segment that is both. The outline goes
       with it — the ring IS the indicator now (UI-R23). */
    .track .seg .pick:focus-visible{outline:0;background:var(--k-focus)}}
  .track .seg > *:not(.pick){position:relative;z-index:1;pointer-events:none}
  /* The two REAL controls take their events back from the select overlay. */
  .track .seg > .go,.track .seg > .fixm{pointer-events:auto}

  /* Untravelled: neutral, and explicitly so. A pending segment must not wear its
     stage hue at full strength — that is what "travelled ground" means here. */
  .track .seg.pending{color:var(--k-text-faint)}
  /* Travelled segments carry their own stage hue as a wash, so the route changes
     colour as the ticket advances — the one thing a flat progress bar cannot say.
     `--stg-color` carries its own fallback: a stage key with no palette class (a
     row from a newer schema) then reads neutral instead of dropping the whole
     declaration and rendering unwashed. */
  .track .seg.passed{background:color-mix(in srgb,var(--stg-color,var(--k-pending)) 20%,transparent);
    color:var(--stg-color,var(--k-pending))}
  /* Ordinary body text on the wash, NOT `--k-success-fg`. That token is the
     knockout foreground (`--vscode-editor-background`), and it is paired with a
     saturated feedback FILL — on a 34% wash of the stage hue over the lane it
     resolves to nearly the surface it sits on: the running segment's own name
     came out dark-on-dark in a dark theme and white-on-lavender in a light one,
     which is the widest label on the track and the one that says where the
     ticket is (UI-R29). The wash strength was chosen to carry body text. */
  .track .seg.running{background:color-mix(in srgb,var(--stg-color,var(--k-pending)) 34%,transparent);
    color:var(--k-text)}
  /* Failed reads as a break in the surface: hatched, never a flat fill. */
  .track .seg.failed{color:var(--k-failed);
    background-image:repeating-linear-gradient(135deg,
      color-mix(in srgb,var(--k-failed) 26%,transparent) 0 var(--k-space-3),
      transparent var(--k-space-3) var(--k-space-6))}
  /* Skipped is the one status that leaves the stage ramp: a stage that never ran
     has no identity to assert, so it reads neutral. */
  .track .seg.skipped{background:color-mix(in srgb,var(--k-pending) 22%,transparent);color:var(--k-text-faint)}
  /* Needs-you OUTRANKS the stage: the stage is no longer the point, the human is.
     Amber wash + pause glyph + the reason in words + the action = four carriers. */
  .track .seg.needs{background:color-mix(in srgb,var(--k-attention) 30%,transparent);
    color:var(--k-attention);animation:seg-breathe var(--k-dur-flash-done) ease-in-out infinite}
  @keyframes seg-breathe{0%,100%{background:color-mix(in srgb,var(--k-attention) 30%,transparent)}
    50%{background:color-mix(in srgb,var(--k-attention) 16%,transparent)}}
  /* Blocked is parked, not running: same amber attention wash as needs-you
     (the banner below it says the same thing), but no breathe — it is a wait,
     not a demand the user answer right now. */
  .track .seg.blocked{background:color-mix(in srgb,var(--k-attention) 30%,transparent);
    color:var(--k-attention)}

  /* min-content, not 0: at 0 the current segment absorbs every overflow by
     shrinking, so its own action button is clipped by the chevron AND the lane
     never reports an overflow — the degradation below would never fire. The extra
     right padding is not spacing either: clip-path clips CHILDREN, so the notch
     was slicing the action button's right edge ("Resolve" rendered as "Re"). */
  .track .seg.cur{flex:1 1 auto;min-width:min-content;padding-right:var(--k-space-9)}

  .track .seg .g{flex:none;width:var(--k-space-7);height:var(--k-space-7);
    display:grid;place-items:center;font-size:var(--k-text-xs);font-weight:var(--k-weight-semibold)}
  .track .seg .nm{font-size:var(--k-text-xs);letter-spacing:.05em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .seg.cur .nm{font-size:var(--k-text-md);font-weight:var(--k-weight-semibold);
    letter-spacing:.03em;flex:none}
  .track .seg .mt{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);opacity:.85;
    white-space:nowrap;padding-left:var(--k-space-4);margin-left:var(--k-space-1);
    border-left:var(--k-border-w) solid currentColor;flex:none}
  /* Inside the current segment the META is what gives way, never the stage name
     and never the action: an unbounded fact (a repo pair, a conflict summary) must
     not be able to push the button it belongs to out of the clip. */
  .track .seg.cur .mt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}

  /* The needs-you control. NOT `.act` — that was the retired activity strip's
     class (the inside ledger now). The host decides what it DOES (`s.needs.cta`):
     for a whole-ticket confirm ship and a single mergeable merge it is a REAL
     actor posting the same message the header's Confirm ship button and the PR
     panel's Merge button post — the host's confirmation still guards the
     irreversible step, and the pending lifecycle is the same `shipRequestId` /
     `mergeRequests` the owning controls use. Every other shape (a multi-repo
     wait, a conflict, an open session) is NAVIGATIONAL: it scrolls the control
     that owns the action into view and focuses it, so the rail never becomes a
     second actor it cannot back with a confirmation. */
  .track .seg .go{font:inherit;font-size:var(--k-text-2xs);border:var(--k-border-w) solid currentColor;
    border-radius:var(--k-radius-sm);background:transparent;color:inherit;
    padding:var(--k-space-1) var(--k-space-4);cursor:pointer;flex:none;margin-left:auto}
  .track .seg .go:hover{background:color-mix(in srgb,currentColor 18%,transparent)}
  .track .seg .go:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);
    outline-offset:var(--k-focus-offset)}
  /* Pending (a ship/merge request is in flight, or the host modal is up):
     disabled + aria-busy is the re-trigger guard and the accessible signal; the
     label is untouched (UI-R18). The outline stays visible so the pending state
     still reads as a control with work underway, never a dead one. */
  .track .seg .go[aria-busy="true"]{opacity:.65;cursor:default}
  .track .seg .go[aria-busy="true"]:hover{background:transparent}

  /* impl's approach lives INSIDE impl's segment: one pip per declared phase, the
     reported ones filled. No stem, no chip, nothing hanging off the track. A
     hollow pip means "not reported", NEVER "not done" — karst records no
     per-phase state it was not explicitly told. */
  .track .seg .pips{display:flex;align-items:center;gap:var(--k-space-2);flex:none;
    margin-left:auto;padding-left:var(--k-space-5)}
  .track .seg .pips .p{width:var(--k-space-3);height:var(--k-space-3);
    border-radius:var(--k-radius-circle);border:var(--k-border-w) solid currentColor;opacity:.55}
  .track .seg .pips .p.on{background:currentColor;opacity:1}
  .track .seg .pips .pn{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    margin-left:var(--k-space-2);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── the retry meter ──────────────────────────────────────────────────────
     One tick per allowed attempt, filled per attempt spent, inside the gate being
     retried. TICKS AND NOT A BAR: a bar reads as progress toward completion, and
     spending fix attempts is the opposite of progress. It costs zero layout on a
     ticket that never looped, and it makes "one retry left before this parks"
     visible — which karst shows nowhere else.

     It is also a <button>: it is how `fix` stays selectable now that the node is
     gone, and it sits on the stage the loop belongs to, which is where a user
     would look for it. */
  .track .fixm{display:inline-flex;align-items:center;gap:var(--k-space-3);flex:none;
    font:inherit;background:transparent;border:0;border-left:var(--k-border-w) solid currentColor;
    padding:0 0 0 var(--k-space-4);margin-left:var(--k-space-1);color:inherit;cursor:pointer}
  .track .fixm:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);
    outline-offset:var(--k-focus-offset)}
  .track .fixm .ticks{display:inline-flex;gap:var(--k-space-1)}
  .track .fixm .tk{width:var(--trk-tick-w);height:var(--trk-tick-h);border-radius:var(--k-radius-xs);
    border:var(--k-border-w) solid var(--stage-fix);opacity:.45;display:inline-block}
  .track .fixm .tk.on{background:var(--stage-fix);opacity:1}
  .track .fixm .tx{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    color:var(--stage-fix);white-space:nowrap}
  /* review ─fail→ fix ─pass→ uat is the one loop that lands on a gate it did not
     leave. Said in WORDS, inside the segment — a backwards arc across the track is
     the shape this design exists to avoid. */
  .track .fixm .ret{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    color:var(--stage-fix);white-space:nowrap}
  /* Spent-but-idle is a RECORD, not an alarm: the meter stays so the cost of the
     ticket is still legible, and stops claiming the ticket's attention. */
  .track .fixm.spent .tk{border-color:var(--k-text-faint)}
  .track .fixm.spent .tk.on{background:var(--k-text-faint)}
  .track .fixm.spent .tx,.track .fixm.spent .ret{color:var(--k-text-faint)}

  /* ── narrow widths: THREE measured steps ──────────────────────────────────
     Measured, not keyed to a breakpoint: the threshold depends on the current
     stage's name length and on whether a meter is riding along. In order of what
     costs least to lose — SNUG drops what a segment merely ANNOTATES and keeps
     every name; TIGHT drops the names too; BARE is the floor, where the passed-by
     segments become position markers and the current segment sheds its own
     annotations, keeping glyph, name and action.

     THREE, not two: two was the first draft, and at a 397px lane five of the eight
     mockup cases were still over after TIGHT. Three clear every case to 300px.

     Anything a step drops is already in the accessible name, which never
     degrades — the meter's attempt count and its return target included. */
  .track.snug .seg:not(.cur) .mt,
  .track.snug .seg:not(.cur) .fixm .tx{display:none}
  .track.snug .seg:not(.cur) .fixm{padding-left:var(--k-space-3);margin-left:0}
  .track.snug .seg.cur .pips .pn{display:none}
  .track.tight .seg:not(.cur) .nm{display:none}
  .track.tight .seg:not(.cur){padding-left:var(--k-space-8);padding-right:var(--k-space-4)}
  .track.tight .seg:not(.cur) .fixm .ret{display:none}
  /* BARE. The non-current segments stop carrying anything but their position and
     their status hue; min-width:0 lets them give up the last of their padding
     rather than pushing the current segment's content under the clip. */
  .track.bare .seg:not(.cur){padding-left:var(--k-space-6);padding-right:var(--k-space-2);min-width:0}
  .track.bare .seg:not(.cur) .fixm{display:none}
  .track.bare .seg:not(.cur) .g{width:var(--k-space-6)}
  .track.bare .seg.cur{padding-right:var(--k-space-8)}
  /* At the floor the current segment gives up its ANNOTATIONS — the meta, the
     approach pips, and the meter's numeral and return label (the ticks still carry
     the count, and the accessible name carries it in words either way). Never the
     name, never the action button. */
  .track.bare .seg.cur .mt,
  .track.bare .seg.cur .pips,
  .track.bare .seg.cur .fixm .tx,
  .track.bare .seg.cur .fixm .ret{display:none}
  /* …and its name shortens to the stage KEY, which is what every other segment
     shows anyway. "Implementation" is 113px of a 300px panel; `impl` is 30. The
     abbreviation is the same word the graph uses, so it is a shortening rather
     than a different label. Both forms ship and CSS picks one — swapping the text
     in JS would mean re-rendering on every resize. */
  .track .seg .nm .abbr{display:none}
  .track.bare .seg.cur .nm .full{display:none}
  .track.bare .seg.cur .nm .abbr{display:inline}

  /* Running = a live spinner, not a glyph. ⟳ misreads as "reload/retry", which is
     the wrong affordance on a clickable segment. An animating ring is the one mark
     that reads as work in progress. Under reduced motion it stops as a broken ring
     — still shape-distinct from ✓ ✕ · –, so status never rides on colour alone. */
  .spin{display:block;border-radius:var(--k-radius-circle);
    border:calc(var(--k-border-w) * 2) solid currentColor;border-top-color:transparent;
    animation:spin var(--k-dur-spin) linear infinite}
  .track .seg .spin{width:var(--k-space-6);height:var(--k-space-6)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .spin,.track .seg.needs{animation:none}
    /* The disclosure marker's rotation is motion; the open state itself is
       still visible in the marker's resting orientation. (UI-R30) */
    .pchev{transition:none}
  }

  /*KARST_INSIDE_PROTO_START*/
  /* ── the Inside block: the A37 prototype, ported verbatim ───────────────
     This block is the delivery surface from
     `karst-inside-a37-centered-implementation-timeline.html`. It is the ONE
     part of the dashboard that does not consume the design system's
     component rules: the injected DS sheet's own `.k-*` and generic element
     rules were reshaping the ported grammar (row heights, chip padding,
     glyph boxes) into something that was neither the prototype nor the DS,
     which is what "close, but not the prototype" kept meaning.

     Two rules keep this exemption honest:
       1. Everything is scoped under `#inside`. Nothing here can reach the
          rail, the panels, the toolbar, or another webview.
       2. No raw colour literal. The prototype's palette is re-expressed as
          `--p-*` custom properties on `#inside`, each pointing at the SAME
          `--k-*` token the rest of the UI uses, so the block still themes
          with VS Code (light themes included) and the conformance tests
          keep their meaning. Tints are `color-mix` over those tokens, never
          the prototype's dark-only hexes.
     Geometry (grid templates, heights, the glyph shapes, the timeline rail)
     is the prototype's, unchanged — that is the part being ported. */
  #inside{
    /* palette — prototype role → karst token */
    --p-bg:var(--k-bg);
    --p-surface:var(--k-surface);
    --p-surface2:var(--k-surface-hover);
    --p-hover:var(--k-surface-hover);
    --p-border:var(--k-border);
    --p-border2:var(--k-border-strong);
    --p-text:var(--k-text);
    --p-strong:var(--k-text);
    --p-muted:var(--k-text-dim);
    --p-muted2:var(--k-text-faint);
    --p-accent:var(--k-link);
    --p-pending:var(--k-text-faint);
    --p-running:var(--k-running);
    --p-attention:var(--k-attention);
    --p-passed:var(--k-passed);
    --p-failed:var(--k-failed);
    --p-skip:var(--k-series-2);
    /* tints — the prototype's filled states, mixed over the theme's own bg */
    --p-tint-run:color-mix(in srgb, var(--p-running) 12%, var(--p-bg));
    --p-tint-fail:color-mix(in srgb, var(--p-failed) 10%, var(--p-bg));
    --p-tint-wait:color-mix(in srgb, var(--p-attention) 10%, var(--p-bg));
    --p-tint-done:color-mix(in srgb, var(--p-passed) 10%, var(--p-bg));
    --p-edge-run:color-mix(in srgb, var(--p-running) 45%, var(--p-border));
    --p-edge-wait:color-mix(in srgb, var(--p-attention) 45%, var(--p-border));
    --p-edge-done:color-mix(in srgb, var(--p-passed) 45%, var(--p-border));
    /* spacing / radius / type — the prototype's own scale */
    --p-r1:var(--k-radius-xs);--p-r2:var(--k-radius-sm);--p-r3:var(--k-radius-lg);
    --p-s1:var(--k-space-2);--p-s2:var(--k-space-3);--p-s3:var(--k-space-4);
    --p-s4:var(--k-space-5);--p-s5:var(--k-space-6);--p-s6:var(--k-space-7);
    --p-xs:var(--k-text-2xs);--p-sm:var(--k-text-xs);--p-md:var(--k-text-md);
    --p-mono:var(--k-font-mono);
    container-type:inline-size;
  }

  /* Inside header = current operation, never a second live row */
  #inside .inside{margin:var(--k-space-7) var(--k-space-3) var(--k-space-1);
    border:var(--k-border-w) solid var(--p-border);border-radius:var(--p-r3);background:var(--p-bg)}
  #inside .inside.viewing{border-color:var(--k-series-2)}
  #inside .vbar{display:flex;align-items:center;gap:var(--p-s3);padding:var(--p-s2) var(--p-s4);
    border-bottom:var(--k-border-w) solid var(--p-border);color:var(--p-muted);font-size:var(--p-sm)}
  #inside .vbar .sp{margin-left:auto}
  #inside .inside-head{min-height:38px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;gap:var(--p-s2);padding:0 var(--p-s4);border-bottom:var(--k-border-w) solid var(--p-border)}
  #inside .inside-head.has-actions{grid-template-columns:auto minmax(0,1fr) auto auto}
  #inside .inside-title{font-size:var(--p-sm);font-weight:var(--k-weight-semibold);color:var(--p-strong);white-space:nowrap}
  #inside .inside-live{min-width:0;overflow:hidden;white-space:nowrap;color:var(--p-muted);
    font-size:var(--p-sm);display:flex;align-items:center;gap:var(--p-s2);line-height:18px}
  #inside .inside-live.run{color:var(--p-running)}
  #inside .inside-live.wait{color:var(--p-attention)}
  #inside .inside-live.fail{color:var(--p-failed)}
  #inside .inside-live strong{color:var(--p-strong);font-weight:var(--k-weight-semibold);line-height:18px;flex:none}
  #inside .live-copy{display:inline-flex;align-items:center;min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;line-height:18px;column-gap:0}
  #inside .sep{display:inline-flex;align-items:center;justify-content:center;flex:none;width:var(--k-space-4);
    margin-inline:var(--k-border-w);padding:0;color:var(--p-muted2);line-height:18px}
  #inside .inside-meta{color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);
    line-height:18px;white-space:nowrap}
  /* The current stage header's ⋯ menu — the ONE recovery surface. Only the
     host's availability verdict renders it; the menu itself is a composed
     popover exactly like the ticket-controls menu, from the same tokens. */
  #inside .stageMenuWrap{position:relative;display:flex;align-items:center}
  #inside .stageMenuBtn{width:var(--k-control-h-sm);height:var(--k-control-h-sm);padding:0;
    display:inline-grid;place-items:center;border-radius:var(--k-radius-sm);color:var(--p-muted)}
  #inside .stageMenuBtn:hover{background:var(--p-hover);color:var(--p-text)}
  #inside .stageMenuBtn[aria-expanded="true"]{background:var(--p-surface2);color:var(--p-text)}
  #inside .stageMenuBtn .k-icon{width:var(--p-s3);height:var(--p-s3)}
  #inside .stageMenu{position:absolute;right:0;top:calc(100% + var(--p-s1));z-index:40;min-width:calc(var(--k-control-h-lg) * 10);
    padding:var(--p-s2);border:var(--k-border-w) solid var(--k-border-strong);border-radius:var(--p-r2);
    background:var(--k-surface);box-shadow:var(--k-elev-2)}
  #inside .stageMenu .menuButton{min-height:var(--k-control-h-lg)}
  #inside .blurb{padding:var(--p-s3) var(--p-s4);color:var(--p-muted);font-size:var(--p-sm)}

  /* Agent identity primitive */
  #inside .agent-id{display:inline-flex;align-items:center;gap:var(--p-s1);min-width:0;height:18px;
    color:var(--p-muted);font-family:var(--p-mono);font-size:var(--p-xs);line-height:14px;vertical-align:middle}
  #inside .agent-id .agent-sep{color:var(--p-muted2);line-height:14px}
  /* Agent identity primitive — the mark is the CANONICAL provider icon
     (injected as .agenticon) drawn at 13px in the core's own blue; the
     stroke-based line-icon styling is gone with the prototype icon set. */
  #inside .agent-icon,#inside .agenticon{width:13px;height:13px;display:inline-grid;place-items:center;flex:none;color:var(--p-running)}
  #inside .agent-icon svg,#inside .agenticon svg{width:13px;height:13px;display:block}
  #inside .agent-core,#inside .agent-model{display:inline-flex;align-items:center;height:14px;line-height:14px;white-space:nowrap}
  #inside .agent-core{color:var(--p-running)}
  #inside .agent-model{color:var(--p-muted)}
  #inside .agent-name{display:inline-flex;align-items:center;height:14px;line-height:14px;color:var(--p-text);white-space:nowrap}
  #inside .ai-mark{display:inline-flex;align-items:center;justify-content:center;height:18px;
    border:var(--k-border-w) solid var(--p-edge-run);border-radius:var(--k-radius-pill);padding:0 var(--p-s2);
    color:var(--p-running);font-family:var(--p-mono);font-size:9px;line-height:16px;letter-spacing:.03em;vertical-align:middle}
  #inside .identity-note{color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);white-space:nowrap}

  /* Token claim */
  #inside .token-stat{display:inline-flex;align-items:center;gap:3px;border:var(--k-border-w) solid var(--p-border);
    border-radius:var(--k-radius-pill);height:18px;padding:0 var(--p-s2);color:var(--p-muted);
    font-family:var(--p-mono);font-size:9px;line-height:16px;white-space:nowrap}
  #inside .token-stat.live{border-color:var(--p-edge-run);color:var(--p-running)}
  #inside .token-stat .sigma{color:var(--p-muted2)}

  /* Process ledger */
  #inside .ledger{padding-bottom:var(--p-s2)}
  #inside .op{border-top:var(--k-border-w) solid var(--p-border)}
  #inside .op:first-child{border-top:0}
  #inside .op summary,#inside .op-static{list-style:none;display:grid;
    grid-template-columns:20px minmax(78px,110px) minmax(0,1fr) auto 16px;
    align-items:center;gap:var(--p-s2);min-height:31px;padding:0 var(--p-s4);border-radius:var(--p-r1)}
  #inside .op summary{cursor:pointer}
  #inside .op summary::-webkit-details-marker{display:none}
  #inside .op summary:hover{background:var(--p-hover)}
  #inside .op[open] summary{background:var(--p-surface2)}
  #inside .op summary:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  #inside .op-static{color:var(--p-muted2)}
  #inside .op.live summary{background:var(--p-tint-run)}
  #inside .op.failed-source summary{background:var(--p-tint-fail)}
  #inside .op.waiting-source summary{background:var(--p-tint-wait)}

  /* The glyph: the prototype's own drawn states — never a text character. */
  #inside .glyph{position:relative;width:16px;height:16px;display:inline-grid;place-items:center;flex:none;
    border:var(--k-border-w) solid currentColor;border-radius:var(--k-radius-circle);color:var(--p-pending);line-height:1}
  #inside .glyph.pass{color:var(--p-passed)}
  #inside .glyph.fail{color:var(--p-failed)}
  #inside .glyph.pending,#inside .glyph.note{color:var(--p-pending)}
  #inside .glyph.skip{color:var(--p-skip)}
  #inside .glyph.wait{color:var(--p-attention)}
  #inside .glyph.run{color:var(--p-running)}
  #inside .glyph.pass:before{content:"";width:6px;height:3px;border-left:1.5px solid currentColor;
    border-bottom:1.5px solid currentColor;transform:translateY(-1px) rotate(-45deg)}
  #inside .glyph.fail:before,#inside .glyph.fail:after{content:"";position:absolute;width:7px;height:1.5px;
    border-radius:var(--k-border-w);background:currentColor;left:50%;top:50%;transform-origin:center}
  #inside .glyph.fail:before{transform:translate(-50%,-50%) rotate(45deg)}
  #inside .glyph.fail:after{transform:translate(-50%,-50%) rotate(-45deg)}
  #inside .glyph.pending:before,#inside .glyph.note:before{content:"";width:3px;height:3px;
    border-radius:var(--k-radius-circle);background:currentColor}
  #inside .glyph.run:before{content:"";width:8px;height:8px;border:1.5px solid currentColor;
    border-right-color:transparent;border-radius:var(--k-radius-circle);animation:spin var(--k-dur-spin) linear infinite}
  #inside .glyph.wait:before,#inside .glyph.wait:after{content:"";position:absolute;width:1.5px;height:6px;
    top:4px;border-radius:var(--k-border-w);background:currentColor}
  #inside .glyph.wait:before{left:5px}
  #inside .glyph.wait:after{right:5px}
  #inside .glyph.skip:before{content:"";width:7px;height:1px;background:currentColor;transform:rotate(-45deg)}

  #inside .op-name{display:flex;align-items:center;gap:var(--p-s2);min-height:18px;line-height:18px;
    font-size:var(--p-sm);font-weight:var(--k-weight-medium);color:var(--p-text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .op-detail{min-width:0;min-height:18px;line-height:18px;color:var(--p-muted);font-size:var(--p-sm);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .op-detail.run{color:var(--p-running)}
  #inside .op-detail.wait{color:var(--p-attention)}
  #inside .op-detail.fail{color:var(--p-failed)}
  #inside .op-detail.note,#inside .op-detail.skip{font-style:italic}
  /* The gates row's console entry (869e7n906-fu1): the description text and
     the terminal icon share one flex slot, so a long gate summary ellipsizes
     on its own span while the icon (flex:none, never shrunk or clipped) stays
     visible at the end of the description area. */
  #inside .op-detail.detail-console{display:inline-flex;align-items:center;gap:var(--p-s2);max-width:100%}
  #inside .op-detail.detail-console .op-detail-text{overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;min-width:0}
  #inside .op-tail{display:flex;align-items:center;justify-content:flex-end;gap:var(--p-s2);min-width:0;
    min-height:18px;line-height:18px;white-space:nowrap;padding-right:var(--p-s1)}
  #inside .count{display:inline-flex;align-items:center;height:18px;border:var(--k-border-w) solid var(--p-border);
    border-radius:var(--k-radius-pill);padding:0 var(--p-s2);color:var(--p-muted);
    font-family:var(--p-mono);font-size:var(--p-xs);line-height:16px}
  #inside .duration{display:inline-flex;align-items:center;height:18px;color:var(--p-muted2);
    font-family:var(--p-mono);font-size:var(--p-xs);line-height:18px;white-space:nowrap}
  #inside .op-time{display:inline-flex;align-items:center;height:18px;color:var(--p-muted2);
    font-family:var(--p-mono);font-size:var(--p-xs);line-height:18px;white-space:nowrap}
  #inside .chev{width:16px;height:16px;display:grid;place-items:center;justify-self:center;align-self:center;color:var(--p-muted2)}
  #inside .chev:before{content:"";width:5px;height:5px;border-right:var(--k-border-w) solid currentColor;
    border-bottom:var(--k-border-w) solid currentColor;transform:rotate(-45deg);
    transition:transform var(--k-dur-fast) var(--k-ease-standard)}
  #inside .op[open] .chev:before{transform:rotate(45deg)}
  #inside .op-body{margin:0 0 var(--p-s2) 36px;border-left:var(--k-border-w) solid var(--p-border);
    padding:var(--p-s2) 0 var(--p-s2) var(--p-s3)}

  /* Generic evidence rows */
  #inside .evidence-row{display:grid;grid-template-columns:minmax(74px,100px) minmax(0,1fr) auto;
    gap:var(--p-s2);align-items:center;min-height:26px;padding:0 var(--p-s2)}
  #inside .ev-key{color:var(--p-text);font-family:var(--p-mono);font-size:var(--p-xs);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .ev-detail{color:var(--p-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:var(--p-sm);line-height:18px}
  #inside .ev-state,#inside .gate-state{min-height:18px;display:inline-flex;align-items:center;
    justify-content:flex-end;line-height:18px;text-transform:lowercase;white-space:nowrap;
    font-family:var(--p-mono);font-size:var(--p-xs);color:var(--p-muted2)}
  #inside .ev-state.pass,#inside .gate-state.pass{color:var(--p-passed)}
  #inside .ev-state.run,#inside .gate-state.run{color:var(--p-running)}
  #inside .ev-state.wait,#inside .gate-state.wait{color:var(--p-attention)}
  #inside .ev-state.fail,#inside .gate-state.fail{color:var(--p-failed)}
  #inside .ev-state.skip,#inside .gate-state.skip{color:var(--p-skip)}
  #inside .ev-state,#inside .gate-state{gap:var(--p-s2)}
  #inside .ev-dur{color:var(--p-muted2)}
  #inside .ev-time{color:var(--p-muted2)}
  #inside .ev-tail{display:inline-flex;align-items:center;gap:var(--p-s2);justify-content:flex-end}

  /* Slice 6 T4 — the graph's status-grouped node list. A LOCAL composition
     (UI-R07/R08): only the list geometry is local; the status glyph and the
     control ride the shared `.glyph`/`.k-btn` primitives. */
  #inside .graph-nodes{border:var(--k-border-w) solid var(--p-border);border-radius:var(--p-r1);
    overflow:hidden;background:var(--p-surface);margin-bottom:var(--p-s2)}
  #inside .graph-node-group{padding:var(--p-s1) var(--p-s2) var(--p-s1);
    background:var(--p-tint-run);border-bottom:var(--k-border-w) solid var(--p-border);
    color:var(--p-muted);font-family:var(--p-mono);font-size:var(--p-xs);
    text-transform:uppercase;letter-spacing:.04em}
  #inside .graph-node{display:grid;grid-template-columns:18px minmax(74px,110px) minmax(0,1fr) auto;
    gap:var(--p-s2);align-items:center;min-height:26px;padding:0 var(--p-s2);
    border-bottom:var(--k-border-w) solid var(--p-border)}
  #inside .graph-node:last-child{border-bottom:0}
  #inside .graph-node .glyph{justify-self:start}
  #inside .graph-node-name{font-family:var(--p-mono);font-size:var(--p-xs);color:var(--p-text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .graph-node-meta{color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .graph-node-detail{display:flex;align-items:center;gap:var(--p-s2);min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--p-sm);line-height:18px}
  #inside .graph-node-identity{color:var(--p-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .graph-node-visit{color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);white-space:nowrap}
  #inside .graph-node-override{color:var(--p-running);font-family:var(--p-mono);font-size:var(--p-xs);white-space:nowrap}
  #inside .graph-node-fact{color:var(--p-muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .graph-node-reason{color:var(--p-attention);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Gates */
  #inside .gates{border:var(--k-border-w) solid var(--p-border);border-radius:var(--p-r1);
    overflow:hidden;background:var(--p-surface)}
  #inside .gate-row{display:grid;grid-template-columns:minmax(74px,90px) minmax(110px,150px) minmax(0,1fr) auto;
    gap:var(--p-s2);align-items:center;min-height:28px;padding:0 var(--p-s2);
    border-bottom:var(--k-border-w) solid var(--p-border)}
  #inside .gate-row:last-child{border-bottom:0}
  /* A gates body whose rows name no repository (pre-v21 rows) drops the column
     rather than drawing an empty one — a blank cell reads as a repo with no
     name instead of a row that names none. */
  #inside .gates.no-repo .gate-row{grid-template-columns:minmax(110px,150px) minmax(0,1fr) auto}
  #inside .gate-row.active{background:var(--p-tint-run);box-shadow:inset 2px 0 0 var(--p-running)}
  #inside .gate-repo,#inside .gate-name{font-family:var(--p-mono);font-size:var(--p-xs);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .gate-repo{color:var(--p-text)}
  #inside .gate-name{color:var(--p-muted)}
  #inside .gate-detail{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--p-muted);font-size:var(--p-sm)}

  /* Findings — one blueprint for Review findings and UAT observations */
  #inside .findings{display:grid;gap:var(--p-s1)}
  #inside .finding{display:grid;
    grid-template-columns:62px minmax(0,1fr) auto auto;gap:var(--p-s2);
    align-items:center;min-height:27px;padding:0 var(--p-s2)}
  #inside .sev{font-family:var(--p-mono);font-size:var(--p-xs);color:var(--p-muted2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* The level ramp. Four levels, four readings — before this every level from
     critical to low rendered in the single amber `--p-attention`, so the one
     column whose entire job is to rank findings ranked nothing. The word stays
     visible beside the colour, so the ranking never rides hue alone (UI-R28). */
  #inside .sev.sev-critical{color:var(--p-failed);font-weight:var(--k-weight-semibold)}
  #inside .sev.sev-high{color:var(--p-attention);font-weight:var(--k-weight-semibold)}
  #inside .sev.sev-medium{color:var(--p-running)}
  #inside .sev.sev-low{color:var(--p-muted2)}
  #inside .finding-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--p-sm);line-height:18px}
  #inside .finding-loc{color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);
    white-space:nowrap;display:inline-flex;align-items:center;min-width:0}
  #inside .finding-time{color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);white-space:nowrap}
  /* An identifier with no action behind it stays text — same metrics as the
     link so a row with one and a row without do not shift against each other. */
  #inside .obj-link-plain{font-family:var(--p-mono);font-size:var(--p-xs);
    line-height:14px;color:var(--p-muted2)}

  /* Bounded evidence: the prototype's overflow note carries the control. */
  #inside .overflow-note{min-height:26px;display:flex;align-items:center;gap:var(--p-s2);padding:0 var(--p-s2);
    color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);
    border-top:var(--k-border-w) solid var(--p-border)}

  /* Session card: phases belong to the session, not beside it */
  #inside .session-card{margin:0 0 var(--p-s2);border:var(--k-border-w) solid var(--p-border);
    border-radius:var(--p-r2);background:var(--p-surface);overflow:hidden}
  #inside .session-head{display:grid;grid-template-columns:20px minmax(78px,110px) minmax(0,1fr) auto;
    gap:var(--p-s1);align-items:center;min-height:34px;padding:0 var(--p-s1);background:var(--p-surface)}
  #inside .session-head.live{background:var(--p-tint-run);box-shadow:inset 2px 0 0 var(--p-running)}
  #inside .session-label{display:flex;align-items:center;gap:var(--p-s1);color:var(--p-text);
    font-size:var(--p-sm);font-weight:var(--k-weight-semibold)}
  #inside .session-current{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--p-muted);font-size:var(--p-sm)}
  #inside .session-current.run{color:var(--p-running)}
  #inside .session-tail{display:flex;align-items:center;justify-content:flex-end;gap:var(--p-s1);
    min-width:0;min-height:18px;line-height:18px}

  /* One continuous chronological session timeline */
  #inside .session-segments{--timeline-left:var(--p-s3);--timeline-col:20px;position:relative;
    padding:var(--p-s1) 0 var(--p-s2)}
  #inside .timeline-row{display:grid;
    grid-template-columns:var(--timeline-col) minmax(110px,160px) minmax(0,1fr) auto;
    gap:var(--p-s1);align-items:center;min-height:29px;padding:0 var(--p-s2) 0 var(--timeline-left);
    position:relative;z-index:1}
  /* ONE source of truth for the timeline x-position: node and edge are both
     centered at 50% of this same 20px cell. */
  #inside .timeline-slot{position:relative;align-self:stretch;display:grid;place-items:center;
    width:var(--timeline-col);min-width:var(--timeline-col);justify-self:stretch;z-index:2}
  #inside .timeline-slot:before,#inside .timeline-slot:after{content:"";position:absolute;left:50%;
    width:var(--k-border-w);transform:translateX(-50%);background:var(--p-border);z-index:0;pointer-events:none}
  #inside .timeline-slot:before{top:0;height:calc(50% - var(--node-radius, 7px))}
  #inside .timeline-slot:after{top:calc(50% + var(--node-radius, 7px));bottom:0}
  #inside .timeline-row:first-child .timeline-slot:before,
  #inside .timeline-row:last-child .timeline-slot:after{display:none}
  #inside .timeline-start{color:var(--p-muted);--node-radius:4px}
  #inside .timeline-start-label{color:var(--p-text);font-family:var(--p-mono);font-size:var(--p-xs);white-space:nowrap}
  #inside .timeline-node{display:grid;place-items:center;justify-self:center;position:relative;z-index:3;background:var(--p-bg)}
  #inside .timeline-node.start{width:7px;height:7px;border:var(--k-border-w) solid var(--p-muted);
    border-radius:var(--k-radius-circle);background:var(--p-surface2)}
  #inside .timeline-tail{display:flex;align-items:center;justify-content:flex-end;gap:var(--p-s1);
    min-width:0;white-space:nowrap}
  #inside .segment-window,#inside .switch-time,#inside .phase-time{color:var(--p-muted2);
    font-family:var(--p-mono);font-size:var(--p-xs);white-space:nowrap}
  #inside .phase-row{color:var(--p-muted);--node-radius:7px}
  #inside .phase-row.current{background:linear-gradient(90deg,transparent 0 40px,var(--p-tint-run) 40px 100%)}
  #inside .phase-status{width:14px;height:14px;transform:none;background:var(--p-bg);position:relative;z-index:3}
  #inside .phase-status.glyph.run:before{width:7px;height:7px}
  #inside .phase-status.glyph.pass:before{width:5px;height:3px}
  #inside .phase-name{color:var(--p-text);font-size:var(--p-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .phase-detail{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--p-muted);font-size:var(--p-sm)}
  #inside .phase-detail.run{color:var(--p-running)}
  #inside .phase-detail.fail{color:var(--p-failed)}
  /* A switch is chronology without a status node: the edge passes straight
     through the rail cell and a short branch points at the annotation. */
  #inside .switch-event{--node-radius:0px;color:var(--p-muted2);
    background:linear-gradient(90deg,transparent 0 40px,var(--p-surface) 40px 100%)}
  #inside .switch-slot .switch-branch{position:absolute;left:50%;top:50%;width:9px;height:var(--k-border-w);
    background:var(--p-border);transform:translateY(-50%);z-index:1}
  #inside .switch-label{display:flex;align-items:center;gap:var(--p-s1);min-width:0;color:var(--p-muted);
    font-size:var(--p-sm);white-space:nowrap}
  #inside .switch-arrow{display:inline-flex;align-items:center;justify-content:center;width:14px;height:16px;
    margin-left:-10px;margin-right:2px;color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-sm);
    line-height:16px;flex:none}
  #inside .switch-value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .session-foot{display:flex;align-items:center;flex-wrap:wrap;gap:var(--p-s2);min-height:27px;
    padding:var(--p-s1) var(--p-s3);border-top:var(--k-border-w) solid var(--p-border);
    color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs)}
  #inside .session-foot .session-rule{margin-left:auto}

  /* Recovery: a bounded fail → Fix loop, and the round history behind it. */
  #inside .recovery-pill{display:inline-flex;align-items:center;justify-content:center;height:18px;
    border:var(--k-border-w) solid var(--p-border);border-radius:var(--k-radius-pill);padding:0 var(--p-s2);
    color:var(--p-muted);font-family:var(--p-mono);font-size:9px;line-height:16px;white-space:nowrap}
  #inside .recovery-pill.exhausted{border-color:var(--p-failed);color:var(--p-failed)}
  #inside .recovery-history{margin-bottom:var(--p-s2);border:var(--k-border-w) solid var(--p-border);
    border-radius:var(--p-r1);overflow:hidden;background:var(--p-surface)}
  #inside .recovery-round{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:var(--p-s2);
    align-items:center;min-height:27px;padding:0 var(--p-s2);border-bottom:var(--k-border-w) solid var(--p-border)}
  #inside .recovery-round:last-child{border-bottom:0}
  #inside .recovery-num{color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs)}
  #inside .recovery-cause{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--p-text);font-size:var(--p-sm)}
  #inside .recovery-result{display:inline-flex;align-items:center;justify-content:flex-end;gap:var(--p-s2);
    color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);white-space:nowrap}
  #inside .recovery-result.run{color:var(--p-running)}
  #inside .recovery-result.fail{color:var(--p-failed)}
  #inside .recovery-result.pass{color:var(--p-passed)}

  /* Done: the compact delivery receipt */
  #inside .done-receipt{padding:0 0 var(--p-s2)}
  #inside .done-hero{display:flex;align-items:center;gap:var(--p-s2);min-height:38px;margin-bottom:var(--p-s1);
    padding:0 var(--p-s2);border:var(--k-border-w) solid var(--p-edge-done);border-radius:var(--p-r2);
    background:var(--p-tint-done)}
  #inside .done-hero-main{color:var(--p-strong);font-size:var(--p-sm);font-weight:var(--k-weight-semibold)}
  #inside .done-hero-sub{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--p-muted);font-size:var(--p-sm)}
  #inside .done-hero-time{margin-left:auto;color:var(--p-muted2);font-family:var(--p-mono);
    font-size:var(--p-xs);white-space:nowrap}
  #inside .done-line{display:grid;grid-template-columns:minmax(88px,120px) minmax(0,1fr) auto;gap:var(--p-s2);
    align-items:center;min-height:24px;padding:0 var(--p-s2)}
  #inside .done-key{color:var(--p-text);font-family:var(--p-mono);font-size:var(--p-xs);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .done-copy{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--p-muted);font-size:var(--p-sm)}
  #inside .done-state{color:var(--p-passed);font-family:var(--p-mono);font-size:var(--p-xs);white-space:nowrap}
  #inside .done-check{flex:none}
  #inside .receipt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
    border:var(--k-border-w) solid var(--p-border);border-radius:var(--p-r2);overflow:hidden;background:var(--p-surface)}
  #inside .receipt-block{min-width:0;padding:var(--p-s2) var(--p-s3);
    border-right:var(--k-border-w) solid var(--p-border)}
  #inside .receipt-block:last-child{border-right:0}
  #inside .receipt-label{display:flex;align-items:center;gap:var(--p-s1);margin-bottom:var(--p-s1);
    color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);
    text-transform:uppercase;letter-spacing:.04em}
  #inside .receipt-value{color:var(--p-strong);font-size:var(--p-sm);
    font-weight:var(--k-weight-semibold);line-height:1.35}
  #inside .receipt-detail{margin-top:var(--k-space-1);color:var(--p-muted);font-size:var(--p-sm);line-height:1.35}
  #inside .ai-usage-breakdown{display:flex;flex-wrap:wrap;gap:var(--p-s1) var(--p-s2);margin-top:var(--p-s1)}
  #inside .ai-usage-item{color:var(--p-muted);font-family:var(--p-mono);font-size:var(--p-xs);white-space:nowrap}
  #inside .ai-usage-item strong{color:var(--p-text);font-weight:var(--k-weight-medium)}

  /* The receipt is a STATIC row with an always-visible body: the overview
     stats are never behind a disclosure chevron (869egdr2u-fu1). The body
     resets the disclosure-body indent, because there is no disclosure. */
  #inside .op-body.receipt-body{margin-left:0;border-left:0;padding-left:var(--p-s1);padding-top:var(--p-s1)}

  /* The receipt's own inner disclosure: only the DETAIL lines expand. */
  #inside .done-details{margin-top:var(--p-s1);border-top:var(--k-border-w) solid var(--p-border)}
  #inside .done-details summary{list-style:none;display:flex;align-items:center;gap:var(--p-s1);
    min-height:30px;padding:0 var(--p-s1);color:var(--p-muted);cursor:pointer;font-size:var(--p-sm)}
  #inside .done-details summary::-webkit-details-marker{display:none}
  #inside .done-details summary:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);
    outline-offset:var(--k-focus-offset)}
  #inside .done-details summary:hover{background:var(--p-hover)}
  #inside .done-details[open] summary{background:var(--p-surface2)}
  #inside .done-details .done-chev{width:16px;height:16px;display:grid;place-items:center;flex:none;
    color:var(--p-muted2)}
  #inside .done-details .done-chev:before{content:"";width:5px;height:5px;
    border-right:var(--k-border-w) solid currentColor;border-bottom:var(--k-border-w) solid currentColor;
    transform:rotate(-45deg);transition:transform var(--k-dur-fast) var(--k-ease-standard)}
  #inside .done-details[open] .done-chev:before{transform:rotate(45deg)}
  #inside .done-detail-body{display:grid;gap:var(--p-s1);padding:var(--p-s1) 0 var(--p-s2) var(--p-s2)}

  /* The Timing strip: the ticket's work-stage spans and their host-computed
     total — the displayed sum is the displayed total by construction. */
  #inside .done-timing{display:flex;align-items:baseline;flex-wrap:wrap;
    gap:var(--p-s1) var(--p-s3);min-height:28px;margin-top:var(--p-s1);
    padding:var(--p-s1) var(--p-s2);border:var(--k-border-w) solid var(--p-border);
    border-radius:var(--p-r1);background:var(--p-surface)}
  #inside .done-timing-label{color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);
    text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
  #inside .done-timing-value{color:var(--p-strong);font-size:var(--p-sm);
    font-weight:var(--k-weight-semibold);white-space:nowrap}
  #inside .done-timing-items{min-width:0;color:var(--p-muted);font-family:var(--p-mono);
    font-size:var(--p-xs);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* Ship · Commit: one block per repository, its provenance pill, its commits */
  #inside .commit-grid{border:var(--k-border-w) solid var(--p-border);border-radius:var(--p-r1);
    overflow:hidden;background:var(--p-surface)}
  #inside .commit-repo{border-bottom:var(--k-border-w) solid var(--p-border)}
  #inside .commit-repo:last-child{border-bottom:0}
  #inside .commit-repo-head{display:grid;grid-template-columns:minmax(72px,90px) minmax(0,1fr) auto auto;
    gap:var(--p-s2);align-items:center;min-height:29px;padding:0 var(--p-s2)}
  #inside .commit-repo-name{color:var(--p-text);font-family:var(--p-mono);font-size:var(--p-xs);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .commit-repo-summary{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--p-muted);font-size:var(--p-sm)}
  #inside .commit-time{color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);
    white-space:nowrap}
  #inside .commit-origin{display:inline-flex;align-items:center;border:var(--k-border-w) solid var(--p-border);
    border-radius:var(--k-radius-pill);padding:0 var(--p-s2);color:var(--p-muted);
    font-family:var(--p-mono);font-size:9px;line-height:16px;white-space:nowrap}
  #inside .commit-origin.ship{border-color:var(--p-edge-run);color:var(--p-running)}
  #inside .commit-origin.existing{border-color:var(--p-border2);color:var(--p-muted2)}
  /* The commit list hangs under its repository head, indented by one step —
     NOT by the head's whole first column. The 82px reservation left a gap
     wider than the hash it preceded, so the second line read as detached from
     the block it belongs to (869egdr2u-fu2). */
  #inside .commit-list{padding:0 var(--p-s2) var(--p-s1) var(--p-s3)}
  #inside .commit-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--p-s2);
    min-height:23px;align-items:center}
  #inside .commit-sha{font-family:var(--p-mono);font-size:var(--p-xs);color:var(--p-muted2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* In-body object links: the commit hash and the PR number ARE the controls
     the design wants them to be — underlined, monospaced, keyboard-focusable */
  #inside .obj-link{display:inline-flex;align-items:center;color:var(--k-link);
    text-decoration-line:underline;text-decoration-thickness:var(--k-border-w);
    text-decoration-color:var(--p-border2);text-underline-offset:2px;cursor:pointer;
    font-family:var(--p-mono);font-size:var(--p-xs);line-height:14px;vertical-align:middle;
    border-radius:var(--k-radius-1)}
  #inside .obj-link:hover{color:var(--k-link);text-decoration-color:currentColor}
  #inside .obj-link:focus-visible{outline:1px solid var(--p-running);outline-offset:2px}
  #inside .commit-message{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    color:var(--p-muted);font-size:var(--p-sm)}

  /* Ship · Pull request: the recorded path per repository */
  #inside .pr-branches{display:grid;gap:var(--k-space-1)}
  #inside .pr-branch{display:flex;align-items:center;gap:var(--p-s1);min-height:29px;
    padding:0 var(--p-s2);border-radius:var(--p-r1)}
  #inside .pr-branch.current{background:var(--p-tint-run)}
  #inside .pr-repo{width:44px;flex:none;color:var(--p-strong);font-family:var(--p-mono);
    font-size:var(--p-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #inside .pr-path{min-width:0;display:flex;align-items:center;gap:var(--p-s1);
    overflow:hidden;font-size:var(--p-sm)}
  #inside .pr-object{display:inline-flex;align-items:center;gap:var(--p-s1);min-height:18px;
    line-height:18px;white-space:nowrap}
  #inside .pr-link{color:var(--p-text);font-family:var(--p-mono);font-size:var(--p-xs);
    font-weight:var(--k-weight-semibold)}
  #inside .pr-status{display:inline-flex;align-items:center;border:var(--k-border-w) solid var(--p-border2);
    border-radius:var(--k-radius-pill);height:18px;padding:0 var(--p-s2);color:var(--p-muted);
    font-family:var(--p-mono);font-size:9px;line-height:16px;text-transform:lowercase;white-space:nowrap}
  #inside .pr-status.open{color:var(--p-running);border-color:var(--p-edge-run)}
  #inside .pr-status.draft{color:var(--p-skip);border-color:var(--p-border2)}
  #inside .pr-status.merged{color:var(--p-passed);border-color:var(--p-edge-done)}
  #inside .pr-status.closed{color:var(--p-failed);border-color:var(--p-failed)}
  #inside .pr-empty{color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);white-space:nowrap}
  #inside .pr-step{white-space:nowrap;color:var(--p-muted)}
  #inside .pr-step.current{color:var(--p-running);font-weight:var(--k-weight-medium)}
  #inside .pr-step.fail{color:var(--p-failed)}
  #inside .pr-step.note{color:var(--p-muted2);font-style:italic}
  #inside .pr-arrow{color:var(--p-muted2);flex:none}
  #inside .pr-time{margin-left:auto;flex:none;color:var(--p-muted2);font-family:var(--p-mono);
    font-size:var(--p-xs);white-space:nowrap}
  /* Indented one step under its branch line, not by the whole repo column —
     the 48px reservation opened a gap wider than the note's own first word. */
  #inside .pr-branch-note{padding:0 var(--p-s2) var(--p-s1) var(--p-s3);
    color:var(--p-muted2);font-family:var(--p-mono);font-size:var(--p-xs);line-height:18px}

  /* The prototype's compact width, expressed as the block's own container
     query so it follows the panel rather than the window (handoff §10). */
  @container (max-width: 430px){
    #inside .inside{margin-left:var(--k-space-2);margin-right:var(--k-space-2)}
    #inside .inside-head{grid-template-columns:auto minmax(0,1fr);padding:var(--p-s1) var(--p-s3)}
    #inside .inside-meta{grid-column:2}
    #inside .op summary,#inside .op-static{grid-template-columns:20px minmax(68px,86px) minmax(0,1fr) auto 16px;
      padding-left:var(--p-s2);padding-right:var(--p-s2)}
    #inside .duration,#inside .op-time{display:none}
    #inside .op-tail .agent-model{display:none}
    #inside .op-body{margin-left:20px}
    #inside .gate-row{grid-template-columns:58px 70px minmax(0,1fr)}
    #inside .gate-repo{display:none}
    #inside .gates.no-repo .gate-row{grid-template-columns:58px 70px minmax(0,1fr)}
    #inside .gate-state{grid-column:3}
    #inside .evidence-row{grid-template-columns:70px minmax(0,1fr)}
    #inside .ev-state{grid-column:2}
    #inside .finding{grid-template-columns:56px minmax(0,1fr)}
    #inside .finding-loc{grid-column:2}
    #inside .finding-time{display:none}
    #inside .done-line{grid-template-columns:76px minmax(0,1fr)}
    #inside .done-state{grid-column:2}
    /* The receipt grid stacks rather than crushing three columns; the commit
       list and the PR note lose their hanging indent so nothing truncates. */
    #inside .receipt-grid{grid-template-columns:minmax(0,1fr)}
    #inside .receipt-block{border-right:0;border-bottom:var(--k-border-w) solid var(--p-border)}
    #inside .receipt-block:last-child{border-bottom:0}
    #inside .commit-repo-head{grid-template-columns:minmax(0,1fr) auto auto}
    #inside .commit-repo-name{grid-column:1}
    #inside .commit-repo-summary{grid-column:1/-1}
    #inside .commit-list,#inside .pr-branch-note{padding-left:var(--p-s2)}
    #inside .commit-item{grid-template-columns:auto minmax(0,1fr)}
    #inside .pr-branch{flex-wrap:wrap}
    #inside .pr-time{margin-left:0}
    #inside .session-head{grid-template-columns:20px minmax(72px,90px) minmax(0,1fr)}
    #inside .timeline-row{grid-template-columns:var(--timeline-col) minmax(82px,104px) minmax(0,1fr);
      padding-left:var(--timeline-left)}
    #inside .phase-time,#inside .timeline-tail{display:none}
    #inside .session-foot{flex-wrap:wrap}
    #inside .session-foot .session-rule{margin-left:0;width:100%}
    #inside .recovery-round{grid-template-columns:48px minmax(0,1fr)}
    #inside .recovery-result{grid-column:2}
    /* handoff §10: a truncated path hides where the fix goes, so the unbounded
       cells WRAP here instead of ellipsising — and `overflow-wrap:anywhere`,
       because `white-space:normal` alone cannot break a long branch or SHA. */
    #inside .finding-title,#inside .ev-detail,#inside .done-copy,#inside .op-detail{
      white-space:normal;overflow:visible;overflow-wrap:anywhere}
  }
  /* ≤360 / ≤300 — the floor: chrome thins, nothing is hidden. The status and
     the name never drop (handoff §10). */
  @container (max-width: 360px){
    #inside .op summary,#inside .op-static{gap:var(--k-border-w);padding-left:var(--k-space-1);padding-right:var(--k-space-1)}
    #inside .evidence-row,#inside .gate-row{gap:var(--p-s1)}
  }
  @container (max-width: 300px){
    #inside .inside{margin-left:var(--k-space-1);margin-right:var(--k-space-1)}
    #inside .op-body{margin-left:var(--k-space-6);padding-left:var(--p-s1)}
