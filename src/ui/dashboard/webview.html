<!--
  Karst ticket dashboard webview (T3.2). Self-contained: no external assets
  (webview CSP forbids them). Renders from the `state` postMessage the host
  pushes (state.ts → DashboardState) and posts action messages back
  (messages.ts → WebviewMessage). Styles ported from design/orchestrator-mockup.html.
-->
<!--KARST_CSP-->
<style>
  :root{
    /* Theme-aware: inherit VS Code's palette so light + dark both read well.
       Stage colors map to the editor's chart colors (kept as --st-* so the
       inline style="" in the render fns keeps working). */
    --border:var(--vscode-panel-border);
    --hover:var(--vscode-list-hoverBackground);
    --text:var(--vscode-foreground);
    --text-dim:var(--vscode-descriptionForeground,var(--vscode-foreground));
    --text-faint:var(--vscode-disabledForeground,var(--vscode-descriptionForeground));
    --link:var(--vscode-textLink-foreground);
    /* MUST stay opaque. --panel-bg is not just a surface tint: the rail nodes
       fill with it to MASK the connector running under them, and the selection
       ring's inner gap (box-shadow 0 0 0 2px) is painted in it to punch the ring
       away from the node. A theme that omits editorWidget.background used to
       fall back to `transparent`, and both masks silently stopped masking — the
       connector drew through the node body and through the ring's gap, so the
       ring read as a broken circle crossed by the rail. editor.background is
       always defined and is exactly what sits behind the stepper anyway, so it
       is the correct opaque floor. */
    --panel-bg:var(--vscode-editorWidget-background,var(--vscode-editor-background));
    --st-done:var(--vscode-charts-green,#4bb64b);
    --st-running:var(--vscode-charts-blue,#3794ff);
    --st-pending:var(--vscode-charts-lines,#6e7681);
    --st-input:var(--vscode-charts-yellow,#cca700);
    --st-failed:var(--vscode-charts-red,#f14c4c);
    /* Selection, kept off the status ramp so a selected node's status stays
       readable underneath the ring. */
    --st-sel:var(--vscode-charts-purple,#8a63d2);
    --mono:var(--vscode-editor-font-family,"SF Mono",ui-monospace,Menlo,Monaco,Consolas,monospace);
    --ui:var(--vscode-font-family,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--vscode-editor-background);color:var(--text);font-family:var(--ui);font-size:var(--vscode-font-size,13px);padding:22px 26px}
  button{font-family:inherit;cursor:pointer;color:var(--vscode-button-foreground);background:var(--vscode-button-background);border:none;border-radius:5px;padding:3px 9px;font-size:11px}
  button:hover{background:var(--vscode-button-hoverBackground,var(--vscode-button-background))}
  button:focus-visible{outline:1px solid var(--vscode-focusBorder);outline-offset:1px}
  a{color:var(--link);text-decoration:none}
  /* Toggled by the render fns (fault card, impl phases) — without this rule the
     `hidden` class was a no-op and an empty box still drew its border. */
  .hidden{display:none}

  .dhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .dhead h1{font-size:17px;margin:0}
  .dhead h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dhead .agent{margin-left:auto;font-size:11px;color:var(--text-dim);font-family:var(--mono)}
  /* The key pill IS the board link: provider mark + key + arrow, one target.
     A separate link chip echoed the key (both print the board's id), so the
     two collapse into one. The board ref/brief demote to the tooltip.
     Manual (no board) is the same pill, dashed and inert. */
  .dhead .keypill{display:inline-flex;align-items:center;gap:6px;flex:none;
    font-family:var(--mono);font-size:11.5px;color:var(--text);
    border:1px solid var(--border);border-radius:14px;padding:3px 10px;
    background:var(--panel-bg);line-height:1.3}
  .dhead a.keypill:hover{border-color:var(--link);background:var(--hover)}
  .dhead a.keypill .arw{color:var(--link);transition:transform .12s ease}
  .dhead a.keypill:hover .arw{transform:translate(1px,-1px)}
  .dhead a.keypill:focus-visible{outline:1px solid var(--vscode-focusBorder);outline-offset:1px}
  .dhead .keypill.local{border-style:dashed;color:var(--text-dim);
    background:transparent;cursor:default}
  @media (prefers-reduced-motion:reduce){.dhead a.keypill:hover .arw{transform:none}}
  /* Shared ticketing-provider badge (icon + brand name) — single source in
     src/model/providerIdentity.ts, injected here at load (CSP forbids a
     shared stylesheet). */
  /*KARST_PROVIDER_CSS*/

  /* The stage graph as a circuit, not a line. The main rail runs scope → impl →
     uat → review → ship → done; `fix` is a RETURN CHANNEL below it, because
     STAGE_GRAPH only reaches fix on a failed verdict and returns it to review on
     a pass. Drawing fix inline claimed a forward path that does not exist.

     The CONNECTORS carry state, not just the nodes. Status is never color alone —
     each node also carries a glyph and a distinct shape (filled / hollow /
     broken), so the rail survives colorblindness and high-contrast themes. */
  .stepper{margin:20px 0 26px;padding:14px 8px 8px;border:1px solid var(--border);border-radius:10px;background:var(--panel-bg)}
  /* The rail scrolls inside itself on a narrow panel; the page never scrolls sideways. */
  /* padding-top is LOAD-BEARING, not spacing. overflow-x:auto forces overflow-y
     to compute to `auto` as well, so this box clips vertically too — and the
     nodes sit flush against its content top. The selection ring paints 4px above
     the node and the focus outline 5px, so both were sliced off flat and the
     selected circle rendered as an open arc. 6px is the outline's reach; the
     stepper gives back the same 6px from its own padding so nothing moves. */
  .railwrap{overflow-x:auto;padding-top:6px}
  /* Column geometry is DERIVED, never hardcoded: the rail is a flex row of
     `--cols` equal columns, so column n centers at (n + 0.5) / cols. Every
     attachment point below is a calc() off these vars (written inline from
     state.rail.geometry), so adding or removing a stage moves the loop with it
     instead of silently detaching it. */
  .track{min-width:560px}
  .main{display:flex;align-items:flex-start}
  /* Each column carries its stage's color via the shared stg-<stage> token
     (model/stagePalette), the SAME token the sidebar chip uses — so a stage is
     the identical hue in both views. `color` here is the stage identity; the
     node's FILL and SHAPE below still encode status, so hue and status stay two
     independent reads. A stageKey with no stg-* class falls through to this
     neutral default rather than rendering uncolored. */
  .st{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0;
    color:var(--st-pending);--stg-color:var(--st-pending)}
  .st .seg{position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
  .st:first-child .seg{display:none}
  .st .seg.lit{background:var(--st-done);opacity:.55}
  .st .seg.active{background:var(--st-running)}
  .st .seg.broken{background-color:transparent;
    background-image:repeating-linear-gradient(90deg,var(--st-failed) 0 4px,transparent 4px 8px)}
  /* The node IS the control — a button, so Tab and Enter work for free. */
  /* Pending is a hollow ring in the stage's hue (border + glyph both
     currentColor, inherited from .st). Status changes the FILL, not the color. */
  .st .node{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    background:var(--panel-bg);border:2px solid var(--stg-color);color:var(--stg-color);
    position:relative;z-index:1;font-size:13px;font-weight:700;line-height:1;
    padding:0;cursor:pointer;font-family:inherit}
  .st .node:hover{filter:brightness(1.25)}
  /* Focus is focusBorder, NOT --st-sel. The selection ring is --st-sel and ends
     4px out; an --st-sel outline at offset 3px overlaps it in the same colour,
     so the two fused into one fat purple slab and a keyboard user landing on the
     already-selected node saw no focus change at all. Two colours at two radii
     keep selection and focus independently readable — and it is what every other
     focusable here (buttons, keypill, the approach summary) already uses. */
  .st .node:focus-visible{outline:2px solid var(--vscode-focusBorder);outline-offset:3px}
  /* The label IS the stage color — the same string and hue as the sidebar chip.
     Inherits from .st, so it can never drift from the node above it. */
  .st .lbl{margin-top:9px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:inherit;text-align:center}
  .st .meta{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);margin-top:3px;height:12px}
  /* Passed/running FILL the node in the stage hue; the glyph knocks out against
     it. Hue still says which stage, fill says it is done/working. */
  .st.done .node{background:var(--stg-color);border-color:var(--stg-color);color:var(--vscode-editor-background)}
  /* Skipped is the one status that leaves the stage ramp: a stage that never ran
     has no identity to assert, so it reads neutral gray. */
  .st.skipped .node{background:var(--st-pending);border-color:var(--st-pending);color:var(--vscode-editor-background);opacity:.55}
  /* No pulse on a running node: it carries a spinner, and two simultaneous
     animations on one 30px mark read as noise. */
  .st.running .node{background:var(--stg-color);border-color:var(--stg-color);color:var(--vscode-editor-background)}
  /* Failed reads as a break in the circuit: hollow + dashed, never filled — in
     the stage's hue (fix's is red, which is also its status meaning). */
  .st.failed .node{background:transparent;border-color:var(--stg-color);border-style:dashed;color:var(--stg-color)}
  /* Selection is a RING, never a fill — status already owns fill and the stage
     owns hue, and all three must stay independently readable, so the ring keeps
     its own off-ramp purple. */
  .st.sel .node{box-shadow:0 0 0 2px var(--panel-bg),0 0 0 4px var(--st-sel)}
  /* Scale only — never opacity. The one node this drives (armed fix) sits ON the
     bracket's bottom edge, and its fill is what MASKS that edge. Fading the node
     to .72 made the dashed bracket show through the fill and through the
     selection ring, so the node read as broken exactly when it matters most. */
  @keyframes node-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}

  /* Running = a live spinner, not a glyph. ⟳ misreads as "reload/retry", which
     is the wrong affordance on a node that is now clickable. An animating ring
     is the one mark that reads as work in progress. Under reduced motion it
     stops as a broken ring — still shape-distinct from ✓ ✕ · –, so status never
     rides on color alone. */
  .spin{display:block;border-radius:50%;border:2px solid currentColor;
    border-top-color:transparent;animation:spin .9s linear infinite}
  .st .spin{width:13px;height:13px}
  .oglyph .spin{width:9px;height:9px;margin:0 auto;border-width:1.5px;color:var(--st-running)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .loop.armed .fixnode .node{animation:none}
    .spin{animation:none}
  }

  /* ── the branch band ──────────────────────────────────────────────────── */
  /* ONE band carries both branches off the rail: fix hangs at the gate columns,
     impl's approach at impl's column. Two grid rows — row 1 is the branch level,
     row 2 is where impl's disclosure expands, clear of both branches. */
  .loop{position:relative;display:grid;grid-template-rows:62px auto;margin-top:6px}
  .loop .drop{position:absolute;top:0;height:30px;
    left:calc((var(--uat) + 0.5) / var(--cols) * 100%);
    right:calc(100% - (var(--review) + 0.5) / var(--cols) * 100%);
    border:2px dashed var(--border);border-top:none;border-radius:0 0 12px 12px}
  /* Armed changes color, never style: a solid rounded bracket reads as a box
     drawn around the fix node; dashed keeps reading as a path. */
  .loop.armed .drop{border-color:var(--st-failed)}
  /* fix ─pass→ review: parallel to review's descender, offset a fixed 20px so
     the two edges read as a channel rather than one ambiguous line. */
  .loop .ret{position:absolute;top:4px;width:2px;height:26px;background:var(--border);
    left:calc((var(--review) + 0.5) / var(--cols) * 100% + 20px)}
  .loop .ret::before{content:"▲";position:absolute;top:-10px;left:-4px;font-size:9px;
    line-height:1;color:var(--border)}
  .loop.armed .ret{background:var(--st-running)}
  .loop.armed .ret::before{color:var(--st-running)}
  .loop .retlbl{position:absolute;top:5px;font-family:var(--mono);font-size:9px;
    color:var(--text-faint);white-space:nowrap;
    left:calc((var(--review) + 0.5) / var(--cols) * 100% + 32px)}
  .loop.armed .retlbl{color:var(--st-running)}
  .loop .faillbl{position:absolute;top:5px;font-family:var(--mono);font-size:9px;
    color:var(--text-faint);white-space:nowrap;transform:translateX(-100%);padding-right:7px;
    left:calc((var(--uat) + 0.5) / var(--cols) * 100%)}
  .loop.armed .faillbl{color:var(--st-failed)}

  /* Node on the bracket's bottom edge, name and status on ONE line beneath it.
     Beside the node they run into the bracket's right descender; as two stacked
     lines they cost 30px to say two words. */
  /* fix carries its own stage hue (stg-fix, added in the markup) exactly like a
     rail node — currentColor here is that hue, so the ring, label, and armed
     fill all read as one stage. */
  .loop .fixnode{position:absolute;top:17px;display:flex;flex-direction:column;
    align-items:center;gap:4px;
    left:calc((var(--uat) + var(--review) + 1) / 2 / var(--cols) * 100%);
    transform:translateX(-50%)}
  .loop .fixnode .node{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
    background:var(--panel-bg);border:2px dashed var(--stg-color);color:var(--stg-color);
    font-size:12px;font-weight:700;flex:none;padding:0;cursor:pointer;font-family:inherit}
  .loop .fixnode .node:hover{filter:brightness(1.25)}
  /* focusBorder, not --st-sel — same fusion with the selection ring as the rail
     nodes above. */
  .loop .fixnode .node:focus-visible{outline:2px solid var(--vscode-focusBorder);outline-offset:3px}
  .loop .fixnode .cl{display:flex;align-items:baseline;gap:6px;white-space:nowrap}
  .loop .fixnode .lbl{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:inherit}
  .loop .fixnode .cap{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);white-space:nowrap}
  /* Armed FILLS the ring (status: the loop is live); hue stays fix's. */
  .loop.armed .fixnode .node{border-style:solid;border-color:var(--stg-color);
    background:var(--stg-color);color:var(--vscode-editor-background);
    animation:node-pulse 1.7s ease-in-out infinite}
  .loop.armed .fixnode .cap{color:var(--st-input)}
  /* A fix pass is a resolved/healthy attempt even though review runs next to
     revalidate it. Paint that stored success green instead of leaving the
     branch looking like an unresolved red retry. */
  .loop .fixnode.done .node{--stg-color:var(--st-done);border-style:solid;
    border-color:var(--stg-color);background:var(--stg-color);
    color:var(--vscode-editor-background)}
  .loop .fixnode.done .lbl{color:var(--st-done)}
  .loop .fixnode.sel .node{box-shadow:0 0 0 2px var(--panel-bg),0 0 0 4px var(--st-sel)}
  .loop .fixnode.sel .lbl{color:var(--text)}

  /* fix is optional, so it defaults collapsed: the whole return channel is
     dropped and row 1 shrinks to the approach chip it still has to carry. Only
     the toggle remains, sitting where the bracket would be. Armed never collapses
     (renderRail omits the class), so a live loop is always drawn. */
  .loop.collapsed{grid-template-rows:auto auto}
  /* A dim stage-hued pill in fix's own colour (stg-fix on the button), so the
     affordance still reads as "the fix loop" while it is hidden. Centred on the
     branch, exactly where the fix node would sit. */
  .fixtoggle{position:absolute;top:2px;left:calc((var(--uat) + var(--review) + 1) / 2 / var(--cols) * 100%);
    transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;
    padding:2px 8px;border-radius:9px;border:1px dashed var(--border);background:var(--panel-bg);
    color:var(--text-faint);white-space:nowrap;cursor:pointer;line-height:1.4}
  .fixtoggle:hover{background:var(--hover);border-color:var(--text-dim);color:var(--text-dim)}
  .fixtoggle:focus-visible{outline:2px solid var(--vscode-focusBorder);outline-offset:2px}
  /* When the branch is shown, the toggle steps aside to the band's right edge so
     it never overlaps the fix node it now sits beside. */
  .fixtoggle.open{left:auto;right:2px;transform:none}

  /* impl's stem drops from the rail and STOPS at the approach chip — the same
     move the bracket makes into the fix node. Running it the full band height
     left a line dangling past the chip, which read as two unrelated marks. */
  .loop .implstem{position:absolute;top:0;height:21px;width:2px;background:var(--border);
    left:calc((var(--impl) + 0.5) / var(--cols) * 100%)}
  .loop .implstem.on{background:var(--st-running)}

  /* ── impl's approach: named on the rail, detail on demand ─────────────── */
  /* display:contents is what lets the summary chip sit in row 1 while the detail
     panel expands into row 2, clear of both branches, with no extra wrapper. */
  .approach{display:contents}
  /* Centered ON impl's stem, exactly as the fix node centers on its bracket.
     Width cap: the gap to the bracket, doubled (the chip is centered, so only
     half reaches right), minus the `fail` edge label that hangs to the bracket's
     LEFT — the nearest thing this can hit — plus a gutter. */
  .branch-slot{grid-row:1;justify-self:start;align-self:start;margin-top:21px;
    margin-left:calc((var(--impl) + 0.5) / var(--cols) * 100%);
    transform:translateX(-50%);
    max-width:calc((var(--uat) - var(--impl)) / var(--cols) * 200% - 72px);
    display:inline-flex;align-items:center;min-width:0}
  .approach > summary{list-style:none;cursor:pointer}
  .approach > summary::-webkit-details-marker{display:none}
  .approach > summary:hover .aid{background:var(--hover);border-color:var(--text-dim)}
  .approach > summary:focus-visible .aid{outline:1px solid var(--vscode-focusBorder);outline-offset:1px}
  /* The chevron rides INSIDE the chip: beside it, it detached from both the stem
     and the chip and read as a stray glyph. */
  .approach .chev{color:var(--text-faint);font-size:7px;transition:transform .12s ease;flex:none}
  .approach[open] .chev{transform:rotate(180deg)}
  @media (prefers-reduced-motion:reduce){.approach .chev{transition:none}}
  /* A long id truncates rather than pushing into the fix branch; the full value
     stays in the title. */
  .approach .aid,.noapproach .none{font-family:var(--mono);font-size:10px;padding:2px 8px;
    border-radius:9px;border:1px solid var(--border);background:var(--panel-bg);
    color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  /* max-width:100% is what makes the cap bite — the slot's max-width alone lets
     a nowrap chip overflow it. */
  .approach .aid{display:inline-flex;align-items:center;gap:6px;max-width:100%}
  .approach .aid .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
  .approach.active .aid{border-color:var(--st-running);color:var(--text)}
  .approach.done .aid{border-color:var(--st-done);color:var(--st-done)}
  /* No approach at all (manual ticket): a plain inert chip, never an empty
     disclosure the user can open onto nothing. */
  .noapproach .none{border-style:dashed;color:var(--text-faint)}

  .approach .detail{grid-row:2;margin:2px 0 0;
    margin-left:calc((var(--impl) + 0.5) / var(--cols) * 100% - 8px);
    border:1px solid var(--border);border-radius:8px;
    padding:8px 4px 6px;max-width:640px}
  .phrow{display:flex;align-items:baseline;gap:10px;padding:4px 10px;border-radius:6px}
  .phrow:hover{background:var(--hover)}
  .phrow .pi{font-family:var(--mono);font-size:9.5px;color:var(--text-faint);width:12px;flex:none}
  .phrow .pn{font-size:11.5px}
  .approach .foot{font-family:var(--mono);font-size:9px;color:var(--text-faint);
    padding:8px 10px 0;margin-top:5px;border-top:1px solid var(--border);opacity:.85}

  /* ── activity strip: what happens inside the SELECTED stage ───────────── */
  .act{margin:16px 6px 2px;border:1px solid var(--border);border-radius:9px}
  .act .ahead{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--border)}
  .act .aname{font-size:12px;font-weight:600}
  .act .adot{width:7px;height:7px;border-radius:50%;background:var(--st-running);flex:none}
  .act .adot.wait{background:var(--st-input)} .act .adot.idle{background:var(--st-pending)}
  .act .adot.fail{background:var(--st-failed)} .act .adot.done{background:var(--st-done)}
  .act .adot.pend{background:transparent;border:2px solid var(--st-pending);width:9px;height:9px}
  .act .aclock{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-faint)}
  /* Viewing a stage that is not the current one — say so, and offer the way
     back. Without this the strip silently contradicts the Now line. */
  .act.viewing{border-color:var(--st-sel)}
  .act .vbar{display:flex;align-items:center;gap:9px;padding:6px 13px;font-size:11px;
    color:var(--text-dim);background:var(--hover);border-bottom:1px solid var(--border)}
  .act .vbar .sp{margin-left:auto}
  .act .blurb{padding:10px 14px;font-size:11.5px;color:var(--text-dim)}
  .act .ops{padding:4px 6px 8px}
  .op{display:flex;align-items:center;gap:10px;padding:5px 8px;border-radius:6px}
  .op:hover{background:var(--hover)}
  .op .oglyph{width:14px;text-align:center;font-size:11px;color:var(--text-faint)}
  .op.pass .oglyph{color:var(--st-done)} .op.run .oglyph{color:var(--st-running)}
  .op.fail .oglyph{color:var(--st-failed)} .op.wait .oglyph{color:var(--st-input)}
  .op .oname{font-size:12px;min-width:82px}
  .op .ocmd{font-family:var(--mono);font-size:11px;color:var(--text-dim);flex:1;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  .op .odur{font-family:var(--mono);font-size:10.5px;color:var(--text-faint)}
  .op.pending{opacity:.5}
  /* A gate the repo cannot answer, or a phase karst cannot observe, is not a
     failure — say so plainly instead of dressing it as a status. */
  .op.note .ocmd{font-style:italic;opacity:.75}
  button.ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
  button.ghost:hover{background:var(--hover)}

  /* The fault card — the one loud element on the page, because a failure is the
     one moment the user MUST read. Machine truth (reason, timings) is monospace. */
  .fault{margin:16px 6px 2px;padding:10px 12px;border-left:3px solid var(--st-failed);
    border-radius:0 6px 6px 0;background:var(--vscode-inputValidation-errorBackground,transparent)}
  .fault .ftitle{font-size:12px;font-weight:600;margin-bottom:6px}
  .fault .freason{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word}
  .fault .fmeta{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:7px}
  .fault .facts{margin-top:9px}

  /* The "Now" line — one plain sentence naming what is happening and the next
     action the user controls. Built host-side (state.now) so the copy is tested. */
  .now{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 6px 2px;padding-top:11px;
    border-top:1px solid var(--border);font-size:12px;color:var(--text)}
  .now .ntext{flex:1}
  .now .now-sub{flex-basis:100%;font-size:11px;color:var(--text-dim)}
  /* The ship-in-progress spinner rides in the Now line at the gate-node size.
     .spin is display:block, so it needs an explicit box here. */
  .now .spin{width:13px;height:13px;flex:none;color:var(--st-running)}
  /* The resolved-success flash: a brief "Shipped ✓" beside the settled line. */
  .now .shipbadge{font-weight:600;flex:none}
  .now .shipbadge.ok{color:var(--st-done)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .panel{border:1px solid var(--border);border-radius:10px;background:var(--panel-bg);overflow:hidden}
  .panel.span{grid-column:1 / -1}
  .phead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:12.5px;font-weight:600}
  .phead .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-faint);font-weight:400}
  .pbody{padding:6px 8px 10px}
  .empty{padding:16px 14px;color:var(--text-faint);font-size:12px}

  .wt,.pr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:6px}
  .wt:hover,.pr:hover{background:var(--hover)}
  .wt .wrepo{font-size:12.5px;min-width:74px}
  .wt .wacts,.pr .pacts{margin-left:auto;display:flex;gap:4px}
  .wt .wbr{font-family:var(--mono);font-size:11px;color:var(--text-dim);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .pr .pst{font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:9px;background:var(--vscode-badge-background);color:var(--vscode-badge-foreground);text-transform:uppercase;letter-spacing:.4px}
  /* Live PR state at a glance: open green, merged purple, closed red, draft muted. */
  .pr .pst-open{background:var(--vscode-testing-iconPassed,#2ea043);color:#fff}
  .pr .pst-merged{background:#8957e5;color:#fff}
  .pr .pst-closed{background:var(--vscode-testing-iconFailed,#cf222e);color:#fff}
  .pr .pst-draft,.pr .pst-unknown{background:var(--vscode-descriptionForeground,#8b949e);color:var(--vscode-editor-background,#0d1117)}
  .pr .pnum{font-family:var(--mono);color:var(--link)}
  .pr .ptitle{flex:1;font-size:12.5px}

  /* agent pill (colored by state) */
  .agent-pill{display:inline-flex;align-items:center;gap:6px}
  .agent-pill .dot{width:7px;height:7px;border-radius:50%}

  /* ===================== Servers panel ==================================
     One service is ONE LINE at every width. The panel reacts to its own grid
     column rather than the viewport, so containment is scoped to it — .panel
     is shared with Worktrees and Pull requests, which need none of this. */
  /* Visually hidden, still announced — for labels the layout drops but a screen
     reader still needs (the dot-only Status header, the filter's label). */
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .svpanel{container-type:inline-size}
  /* Whole-ticket controls live in the HEADER because they act on every service
     and must survive the states where the body has no rows to hang a button
     off — the empty body is exactly when Start matters most. The count
     therefore gives up the auto margin it keeps in the other panels. */
  .svpanel .phead{padding:8px 10px 8px 14px}
  .svpanel .phead .count{margin-left:0}
  .svpanel .phead .pops{margin-left:auto;display:flex;gap:2px}
  .svpanel .pbody{padding:0}

  /* Icon buttons — inline SVG off a sprite (no icon font, no external asset:
     the webview CSP forbids both). Icon-only is what lets four actions share a
     row without the action column outgrowing the data. The label is not lost,
     it moves to aria-label + title, so the word survives for both pointer and
     screen reader. */
  .ib{display:inline-flex;align-items:center;justify-content:center;
    width:23px;height:23px;padding:0;border-radius:5px;flex:none;
    background:transparent;border:1px solid transparent;color:var(--text-dim);
    transition:background .12s ease,border-color .12s ease}
  .ib:focus-visible{outline:1px solid var(--vscode-focusBorder);outline-offset:1px}
  .ib svg{width:14px;height:14px;display:block;transition:transform .12s ease}
  /* Each action carries its OWN resting colour, off the same status ramp the
     stepper uses — hue is the fastest way to tell Stop from Start before any
     label is read. The word is still on every button, so hue accelerates, it
     never carries. */
  .ib.t-open{color:var(--st-running)}
  .ib.t-copy{color:var(--st-sel)}
  .ib.t-restart{color:var(--st-input)}
  .ib.t-stop{color:var(--st-failed)}
  .ib.t-start{color:var(--st-done)}
  .ib.ok{color:var(--st-done)}
  /* Hover is a SEPARATE channel from colour: a surface and border appear under
     the icon and the glyph grows. Deliberately not a brightness shift — under a
     light theme every hue is already dark, so brightening moves the icon toward
     the background and costs contrast on the very element being pointed at.
     Scale and surface read the same in both themes. */
  .ib:hover:not(:disabled){background:var(--hover);border-color:var(--border)}
  .ib:hover:not(:disabled) svg{transform:scale(1.14)}
  .ib:active:not(:disabled) svg{transform:scale(.94)}
  .ib:disabled{color:var(--text-faint);opacity:.45;cursor:default}
  @media (prefers-reduced-motion:reduce){
    .ib,.ib svg{transition:none}
    .ib:hover svg,.ib:active svg{transform:none}
  }

  /* Status semantics. Colour is never the only carrier: each state has a
     distinct GLYPH (filled disc vs hollow ring), the address column reads "—"
     when offline, and the dot carries its word to pointer and screen reader. */
  .svpanel .glyph{flex:0 0 auto;display:inline-block;border-radius:50%}
  .svpanel .glyph.on{width:8px;height:8px;background:var(--st-done)}
  .svpanel .glyph.off{width:9px;height:9px;background:transparent;border:2px solid var(--st-pending)}

  .svpanel .filter{display:flex;align-items:center;gap:8px;padding:8px 10px;
    border-bottom:1px solid var(--border)}
  .svpanel .filter input{flex:1;min-width:0;font-family:var(--ui);font-size:11.5px;
    padding:3px 8px;border-radius:5px;background:var(--vscode-input-background);
    color:var(--vscode-input-foreground);border:1px solid var(--vscode-input-border)}
  .svpanel .filter input:focus-visible{outline:1px solid var(--vscode-focusBorder);outline-offset:0}
  .svpanel .scroll{max-height:288px;overflow-y:auto;overflow-x:hidden}
  .svpanel table{width:100%;border-collapse:collapse;font-size:12.5px}
  .svpanel thead th{position:sticky;top:0;z-index:1;background:var(--panel-bg);
    text-align:left;font-weight:600;font-size:10.5px;text-transform:uppercase;
    letter-spacing:.6px;color:var(--text-faint);padding:7px 10px;
    border-bottom:1px solid var(--border);white-space:nowrap}
  .svpanel tbody tr:hover,.svpanel tbody tr:focus-within{background:var(--hover)}
  .svpanel td{padding:4px 10px;vertical-align:middle}
  /* Status is the DOT only — no word. A "Status" label over a 9px dot only
     crowded the header, so that header is screen-reader-only. */
  .svpanel td.c-dot{width:1%;padding-right:0;line-height:0}
  /* The NAME column absorbs all the slack, which pushes the address and its two
     ops into one right-hand group. The address is right-aligned inside a
     shrink-wrapped column, and that is what makes Open/Copy sit flush against
     the value on EVERY row instead of after a ragged gap. */
  .svpanel td.c-name{font-size:12.5px;max-width:0;width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .svpanel td.c-addr{font-family:var(--mono);font-size:11.5px;color:var(--text-dim);
    white-space:nowrap;width:1%;text-align:right;padding-right:5px}
  .svpanel td.c-addr.off{font-style:italic;color:var(--text-faint)}
  .svpanel td.c-addr .short{display:none}
  .svpanel td.c-addrops{width:1%;padding-left:0;padding-right:0}
  /* The gap between the address group and the lifecycle group is the only thing
     separating them — keep it wider than the 2px inside each group. */
  .svpanel td.c-acts{text-align:right;white-space:nowrap;width:1%;padding-left:12px}
  .svpanel td .g{display:inline-flex;gap:2px;justify-content:flex-end}

  /* Narrow COMPACTS, it does not restack: one service stays one line, which is
     the whole point of this design. */
  @container (max-width: 400px){
    /* SPECIFICITY TRAP — do not simplify these back to bare `td`. A
       class-qualified `td.c-acts` (0,2,1) out-specifies a bare `td` (0,1,1)
       REGARDLESS of source order, so a reset written as `td{width:auto}` never
       lands: the 1% action column survived into narrow and wrapped every icon
       onto its own line. The re-qualification is the fix. */
    .svpanel td.c-acts{width:auto}
    .svpanel thead th{padding:6px 6px;font-size:10px}
    .svpanel td{padding:4px 6px}
    /* At this width "localhost:5173" ellipsises to "localhost…" — showing the
       part that never varies and hiding the part that does. Both strings are in
       the DOM so the swap is CSS, not a JS width probe; the full address stays
       on the cell's title either way. */
    .svpanel td.c-addr{font-size:11px}
    .svpanel td.c-addr .full{display:none}
    .svpanel td.c-addr .short{display:inline}
  }

  /* Empty states. Dense: mark + headline on one line, the reason under it, and
     no button — Start lives in the header where it works in every state. */
  .svpanel .estate{display:flex;align-items:flex-start;gap:10px;padding:14px 14px 15px}
  .svpanel .estate .emark{display:flex;align-items:center;justify-content:center;
    width:22px;height:22px;border-radius:50%;flex:none;margin-top:-1px;
    background:var(--hover);color:var(--text-faint)}
  .svpanel .estate .emark svg{width:13px;height:13px;display:block}
  .svpanel .estate .ehead{font-size:12.5px;font-weight:600;color:var(--text)}
  .svpanel .estate .esub{font-size:11.5px;color:var(--text-dim);line-height:1.45;margin-top:2px}
  /* The dead end gets no action anywhere, so it also gets no emphasis — the
     block stays at description weight to read as a statement, not a prompt. */
  .svpanel .estate.dead .ehead{color:var(--text-dim);font-weight:500}
  .svpanel .nomatch{padding:14px;color:var(--text-faint);font-size:12px}
</style>

<!-- Icon sprite for the servers panel. Stroked 16px glyphs on currentColor,

<div class="dhead">
  <span id="keyPill"></span>
  <h1 id="title"></h1>
  <span class="agent" id="agent"></span>
  <button id="editBtn" title="Edit ticket">Edit</button>
</div>

<div class="stepper">
  <!-- The main rail + the fix return channel + impl's approach chip. -->
  <div class="railwrap" id="rail"></div>
  <!-- What happens inside the SELECTED stage (defaults to the current one). -->
  <div id="inside"></div>
  <!-- Inline fault card for a failed stage: reason + timings + [Open log]. -->
  <div class="fault hidden" id="fault"></div>
  <!-- What is happening and what the user can do next (state.now). -->
  <div class="now" id="now"></div></div>

<div class="grid">
  <div class="panel svpanel"><div class="phead">Servers<span class="count" id="srvCount"></span><span class="pops" id="srvOps"></span></div><div class="pbody" id="servers"></div></div>
  <div class="panel"><div class="phead">Worktrees<span class="count" id="wtCount"></span></div><div class="pbody" id="worktrees"></div></div>
  <div class="panel span"><div class="phead">Pull requests<span class="count" id="prCount"></span></div><div class="pbody" id="prs"></div></div>
</div>

<script>
  // Shared ticketing-provider identity (icon + brand) — single source in
  // src/model/providerIdentity.ts, injected here at load (CSP forbids a
  // shared script). Defines PROVIDER_LABELS, CLICKUP_SVG, providerBadgeHtml.
  /*KARST_PROVIDER_JS*/

  const vscode = acquireVsCodeApi();
  const post = (msg) => vscode.postMessage(msg);

  // Stage status -> rail CSS class. Amber/needs-you is an agent-level signal
  // (glyphFor precedence); the rail shows stage status only.
  const STEP_CLASS = { passed: 'done', running: 'running', failed: 'failed', pending: '', skipped: 'skipped' };
  // Running renders a spinner ELEMENT, not a character — see the .spin rule for
  // why every glyph candidate misread on a clickable node.
  const SPINNER = '<span class="spin" aria-hidden="true"></span>';
  const STEP_GLYPH = { passed: '✓', running: SPINNER, failed: '✕', pending: '·', skipped: '–' };
  const OP_GLYPH = { pass: '✓', fail: '✕', run: SPINNER, wait: '⏸', note: '↳', pending: '·' };
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const STAGE_TITLE = { uat: 'UAT', review: 'Review', fix: 'Fix', scope: 'Scope', impl: 'Implementation', ship: 'Ship', done: 'Done' };

  // The last snapshot the host pushed, and which stage the user is looking at.
  // Selection is LOCAL: it is not in DashboardState and is never posted back.
  // pushState fires on every driver progress tick, so anything that routed
  // selection through the host would snap the panel back mid-run.
  let lastState = null;
  let selectedStage = null;
  // Whether the optional fix loop is expanded. Local view state like the
  // selection — never in DashboardState, so a host push can't reset it.
  let fixExpanded = false;
  // What the user typed into the servers filter. Local for the same reason: a
  // state push lands on every server change, so a filter living in (or absent
  // from) DashboardState would be wiped out mid-typing.
  let srvFilter = '';
  // Ship-in-flight view state. `shipping` is set the instant the user clicks
  // Confirm ship — BEFORE any host round trip — so the click always registers
  // visibly. It stays true (overriding every state push, which still reads the
  // ship stage as "ready") until the ship stage resolves: advanced past ship
  // (success) or landed failed (error). `shipOps` is per-repo/per-step live
  // state the host streams via `ship-progress`, overlaid onto the Inside block;
  // `shipDone` is the brief post-success flash.
  let shipping = false;
  let shipOps = null;
  let shipDone = null;

  // The steps a ship COULD show, in the order they happen. `describe` is
  // omitted unless it's actually touched (a ticket with no agent adapter never
  // fires it, and a permanently-pending row would misreport that).
  const SHIP_STEP_ORDER = ['commit', 'push', 'describe', 'pr', 'merge'];
  const SHIP_BASE_STEPS = ['commit', 'push', 'pr', 'merge'];

  function seedShipOps(worktrees) {
    const map = {};
    for (const w of worktrees || []) map[w.repo] = {};
    return map;
  }

  // Pure: repo list + accumulated per-repo/per-step events → ordered StageOp[].
  // Kept separate from rendering so the shape mirrors `StageOp` exactly and the
  // logic reads the same as the host's `shipInside`/`gateOp` pending rows.
  function flattenShipOps(worktrees, opsByRepo) {
    const out = [];
    for (const w of worktrees || []) {
      const touched = (opsByRepo && opsByRepo[w.repo]) || {};
      const steps = SHIP_STEP_ORDER.filter(
        (s) => SHIP_BASE_STEPS.includes(s) || Object.prototype.hasOwnProperty.call(touched, s),
      );
      // A host-supplied detail (the idempotent-skip / merge-failure notes) must
      // not silently replace the repo name on a multi-repo ship — otherwise two
      // repos' "note" rows read identically with no way to tell them apart.
      const repoTag = worktrees.length > 1 ? w.repoDisplay || w.repo : '';
      for (const step of steps) {
        const row = touched[step];
        const base = (row && row.detail) || w.repoDisplay || w.repo;
        out.push({
          status: row ? row.status : 'pending',
          name: step,
          detail: repoTag && row && row.detail ? `${repoTag}: ${base}` : base,
          duration: '',
        });
      }
    }
    return out;
  }

  // Overlay the live per-step ops onto the ship strip while a ship is in
  // flight and the ship stage is the one selected — every other stage/state
  // reads `state.inside` exactly as the host built it.
  function shippingView(state, sel) {
    if (!shipping || sel !== 'ship' || !state.inside || !state.inside.ship) return state;
    return {
      ...state,
      inside: { ...state.inside, ship: { ...state.inside.ship, ops: flattenShipOps(state.worktrees, shipOps) } },
    };
  }

  // The connector INTO this node: lit once the previous stage passed, accented
  // into a running node, broken (red) into a failed one, dim when unreached.
  function segClass(cell, prev) {
    if (cell.status === 'failed') return 'broken';
    const reached = prev && (prev.status === 'passed' || prev.status === 'skipped');
    if (!reached) return '';
    return cell.status === 'running' ? 'active' : 'lit';
  }

  // "12:04:31 · 42s" — machine truth, so it is rendered in mono. Duration is
  // omitted while a stage is still running (no endedAt yet).
  function timingText(cell) {
    if (!cell.startedAt) return '';
    const started = new Date(cell.startedAt);
    if (Number.isNaN(started.getTime())) return '';
    const stamp = started.toLocaleTimeString();
    if (!cell.endedAt) return stamp;
    const ms = new Date(cell.endedAt).getTime() - started.getTime();
    if (!Number.isFinite(ms) || ms < 0) return stamp;
    return `${stamp} · ${(ms / 1000).toFixed(1)}s`;
  }

  // Under a rail node there is room for one number, not a sentence. The full
  // stamp belongs to the Inside header, which has a line to itself.
  function durationText(cell) {
    if (!cell.startedAt || !cell.endedAt) return '';
    const ms = new Date(cell.endedAt).getTime() - new Date(cell.startedAt).getTime();
    if (!Number.isFinite(ms) || ms < 0) return '';
    if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
    const mins = Math.round(ms / 60000);
    return mins < 60 ? `${mins}m` : `${Math.floor(mins / 60)}h ${mins % 60}m`;
  }

  // The rail: the forward path, then the band carrying fix and impl's approach.
  // Geometry comes from the host (state.rail.geometry) as CSS custom properties,
  // so every attachment point below is a calc() that follows the columns.
  function renderRail(rail, approach, sel, fixExpanded) {
    const g = rail.geometry;
    const nodes = rail.main.map((cell, i) => {
      const cls = STEP_CLASS[cell.status] || '';
      const on = sel === cell.stageKey;
      return `<div class="st ${cls} stg-${esc(cell.stageKey)} ${on ? 'sel' : ''}">`
        + `<div class="seg ${segClass(cell, rail.main[i - 1])}"></div>`
        + `<button class="node" data-stage="${esc(cell.stageKey)}" aria-pressed="${on}"`
        + ` title="${esc(STAGE_TITLE[cell.stageKey] || cell.stageKey)}: ${esc(cell.status)}">`
        + `${STEP_GLYPH[cell.status] || ''}</button>`
        + `<div class="lbl">${esc(cell.stageKey)}</div>`
        + `<div class="meta">${esc(durationText(cell))}</div></div>`;
    }).join('');

    const fixSel = sel === 'fix';
    const fixClass = STEP_CLASS[rail.branch.status] || '';
    const implRunning = rail.main.some((c) => c.stageKey === 'impl' && c.status === 'running');

    // fix is a RETURN CHANNEL reached only on a failed gate, so it stays hidden
    // until the user asks for it — on a ticket that never looped it would just eat
    // the band's height. `armed` (fix running, or a gate sitting failed) forces it
    // open, and so does selecting it: hiding a live loop, or the stage whose Inside
    // strip is showing, would hide the very state the user is looking at.
    // Keep a resolved fix visible after fix→review disarms the loop. Otherwise
    // the branch collapses in the same state push that turns it green, making a
    // successful resolution technically stored but impossible to see.
    const showFix = fixExpanded || rail.armed || rail.branch.status === 'passed' || fixSel;
    // No toggle while armed: there is nothing optional to collapse when the loop is
    // actually running.
    const toggle = rail.armed
      ? ''
      : showFix
        ? `<button class="fixtoggle open" data-fixtoggle aria-expanded="true"`
          + ` title="Hide the optional fix loop">hide fix ⌃</button>`
        : `<button class="fixtoggle" data-fixtoggle aria-expanded="false"`
          + ` title="fix runs only when a uat or review gate fails — show the loop">+ fix ⌄</button>`;
    const branch = showFix
      ? `<div class="drop"></div><div class="ret"></div>`
        + `<div class="retlbl">pass → review</div><div class="faillbl">fail</div>`
        + `<div class="fixnode ${fixClass} stg-fix ${fixSel ? 'sel' : ''}"`
        + ` title="Entered only when the uat or review gate fails; on pass it returns to review.">`
        + `<button class="node" data-stage="fix" aria-pressed="${fixSel}">↺</button>`
        + `<div class="cl"><span class="lbl">fix</span>`
        + `<span class="cap">${esc(rail.cap || 'idle')}</span></div></div>`
      : '';

    el('rail').innerHTML =
      `<div class="track" style="--cols:${g.cols};--impl:${g.impl};--uat:${g.uat};--review:${g.review}">`
      + `<div class="main">${nodes}</div>`
      + `<div class="loop ${rail.armed ? 'armed' : ''} ${showFix ? '' : 'collapsed'}">`
      + `<div class="implstem ${implRunning ? 'on' : ''}"></div>`
      + branch
      + toggle
      + renderApproach(approach, rail)
      + `</div></div>`;
  }

  // The approach driving impl, named on the rail with its declared phases behind
  // a disclosure. The phases are DECLARED, never observed — the footer says so,
  // so the list cannot be read as progress karst is tracking.
  function renderApproach(approach, rail) {
    if (!approach) {
      return `<div class="noapproach branch-slot" title="This ticket has no approach selected.">`
        + `<span class="none">no approach</span></div>`;
    }
    const impl = rail.main.find((c) => c.stageKey === 'impl');
    const cls = impl && (impl.status === 'passed' || impl.status === 'skipped') ? 'done'
      : impl && impl.status === 'running' ? 'active' : '';
    const phases = approach.phases || [];
    const count = phases.length ? `${phases.length} phases` : 'no phases';
    const rows = phases.length
      ? phases.map((p, i) => `<div class="phrow"><span class="pi">${i + 1}</span>`
        + `<span class="pn">${esc(p)}</span></div>`).join('')
      : '';
    const foot = phases.length
      ? 'karst records no per-phase state — the agent runs these inside impl'
      : 'this approach declares no workflow — impl is one undivided stage';
    return `<details class="approach ${cls}">`
      + `<summary class="branch-slot" title="Approach driving impl — ${esc(approach.id)}, ${count}">`
      + `<span class="aid"><span class="nm">${esc(approach.id)}</span>`
      + `<span class="chev">▼</span></span></summary>`
      + `<div class="detail">${rows}<div class="foot">${esc(foot)}</div></div></details>`;
  }

  // What happens inside the selected stage. Three shapes, because a stage has
  // three things it can be: it ran, it is running, or it has not run — and the
  // last shows a blurb, because empty rows would imply karst tried and got
  // nothing back.
  function renderInside(state, sel) {
    const strip = (state.inside || {})[sel];
    if (!strip) { el('inside').innerHTML = ''; return; }

    // "Not the current stage" is only meaningful when there IS one. On a ticket
    // that never started, every stage is equally uncurrent and the bar would be
    // noise offering a way back to nowhere.
    const viewing = state.stageCurrent && sel !== state.stageCurrent;
    const back = viewing ? STAGE_TITLE[state.stageCurrent] || state.stageCurrent : '';
    const vbar = viewing
      ? `<div class="vbar"><span>Viewing ${esc(strip.title)} — not the current stage.</span>`
        + `<span class="sp"><button class="ghost" data-back>Back to ${esc(back)}</button></span></div>`
      : '';

    const body = strip.ops.length
      ? `<div class="ops">${strip.ops.map((o) => `<div class="op ${esc(o.status)}">`
        + `<span class="oglyph">${OP_GLYPH[o.status] || '·'}</span>`
        + `<span class="oname">${esc(o.name)}</span>`
        + `<span class="ocmd">${esc(o.detail)}</span>`
        + `<span class="odur">${esc(o.duration)}</span></div>`).join('')}</div>`
      : `<div class="blurb">${esc(strip.blurb)}</div>`;

    el('inside').innerHTML = `<div class="act ${viewing ? 'viewing' : ''}">${vbar}`
      + `<div class="ahead"><span class="adot ${esc(strip.dot)}"></span>`
      + `<span class="aname">Inside ${esc(strip.title.toLowerCase())}</span>`
      + `<span class="aclock">${esc(strip.clock)}</span></div>${body}</div>`;
  }

  // The fault card: the reason a red node is red, the log behind it, and when it
  // ran. Shown only for a failed stage — everything else stays quiet.
  function renderFault(stepper) {
    const box = el('fault');
    const failed = (stepper || []).find((s) => s.status === 'failed');
    box.classList.toggle('hidden', !failed);
    if (!failed) { box.innerHTML = ''; return; }
    const title = `${STAGE_TITLE[failed.stageKey] || failed.stageKey} failed`;
    const timing = timingText(failed);
    const attempt = failed.attempt ? ` · attempt ${esc(failed.attempt)}` : '';
    box.innerHTML = `<div class="ftitle">${esc(title)}</div>`
      + `<div class="freason">${esc(failed.reason || 'No reason recorded.')}</div>`
      + (timing ? `<div class="fmeta">${esc(timing)}${attempt}</div>` : '')
      + (failed.artifactPath
        ? `<div class="facts"><button data-act="open-stage-log" data-path="${esc(failed.artifactPath)}">Open log</button></div>`
        : '');
  }

  // One sentence + at most one button. The copy is built host-side (model/nowLine)
  // and shipped in the state, so it is unit-tested and lives in exactly one place.
  // `session` and `resume` both route to resume-ticket: the host's openSession
  // resolves --resume vs. a fresh (self-scoping) launch on its own, so the verb
  // is a label concern only — the button always reaches the one entry point.
  const NOW_MESSAGE = { 'open-log': 'open-stage-log', ship: 'ship-ticket', resume: 'resume-ticket', session: 'resume-ticket' };

  function renderNow(now) {
    // While a ship is in flight, the real per-step progress lives in the Inside
    // block; this line is a static sentence, never a spinner label — and no
    // button, since the confirm click already happened (no second one to make).
    if (shipping) {
      el('now').innerHTML = `<span class="ntext">${esc('Now: shipping — committing, pushing, and opening PRs for each hot repo.')}</span>`;
      return;
    }
    const line = now || { text: '' };
    const a = line.action;
    const type = a && NOW_MESSAGE[a.kind];
    const attrs = a && a.path ? ` data-path="${esc(a.path)}"` : '';
    // A brief success flash beside the settled line once a ship resolves — the
    // clear "it worked" beat before the dashboard shows the done state.
    const badge = shipDone === 'success' ? `<span class="shipbadge ok">✓ Shipped</span>` : '';
    const sub = a && a.kind === 'session' && a.detail
      ? `<div class="now-sub">${esc(a.detail)}</div>`
      : '';
    el('now').innerHTML = badge + `<span class="ntext">${esc(line.text)}</span>`
      + (type ? `<button data-act="${type}"${attrs}>${esc(a.label)}</button>` : '')
      + sub;
  }

  // Decide whether an incoming snapshot ends the in-flight ship. Keyed off host
  // truth (the ship stage's own status), never the copy: while shipping the
  // stage sits at `running`, so every push would otherwise rebuild the plain
  // "Confirm ship" line and wipe the spinner. Success = advanced past ship;
  // error = ship landed failed (the Now line + fault card then explain it).
  function resolveShipping(state) {
    if (!shipping) return;
    const atShip = state.stageCurrent === 'ship';
    const failed = atShip && state.currentStage && state.currentStage.status === 'failed';
    if (failed) {
      shipping = false; // the failed Now line + fault card are the explicit error state
      shipOps = null;
    } else if (!atShip) {
      shipping = false;
      shipOps = null;
      shipDone = 'success';
      setTimeout(() => { shipDone = null; render(lastState); }, 2400);
    }
    // else still at ship (running) → hold the spinner across this push
  }

  // ---------------------------------------------------------------------
  // Servers panel
  // ---------------------------------------------------------------------
  const isOnline = (s) => s.status === 'running';
  const addrOf = (s) => `${s.host || 'localhost'}:${s.port}`;

  const svgIcon = (name) => (
    `<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`
  );

  /**
   * An icon action. The visible label IS the icon, so the word survives as both
   * aria-label (screen readers) and title (hover) — nothing is conveyed by shape
   * alone. A disabled button keeps a title saying WHY: a greyed icon with no
   * explanation is a dead end the user cannot tell from a broken one.
   */
  const iact = (action, id, label, name, disabledWhy) => (
    `<button class="ib t-${name}" data-act="${action}"`
    + `${id != null ? ` data-id="${id}"` : ''}`
    + `${name === 'copy' ? ' data-copy' : ''}`
    + `${disabledWhy ? ' disabled' : ''}`
    + ` aria-label="${esc(label)}" title="${esc(disabledWhy || label)}">`
    + `${svgIcon(name)}</button>`
  );

  // Row actions come in two groups: Open and Copy operate on the ADDRESS and sit
  // flush against it; Restart and Stop operate on the PROCESS.
  const addrActions = (s) => (
    isOnline(s)
      ? iact('open-server', s.id, 'Open in browser', 'open')
        + iact('copy-server-url', s.id, 'Copy URL', 'copy')
      : ''
  );

  // An offline row is retained, not deleted, so it can be started again. Open,
  // Copy and Stop are all meaningless on it.
  const lifeActions = (s) => (
    isOnline(s)
      ? iact('restart-server', s.id, 'Restart', 'restart')
        + iact('stop-server', s.id, 'Stop', 'stop')
      : iact('spin-servers', null, 'Start service', 'start')
  );

  /**
   * Whole-ticket controls, rendered into the panel HEADER. They act on every
   * service, so they must survive the states where the body has no rows — the
   * empty body is exactly when Start matters most. Each disables itself when it
   * would be a no-op and explains that in its title.
   *
   * Start and Restart post different actions but the host binds both to a
   * re-spin (a spin already stops everything first); they stay distinct by
   * AVAILABILITY, which is what this function computes.
   */
  function panelOps(state) {
    // Nothing in scope can ever run: these would be permanent dead affordances,
    // so they are absent rather than disabled.
    if (state.hasRunnableRepos === false) return '';
    const list = state.servers;
    const none = list.length === 0;
    const anyOffline = list.some((s) => !isOnline(s));
    const anyRunning = list.some(isOnline);
    const startWhy = !none && !anyOffline ? 'Every service is already running' : null;
    const restartWhy = none ? 'No services to restart' : null;
    const stopWhy = !anyRunning ? 'No service is running' : null;
    return iact('spin-servers', null, 'Start all services', 'start', startWhy)
      + iact('restart-servers', null, 'Restart all services', 'restart', restartWhy)
      + iact('stop-servers', null, 'Stop all services', 'stop', stopWhy);
  }

  /**
   * The two empty states stay distinct, and the distinction is the point: one is
   * a PROMPT (nothing is running — the header's Start fixes that), the other a
   * STATEMENT of fact (nothing here can run, and the header controls are gone
   * with it). Neither carries a button; the action lives in the header.
   */
  function serversEmpty(state) {
    if (state.hasRunnableRepos === false) {
      return `<div class="estate dead"><span class="emark">${svgIcon('ban')}</span>`
        + `<div><div class="ehead">No runnable services in scope</div>`
        + `<div class="esub">This ticket scopes only repositories without a service`
        + ` block, so there is nothing here to run.</div></div></div>`;
    }
    return `<div class="estate"><span class="emark">${svgIcon('rack')}</span>`
      + `<div><div class="ehead">No servers running</div>`
      + `<div class="esub">Start the services in scope to get their local`
      + ` addresses here.</div></div></div>`;
  }

  function serverRow(s) {
    const on = isOnline(s);
    const status = on ? 'running' : 'offline';
    // role=img + aria-label is what keeps a bare dot from being invisible to a
    // screen reader now that the word is gone; title gives the pointer the same
    // word. Never colour alone: filled disc vs hollow ring still differ, and an
    // offline row reads "—" where an address would be.
    const dot = `<span class="glyph ${on ? 'on' : 'off'}" role="img"`
      + ` aria-label="${status}" title="${status}"></span>`;
    const addr = on
      ? `<span class="full">${esc(addrOf(s))}</span><span class="short">:${esc(s.port)}</span>`
      : '—';
    return `<tr><td class="c-dot">${dot}</td>`
      + `<td class="c-name" title="${esc(s.service)}">${esc(s.service)}</td>`
      + `<td class="c-addr${on ? '' : ' off'}"`
      + ` title="${on ? esc(addrOf(s)) : 'offline — no address'}">${addr}</td>`
      + `<td class="c-addrops"><span class="g">${addrActions(s)}</span></td>`
      + `<td class="c-acts"><span class="g">${lifeActions(s)}</span></td></tr>`;
  }

  function renderServers(state) {
    const servers = state.servers;
    el('srvCount').textContent = servers.length ? `${servers.length}` : '';
    el('srvOps').innerHTML = panelOps(state);
    if (!servers.length) {
      el('servers').innerHTML = serversEmpty(state);
      return;
    }
    // The filter earns its row only once scanning is actually hard.
    const needle = srvFilter.trim().toLowerCase();
    const filterable = servers.length > 6;
    const bar = filterable
      ? `<div class="filter"><label class="sr" for="srvFilter">Filter services</label>`
        + `<input id="srvFilter" type="search" placeholder="Filter ${servers.length} services…"`
        + ` value="${esc(srvFilter)}" data-filter></div>`
      : '';
    const shown = filterable && needle
      ? servers.filter((s) => s.service.toLowerCase().includes(needle))
      : servers;
    const rows = shown.map(serverRow).join('')
      || `<tr><td colspan="5"><div class="nomatch">No service matches`
        + ` “${esc(srvFilter)}”.</div></td></tr>`;
    // The address-ops column sits UNDER the Address header (colspan 2): Open and
    // Copy are part of the address, so the header says so.
    el('servers').innerHTML = `${bar}<div class="scroll"><table>`
      + `<thead><tr><th scope="col"><span class="sr">Status</span></th>`
      + `<th scope="col">Service</th><th scope="col" colspan="2">Address</th>`
      + `<th scope="col" style="text-align:right">Actions</th></tr></thead>`
      + `<tbody>${rows}</tbody></table></div>`;
  }

  function renderWorktrees(wts) {
    el('wtCount').textContent = wts.length ? `${wts.length}` : '';
    el('worktrees').innerHTML = wts.length ? wts.map((w) => (
      `<div class="wt"><span class="wrepo">${esc(w.repoDisplay || w.repo)}</span>`
      + `<span class="wbr">${esc(w.branch || '')}</span>`
      + `<span class="wacts">`
      + `<button data-act="diff-worktree" data-path="${esc(w.path)}">Diff</button>`
      + `<button data-act="open-worktree-folder" data-path="${esc(w.path)}">Open folder</button>`
      + `</span></div>`
    )).join('') : '<div class="empty">No worktrees.</div>';
  }

  function renderPrs(prs) {
    el('prCount').textContent = prs.length ? `${prs.length}` : '';
    el('prs').innerHTML = prs.length ? prs.map((p) => (
      `<div class="pr"><span class="pst pst-${esc(p.status || 'unknown')}">${esc(p.status || '')}</span>`
      + `<span class="prepo">${esc(p.repo)}</span>`
      + `<span class="ptitle">${esc(p.url || '')}</span>`
      + `<span class="pnum">#${esc(p.number)}</span>`
      + `<span class="pacts"><button data-act="open-pr" data-url="${esc(p.url)}">Open</button></span></div>`
    )).join('') : '<div class="empty">No pull requests.</div>';
  }

  // agent state -> pill color (uses the same chart vars as the stepper).
  const AGENT_COLOR = {
    running: 'var(--st-running)',
    waiting: 'var(--st-input)',
    idle: 'var(--st-pending)',
    none: 'var(--st-pending)',
  };

  function renderAgent(agentState) {
    const st = agentState || 'none';
    const color = AGENT_COLOR[st] || 'var(--st-pending)';
    el('agent').innerHTML =
      `<span class="agent-pill"><span class="dot" style="background:${color}"></span>`
      + `agent: ${esc(st)}</span>`;
  }

  // The key pill, which doubles as the link to the source board (ClickUp, …)
  // when the ticket was fetched from one: provider mark + key + arrow, one
  // target. The board ref and the synthesized brief ride along as the hover —
  // printing the ref beside the key only echoed it (they name the same id).
  // Manual/unfetched → the same pill, dashed and inert.
  function renderKeyPill(state) {
    const label = state.key || `#${state.ticketId}`;
    if (!state.ticketUrl) {
      el('keyPill').innerHTML =
        `<span class="keypill local" title="Manual ticket — not linked to a board.">${esc(label)}</span>`;
      return;
    }
    const icon = providerIconHtml(state.provider);
    // Drop the ref when it IS the key (a fetched ticket usually keys on it) —
    // the tooltip would just repeat the pill.
    const ref = state.sourceRef === label ? null : state.sourceRef;
    const hover = [ref, state.brief].filter(Boolean).join(' — ');
    const tip = hover ? ` title="${esc(hover)}"` : '';
    el('keyPill').innerHTML =
      `<a class="keypill" href="#" data-act="open-ticket-link" data-url="${esc(state.ticketUrl)}"${tip}>`
      + `${icon}${esc(label)} <span class="arw" aria-hidden="true">↗</span></a>`;
  }

  function render(state) {
    lastState = state;
    // Selection defaults to the current stage; with none (nothing has run) it
    // falls back to scope — the one the user is about to start.
    const sel = selectedStage || state.stageCurrent || 'scope';
    el('title').textContent = state.title || '(untitled)';
    renderKeyPill(state);
    renderAgent(state.agentState);
    renderRail(state.rail, state.approach, sel, fixExpanded);
    renderInside(shippingView(state, sel), sel);
    // The fault card scans the FLAT stepper, so it still sees fix.
    renderFault(state.stepper);
    renderNow(state.now);
    renderServers(state);
    renderWorktrees(state.worktrees);
    renderPrs(state.prs);
  }

  // Selection is view state: persisted BESIDE the host's snapshot, never inside
  // it. Inside `state` it would be dropped by the next push (the host builds
  // that from the DB) and would put a webview concern in a host-owned type.
  const persist = () => vscode.setState({ state: lastState, sel: selectedStage, fixExpanded, srvFilter: srvFilter });

  function select(stage) {
    selectedStage = stage;
    render(lastState);
    persist();
  }

  function toggleFix() {
    fixExpanded = !fixExpanded;
    render(lastState);
    persist();
  }

  el('editBtn').addEventListener('click', () => post({ type: 'edit-ticket' }));

  // Filtering is local and never round-trips to the host. Re-rendering replaces
  // the input element, so focus and caret are restored explicitly — otherwise
  // the field loses focus after the first keystroke and typing stops dead.
  el('servers').addEventListener('input', (e) => {
    const box = e.target.closest('[data-filter]');
    if (!box) return;
    srvFilter = box.value;
    const caret = box.selectionStart;
    render(lastState);
    const next = el('servers').querySelector('[data-filter]');
    if (next) {
      next.focus();
      try { next.setSelectionRange(caret, caret); } catch { /* type=search may refuse */ }
    }
    persist();
  });

  // Clicking a stage re-points the strip. Purely local — no host round trip, so
  // it stays instant and survives every state push.
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-fixtoggle]')) { toggleFix(); return; }
    const node = e.target.closest('[data-stage]');
    if (node) { select(node.dataset.stage); return; }
    if (e.target.closest('[data-back]')) select(null);
  });

  // Optimistic feedback for the copy button — the host does the actual clipboard
  // write; the webview just confirms it so the click feels responsive.
  function flashCopied(btn) {
    // An icon button has no text to swap, so the GLYPH is what flashes — and the
    // confirmation moves onto aria-label too, so it is not a purely visual beat
    // for anyone reading the button by name.
    if (btn.classList.contains('ib')) {
      const prevHtml = btn.innerHTML;
      const prevLabel = btn.getAttribute('aria-label');
      btn.innerHTML = svgIcon('check');
      btn.setAttribute('aria-label', 'Copied');
      btn.classList.add('ok');
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = prevHtml;
        btn.setAttribute('aria-label', prevLabel);
        btn.classList.remove('ok');
        btn.disabled = false;
      }, 1200);
      return;
    }
    const prev = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 1200);
  }

  // Delegate clicks (buttons + the ticket-link anchor) → action messages
  // (messages.ts routeAction). A no-payload action (e.g. spin-servers) posts
  // just its type.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    e.preventDefault();
    const act = btn.dataset.act;
    // Confirm ship kicks off slow backend work (model call + gh pr create). Guard
    // against double-submit and show that the click registered BEFORE the host is
    // even asked — no window where the button looks inert with work underway.
    if (act === 'ship-ticket') {
      if (shipping) return;
      shipping = true;
      shipDone = null;
      shipOps = seedShipOps(lastState ? lastState.worktrees : []);
      render(lastState);
    }
    if (btn.dataset.id) post({ type: act, serverId: Number(btn.dataset.id) });
    else if (btn.dataset.path) post({ type: act, path: btn.dataset.path });
    else if (btn.dataset.url) post({ type: act, url: btn.dataset.url });
    else post({ type: act });
    if (btn.hasAttribute('data-copy')) flashCopied(btn);
  });

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg) return;
    // Live per-repo/per-step ship progress. Ignored unless a ship is in flight
    // (a stale message can't resurrect a stale overlay).
    if (msg.type === 'ship-progress') {
      if (shipping && msg.event && msg.event.repo) {
        const e = msg.event;
        if (!shipOps) shipOps = {};
        if (!shipOps[e.repo]) shipOps[e.repo] = {};
        shipOps[e.repo][e.step] = { status: e.status, detail: e.detail };
        render(lastState);
      }
      return;
    }
    if (msg.type === 'state') {
      // Resolve an in-flight ship FIRST, so render() draws either the held
      // spinner or the settled line — never a flash of the stale "Confirm ship".
      resolveShipping(msg.state);
      // Never touches selectedStage, so a full re-render preserves the user's
      // selection for free — including during a run, when pushes are frequent.
      render(msg.state);
      persist(); // survive reload (retainContextWhenHidden)
    }
  });

  // Restore last state on reload before the host re-pushes. Tolerates the
  // pre-envelope shape a panel open across an upgrade may have persisted.
  const prev = vscode.getState();
  const restored = prev && prev.state ? prev : prev ? { state: prev, sel: null } : null;
  if (restored && restored.state) {
    selectedStage = restored.sel || null;
    fixExpanded = restored.fixExpanded || false;
    srvFilter = restored.srvFilter || '';
    render(restored.state);
  }
</script>

<style>/*KARST_PALETTE*/</style>
