<div class="dhead">
  <span id="keyPill"></span>
  <h1 id="title"></h1>
  <span class="agent" id="agent"></span>
  <button id="bindBtn" type="button" class="k-btn k-btn--ghost k-btn--sm bindtoggle" data-act="toggle-bind" aria-pressed="false"
    title="Bind is off — this dashboard and the agent terminal move independently"><span class="dot" aria-hidden="true"></span>Bind terminal</button>
  <button id="followUpBtn" type="button" class="hidden k-btn k-btn--secondary k-btn--sm" data-act="create-follow-up-ticket" title="Create a new ticket linked to this one, pre-filled with its repos/approach/agent">Create follow-up</button>
  <button id="editBtn" type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="edit-ticket" title="Edit this ticket's title, description, and scope">Edit</button>
</div>

<div class="stepper">
  <!-- The main rail + the fix return channel + impl's approach chip. -->
  <div class="railwrap" id="rail"></div>
  <!-- What happens inside the SELECTED stage (defaults to the current one). -->
  <div id="inside"></div>
  <!-- Inline fault card for a failed stage: reason + timings + [Open log]. -->
  <div class="fault hidden" id="fault"></div>
  <!-- What is happening and what the user can do next (state.now). -->
  <div class="now" id="now"></div></div>

<div class="grid">
  <div class="panel svpanel"><div class="phead">Servers<span class="count" id="srvCount"></span><span class="pops" id="srvOps"></span></div><div class="pbody" id="servers"></div></div>
  <!-- The count is a direct child of .phead, like every other panel's: nested in
       a wrapper its `margin-left:auto` had nothing to push against, so it read
       as "Worktrees2" and the button sat wherever the text ended. -->
  <div class="panel"><div class="phead">Worktrees<span class="count" id="wtCount"></span><button id="wtChanges" class="k-iconbtn iconbtn" data-act="show-changes" type="button"
    aria-label="Show ticket changes" title="Show ticket changes"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false"><use href="#i-diff"/></svg></button></div><div class="pbody" id="worktrees"></div></div>
  <div class="panel span"><div class="phead">Pull requests<span class="count" id="prCount"></span><button id="prRefresh" class="k-iconbtn iconbtn" data-act="refresh-prs" type="button"
    aria-label="Re-check pull request status and mergeability now" title="Re-check pull request status and mergeability now">
    <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 3a5 5 0 1 0 4.546 2.914l1.09-.508A6.2 6.2 0 1 1 8 1.8V0l3 2.4-3 2.4V3Z"/></svg>
  </button></div><div class="pbody" id="prs"></div></div>
</div>

<script>
  /*KARST_DS_JS*/

  // Shared ticketing-provider identity (icon + brand) — single source in
  // src/model/providerIdentity.ts, injected here at load (CSP forbids a
  // shared script). Defines PROVIDER_LABELS, CLICKUP_SVG, providerBadgeHtml.
  /*KARST_PROVIDER_JS*/

  const vscode = acquireVsCodeApi();
  const post = (msg) => vscode.postMessage(msg);

  // Stage status -> rail CSS class. Amber/needs-you is an agent-level signal
  // (glyphFor precedence); the rail shows stage status only.
  const STEP_CLASS = { passed: 'done', running: 'running', failed: 'failed', pending: '', skipped: 'skipped' };
  // Running renders a spinner ELEMENT, not a character — see the .spin rule for
  // why every glyph candidate misread on a clickable node.
  const SPINNER = '<span class="spin" aria-hidden="true"></span>';
  const STEP_GLYPH = { passed: '✓', running: SPINNER, failed: '✕', pending: '·', skipped: '–' };
  const OP_GLYPH = { pass: '✓', fail: '✕', run: SPINNER, wait: '⏸', note: '↳', pending: '·' };
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const STAGE_TITLE = { uat: 'UAT', review: 'Review', fix: 'Fix', scope: 'Scope', impl: 'Implementation', ship: 'Ship', merge: 'Merge', done: 'Done' };

  // The last snapshot the host pushed, and which stage the user is looking at.
  // Selection is LOCAL: it is not in DashboardState and is never posted back.
  // pushState fires on every driver progress tick, so anything that routed
  // selection through the host would snap the panel back mid-run.
  let lastState = null;
  let selectedStage = null;
  // Whether the optional fix loop is expanded. Local view state like the
  // selection — never in DashboardState, so a host push can't reset it.
  let fixExpanded = false;
  // What the user typed into the servers filter. Local for the same reason: a
  // state push lands on every server change, so a filter living in (or absent
  // from) DashboardState would be wiped out mid-typing.
  let srvFilter = '';
  // Live Git totals are supplemental filesystem facts. They stay beside the
  // host's store snapshot and are cleared whenever a newer snapshot arrives.
  let worktreeStats = {};
  // Ship-in-flight view state. `shipping` is set the instant the user clicks
  // Confirm ship — BEFORE any host round trip — so the click always registers
  // visibly. It stays true (overriding every state push, which still reads the
  // ship stage as "ready") until the ship stage resolves: advanced past ship
  // (success) or landed failed (error). `shipOps` is per-repo/per-step live
  // state the host streams via `ship-progress`, overlaid onto the Inside block;
  // `shipDone` is the brief post-success flash.
  //
  // `shipRequestId` / `mergeRequests` / `prRefreshId` below are the runtime's
  // pending bookkeeping (karstBeginPending/karstSettle) for these same three
  // controls. They are tracked SEPARATELY from `shipping`/`openMergeRepos`'s
  // fellow view-state because ship/merge/refresh-prs are the one place this
  // file's full-innerHTML re-render (§ render()) collides with the runtime's
  // element-keyed pending map: a `state` push mid-ship replaces the "Confirm
  // ship" button with a brand-new DOM node, so a pending flag living only on
  // the OLD (now detached) element would vanish from the redraw even though
  // the request is still outstanding. Keeping the requestId here — consulted
  // by the render functions below — is what survives that replacement; the
  // runtime is still what emits the toast and the `aria-busy`/`disabled` pair
  // on whichever element is live when a request begins or ends.
  let shipping = false;
  let shipOps = null;
  let shipDone = null;
  let shipRequestId = null;
  // Per-repo merge-in-flight request ids, keyed by repo path. NOT persisted: a
  // merge is a one-shot host round trip, and an id restored from a reload
  // would claim a merge is underway that nobody is running. Cleared on every
  // state push — extension.ts's mergePr always refreshes in a `finally`
  // (success, refusal, cancel, or throw), so a push is guaranteed to arrive
  // and end the pending state; it is never left to a watchdog alone.
  let mergeRequests = {};
  // Which merge-check disclosures (`.mgd`) are open, keyed by repo. Local view
  // state, exactly like `selectedStage`: render() replaces #prs wholesale on
  // every `state` push AND every ship-progress tick, so a disclosure that is
  // open only in the DOM — and the reader's scroll position inside it — would
  // snap shut on the very next one. Never in DashboardState, never
  // round-tripped through the host; only the `toggle` listener below mutates
  // it, and render() itself must never reset it.
  let openMergeRepos = new Set();
  // A user-requested PR re-probe is in flight. Set on the click, BEFORE the host
  // round trip, because that probe runs `gh` and a `git fetch` per repo — seconds
  // in which a button with no busy state looks inert and gets pressed again.
  // Cleared by the next state push (the host always sends one when the refresh
  // settles, including when nothing moved), so it can never stick.
  let prRefreshId = null;
  // The window's terminal binding. UNLIKE the view state above, this is NOT a
  // webview concern: it is one host-owned preference shared by every open
  // dashboard, so it is never persisted here — a stored copy could only go
  // stale against another panel's toggle. The host pushes it on every open.
  let bindEnabled = false;

  // The steps a ship COULD show, in the order they happen. `describe` is
  // omitted unless it's actually touched (a ticket with no agent adapter never
  // fires it, and a permanently-pending row would misreport that).
  const SHIP_STEP_ORDER = ['commit', 'push', 'describe', 'pr', 'merge'];
  const SHIP_BASE_STEPS = ['commit', 'push', 'pr', 'merge'];

  function seedShipOps(worktrees) {
    const map = {};
    for (const w of worktrees || []) map[w.repo] = {};
    return map;
  }

  // Pure: repo list + accumulated per-repo/per-step events → ordered StageOp[].
  // Kept separate from rendering so the shape mirrors `StageOp` exactly and the
  // logic reads the same as the host's `shipInside`/`gateOp` pending rows.
  function flattenShipOps(worktrees, opsByRepo) {
    const out = [];
    for (const w of worktrees || []) {
      const touched = (opsByRepo && opsByRepo[w.repo]) || {};
      const steps = SHIP_STEP_ORDER.filter(
        (s) => SHIP_BASE_STEPS.includes(s) || Object.prototype.hasOwnProperty.call(touched, s),
      );
      // A host-supplied detail (the idempotent-skip / merge-failure notes) must
      // not silently replace the repo name on a multi-repo ship — otherwise two
      // repos' "note" rows read identically with no way to tell them apart.
      const repoTag = worktrees.length > 1 ? w.repoDisplay || w.repo : '';
      for (const step of steps) {
        const row = touched[step];
        const base = (row && row.detail) || w.repoDisplay || w.repo;
        out.push({
          status: row ? row.status : 'pending',
          name: step,
          detail: repoTag && row && row.detail ? `${repoTag}: ${base}` : base,
          duration: '',
        });
      }
    }
    return out;
  }

  // Overlay the live per-step ops onto the ship strip while a ship is in
  // flight and the ship stage is the one selected — every other stage/state
  // reads `state.inside` exactly as the host built it.
  function shippingView(state, sel) {
    if (!shipping || sel !== 'ship' || !state.inside || !state.inside.ship) return state;
    return {
      ...state,
      inside: { ...state.inside, ship: { ...state.inside.ship, ops: flattenShipOps(state.worktrees, shipOps) } },
    };
  }

  // The connector INTO this node: lit once the previous stage passed, accented
  // into a running node, broken (red) into a failed one, dim when unreached.
  function segClass(cell, prev) {
    if (cell.status === 'failed') return 'broken';
    const reached = prev && (prev.status === 'passed' || prev.status === 'skipped');
    if (!reached) return '';
    return cell.status === 'running' ? 'active' : 'lit';
  }

  // "12:04:31 · 42s" — machine truth, so it is rendered in mono. Duration is
  // omitted while a stage is still running (no endedAt yet).
  function timingText(cell) {
    if (!cell.startedAt) return '';
    const started = new Date(cell.startedAt);
    if (Number.isNaN(started.getTime())) return '';
    const stamp = started.toLocaleTimeString();
    if (!cell.endedAt) return stamp;
    const ms = new Date(cell.endedAt).getTime() - started.getTime();
    if (!Number.isFinite(ms) || ms < 0) return stamp;
    return `${stamp} · ${(ms / 1000).toFixed(1)}s`;
  }

  // Under a rail node there is room for one number, not a sentence. The full
  // stamp belongs to the Inside header, which has a line to itself.
  function durationText(cell) {
    if (!cell.startedAt || !cell.endedAt) return '';
    const ms = new Date(cell.endedAt).getTime() - new Date(cell.startedAt).getTime();
    if (!Number.isFinite(ms) || ms < 0) return '';
    if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
    const mins = Math.round(ms / 60000);
    return mins < 60 ? `${mins}m` : `${Math.floor(mins / 60)}h ${mins % 60}m`;
  }

  // The rail: the forward path, then the band carrying fix and impl's approach.
  // Geometry comes from the host (state.rail.geometry) as CSS custom properties,
  // so every attachment point below is a calc() that follows the columns.
  function renderRail(rail, approach, sel, fixExpanded) {
    const g = rail.geometry;
    const nodes = rail.main.map((cell, i) => {
      const cls = STEP_CLASS[cell.status] || '';
      const on = sel === cell.stageKey;
      // Icon-only (a glyph or a spinner, never text) — aria-label AND title
      // carry the SAME string (UI-R21/R24): the stage name plus its status,
      // since colour/shape alone would leave a screen-reader user with no
      // account of which stage this node is.
      const nodeName = `${esc(STAGE_TITLE[cell.stageKey] || cell.stageKey)}: ${esc(cell.status)}`;
      return `<div class="st ${cls} stg-${esc(cell.stageKey)} ${on ? 'sel' : ''}">`
        + `<div class="seg ${segClass(cell, rail.main[i - 1])}"></div>`
        + `<button type="button" class="node" data-stage="${esc(cell.stageKey)}" aria-pressed="${on}"`
        + ` aria-label="${nodeName}" title="${nodeName}">`
        + `${STEP_GLYPH[cell.status] || ''}</button>`
        + `<div class="lbl">${esc(cell.stageKey)}</div>`
        + `<div class="meta">${esc(durationText(cell))}</div></div>`;
    }).join('');

    const fixSel = sel === 'fix';
    const fixClass = STEP_CLASS[rail.branch.status] || '';
    const implRunning = rail.main.some((c) => c.stageKey === 'impl' && c.status === 'running');

    // fix is a RETURN CHANNEL reached only on a failed gate, so it stays hidden
    // until the user asks for it — on a ticket that never looped it would just eat
    // the band's height. `armed` (fix running, or a gate sitting failed) forces it
    // open, and so does selecting it: hiding a live loop, or the stage whose Inside
    // strip is showing, would hide the very state the user is looking at.
    // Keep a resolved fix visible after fix→review disarms the loop. Otherwise
    // the branch collapses in the same state push that turns it green, making a
    // successful resolution technically stored but impossible to see.
    const showFix = fixExpanded || rail.armed || rail.branch.status === 'passed' || fixSel;
    // No toggle while armed: there is nothing optional to collapse when the loop is
    // actually running.
    const toggle = rail.armed
      ? ''
      : showFix
        ? `<button type="button" class="k-chip fixtoggle open" data-fixtoggle aria-expanded="true"`
          + ` title="Hide the optional fix loop">hide fix ⌃</button>`
        : `<button type="button" class="k-chip fixtoggle" data-fixtoggle aria-expanded="false"`
          + ` title="fix runs only when a uat or review gate fails — show the loop">+ fix ⌄</button>`;
    // The fix node is icon-only (↺) — aria-label AND title carry the same
    // string (UI-R21/R24); the ancestor's own title (below) explains the loop
    // as a whole, which is not part of THIS button's accessible name.
    const fixNodeName = fixSel ? 'Fix stage, selected' : 'View fix stage';
    const branch = showFix
      ? `<div class="drop"></div><div class="ret"></div>`
        + `<div class="retlbl">pass → review</div><div class="faillbl">fail</div>`
        + `<div class="fixnode ${fixClass} stg-fix ${fixSel ? 'sel' : ''}"`
        + ` title="Entered only when the uat or review gate fails; on pass it returns to review">`
        + `<button type="button" class="node" data-stage="fix" aria-pressed="${fixSel}"`
        + ` aria-label="${fixNodeName}" title="${fixNodeName}">↺</button>`
        + `<div class="cl"><span class="lbl">fix</span>`
        + `<span class="cap">${esc(rail.cap || 'idle')}</span></div></div>`
      : '';

    el('rail').innerHTML =
      `<div class="track" style="--cols:${g.cols};--impl:${g.impl};--uat:${g.uat};--review:${g.review}">`
      + `<div class="main">${nodes}</div>`
      + `<div class="loop ${rail.armed ? 'armed' : ''} ${showFix ? '' : 'collapsed'}">`
      + `<div class="implstem ${implRunning ? 'on' : ''}"></div>`
      + branch
      + toggle
      + renderApproach(approach, rail)
      + `</div></div>`;
  }

  // The approach driving impl, named on the rail with its declared phases behind
  // a disclosure. The phases are DECLARED, never observed — the footer says so,
  // so the list cannot be read as progress karst is tracking.
  function renderApproach(approach, rail) {
    if (!approach) {
      return `<div class="noapproach branch-slot" title="This ticket has no approach selected">`
        + `<span class="k-chip none">no approach</span></div>`;
    }
    const impl = rail.main.find((c) => c.stageKey === 'impl');
    const cls = impl && (impl.status === 'passed' || impl.status === 'skipped') ? 'done'
      : impl && impl.status === 'running' ? 'active' : '';
    const phases = approach.phases || [];
    const count = phases.length ? `${phases.length} phases` : 'no phases';
    const rows = phases.length
      ? phases.map((p, i) => `<div class="phrow"><span class="pi">${i + 1}</span>`
        + `<span class="pn">${esc(p)}</span></div>`).join('')
      : '';
    const foot = phases.length
      ? 'karst records no per-phase state — the agent runs these inside impl'
      : 'this approach declares no workflow — impl is one undivided stage';
    return `<details class="approach ${cls}">`
      + `<summary class="branch-slot" title="Approach driving impl — ${esc(approach.id)}, ${count}">`
      + `<span class="k-chip aid"><span class="nm">${esc(approach.id)}</span>`
      + `<span class="chev">▼</span></span></summary>`
      + `<div class="detail">${rows}<div class="foot">${esc(foot)}</div></div></details>`;
  }

  // What happens inside the selected stage. Three shapes, because a stage has
  // three things it can be: it ran, it is running, or it has not run — and the
  // last shows a blurb, because empty rows would imply karst tried and got
  // nothing back.
  function renderInside(state, sel) {
    const strip = (state.inside || {})[sel];
    if (!strip) { el('inside').innerHTML = ''; return; }

    // "Not the current stage" is only meaningful when there IS one. On a ticket
    // that never started, every stage is equally uncurrent and the bar would be
    // noise offering a way back to nowhere.
    const viewing = state.stageCurrent && sel !== state.stageCurrent;
    const back = viewing ? STAGE_TITLE[state.stageCurrent] || state.stageCurrent : '';
    const vbar = viewing
      ? `<div class="vbar"><span>Viewing ${esc(strip.title)} — not the current stage.</span>`
        + `<span class="sp"><button type="button" class="k-btn k-btn--ghost k-btn--sm" data-back`
        + ` title="Return the strip to the stage the ticket is actually on">Back to ${esc(back)}</button></span></div>`
      : '';

    const body = strip.ops.length
      ? `<div class="ops">${strip.ops.map((o) => `<div class="op ${esc(o.status)}">`
        + `<span class="oglyph">${OP_GLYPH[o.status] || '·'}</span>`
        + `<span class="oname">${esc(o.name)}</span>`
        + `<span class="ocmd">${esc(o.detail)}</span>`
        + `<span class="odur">${esc(o.duration)}</span></div>`).join('')}</div>`
      : `<div class="blurb">${esc(strip.blurb)}</div>`;

    el('inside').innerHTML = `<div class="act ${viewing ? 'viewing' : ''}">${vbar}`
      + `<div class="ahead"><span class="adot ${esc(strip.dot)}"></span>`
      + `<span class="aname">Inside ${esc(strip.title.toLowerCase())}</span>`
      + `<span class="aclock">${esc(strip.clock)}</span></div>${body}</div>`;
  }

  // The fault card: the reason a red node is red, the log behind it, and when it
  // ran. Shown only for a failed stage — everything else stays quiet.
  function renderFault(stepper) {
    const box = el('fault');
    const failed = (stepper || []).find((s) => s.status === 'failed');
    box.classList.toggle('hidden', !failed);
    if (!failed) { box.innerHTML = ''; return; }
    const title = `${STAGE_TITLE[failed.stageKey] || failed.stageKey} failed`;
    const timing = timingText(failed);
    const attempt = failed.attempt ? ` · attempt ${esc(failed.attempt)}` : '';
    box.innerHTML = `<div class="ftitle">${esc(title)}</div>`
      + `<div class="freason">${esc(failed.reason || 'No reason recorded.')}</div>`
      + (timing ? `<div class="fmeta">${esc(timing)}${attempt}</div>` : '')
      + (failed.artifactPath
        ? `<div class="facts"><button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="open-stage-log"`
          + ` data-path="${esc(failed.artifactPath)}" title="Open this stage's log file in an editor">Open log</button></div>`
        : '');
  }

  // One sentence + at most one button. The copy is built host-side (model/nowLine)
  // and shipped in the state, so it is unit-tested and lives in exactly one place.
  // `session` and `resume` both route to resume-ticket: the host's openSession
  // resolves --resume vs. a fresh (self-scoping) launch on its own, so the verb
  // is a label concern only — the button always reaches the one entry point.
  const NOW_MESSAGE = { 'open-log': 'open-stage-log', ship: 'ship-ticket', resume: 'resume-ticket', session: 'resume-ticket' };
  // Fixed, static tooltip text per action kind (UI-R19/R20) — the label alone
  // ("Ship", "Resume") is a bare verb whose object is not visible on the
  // button. These are structural UI copy, like every other static tooltip in
  // this file (sidebar's row actions are the precedent), not a host-derived
  // value — UI-R31 governs DATA, not fixed control copy.
  const NOW_TITLE = {
    'open-log': "Open the failed stage's log file",
    ship: 'Ship this ticket — commit, push, and open pull requests',
    resume: "Resume this ticket's agent session",
    session: "Resume this ticket's agent session",
  };

  function renderNow(now, agentSession) {
    // While a ship is in flight, the real per-step progress lives in the Inside
    // block; this line is a static sentence, never a spinner label — and no
    // button, since the confirm click already happened (no second one to make).
    if (shipping) {
      el('now').innerHTML = `<span class="ntext">${esc('Now: shipping — committing, pushing, and opening PRs for each hot repo.')}</span>`;
      return;
    }
    const line = now || { text: '' };
    const a = line.action;
    const type = a && NOW_MESSAGE[a.kind];
    const title = a && NOW_TITLE[a.kind];
    const attrs = a && a.path ? ` data-path="${esc(a.path)}"` : '';
    const switchAction = agentSession && agentSession.canSwitch
      ? '<button type="button" class="k-btn k-btn--secondary k-btn--sm switch-agent" data-act="switch-agent"'
        + ' title="Switch this ticket\'s live agent session">Switch agent…</button>'
      : '';
    const identity = agentSession
      ? `${agentSession.providerLabel} · ${agentSession.modelLabel}`
      : '';
    // A brief success flash beside the settled line once a ship resolves — the
    // clear "it worked" beat before the dashboard shows the done state.
    const badge = shipDone === 'success' ? `<span class="shipbadge ok">✓ Shipped</span>` : '';
    const detail = a && a.kind === 'session' && a.detail ? a.detail : '';
    const subtitle = [detail, identity].filter(Boolean).join(' · ');
    const sub = subtitle
      ? `<div class="now-sub">${esc(subtitle)}</div>`
      : '';
    el('now').innerHTML = badge + `<span class="ntext">${esc(line.text)}</span>`
      + (type ? `<button type="button" class="k-btn k-btn--primary k-btn--sm" data-act="${type}"${attrs}`
        + `${title ? ` title="${esc(title)}"` : ''}>${esc(a.label)}</button>` : '')
      + switchAction
      + sub;
  }

  // Decide whether an incoming snapshot ends the in-flight ship. Keyed off host
  // truth (the ship stage's own status), never the copy: while shipping the
  // stage sits at `running`, so every push would otherwise rebuild the plain
  // "Confirm ship" line and wipe the spinner. Success = advanced past ship;
  // error = ship landed failed (the Now line + fault card then explain it).
  function resolveShipping(state) {
    if (!shipping) return;
    const atShip = state.stageCurrent === 'ship';
    const failed = atShip && state.currentStage && state.currentStage.status === 'failed';
    const requestId = shipRequestId;
    shipRequestId = null;
    if (failed) {
      shipping = false; // the failed Now line + fault card are the explicit error state
      shipOps = null;
      // The fault card already carries the reason inline (UI-R14b territory);
      // the toast stays generic so the two do not repeat host prose twice.
      if (requestId) karstSettle(requestId, false);
    } else if (!atShip) {
      shipping = false;
      shipOps = null;
      shipDone = 'success';
      if (requestId) karstSettle(requestId, true);
      setTimeout(() => { shipDone = null; render(lastState); }, 2400);
    }
    // else still at ship (running) → hold the spinner across this push, and
    // leave requestId in place (restored below) so a later push can still
    // settle it.
    if (!failed && atShip) shipRequestId = requestId;
  }

  // ---------------------------------------------------------------------
  // Servers panel
  // ---------------------------------------------------------------------
  const isOnline = (s) => s.status === 'running';
  const addrOf = (s) => `${s.host || 'localhost'}:${s.port}`;

  const svgIcon = (name) => (
    `<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`
  );

  /**
   * An icon action. The visible label IS the icon, so the word survives as both
   * aria-label (screen readers) and title (hover) — nothing is conveyed by shape
   * alone, and the two carry the SAME string (UI-R21). A disabled button keeps
   * that string as WHY: a greyed icon with no explanation is a dead end the
   * user cannot tell from a broken one, for a screen-reader user exactly as
   * much as a sighted one.
   */
  const iact = (action, id, label, name, disabledWhy) => (
    `<button type="button" class="k-iconbtn ib t-${name}" data-act="${action}"`
    + `${id != null ? ` data-id="${id}"` : ''}`
    + `${name === 'copy' ? ' data-copy' : ''}`
    + `${disabledWhy ? ' disabled' : ''}`
    + ` aria-label="${esc(disabledWhy || label)}" title="${esc(disabledWhy || label)}">`
    + `${svgIcon(name)}</button>`
  );

  // Row actions come in two groups: Open and Copy operate on the ADDRESS and sit
  // flush against it; Restart and Stop operate on the PROCESS.
  const addrActions = (s) => (
    isOnline(s)
      ? iact('open-server', s.id, 'Open in browser', 'open')
        + iact('copy-server-url', s.id, 'Copy URL', 'copy')
      : ''
  );

  // An offline row is retained, not deleted, so it can be started again. Open,
  // Copy and Stop are all meaningless on it.
  const lifeActions = (s) => (
    isOnline(s)
      ? iact('restart-server', s.id, 'Restart', 'restart')
        + iact('stop-server', s.id, 'Stop', 'stop')
      : iact('spin-servers', null, 'Start service', 'start')
  );

  /**
   * Whole-ticket controls, rendered into the panel HEADER. They act on every
   * service, so they must survive the states where the body has no rows — the
   * empty body is exactly when Start matters most. Each disables itself when it
   * would be a no-op and explains that in its title.
   *
   * Start and Restart post different actions but the host binds both to a
   * re-spin (a spin already stops everything first); they stay distinct by
   * AVAILABILITY, which is what this function computes.
   */
  function panelOps(state) {
    // Nothing in scope can ever run: these would be permanent dead affordances,
    // so they are absent rather than disabled.
    if (state.hasRunnableRepos === false) return '';
    const list = state.servers;
    const none = list.length === 0;
    const anyOffline = list.some((s) => !isOnline(s));
    const anyRunning = list.some(isOnline);
    const startWhy = !none && !anyOffline ? 'Every service is already running' : null;
    const restartWhy = none ? 'No services to restart' : null;
    const stopWhy = !anyRunning ? 'No service is running' : null;
    return iact('spin-servers', null, 'Start all services', 'start', startWhy)
      + iact('restart-servers', null, 'Restart all services', 'restart', restartWhy)
      + iact('stop-servers', null, 'Stop all services', 'stop', stopWhy);
  }

  /**
   * The two empty states stay distinct, and the distinction is the point: one is
   * a PROMPT (nothing is running — the header's Start fixes that), the other a
   * STATEMENT of fact (nothing here can run, and the header controls are gone
   * with it). Neither carries a button; the action lives in the header.
   */
  function serversEmpty(state) {
    if (state.hasRunnableRepos === false) {
      return `<div class="estate dead"><span class="emark">${svgIcon('ban')}</span>`
        + `<div><div class="ehead">No runnable services in scope</div>`
        + `<div class="esub">This ticket scopes only repositories without a service`
        + ` block, so there is nothing here to run.</div></div></div>`;
    }
    return `<div class="estate"><span class="emark">${svgIcon('rack')}</span>`
      + `<div><div class="ehead">No servers running</div>`
      + `<div class="esub">Start the services in scope to get their local`
      + ` addresses here.</div></div></div>`;
  }

  function serverRow(s) {
    const on = isOnline(s);
    const status = on ? 'running' : 'offline';
    // role=img + aria-label is what keeps a bare dot from being invisible to a
    // screen reader now that the word is gone; title gives the pointer the same
    // word. Never colour alone: filled disc vs hollow ring still differ, and an
    // offline row reads "—" where an address would be.
    const dot = `<span class="glyph ${on ? 'on' : 'off'}" role="img"`
      + ` aria-label="${status}" title="${status}"></span>`;
    const addr = on
      ? `<span class="full">${esc(addrOf(s))}</span><span class="short">:${esc(s.port)}</span>`
      : '—';
    return `<tr><td class="c-dot">${dot}</td>`
      + `<td class="c-name" title="${esc(s.service)}">${esc(s.service)}</td>`
      + `<td class="c-addr${on ? '' : ' off'}"`
      + ` title="${on ? esc(addrOf(s)) : 'offline — no address'}">${addr}</td>`
      + `<td class="c-addrops"><span class="g">${addrActions(s)}</span></td>`
      + `<td class="c-acts"><span class="g">${lifeActions(s)}</span></td></tr>`;
  }

  function renderServers(state) {
    const servers = state.servers;
    el('srvCount').textContent = servers.length ? `${servers.length}` : '';
    el('srvOps').innerHTML = panelOps(state);
    if (!servers.length) {
      el('servers').innerHTML = serversEmpty(state);
      return;
    }
    // The filter earns its row only once scanning is actually hard.
    const needle = srvFilter.trim().toLowerCase();
    const filterable = servers.length > 6;
    const bar = filterable
      ? `<div class="filter"><label class="sr" for="srvFilter">Filter services</label>`
        + `<input id="srvFilter" class="k-input" type="search" placeholder="Filter ${servers.length} services…"`
        + ` value="${esc(srvFilter)}" data-filter></div>`
      : '';
    const shown = filterable && needle
      ? servers.filter((s) => s.service.toLowerCase().includes(needle))
      : servers;
    const rows = shown.map(serverRow).join('')
      || `<tr><td colspan="5"><div class="nomatch">No service matches`
        + ` “${esc(srvFilter)}”.</div></td></tr>`;
    // The address-ops column sits UNDER the Address header (colspan 2): Open and
    // Copy are part of the address, so the header says so.
    el('servers').innerHTML = `${bar}<div class="scroll"><table>`
      + `<thead><tr><th scope="col"><span class="sr">Status</span></th>`
      + `<th scope="col">Service</th><th scope="col" colspan="2">Address</th>`
      + `<th scope="col" style="text-align:right">Actions</th></tr></thead>`
      + `<tbody>${rows}</tbody></table></div>`;
  }

  function renderWorktrees(wts) {
    el('wtCount').textContent = wts.length ? `${wts.length}` : '';
    el('wtChanges').disabled = wts.length === 0;
    el('worktrees').innerHTML = wts.length ? wts.map((w) => {
      const stats = worktreeStats[w.repo];
      const totals = stats
        ? `<span class="wstats"><span class="wadd">+${stats.additions}</span> <span class="wdel">−${stats.deletions}</span></span>`
        : '';
      const branch = w.branch
        ? `<span class="wbranch"><span class="wbr">${esc(w.branch)}</span>`
          // Optimistic (UI-R15): the host does the clipboard write and cannot
          // fail in a way the user must act on, so flashCopied confirms
          // without waiting for a round trip — see flashCopied() below.
          + `<button type="button" class="k-iconbtn ib t-copy" data-act="copy-worktree-branch" data-branch="${esc(w.branch)}" data-copy aria-label="Copy branch name" title="Copy branch name">${svgIcon('copy')}</button></span>`
        : '';
      return `<div class="wt"><span class="wrepo">${esc(w.repoDisplay || w.repo)}</span>`
        + branch + totals + `<span class="wacts">`
        + `<button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="open-worktree-terminal" data-path="${esc(w.path)}"`
        + ` title="Open a terminal in this worktree">Open Terminal</button>`
        + `<button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="open-worktree-folder" data-path="${esc(w.path)}"`
        + ` title="Reveal this worktree in the file explorer">Reveal in Explorer</button>`
        + `</span></div>`;
    }).join('') : '<div class="empty">No worktrees.</div>';
  }

  // Mergeability under a PR row. Every string is the host's
  // (`buildMergeCheckPanelRows`) — the webview only places them. A repo with no
  // check renders NOTHING: never asked is not the same as clean, and the one
  // thing this panel must not do is reassure about a question nobody put.
  //
  // The headline is bounded (verdict, count, base ref, age), so it fits the line
  // it is given. Everything unbounded — the path list, git's own error prose —
  // lives in the disclosure, which is where it can wrap and be selected. A row
  // the host gave no `detailsLabel` renders no disclosure at all.
  function mergeLine(m) {
    if (!m) return '';
    const act = m.state === 'conflicted'
      ? `<button type="button" class="k-btn k-btn--secondary k-btn--sm mgbtn" data-act="resolve-conflicts" data-repo="${esc(m.repo)}"`
        + ` title="Hand this repo's conflict to an agent session">Resolve conflicts</button>`
      : '';
    // The relative age drifts between state pushes; the absolute stamp does not.
    const title = m.checkedTitle ? ` title="checked ${esc(m.checkedTitle)}"` : '';
    const body = m.reason
      ? `<div class="mgreason">${esc(m.reason)}</div>`
      : (m.files || []).map((f) => `<div class="mgfile">${esc(f)}</div>`).join('');
    // Re-open exactly the disclosures the user had open before this render —
    // see `openMergeRepos` above.
    const openAttr = openMergeRepos.has(m.repo) ? ' open' : '';
    const details = m.detailsLabel
      ? `<details class="mgd"${openAttr} data-repo="${esc(m.repo)}"><summary>${esc(m.detailsLabel)}</summary>`
        + `<div class="mgdbody">${body}</div></details>`
      : '';
    return `<div class="mgwrap mg-${esc(m.state)}">`
      + `<div class="mg"><span class="mgdot" aria-hidden="true"></span>`
      + `<span class="mgtext"${title}>${esc(m.headline)}</span>${act}</div>`
      + details
      + `</div>`;
  }

  // The merge control. Rendered from the host's verdict (`canMerge` +
  // `mergeBlockedReason`) — the webview never decides that a PR is mergeable, and
  // never phrases the reason it isn't.
  //
  // Merging is IRREVERSIBLE, so the click only asks: the host puts a modal in
  // front of the user (which also chooses the strategy) before anything runs.
  // `.k-btn--danger` (UI-R10b) marks it as the one irreversible action on this
  // panel. The pending state (aria-busy, via `mergeRequests`) exists so a click
  // on an irreversible action is never silent while that dialog is up, and it
  // is cleared by the next state push — including the one the host sends after
  // a cancel, so the button can never stick (see `mergeRequests`' own comment).
  function mergeButton(p) {
    if (p.status === 'merged') return '';
    if (mergeRequests[p.repo]) {
      return `<button type="button" class="k-btn k-btn--danger k-btn--sm mgbtn" aria-busy="true" disabled`
        + ` title="Confirm the merge in the dialog">Merge</button>`;
    }
    if (!p.canMerge) {
      return `<button type="button" class="k-btn k-btn--secondary k-btn--sm mgbtn" disabled title="${esc(p.mergeBlockedReason)}">Merge</button>`;
    }
    const num = p.number ? ` #${p.number}` : '';
    return `<button type="button" class="k-btn k-btn--danger k-btn--sm mgbtn" data-act="merge-pr" data-repo="${esc(p.repo)}"`
      + ` title="Merge PR${esc(num)} into ${esc(p.baseRef || 'its base')} — cannot be undone">Merge</button>`;
  }

  // The metadata line under a PR: from-to, when it was opened, when it merged, and
  // how many comments it carries. Every part is a host-rendered string that is ''
  // when the fact is absent, so a PR karst has not fully probed simply shows less
  // — never a blank field, a placeholder, or "Invalid Date".
  function prMetaLine(p) {
    const bits = [
      p.branches ? `<span class="pbranch">${esc(p.branches)}</span>` : '',
      p.opened ? `<span>${esc(p.opened)}</span>` : '',
      p.merged ? `<span class="pmerged">${esc(p.merged)}</span>` : '',
    ].filter(Boolean);
    if (!bits.length) return '';
    return `<div class="pmeta">${bits.join('<span class="psep">·</span>')}</div>`;
  }

  // Comments collapse by default: the count is the fact a reader scans for, the
  // bodies are what they open when it matters. A PR with none renders nothing at
  // all rather than an empty disclosure.
  function prComments(p) {
    if (!p.commentsLabel) return '';
    const rows = p.comments.map((c) => (
      `<div class="pcm"><span class="pcmwho">${esc(c.author || 'unknown')}</span>`
      + (c.when ? `<span class="pcmwhen">${esc(c.when)}</span>` : '')
      + `<div class="pcmbody">${esc(c.body)}</div></div>`
    )).join('');
    return `<details class="pcms"><summary>${esc(p.commentsLabel)}</summary>${rows}</details>`;
  }

  function renderPrs(prs, mergeChecks) {
    const byRepo = {};
    for (const m of (mergeChecks || [])) byRepo[m.repo] = m;
    el('prCount').textContent = prs.length ? `${prs.length}` : '';
    // The refresh stays live even with zero PRs: "none yet" is exactly the answer
    // a user wants to re-ask right after a ship.
    const refresh = el('prRefresh');
    const refreshing = !!prRefreshId;
    if (refreshing) refresh.setAttribute('aria-busy', 'true');
    else refresh.removeAttribute('aria-busy');
    refresh.disabled = refreshing;
    // aria-label and title stay the SAME string in both states (UI-R21) — an
    // icon-only control's accessible name and its tooltip must never diverge.
    const refreshName = refreshing
      ? 'Re-checking pull requests…'
      : 'Re-check pull request status and mergeability now';
    refresh.title = refreshName;
    refresh.setAttribute('aria-label', refreshName);
    el('prs').innerHTML = prs.length ? prs.map((p) => (
      `<div class="prrow"><div class="pr"><span class="k-chip pst pst-${esc(p.status || 'unknown')}">${esc(p.status || '')}</span>`
      // The DISPLAY path, per the worktree path-display preference — the same
      // string the worktree rows show for this repo.
      + `<span class="prepo">${esc(p.repoDisplay || p.repo)}</span>`
      + `<span class="ptitle">${esc(p.url || '')}</span>`
      + `<span class="pnum">#${esc(p.number)}</span>`
      + `<span class="pacts"><button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="open-pr" data-url="${esc(p.url)}" title="Open this pull request">Open</button>`
      + mergeButton(p)
      + `</span></div>`
      + prMetaLine(p)
      + mergeLine(byRepo[p.repo])
      + prComments(p)
      + `</div>`
    )).join('') : '<div class="empty">No pull requests.</div>';
  }

  // agent state -> pill color (uses the same chart vars as the stepper).
  const AGENT_COLOR = {
    running: 'var(--k-running)',
    waiting: 'var(--k-attention)',
    idle: 'var(--k-pending)',
    none: 'var(--k-pending)',
  };

  function renderAgent(agentState) {
    const st = agentState || 'none';
    const color = AGENT_COLOR[st] || 'var(--k-pending)';
    el('agent').innerHTML =
      `<span class="agent-pill"><span class="dot" style="background:${color}"></span>`
      + `agent: ${esc(st)}</span>`;
  }

  // The key pill, which doubles as the link to the source board (ClickUp, …)
  // when the ticket was fetched from one: provider mark + key + arrow, one
  // target. The board ref and the synthesized brief ride along as the hover —
  // printing the ref beside the key only echoed it (they name the same id).
  // Manual/unfetched → the same pill, dashed and inert.
  function renderKeyPill(state) {
    const label = state.key || `#${state.ticketId}`;
    if (!state.ticketUrl) {
      // Inert: a plain, non-interactive <span> (the `.k-chip` informational
      // form — no role, no tabindex) with a dashed border and default cursor,
      // so nothing about it implies a control that can be activated.
      el('keyPill').innerHTML =
        `<span class="k-chip keypill local" title="Manual ticket — not linked to a board">${esc(label)}</span>`;
      return;
    }
    const icon = providerIconHtml(state.provider);
    // Drop the ref when it IS the key (a fetched ticket usually keys on it) —
    // the tooltip would just repeat the pill.
    const ref = state.sourceRef === label ? null : state.sourceRef;
    const hover = [ref, state.brief].filter(Boolean).join(' — ');
    const tip = hover ? ` title="${esc(hover)}"` : '';
    el('keyPill').innerHTML =
      `<a class="k-chip keypill" href="#" data-act="open-ticket-link" data-url="${esc(state.ticketUrl)}"${tip}>`
      + `${icon}${esc(label)} <span class="arw" aria-hidden="true">↗</span></a>`;
  }

  function render(state) {
    lastState = state;
    // Selection defaults to the current stage; with none (nothing has run) it
    // falls back to scope — the one the user is about to start.
    const sel = selectedStage || state.stageCurrent || 'scope';
    el('title').textContent = state.title || '(untitled)';
    renderKeyPill(state);
    // Follow-up only makes sense once the work shipped — same gate the
    // createFollowUpTicket command enforces server-side.
    el('followUpBtn').classList.toggle('hidden', state.stageCurrent !== 'done');
    renderAgent(state.agentState);
    renderRail(state.rail, state.approach, sel, fixExpanded);
    renderInside(shippingView(state, sel), sel);
    // The fault card scans the FLAT stepper, so it still sees fix.
    renderFault(state.stepper);
    renderNow(state.now, state.agentSession);
    renderServers(state);
    renderWorktrees(state.worktrees);
    renderPrs(state.prs, state.mergeChecks);
  }

  // The toggle's label stays "Bind terminal" in both states — a button that
  // renamed itself to the ACTION ("Unbind") reads, at a glance, as the state.
  // aria-pressed and the fill carry the state; the tooltip spells out what the
  // binding does, since the consequence lands on tabs elsewhere in the IDE.
  function renderBind() {
    const btn = el('bindBtn');
    if (!btn) return;
    btn.setAttribute('aria-pressed', String(bindEnabled));
    btn.title = bindEnabled
      ? 'Bind is on — opening this dashboard reveals the agent terminal, and opening the terminal reveals this dashboard. Click to unbind.'
      : 'Bind is off — this dashboard and the agent terminal move independently. Click to bind them.';
  }

  // Selection is view state: persisted BESIDE the host's snapshot, never inside
  // it. Inside `state` it would be dropped by the next push (the host builds
  // that from the DB) and would put a webview concern in a host-owned type.
  const persist = () => vscode.setState({ state: lastState, sel: selectedStage, fixExpanded, srvFilter: srvFilter });

  function select(stage) {
    selectedStage = stage;
    render(lastState);
    persist();
  }

  function toggleFix() {
    fixExpanded = !fixExpanded;
    render(lastState);
    persist();
  }

  // editBtn/followUpBtn post through the generic delegated `[data-act]`
  // handler below (data-act is set in their markup, above) — the same pending
  // lifecycle every other posting control gets, rather than a bespoke listener.

  // Filtering is local and never round-trips to the host. Re-rendering replaces
  // the input element, so focus and caret are restored explicitly — otherwise
  // the field loses focus after the first keystroke and typing stops dead.
  el('servers').addEventListener('input', (e) => {
    const box = e.target.closest('[data-filter]');
    if (!box) return;
    srvFilter = box.value;
    const caret = box.selectionStart;
    render(lastState);
    const next = el('servers').querySelector('[data-filter]');
    if (next) {
      next.focus();
      try { next.setSelectionRange(caret, caret); } catch { /* type=search may refuse */ }
    }
    persist();
  });

  // Clicking a stage re-points the strip. Purely local — no host round trip, so
  // it stays instant and survives every state push.
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-fixtoggle]')) { toggleFix(); return; }
    const node = e.target.closest('[data-stage]');
    if (node) { select(node.dataset.stage); return; }
    if (e.target.closest('[data-back]')) select(null);
  });

  // Tracks which merge disclosures (`.mgd`) are open, so the next render — fired
  // by a state push or a ship-progress tick, not by this click — restores
  // exactly the ones the user had open. Listens in the CAPTURE phase: `toggle`
  // does not bubble in every engine, so a bubble-phase delegate on `#prs` could
  // silently miss it.
  document.addEventListener('toggle', (e) => {
    const node = e.target && e.target.closest && e.target.closest('.mgd');
    if (!node || !node.dataset.repo) return;
    const next = new Set(openMergeRepos);
    if (node.open) next.add(node.dataset.repo);
    else next.delete(node.dataset.repo);
    openMergeRepos = next;
  }, true);

  // Optimistic feedback for the copy button (UI-R15) — the host does the actual
  // clipboard write, and a webview that cannot confirm a write is not something
  // the user needs to act on (the click is trivially repeatable), so this
  // confirms without waiting for a round trip. Never used for a mutation.
  function flashCopied(btn) {
    // An icon button has no text to swap, so the GLYPH is what flashes — and the
    // confirmation moves onto aria-label too, so it is not a purely visual beat
    // for anyone reading the button by name.
    if (btn.classList.contains('ib')) {
      const prevHtml = btn.innerHTML;
      const prevLabel = btn.getAttribute('aria-label');
      btn.innerHTML = svgIcon('check');
      btn.setAttribute('aria-label', 'Copied');
      btn.classList.add('ok');
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = prevHtml;
        btn.setAttribute('aria-label', prevLabel);
        btn.classList.remove('ok');
        btn.disabled = false;
      }, 1200);
      return;
    }
    const prev = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 1200);
  }

  // Delegate clicks (buttons + the ticket-link anchor) → action messages
  // (messages.ts routeAction). A no-payload action (e.g. spin-servers) posts
  // just its type.
  //
  // Rows here render by full innerHTML replacement (every `state` push and
  // every `ship-progress` tick calls render()), so a per-element `karstAction`
  // binding — which keys pending state to the ONE element it was bound to —
  // would go stale the instant a re-render swaps that element out from under
  // it. This delegated handler instead calls the runtime's underlying pieces
  // (karstRequestId / karstBeginPending / karstIsPending) directly, the same
  // fix `sidebar` and `diffs` already apply to the same problem, so every
  // control still gets the four required properties: pending on click,
  // non-re-triggerable, a terminal result, and a watchdog.
  //
  // ship-ticket / merge-pr / refresh-prs are the exception: extension.ts does
  // not await their inner promise (each fires a multi-second-to-multi-minute
  // network operation and returns immediately), so the generic host ack would
  // arrive and settle the control almost instantly — long before the real
  // work finishes. Those three carry NO requestId on the wire and settle
  // themselves from the next meaningful `state` push instead (§
  // DESIGN-SYSTEM.md 5.1: a mutating action "settles on the host's result, OR
  // THE NEXT state push") — see resolveShipping() and the `state` handler
  // below. merge-pr's payload also stays exactly `{type:'merge-pr', repo}`
  // regardless (UI-R37): the strategy is the host's question to the user, and
  // widening the wire payload here would be the same failure the omitted
  // `method` already guards against.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    e.preventDefault();
    const act = btn.dataset.act;

    // Confirm ship kicks off slow backend work (model call + gh pr create).
    // Guard against double-submit and show that the click registered BEFORE
    // the host is even asked — no window where the button looks inert with
    // work underway.
    if (act === 'ship-ticket') {
      if (shipping) return;
      shipping = true;
      shipDone = null;
      shipOps = seedShipOps(lastState ? lastState.worktrees : []);
      shipRequestId = karstRequestId();
      karstBeginPending(btn, shipRequestId);
      render(lastState);
      post({ type: act });
      return;
    }
    // Merging is irreversible and the host answers with a modal first, so the
    // button must both stop repeating the request and show that the click
    // landed. See resolveMergeOutcome() for how mergeRequests[repo] settles.
    if (act === 'merge-pr') {
      const repo = btn.dataset.repo;
      if (!repo || mergeRequests[repo]) return;
      const requestId = karstRequestId();
      karstBeginPending(btn, requestId);
      mergeRequests = { ...mergeRequests, [repo]: requestId };
      render(lastState);
      post({ type: act, repo });
      return;
    }
    // Same reason as the two above: the work is a slow host round trip (gh
    // per PR, git fetch per repo), so show it landed and stop it repeating.
    if (act === 'refresh-prs') {
      if (prRefreshId) return;
      prRefreshId = karstRequestId();
      karstBeginPending(btn, prRefreshId);
      if (lastState) render(lastState);
      post({ type: act });
      return;
    }

    // Every other posting control settles on the host's genuine `action-result`
    // ack (UI-R11–R14): pending on click, dropped (not queued) on a repeat,
    // and the runtime's own watchdog covers a host that never answers.
    if (karstIsPending(btn) || btn.disabled) return;
    const requestId = karstRequestId();
    karstBeginPending(btn, requestId);
    if (btn.dataset.id) post({ type: act, serverId: Number(btn.dataset.id), requestId });
    else if (btn.dataset.branch) post({ type: act, branch: btn.dataset.branch, requestId });
    else if (btn.dataset.path) post({ type: act, path: btn.dataset.path, requestId });
    else if (btn.dataset.url) post({ type: act, url: btn.dataset.url, requestId });
    // The repo NAMES the conflict; the host resolves it to a worktree itself.
    else if (btn.dataset.repo) post({ type: act, repo: btn.dataset.repo, requestId });
    else post({ type: act, requestId });
    // Optimistic clipboard confirmation (UI-R15) rides ALONGSIDE the pending
    // state above, not instead of it — the button still reports whatever the
    // host's real ack says, same as every other control.
    if (btn.hasAttribute('data-copy')) flashCopied(btn);
  });

  // Settle every outstanding merge request against the fresh PR list. `merged`
  // is the one outcome the webview can actually verify — the host reports
  // nothing else back over this channel — so a repo that came back merged
  // settles `true` (success flash + toast); anything else settles `null`
  // (unknown), never `false`. Claiming FAILED would misreport a user who
  // simply cancelled the host's confirmation dialog, which is not a failure;
  // distinguishing a real refusal from a cancel needs a host-side signal this
  // webview does not have (see the PR panel's own header comment).
  function resolveMergeOutcome(state) {
    if (!Object.keys(mergeRequests).length) return;
    const prByRepo = {};
    for (const p of (state.prs || [])) prByRepo[p.repo] = p;
    for (const [repo, requestId] of Object.entries(mergeRequests)) {
      const merged = prByRepo[repo] && prByRepo[repo].status === 'merged';
      karstSettle(requestId, merged ? true : null, merged ? 'Merged.' : undefined);
    }
    // A state push is the host's answer to every outstanding merge request —
    // success, refusal, or a cancelled confirmation (the host pushes either
    // way, via extension.ts's `finally`). Clearing here is what stops a
    // button sticking on "Merge" (pending) forever.
    mergeRequests = {};
  }

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg) return;
    // Live per-repo/per-step ship progress. Ignored unless a ship is in flight
    // (a stale message can't resurrect a stale overlay).
    if (msg.type === 'ship-progress') {
      if (shipping && msg.event && msg.event.repo) {
        const e = msg.event;
        if (!shipOps) shipOps = {};
        if (!shipOps[e.repo]) shipOps[e.repo] = {};
        shipOps[e.repo][e.step] = { status: e.status, detail: e.detail };
        render(lastState);
      }
      return;
    }
    // The window's terminal binding. Host-owned: it is one preference shared by
    // every open dashboard, so the webview renders what it is told and never
    // decides — the click posts `toggle-bind` and waits for this message back.
    if (msg.type === 'bind') {
      bindEnabled = msg.enabled === true;
      renderBind();
      return;
    }
    if (msg.type === 'worktree-stats') {
      worktreeStats = Object.fromEntries(
        (msg.stats || []).map((stats) => [stats.repo, stats]),
      );
      if (lastState) renderWorktrees(lastState.worktrees || []);
      return;
    }
    // The terminal result of an async action (§ DESIGN-SYSTEM.md 5.3, UI-R13).
    // ship-ticket/merge-pr/refresh-prs never reach here (they carry no
    // requestId on the wire, by design — see the click handler above); every
    // other posting control settles through this one line.
    if (msg.type === 'action-result') {
      karstSettle(msg.requestId, msg.ok, msg.message);
      return;
    }
    if (msg.type === 'state') {
      // Resolve an in-flight ship FIRST, so render() draws either the held
      // spinner or the settled line — never a flash of the stale "Confirm ship".
      resolveShipping(msg.state);
      // Likewise merge — settle every outstanding request against the fresh
      // PR list before rendering, so the button's pending state and its
      // terminal toast land in the same frame.
      resolveMergeOutcome(msg.state);
      // Likewise the refresh icon: the host pushes state when the sweep settles
      // even if no verdict moved, precisely so the spin has an end. The result
      // is always reported ok:true — the webview cannot itself distinguish "PR
      // status changed" from "confirmed unchanged", and both are a successful
      // refresh (UI-R31: no verdict is invented here).
      if (prRefreshId) {
        karstSettle(prRefreshId, true);
        prRefreshId = null;
      }
      // The matching async totals message follows this snapshot. Until then,
      // omit numbers rather than showing values for an older working tree.
      worktreeStats = {};
      // Never touches selectedStage, so a full re-render preserves the user's
      // selection for free — including during a run, when pushes are frequent.
      render(msg.state);
      persist(); // survive reload (retainContextWhenHidden)
    }
  });

  // Restore last state on reload before the host re-pushes. Tolerates the
  // pre-envelope shape a panel open across an upgrade may have persisted.
  const prev = vscode.getState();
  const restored = prev && prev.state ? prev : prev ? { state: prev, sel: null } : null;
  if (restored && restored.state) {
    selectedStage = restored.sel || null;
    fixExpanded = restored.fixExpanded || false;
    srvFilter = restored.srvFilter || '';
    render(restored.state);
  }
</script>
