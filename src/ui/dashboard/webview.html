<!--
  Karst ticket dashboard webview (T3.2). Self-contained: no external assets
  (webview CSP forbids them). Renders from the `state` postMessage the host
  pushes (state.ts → DashboardState) and posts action messages back
  (messages.ts → WebviewMessage). Styles ported from design/orchestrator-mockup.html.
-->
<!--KARST_CSP-->
<style>
  /*KARST_DS_CSS*/
  /*KARST_AGENT_CSS*/

  :root{
    /* Status colors come from the shared ramp (--k-pending|running|attention|
       passed|failed, injected via /*KARST_PALETTE*\/ below) and are consumed
       directly as var(--k-*) everywhere in this file (UI-R05/R06: one token
       per meaning, declared once, never redeclared or given a second name).
       --k-surface is the opaque mask the rail nodes fill with to hide the
       connector running under them — it used to be a local `--panel-bg` here
       with its own hex fallback; that fallback is now the one in
       designSystem.ts, so a theme without editorWidget.background still gets
       the same opaque floor. */

    /* One header height for every panel in the grid. The headers carry
       different contents — bare text, icon buttons, a text button — and
       letting each size itself put the Worktrees body 2px below the Servers
       body beside it, so the whole block read as drifted. Padding alone
       cannot fix that: the tallest control still sets the height. Composed
       from tokens (a large control + one padding step + the hairline)
       rather than a bare 39px literal (UI-R04). */
    --phead-h:calc(var(--k-control-h-lg) + var(--k-space-4) + var(--k-border-w));
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--k-bg);color:var(--k-text);font-family:var(--k-font-ui);font-size:var(--k-text-base);padding:var(--k-space-8) var(--k-space-9)}
  a{color:var(--k-link);text-decoration:none}
  /* Toggled by the render fns (fault card, impl phases) — without this rule the
     `hidden` class was a no-op and an empty box still drew its border. */
  .hidden{display:none}

  .dhead{display:flex;align-items:center;gap:var(--k-space-5);margin-bottom:var(--k-space-2)}
  .dhead h1{font-size:var(--k-text-xl);margin:0}
  .dhead h1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dhead .agent{margin-left:auto;font-size:var(--k-text-xs);color:var(--k-text-dim);font-family:var(--k-font-mono)}
  /* The key pill IS the board link: provider mark + key + arrow, one target.
     A separate link chip echoed the key (both print the board's id), so the
     two collapse into one. The board ref/brief demote to the tooltip.
     Manual (no board) is the same pill, dashed and inert — built on the shared
     `.k-chip` primitive (UI-R08: one pill shape, one radius, for every chip in
     this file), with only content-specific bits (monospace, the hover arrow
     shift) layered on top. */
  .dhead .keypill{font-family:var(--k-font-mono)}
  .dhead a.keypill .arw{color:var(--k-link);transition:transform var(--k-dur-fast) var(--k-ease-standard)}
  .dhead a.keypill:hover .arw{transform:translate(var(--k-space-1),calc(var(--k-space-1) * -1))}
  /* Inert: dashed border + default cursor say plainly "not a control" — a
     plain span, never a link, so nothing implies it is clickable (the
     `.k-chip` informational form: no role, no tabindex). */
  .dhead .keypill.local{border-style:dashed;color:var(--k-text-dim);
    background:transparent;cursor:default}
  /* The terminal binding. Off is the default, so the resting look is quiet —
     an outline, like every other non-primary control here. On is not a hover
     shade but a filled chip: the button reports a mode that changes what
     clicking a TAB does, and a state that subtle reads as "nothing happened".
     Built on `.k-btn--ghost` (quiet outline at rest) with the pressed state
     re-themed to the primary action fill. */
  .dhead .bindtoggle .dot{width:var(--k-space-3);height:var(--k-space-3);border-radius:var(--k-radius-circle);
    background:currentColor;opacity:.45}
  .dhead .bindtoggle[aria-pressed="true"]{color:var(--k-action-fg);
    background:var(--k-action-bg);border-color:transparent}
  .dhead .bindtoggle[aria-pressed="true"] .dot{opacity:1}
  @media (prefers-reduced-motion:reduce){.dhead a.keypill:hover .arw{transform:none}}
  /* Shared ticketing-provider badge (icon + brand name) — single source in
     src/model/providerIdentity.ts, injected here at load (CSP forbids a
     shared stylesheet). */
  /*KARST_PROVIDER_CSS*/

  /* The stage graph as ONE OBJECT the ticket travels through, not seven circles
     joined by connectors with a band beneath. The current stage is the WIDE
     segment and every other is compact — that is what fits seven stages into a
     narrow panel, and it is what removed the old 560px floor and the sideways
     scroll with it.

     `fix` is NOT a segment. STAGE_GRAPH reaches it only by a failed verdict and
     its only edge returns to uat, so nothing can ever be after it; it is a retry
     cycle on the gate that failed, and it is drawn INSIDE that gate (.fixm).
     Drawing it as a seventh station bought permanent layout for a stage most
     tickets never enter, and left a control on screen reading `fix idle`.

     Status is never colour alone (UI-R28): every state also carries a distinct
     glyph, failed adds a hatch, and needs-you adds the reason in words plus the
     action — so the track survives colourblindness and high-contrast themes. */
  .stepper{margin:var(--k-space-8) 0 var(--k-space-9);
    padding:calc(var(--k-space-6) + var(--k-space-1)) var(--k-space-4) var(--k-space-4);
    border:var(--k-border-w) solid var(--k-border);
    border-radius:calc(var(--k-radius-lg) + var(--k-border-w));background:var(--k-surface)}
  .railwrap{padding-top:var(--k-space-3)}

  /* Named geometry handles. The notch depth is what the horizontal paddings and
     the clip-path below are BOTH derived from, so the two can never drift apart —
     that is why it is a variable rather than three copies of one number. All but
     the lane height resolve to scale tokens; the lane height is a component
     dimension with no scale match (the closed 0–26px scale stops well short of a
     control strip), the same UI-R04 exception the deleted 560px floor carried. */
  .track{position:relative;--trk-h:46px;
    --trk-notch:var(--k-space-6);--trk-tick-w:var(--k-space-2);--trk-tick-h:var(--k-space-6);
    /* Half the lane and the length of one chevron edge. Both exist only so the
       focus ring below can be inset PERPENDICULARLY to that edge; they are
       derived from the two dimensions above, never written down, so a change to
       either keeps the ring parallel to the shape it outlines. */
    --trk-half:calc(var(--trk-h) / 2);
    --trk-diag:hypot(var(--trk-notch),var(--trk-half));
    /* The lane's radius as seen from INSIDE its border — what a ring flush to the
       first or last segment must curve by to sit on the lane's own corner rather
       than be cut square by it. */
    --trk-r:calc(var(--k-radius-lg) - var(--k-border-w))}

  /* overflow-x:auto, NEVER hidden. The three degradation steps below keep the
     track inside its lane at every width a VS Code panel can be dragged to (300px,
     measured across the eight cases in docs/design/stages/variant-e-track.html),
     so this scrollbar is unreachable in practice — but if a width ever gets past
     them, the honest failure is a scrollbar the user can act on. overflow:hidden
     is what turned an over-wide track into an INVISIBLE defect: the current
     segment's own action button was clipped away with nothing to say so. */
  .lane{display:flex;align-items:stretch;height:var(--trk-h);
    border-radius:var(--k-radius-lg);background:var(--k-surface-sunken);
    border:var(--k-border-w) solid var(--k-border);
    overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}

  /* A segment is a WRAPPER, not a button: it holds the select control and, when
     the stage is parked on the user, the action control too — and a <button> may
     not contain a <button> (nested, the parser closes the outer one and the whole
     track loses its structure). The chevron clip and the wash live here.

     Each segment carries its stage's colour via the shared stg-<stage> token
     (model/stagePalette), the SAME token the sidebar chip uses, so a stage is the
     identical hue in both views. A stageKey with no stg-* class falls through to
     this neutral default rather than rendering uncoloured. */
  /* NOTE: this rule deliberately sets NEITHER `color` NOR `--stg-color`. The
     stage hue arrives on the same element from the injected `stg-<stage>` classes
     (model/stagePalette), whose specificity is (0,1,0) — a scoped `.track .seg`
     is (0,2,0) and would beat them at any source order, which paints every
     travelled segment neutral grey and silently kills the one thing the wash
     exists to say. The old `.st` rule tied at (0,1,0) and lost to the later
     injection; scoping is what broke that. Status classes below are (0,3,0) and
     override the hue ON PURPOSE. */
  .track .seg{position:relative;display:flex;align-items:center;gap:var(--k-space-3);
    flex:0 0 auto;min-width:0;
    padding:0 var(--k-space-6) 0 calc(var(--trk-notch) + var(--k-space-5));
    clip-path:polygon(0 0,calc(100% - var(--trk-notch)) 0,100% 50%,
      calc(100% - var(--trk-notch)) 100%,0 100%,var(--trk-notch) 50%);
    margin-left:calc(var(--trk-notch) * -1);
    transition:background var(--k-dur-base) var(--k-ease-standard)}
  .track .seg:first-child{margin-left:0;padding-left:var(--k-space-6);
    clip-path:polygon(0 0,calc(100% - var(--trk-notch)) 0,100% 50%,
      calc(100% - var(--trk-notch)) 100%,0 100%)}
  .track .seg:last-child{padding-right:var(--k-space-7);
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%,var(--trk-notch) 50%)}
  .track .seg:hover{background:var(--k-surface-hover)}

  /* The select control fills the wrapper, so the WHOLE segment is the hit area
     while still being one real <button> for Tab and Enter (UI-R09). */
  .track .seg .pick{position:absolute;inset:0;background:transparent;border:0;padding:0;cursor:pointer}
  /* The rectangular baseline, and the fallback if the ring below cannot be
     computed. It is honest about what it is: two bars, because an `outline` is
     a rectangle and the chevron clip cuts its left and right strokes away. */
  .track .seg .pick:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);
    outline-offset:calc(var(--k-focus-offset) * -1)}

  /* Selection is a MARK, never a fill — status already owns fill and the stage
     owns hue, and all three must stay independently readable, so it keeps its
     own off-ramp purple (the shared categorical token, UI-R08).
     This is the BASELINE, replaced by the chevron ring above wherever that can
     be computed. It is an inset shadow on the SEGMENT rather than a ring on the
     inset `.pick` because `clip-path` clips a child's rendering: a rectangular
     ring lost its left and right strokes inside the two notches, and at the ends
     of the lane its square corners sat inside the lane's own `--k-radius-lg`, so
     the mark read as SHIFTED off the block it marks. An underline is clipped by
     the very polygon that draws the segment, so it cannot disagree with the
     shape — it just says less than the ring does. */
  .track .seg.sel{box-shadow:inset 0 calc(var(--k-border-w) * -3) 0 var(--k-series-2)}

  /* ── the selection and focus rings, in the segment's own shape ───────────
     An outline (or an inset shadow — same rectangle) cannot outline a chevron:
     `clip-path` clips a CHILD's rendering, so the vertical strokes fall inside
     the two notches and are cut, leaving a border that visibly does not close
     around the arrow it belongs to. The first attempt at that was the selection
     ring; the underline it became read as a stray bottom border on the segment,
     which is the same complaint from the other side — a mark that is not the
     shape it marks. So the ring is drawn as a SHAPE: `.pick` is filled and
     clipped to the chevron MINUS a smaller chevron (`evenodd`), which leaves
     exactly the band between them.

     ONE shape, two states. Selection wears the shared categorical purple
     (UI-R08) and focus wears `--k-focus` and OUTRANKS it — a focused segment is
     already the selected one in every case the user can reach by keyboard, and
     two concentric bands say nothing the colour does not. `aria-pressed` carries
     selection either way, so nothing is lost while the ring is showing focus.

     The inner chevron is the outer one offset PERPENDICULARLY — not by the same
     px horizontally and vertically, which would splay the diagonals and taper
     the ring. For an edge of length `--trk-diag` over a half-height of
     `--trk-half`, an inset of `q` moves the tip by `q · diag / half` and the
     top/bottom corners by `q · (diag ∓ notch) / half` (the notch is concave on
     the left, convex on the right — hence the two signs). All three fall out of
     the two dimensions the segment is already drawn from, so the ring stays
     parallel to the shape at any lane height or notch depth.

     The outer boundary IS the segment's own polygon, written out verbatim rather
     than inset: an inset one read as a hairline gap all the way round, and at the
     ends of the lane its square corners sat inside the lane's `--k-radius-lg` —
     the same "mark shifted off its block" complaint in a smaller form. Flush, the
     lane's own rounded overflow clips the ring exactly as it clips the segment,
     so the corners agree by construction instead of by arithmetic.

     The hole is joined to the outer boundary by a ZERO-AREA SLIT, and every point
     of it is load-bearing. `polygon()` is ONE contour with no move-to, so the two
     implicit connectors that reach the hole REPLACE whatever inner edge they jump
     across — and that edge is simply gone from the shape, taking its band with it.
     Both earlier orderings lost the left stroke that way: same-direction contours
     cross in the middle of it, reversed ones drop the inner notch edge. So the
     outer loop is CLOSED first (its start point repeated), and the inner loop both
     starts and ends at the same point, which makes the two connectors coincident
     and opposite — they cancel, and every real edge survives.

     @supports, because a browser without `hypot()` (or without length division
     in `calc()`) would drop the `clip-path` and keep the `background` — a solid
     fill over the whole segment. The guard keeps such a browser on the plain
     outline and the underline above, both of which still say what they mean. */
  @supports (width: calc(1px * hypot(1px,1px) / 1px)){
    .track .seg.sel{box-shadow:none}
    .track .seg.sel .pick,
    .track .seg .pick:focus-visible{
      /* q: how far the inner edge sits from the segment's edge, i.e. the ring's
         own width. Two focus widths, not one — a 1px band is what the diagonals
         eat first, and neither of these marks may be the thing that degrades. */
      --rq:calc(var(--k-focus-w) * 2);
      --rt:calc(var(--rq) * var(--trk-diag) / var(--trk-half));
      --rr:calc(var(--rq) * (var(--trk-diag) - var(--trk-notch)) / var(--trk-half));
      --rl:calc(var(--rq) * (var(--trk-diag) + var(--trk-notch)) / var(--trk-half));
      background:var(--k-series-2);
      clip-path:polygon(evenodd,
        0 0,
        calc(100% - var(--trk-notch)) 0,
        100% 50%,
        calc(100% - var(--trk-notch)) 100%,
        0 100%,
        var(--trk-notch) 50%,
        0 0,
        var(--rl) var(--rq),
        calc(var(--trk-notch) + var(--rt)) 50%,
        var(--rl) calc(100% - var(--rq)),
        calc(100% - var(--trk-notch) - var(--rr)) calc(100% - var(--rq)),
        calc(100% - var(--rt)) 50%,
        calc(100% - var(--trk-notch) - var(--rr)) var(--rq),
        var(--rl) var(--rq))}
    /* The ends of the lane have one notch, not two — same rule as the segment
       shapes above, and for the same reason: a wedge at the outer end would
       point at nothing. A square corner insets by q in both axes, and takes the
       lane's radius: `clip-path` cannot round a corner, so a flush ring met the
       lane's rounded end square and the lane's own overflow cut the difference
       away. `border-radius` clips the fill, so the two curve together. */
    .track .seg:first-child.sel .pick,
    .track .seg:first-child .pick:focus-visible{
      border-radius:var(--trk-r) 0 0 var(--trk-r);
      clip-path:polygon(evenodd,
        0 0,
        calc(100% - var(--trk-notch)) 0,
        100% 50%,
        calc(100% - var(--trk-notch)) 100%,
        0 100%,
        0 0,
        var(--rq) var(--rq),
        var(--rq) calc(100% - var(--rq)),
        calc(100% - var(--trk-notch) - var(--rr)) calc(100% - var(--rq)),
        calc(100% - var(--rt)) 50%,
        calc(100% - var(--trk-notch) - var(--rr)) var(--rq),
        var(--rq) var(--rq))}
    .track .seg:last-child.sel .pick,
    .track .seg:last-child .pick:focus-visible{
      border-radius:0 var(--trk-r) var(--trk-r) 0;
      clip-path:polygon(evenodd,
        0 0,
        100% 0,
        100% 100%,
        0 100%,
        var(--trk-notch) 50%,
        0 0,
        var(--rl) var(--rq),
        calc(var(--trk-notch) + var(--rt)) 50%,
        var(--rl) calc(100% - var(--rq)),
        calc(100% - var(--rq)) calc(100% - var(--rq)),
        calc(100% - var(--rq)) var(--rq),
        var(--rl) var(--rq))}
    /* Last, so focus wins the colour on a segment that is both. The outline goes
       with it — the ring IS the indicator now (UI-R23). */
    .track .seg .pick:focus-visible{outline:0;background:var(--k-focus)}}
  .track .seg > *:not(.pick){position:relative;z-index:1;pointer-events:none}
  /* The two REAL controls take their events back from the select overlay. */
  .track .seg > .go,.track .seg > .fixm{pointer-events:auto}

  /* Untravelled: neutral, and explicitly so. A pending segment must not wear its
     stage hue at full strength — that is what "travelled ground" means here. */
  .track .seg.pending{color:var(--k-text-faint)}
  /* Travelled segments carry their own stage hue as a wash, so the route changes
     colour as the ticket advances — the one thing a flat progress bar cannot say.
     `--stg-color` carries its own fallback: a stage key with no palette class (a
     row from a newer schema) then reads neutral instead of dropping the whole
     declaration and rendering unwashed. */
  .track .seg.passed{background:color-mix(in srgb,var(--stg-color,var(--k-pending)) 20%,transparent);
    color:var(--stg-color,var(--k-pending))}
  /* Ordinary body text on the wash, NOT `--k-success-fg`. That token is the
     knockout foreground (`--vscode-editor-background`), and it is paired with a
     saturated feedback FILL — on a 34% wash of the stage hue over the lane it
     resolves to nearly the surface it sits on: the running segment's own name
     came out dark-on-dark in a dark theme and white-on-lavender in a light one,
     which is the widest label on the track and the one that says where the
     ticket is (UI-R29). The wash strength was chosen to carry body text. */
  .track .seg.running{background:color-mix(in srgb,var(--stg-color,var(--k-pending)) 34%,transparent);
    color:var(--k-text)}
  /* Failed reads as a break in the surface: hatched, never a flat fill. */
  .track .seg.failed{color:var(--k-failed);
    background-image:repeating-linear-gradient(135deg,
      color-mix(in srgb,var(--k-failed) 26%,transparent) 0 var(--k-space-3),
      transparent var(--k-space-3) var(--k-space-6))}
  /* Skipped is the one status that leaves the stage ramp: a stage that never ran
     has no identity to assert, so it reads neutral. */
  .track .seg.skipped{background:color-mix(in srgb,var(--k-pending) 22%,transparent);color:var(--k-text-faint)}
  /* Needs-you OUTRANKS the stage: the stage is no longer the point, the human is.
     Amber wash + pause glyph + the reason in words + the action = four carriers. */
  .track .seg.needs{background:color-mix(in srgb,var(--k-attention) 30%,transparent);
    color:var(--k-attention);animation:seg-breathe var(--k-dur-flash-done) ease-in-out infinite}
  @keyframes seg-breathe{0%,100%{background:color-mix(in srgb,var(--k-attention) 30%,transparent)}
    50%{background:color-mix(in srgb,var(--k-attention) 16%,transparent)}}

  /* min-content, not 0: at 0 the current segment absorbs every overflow by
     shrinking, so its own action button is clipped by the chevron AND the lane
     never reports an overflow — the degradation below would never fire. The extra
     right padding is not spacing either: clip-path clips CHILDREN, so the notch
     was slicing the action button's right edge ("Resolve" rendered as "Re"). */
  .track .seg.cur{flex:1 1 auto;min-width:min-content;padding-right:var(--k-space-9)}

  .track .seg .g{flex:none;width:var(--k-space-7);height:var(--k-space-7);
    display:grid;place-items:center;font-size:var(--k-text-xs);font-weight:var(--k-weight-semibold)}
  .track .seg .nm{font-size:var(--k-text-xs);letter-spacing:.05em;text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .track .seg.cur .nm{font-size:var(--k-text-md);font-weight:var(--k-weight-semibold);
    letter-spacing:.03em;flex:none}
  .track .seg .mt{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);opacity:.85;
    white-space:nowrap;padding-left:var(--k-space-4);margin-left:var(--k-space-1);
    border-left:var(--k-border-w) solid currentColor;flex:none}
  /* Inside the current segment the META is what gives way, never the stage name
     and never the action: an unbounded fact (a repo pair, a conflict summary) must
     not be able to push the button it belongs to out of the clip. */
  .track .seg.cur .mt{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}

  /* The needs-you control. NOT `.act` — that is the activity strip's class. It is
     NAVIGATIONAL: it scrolls the control that owns the action into view and
     focuses it, so the rail never becomes a second actor for an irreversible step.
     merge is per-repo and its confirmation modal lives in the host, so a
     rail-level Merge button could neither pick a repo nor carry the confirmation. */
  .track .seg .go{font:inherit;font-size:var(--k-text-2xs);border:var(--k-border-w) solid currentColor;
    border-radius:var(--k-radius-sm);background:transparent;color:inherit;
    padding:var(--k-space-1) var(--k-space-4);cursor:pointer;flex:none;margin-left:auto}
  .track .seg .go:hover{background:color-mix(in srgb,currentColor 18%,transparent)}
  .track .seg .go:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);
    outline-offset:var(--k-focus-offset)}

  /* impl's approach lives INSIDE impl's segment: one pip per declared phase, the
     reported ones filled. No stem, no chip, nothing hanging off the track. A
     hollow pip means "not reported", NEVER "not done" — karst records no
     per-phase state it was not explicitly told. */
  .track .seg .pips{display:flex;align-items:center;gap:var(--k-space-2);flex:none;
    margin-left:auto;padding-left:var(--k-space-5)}
  .track .seg .pips .p{width:var(--k-space-3);height:var(--k-space-3);
    border-radius:var(--k-radius-circle);border:var(--k-border-w) solid currentColor;opacity:.55}
  .track .seg .pips .p.on{background:currentColor;opacity:1}
  .track .seg .pips .pn{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    margin-left:var(--k-space-2);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ── the retry meter ──────────────────────────────────────────────────────
     One tick per allowed attempt, filled per attempt spent, inside the gate being
     retried. TICKS AND NOT A BAR: a bar reads as progress toward completion, and
     spending fix attempts is the opposite of progress. It costs zero layout on a
     ticket that never looped, and it makes "one retry left before this parks"
     visible — which karst shows nowhere else.

     It is also a <button>: it is how `fix` stays selectable now that the node is
     gone, and it sits on the stage the loop belongs to, which is where a user
     would look for it. */
  .track .fixm{display:inline-flex;align-items:center;gap:var(--k-space-3);flex:none;
    font:inherit;background:transparent;border:0;border-left:var(--k-border-w) solid currentColor;
    padding:0 0 0 var(--k-space-4);margin-left:var(--k-space-1);color:inherit;cursor:pointer}
  .track .fixm:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);
    outline-offset:var(--k-focus-offset)}
  .track .fixm .ticks{display:inline-flex;gap:var(--k-space-1)}
  .track .fixm .tk{width:var(--trk-tick-w);height:var(--trk-tick-h);border-radius:var(--k-radius-xs);
    border:var(--k-border-w) solid var(--stage-fix);opacity:.45;display:inline-block}
  .track .fixm .tk.on{background:var(--stage-fix);opacity:1}
  .track .fixm .tx{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    color:var(--stage-fix);white-space:nowrap}
  /* review ─fail→ fix ─pass→ uat is the one loop that lands on a gate it did not
     leave. Said in WORDS, inside the segment — a backwards arc across the track is
     the shape this design exists to avoid. */
  .track .fixm .ret{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    color:var(--stage-fix);white-space:nowrap}
  /* Spent-but-idle is a RECORD, not an alarm: the meter stays so the cost of the
     ticket is still legible, and stops claiming the ticket's attention. */
  .track .fixm.spent .tk{border-color:var(--k-text-faint)}
  .track .fixm.spent .tk.on{background:var(--k-text-faint)}
  .track .fixm.spent .tx,.track .fixm.spent .ret{color:var(--k-text-faint)}

  /* ── narrow widths: THREE measured steps ──────────────────────────────────
     Measured, not keyed to a breakpoint: the threshold depends on the current
     stage's name length and on whether a meter is riding along. In order of what
     costs least to lose — SNUG drops what a segment merely ANNOTATES and keeps
     every name; TIGHT drops the names too; BARE is the floor, where the passed-by
     segments become position markers and the current segment sheds its own
     annotations, keeping glyph, name and action.

     THREE, not two: two was the first draft, and at a 397px lane five of the eight
     mockup cases were still over after TIGHT. Three clear every case to 300px.

     Anything a step drops is already in the accessible name, which never
     degrades — the meter's attempt count and its return target included. */
  .track.snug .seg:not(.cur) .mt,
  .track.snug .seg:not(.cur) .fixm .tx{display:none}
  .track.snug .seg:not(.cur) .fixm{padding-left:var(--k-space-3);margin-left:0}
  .track.snug .seg.cur .pips .pn{display:none}
  .track.tight .seg:not(.cur) .nm{display:none}
  .track.tight .seg:not(.cur){padding-left:var(--k-space-8);padding-right:var(--k-space-4)}
  .track.tight .seg:not(.cur) .fixm .ret{display:none}
  /* BARE. The non-current segments stop carrying anything but their position and
     their status hue; min-width:0 lets them give up the last of their padding
     rather than pushing the current segment's content under the clip. */
  .track.bare .seg:not(.cur){padding-left:var(--k-space-6);padding-right:var(--k-space-2);min-width:0}
  .track.bare .seg:not(.cur) .fixm{display:none}
  .track.bare .seg:not(.cur) .g{width:var(--k-space-6)}
  .track.bare .seg.cur{padding-right:var(--k-space-8)}
  /* At the floor the current segment gives up its ANNOTATIONS — the meta, the
     approach pips, and the meter's numeral and return label (the ticks still carry
     the count, and the accessible name carries it in words either way). Never the
     name, never the action button. */
  .track.bare .seg.cur .mt,
  .track.bare .seg.cur .pips,
  .track.bare .seg.cur .fixm .tx,
  .track.bare .seg.cur .fixm .ret{display:none}
  /* …and its name shortens to the stage KEY, which is what every other segment
     shows anyway. "Implementation" is 113px of a 300px panel; `impl` is 30. The
     abbreviation is the same word the graph uses, so it is a shortening rather
     than a different label. Both forms ship and CSS picks one — swapping the text
     in JS would mean re-rendering on every resize. */
  .track .seg .nm .abbr{display:none}
  .track.bare .seg.cur .nm .full{display:none}
  .track.bare .seg.cur .nm .abbr{display:inline}

  /* Running = a live spinner, not a glyph. ⟳ misreads as "reload/retry", which is
     the wrong affordance on a clickable segment. An animating ring is the one mark
     that reads as work in progress. Under reduced motion it stops as a broken ring
     — still shape-distinct from ✓ ✕ · –, so status never rides on colour alone. */
  .spin{display:block;border-radius:var(--k-radius-circle);
    border:calc(var(--k-border-w) * 2) solid currentColor;border-top-color:transparent;
    animation:spin var(--k-dur-spin) linear infinite}
  .track .seg .spin{width:var(--k-space-6);height:var(--k-space-6)}
  .oglyph .spin{width:var(--k-space-4);height:var(--k-space-4);margin:0 auto;
    border-width:calc(var(--k-border-w) * 1.5);color:var(--k-running)}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .spin,.track .seg.needs{animation:none}
    /* The disclosure marker's rotation is motion; the open state itself is
       still visible in the marker's resting orientation. (UI-R30) */
    .pchev{transition:none}
  }

  /* ── activity strip: what happens inside the SELECTED stage ───────────── */
  .act{margin:var(--k-space-7) var(--k-space-3) var(--k-space-1);border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-lg)}
  .act .ahead{display:flex;align-items:center;gap:var(--k-space-4);padding:var(--k-space-4) var(--k-space-6);border-bottom:var(--k-border-w) solid var(--k-border)}
  .act .aname{font-size:var(--k-text-md);font-weight:var(--k-weight-semibold)}
  .act .adot{width:var(--k-space-3);height:var(--k-space-3);border-radius:var(--k-radius-circle);background:var(--k-running);flex:none}
  .act .adot.wait{background:var(--k-attention)} .act .adot.idle{background:var(--k-pending)}
  .act .adot.fail{background:var(--k-failed)} .act .adot.done{background:var(--k-passed)}
  .act .adot.pend{background:transparent;border:calc(var(--k-border-w) * 2) solid var(--k-pending);width:var(--k-space-4);height:var(--k-space-4)}
  .act .aclock{margin-left:auto;font-family:var(--k-font-mono);font-size:var(--k-text-sm);color:var(--k-text-faint)}
  /* Viewing a stage that is not the current one — say so, and offer the way
     back. Without this the strip silently contradicts the Now line. */
  .act.viewing{border-color:var(--k-series-2)}
  .act .vbar{display:flex;align-items:center;gap:var(--k-space-4);padding:var(--k-space-3) var(--k-space-6);font-size:var(--k-text-xs);
    color:var(--k-text-dim);background:var(--k-surface-hover);border-bottom:var(--k-border-w) solid var(--k-border)}
  .act .vbar .sp{margin-left:auto}
  .act .blurb{padding:var(--k-space-5) var(--k-space-7);font-size:var(--k-text-sm);color:var(--k-text-dim)}
  .act .ops{padding:var(--k-space-2) var(--k-space-3) var(--k-space-4)}
  .op{display:flex;align-items:center;gap:var(--k-space-5);padding:var(--k-space-2) var(--k-space-4);border-radius:var(--k-radius-md)}
  .op:hover{background:var(--k-surface-hover)}
  .op .oglyph{width:calc(var(--k-space-6) + var(--k-space-1));text-align:center;font-size:var(--k-text-xs);color:var(--k-text-faint)}
  .op.pass .oglyph{color:var(--k-passed)} .op.run .oglyph{color:var(--k-running)}
  .op.fail .oglyph{color:var(--k-failed)} .op.wait .oglyph{color:var(--k-attention)}
  /* 82px has no scale match — the name column's minimum is set by the longest
     op label karst emits ("Implementation"), not a spacing value. */
  .op .oname{font-size:var(--k-text-md);min-width:82px}
  .op .ocmd{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-dim);flex:1;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  .op .odur{font-family:var(--k-font-mono);font-size:var(--k-text-sm);color:var(--k-text-faint)}
  .op.pending{opacity:.5}
  /* A gate the repo cannot answer, or a phase karst cannot observe, is not a
     failure — say so plainly instead of dressing it as a status. */
  .op.note .ocmd{font-style:italic;opacity:.75}
  /* A withdrawn question, not an unanswerable one: dimmed like `pending` but
     glyphed distinctly, so it never reads as a gate still to come. */
  .op.skip .oglyph{color:var(--k-text-faint)}
  .op.skip{opacity:.7}
  .op.skip .ocmd{font-style:italic}

  /* ── inside ledger: process rows with evidence (the inside redesign) ────
     One generic row per process. Everything on the row — status, label,
     detail, counts, identity, tokens, action id — arrives pre-built in the
     snapshot; the webview never derives a verdict or a label from prose. The
     disclosure is a native <details>/<summary> (B3, UI-R09), never a
     clickable div. */
  .act .procs{padding:var(--k-space-2) var(--k-space-3) var(--k-space-4)}
  .proc{border-radius:var(--k-radius-md)}
  .proc:hover{background:var(--k-surface-hover)}
  .proc .prow{display:flex;flex-wrap:wrap;align-items:center;column-gap:var(--k-space-5);row-gap:var(--k-space-2);padding:var(--k-space-3) var(--k-space-4)}
  .proc .pglyph{width:calc(var(--k-space-6) + var(--k-space-1));text-align:center;font-size:var(--k-text-xs);color:var(--k-text-faint);flex:none}
  .proc.pass .pglyph{color:var(--k-passed)} .proc.run .pglyph{color:var(--k-running)}
  .proc.fail .pglyph{color:var(--k-failed)} .proc.wait .pglyph{color:var(--k-attention)}
  .proc .pname{font-size:var(--k-text-md);font-weight:var(--k-weight-medium)}
  /* The recorded execution identity — `execution` when the process ran,
     `configuredExecution` when it has not. One compact chip, never both: they
     make two different claims and must not read as one. */
  .proc .pchip{display:inline-flex;align-items:center;gap:var(--k-space-2);padding:var(--k-space-1) var(--k-space-3);
    border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-pill);
    font-size:var(--k-text-2xs);color:var(--k-text-dim);white-space:nowrap}
  .proc .pchip::before{content:'';width:var(--k-space-2);height:var(--k-space-2);border-radius:var(--k-radius-circle);background:var(--k-text-faint)}
  /* The agent-core mark replaces the quiet dot: two identity marks in one chip
     would compete, and the icon IS the identity (handoff §5). The injected
     .agenticon rules own the icon's box; this only stops the dot. */
  .proc .pchip.with-icon::before{display:none}
  .proc .ptok{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);color:var(--k-text-faint);white-space:nowrap}
  .proc .pdetail{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-dim);flex:1;min-width:0;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .proc .pright{margin-left:auto;display:flex;align-items:center;gap:var(--k-space-4);flex:none}
  .proc .pmeta{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-faint);white-space:nowrap}
  .proc.pending{opacity:.5}
  .proc.note .pdetail{font-style:italic;opacity:.75}
  .proc.skip .pdetail{font-style:italic;opacity:.7}
  /* The disclosure is a native <details>/<summary> (B3, UI-R09): the process
     row IS the summary, so keyboard operability comes from the element, never
     from a click handler. The marker is decorative (aria-hidden) and its
     rotation states the open state; the summary's own text is the accessible
     name. `list-style` + the webkit marker rule silence the default triangle
     so the marker below is the only affordance. */
  .proc summary{list-style:none;cursor:pointer}
  .proc summary::-webkit-details-marker{display:none}
  .proc summary:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  .proc .pchev{flex:none;color:var(--k-text-faint);font-size:var(--k-text-md);line-height:1;
    transition:transform var(--k-dur-fast) var(--k-ease-standard)}
  .proc[open] .pchev{transform:rotate(90deg)}
  .proc .pev{border-top:var(--k-border-w) solid var(--k-border);margin:0 var(--k-space-4) var(--k-space-3);padding:var(--k-space-3) 0}
  .erow{display:flex;flex-wrap:wrap;align-items:baseline;column-gap:var(--k-space-4);row-gap:var(--k-space-1);padding:var(--k-space-2) var(--k-space-4);border-radius:var(--k-radius-md)}
  .erow:hover{background:var(--k-surface-hover)}
  .erow .eglyph{width:calc(var(--k-space-6) + var(--k-space-1));text-align:center;font-size:var(--k-text-xs);color:var(--k-text-faint);flex:none}
  .erow.pass .eglyph{color:var(--k-passed)} .erow.fail .eglyph{color:var(--k-failed)}
  .erow.run .eglyph{color:var(--k-running)} .erow.wait .eglyph{color:var(--k-attention)}
  /* The timeline's relationship arrow: the same execution continuing through
     a provider switch or resume. Aligned with the status glyph column above,
     so the segments read as one spine without becoming a diagram. */
  .erow .econn{width:calc(var(--k-space-6) + var(--k-space-1));text-align:center;font-size:var(--k-text-sm);color:var(--k-text-dim);flex:none}
  .erow .elabel{font-size:var(--k-text-sm);color:var(--k-text)}
  .erow .edetail{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-dim);flex:1;min-width:0;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .erow .edur{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-faint)}
  .erow .eact{margin-left:auto;flex:none}
  /* ── per-kind evidence layouts (B2): one rule per closed kind (UI-R10) ──
     The kind class rides the evidence block (`pev-<kind>`, emitted by the
     per-kind renderer in the script), so a kind-specific treatment hangs off
     one selector. All values are tokens (UI-R04/R05). */
  .pev-rows .erow{}
  .pev-gates .erow{}
  .pev-findings .erow{}
  .pev-commits .erow{}
  .pev-prs .erow{}
  .pev-recovery .erow{}
  /* The status word — the visible state, never colour alone (UI-R06). The
     row's own status class is already on the row, so the word inherits the
     ramp through the scoped rules below. */
  .pev .estatus{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);color:var(--k-text-faint);white-space:nowrap}
  .erow.pass .estatus{color:var(--k-passed)} .erow.fail .estatus{color:var(--k-failed)}
  .erow.run .estatus{color:var(--k-running)} .erow.wait .estatus{color:var(--k-attention)}
  .erow.note .estatus,.erow.pending .estatus{color:var(--k-text-dim)}
  /* The timeline holds its cells on one line so the connector spine and the
     time column stay aligned down the rows (handoff §6 impl, §10 narrow). */
  .pev-timeline .erow{flex-wrap:nowrap}
  .pev-timeline .etime{margin-left:auto;font-family:var(--k-font-mono);font-size:var(--k-text-2xs);color:var(--k-text-faint);white-space:nowrap}
  /* The receipt is a list, not a status readout: no glyph column, one line
     per delivered fact (handoff §6 done). */
  .pev-receipt .erow{flex-wrap:nowrap;gap:var(--k-space-2)}
  /* A live operation in the stage header: one current process, spinner +
     label, host-worded. Never a second process row and never a verdict. */
  .act .alive{display:inline-flex;align-items:center;gap:var(--k-space-2);font-size:var(--k-text-xs);color:var(--k-text-dim);
    font-family:var(--k-font-mono);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .act .alive .spin{width:var(--k-text-xs);height:var(--k-text-xs);flex:none;color:var(--k-running)}
  .alive .adetail{color:var(--k-text-dim);margin-left:var(--k-space-2)}
  .alive .adur{color:var(--k-text-dim);margin-left:var(--k-space-2);font-variant-numeric:tabular-nums}

  /* The fault card — the one loud element on the page, because a failure is the
     one moment the user MUST read. Machine truth (reason, timings) is monospace. */
  .fault{margin:var(--k-space-7) var(--k-space-3) var(--k-space-1);padding:var(--k-space-5) var(--k-space-6);
    border-left:calc(var(--k-border-w) * 3) solid var(--k-failed);
    border-radius:0 var(--k-radius-md) var(--k-radius-md) 0;background:var(--vscode-inputValidation-errorBackground,transparent)}
  .fault .ftitle{font-size:var(--k-text-md);font-weight:var(--k-weight-semibold);margin-bottom:var(--k-space-3)}
  .fault .freason{font-family:var(--k-font-mono);font-size:var(--k-text-sm);white-space:pre-wrap;word-break:break-word}
  .fault .fmeta{font-family:var(--k-font-mono);font-size:var(--k-text-sm);color:var(--k-text-dim);margin-top:calc(var(--k-space-4) - var(--k-border-w))}
  .fault .facts{margin-top:var(--k-space-6)}

  /* The "Now" line — one plain sentence naming what is happening and the next
     action the user controls. Built host-side (state.now) so the copy is tested. */
  .now{display:flex;flex-wrap:wrap;align-items:center;gap:var(--k-space-5);margin:var(--k-space-6) var(--k-space-3) var(--k-space-1);padding-top:calc(var(--k-space-6) - var(--k-border-w));
    border-top:var(--k-border-w) solid var(--k-border);font-size:var(--k-text-md);color:var(--k-text)}
  .now .ntext{flex:1}
  .now .now-sub{flex-basis:100%;font-size:var(--k-text-xs);color:var(--k-text-dim)}
  /* The ship-in-progress spinner rides in the Now line at the gate-node size.
     .spin is display:block, so it needs an explicit box here. */
  .now .spin{width:var(--k-text-base);height:var(--k-text-base);flex:none;color:var(--k-running)}
  /* The resolved-success flash: a brief "Shipped ✓" beside the settled line. */
  .now .shipbadge{font-weight:var(--k-weight-semibold);flex:none}
  .now .shipbadge.ok{color:var(--k-passed)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--k-space-7)}
  .panel{border:var(--k-border-w) solid var(--k-border);border-radius:calc(var(--k-radius-lg) + var(--k-border-w));background:var(--k-surface);overflow:hidden}
  .panel.span{grid-column:1 / -1}
  .phead{display:flex;align-items:center;gap:var(--k-space-4);min-height:var(--phead-h);padding:var(--k-space-4) var(--k-space-7);
    border-bottom:var(--k-border-w) solid var(--k-border);font-size:var(--k-text-md);font-weight:var(--k-weight-semibold)}
  .phead .count{margin-left:auto;font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-faint);font-weight:var(--k-weight-normal)}
  /* An icon-only panel control, built on `.k-iconbtn` (UI-R07) — quiet until
     hovered, since it sits in a header, not a row of actions, and a filled
     button there would read as the panel's subject. */
  .phead .iconbtn{margin-left:auto}
  .pbody{padding:var(--k-space-3) var(--k-space-4) var(--k-space-5)}
  .empty{padding:var(--k-space-7) var(--k-space-6);color:var(--k-text-faint);font-size:var(--k-text-md)}

  .wt,.pr{display:flex;align-items:center;gap:var(--k-space-5);padding:var(--k-space-4) var(--k-space-3);border-radius:var(--k-radius-md)}
  .wt:hover,.pr:hover{background:var(--k-surface-hover)}
  /* 74px has no scale match — set by the longest repo label karst has shown in
     practice, not a spacing value. */
  .wt .wrepo{font-size:var(--k-text-md);min-width:74px}
  .wt .wacts,.pr .pacts{margin-left:auto;display:flex;gap:var(--k-space-2)}
  .wt .wbranch{display:flex;align-items:center;gap:var(--k-space-1);min-width:0;flex:1}
  .wt .wbr{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .wt .wstats{display:flex;gap:var(--k-space-3);font-family:var(--k-font-mono);font-size:var(--k-text-xs);white-space:nowrap}
  .wt .wadd{color:var(--k-passed)}
  .wt .wdel{color:var(--k-failed)}
  /* Built on `.k-chip` (UI-R08: the same pill primitive as keypill/fixtoggle/
     approach .aid); only the monospace uppercase treatment stays local. Every
     status renders one of the variants below, so the chip's own default fill
     never shows in practice. */
  .pr .pst{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.4px}
  /* Live PR state at a glance: open green, merged purple (the shared
     categorical token, UI-R08), closed red, draft muted — every fill is paired
     with the SAME "text on a filled surface" token the design system already
     defines for success/danger (UI-R29: paired tokens, never a hand-picked
     foreground). */
  .pr .pst-open{background:var(--k-success);color:var(--k-success-fg)}
  .pr .pst-merged{background:var(--k-series-2);color:var(--k-success-fg)}
  .pr .pst-closed{background:var(--k-danger);color:var(--k-danger-fg)}
  .pr .pst-draft,.pr .pst-unknown{background:var(--k-text-faint);color:var(--k-success-fg)}
  .pr .pnum{font-family:var(--k-font-mono);color:var(--k-link)}
  .pr .ptitle{flex:1;font-size:var(--k-text-md)}
  /* Merge verdict, indented under its PR so it reads as a fact ABOUT that PR and
     never as a second pull request. Shape (filled/hollow/ring) carries the state
     alongside colour, matching the servers panel's dot. */
  .mg{display:flex;align-items:center;gap:var(--k-space-4);margin:calc(var(--k-space-1) * -1) 0 var(--k-space-3) var(--k-space-6);
    padding:var(--k-space-1) var(--k-space-3);font-size:var(--k-text-sm);color:var(--k-text-dim)}
  .mg .mgdot{width:var(--k-space-4);height:var(--k-space-4);border-radius:var(--k-radius-circle);flex:none}
  .mg-clean .mgdot{background:var(--k-success)}
  .mg-conflicted .mgdot{background:var(--k-danger)}
  .mg-unknown .mgdot{border:calc(var(--k-border-w) * 2) solid var(--k-pending);width:var(--k-space-3);height:var(--k-space-3)}
  .mg-conflicted .mgtext{color:var(--k-danger)}
  .mg .mgtext{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mg .mgbtn{flex:none}
  /* The conflict list / the reason karst could not tell. Collapsed by default,
     like the PR comments thread further down this same panel — the count is what
     a reader scans, the detail is what they open. Capped and scrollable so a
     forty-file conflict cannot push the rest of the panel off screen. */
  .mgd{margin:calc(var(--k-space-2) * -1) 0 var(--k-space-3) var(--k-space-9);font-size:var(--k-text-sm)}
  .mgd summary{cursor:pointer;color:var(--k-link);width:fit-content}
  /* <summary> is not a <button>/<a>/<input>, so it gets no ring from the
     primitives' generic :focus-visible rule (same reasoning as the approach
     disclosure above). */
  .mgd summary:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  /* 180px has no scale match — a scroll cap sized to the panel, not a spacing
     value (same category as the servers panel's 288px below). */
  .mgdbody{max-height:180px;overflow-y:auto;margin-top:var(--k-space-2)}
  .mgfile{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-dim);word-break:break-all}

  .mgreason{white-space:pre-wrap;color:var(--k-text-dim);word-break:break-word}
  /* PR metadata: from-to, opened, merged. Indented under its PR like the merge
     verdict, so it reads as facts ABOUT that pull request. */
  .pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--k-space-3);margin:calc(var(--k-space-1) * -1) 0 var(--k-space-2) var(--k-space-6);padding:0 var(--k-space-3);
    font-size:var(--k-text-xs);color:var(--k-text-dim)}

  .pcms summary{cursor:pointer;color:var(--k-link);width:fit-content}
  .pcms summary:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  .pcm{margin:var(--k-space-3) 0 0;padding-left:var(--k-space-4);border-left:var(--k-space-1) solid var(--k-border)}
  .pcm .pcmwho{font-weight:var(--k-weight-semibold);font-size:var(--k-text-xs)}
  .pcm .pcmwhen{margin-left:var(--k-space-3);font-size:var(--k-text-sm);color:var(--k-text-faint)}
  .pcm .pcmbody{white-space:pre-wrap;color:var(--k-text-dim);font-size:var(--k-text-sm);margin-top:var(--k-space-1)}
  /* The merge control is `.k-btn--danger` (UI-R10b: the one irreversible action
     on this panel), built in markup — no bespoke color rule left here. */
  .mgbtn{flex:none}

  /* agent pill (colored by state) */
  .agent-pill{display:inline-flex;align-items:center;gap:var(--k-space-3)}
  .agent-pill .dot{width:var(--k-space-3);height:var(--k-space-3);border-radius:var(--k-radius-circle)}

  /* ===================== Servers panel ==================================
     One service is ONE LINE at every width. The panel reacts to its own grid
     column rather than the viewport, so containment is scoped to it — .panel
     is shared with Worktrees and Pull requests, which need none of this. */
  /* Visually hidden, still announced — for labels the layout drops but a screen
     reader still needs (the dot-only Status header, the filter's label). */
  .sr{position:absolute;width:var(--k-border-w);height:var(--k-border-w);padding:0;margin:calc(var(--k-border-w) * -1);overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .svpanel{container-type:inline-size}
  /* Whole-ticket controls live in the HEADER because they act on every service
     and must survive the states where the body has no rows to hang a button
     off — the empty body is exactly when Start matters most. The count
     therefore gives up the auto margin it keeps in the other panels. */
  .svpanel .phead{padding-right:var(--k-space-5)}
  .svpanel .phead .count{margin-left:0}
  .svpanel .phead .pops{margin-left:auto;display:flex;gap:var(--k-space-1)}
  .svpanel .pbody{padding:0}

  /* Icon buttons — inline SVG off a sprite (no icon font, no external asset:
     the webview CSP forbids both). Icon-only is what lets four actions share a
     row without the action column outgrowing the data. The label is not lost,
     it moves to aria-label + title, so the word survives for both pointer and
     screen reader. Built on `.k-iconbtn` (UI-R07: sizing, hover surface, focus
     ring, and the disabled/pending states all come from the primitive); `.ib`
     stays a LAYOUT+colour-only local class — the glyph's own size, and each
     action's resting hue off the shared status ramp. */
  .ib svg{width:calc(var(--k-space-6) + var(--k-space-1));height:calc(var(--k-space-6) + var(--k-space-1));display:block;

     primitive's own surface+border hover, never replacing it. */
  .ib:hover:not(:disabled) svg{transform:scale(1.14)}

  .svpanel .glyph{flex:0 0 auto;display:inline-block;border-radius:var(--k-radius-circle)}

  .svpanel .glyph.off{width:calc(var(--k-space-4) + var(--k-border-w));height:calc(var(--k-space-4) + var(--k-border-w));background:transparent;border:calc(var(--k-border-w) * 2) solid var(--k-pending)}

  .svpanel table{width:100%;border-collapse:collapse;font-size:var(--k-text-md)}

    letter-spacing:.6px;color:var(--k-text-faint);padding:calc(var(--k-space-3) + var(--k-border-w)) var(--k-space-5);

  .svpanel td{padding:var(--k-space-2) var(--k-space-5);vertical-align:middle}

     header, so that header is screen-reader-only. */
  .svpanel td.c-dot{width:1%;padding-right:0;line-height:0}
  /* The NAME column absorbs all the slack, which pushes the address and its two
     ops into one right-hand group. The address is right-aligned inside a
     shrink-wrapped column, and that is what makes Open/Copy sit flush against
     the value on EVERY row instead of after a ragged gap. */

    text-overflow:ellipsis;white-space:nowrap}
  .svpanel td.c-addr{font-family:var(--k-font-mono);font-size:var(--k-text-sm);color:var(--k-text-dim);
    white-space:nowrap;width:1%;text-align:right;padding-right:calc(var(--k-space-3) - var(--k-border-w))}
  .svpanel td.c-addr.off{font-style:italic;color:var(--k-text-faint)}
  .svpanel td.c-addr .short{display:none}
  .svpanel td.c-addrops{width:1%;padding-left:0;padding-right:0}
  /* The gap between the address group and the lifecycle group is the only thing
     separating them — keep it wider than the gap inside each group. */
  .svpanel td.c-acts{text-align:right;white-space:nowrap;width:1%;padding-left:var(--k-space-6)}
  .svpanel td .g{display:inline-flex;gap:var(--k-space-1);justify-content:flex-end}

  /* Narrow COMPACTS, it does not restack: one service stays one line, which is
     the whole point of this design. 400px cannot be a token: @container
     conditions cannot read a custom property, so no --k-* applies here (same
     exception as a @media breakpoint). */
  @container (max-width: 400px){
    /* SPECIFICITY TRAP — do not simplify these back to bare `td`. A
       class-qualified `td.c-acts` (0,2,1) out-specifies a bare `td` (0,1,1)
       REGARDLESS of source order, so a reset written as `td{width:auto}` never
       lands: the 1% action column survived into narrow and wrapped every icon
       onto its own line. The re-qualification is the fix. */
    .svpanel td.c-acts{width:auto}
    .svpanel thead th{padding:var(--k-space-3);font-size:var(--k-text-2xs)}
    .svpanel td{padding:var(--k-space-2) var(--k-space-3)}
    /* At this width "localhost:5173" ellipsises to "localhost…" — showing the
       part that never varies and hiding the part that does. Both strings are in
       the DOM so the swap is CSS, not a JS width probe; the full address stays
       on the cell's title either way. */
    .svpanel td.c-addr{font-size:var(--k-text-xs)}
    .svpanel td.c-addr .full{display:none}
    .svpanel td.c-addr .short{display:inline}
  }

     no button — Start lives in the header where it works in every state. */
  .svpanel .estate{display:flex;align-items:flex-start;gap:var(--k-space-5);
    padding:calc(var(--k-space-6) + var(--k-space-1)) calc(var(--k-space-6) + var(--k-space-1)) calc(var(--k-space-6) + var(--k-space-1) + var(--k-border-w))}
  .svpanel .estate .emark{display:flex;align-items:center;justify-content:center;
    width:var(--k-control-h-sm);height:var(--k-control-h-sm);border-radius:var(--k-radius-circle);flex:none;margin-top:calc(var(--k-border-w) * -1);
    background:var(--k-surface-hover);color:var(--k-text-faint)}
  .svpanel .estate .emark svg{width:var(--k-text-base);height:var(--k-text-base);display:block}
  .svpanel .estate .ehead{font-size:var(--k-text-md);font-weight:var(--k-weight-semibold);color:var(--k-text)}
  .svpanel .estate .esub{font-size:var(--k-text-sm);color:var(--k-text-dim);line-height:1.45;margin-top:var(--k-space-1)}
  /* The dead end gets no action anywhere, so it also gets no emphasis — the
     block stays at description weight to read as a statement, not a prompt. */
  .svpanel .estate.dead .ehead{color:var(--k-text-dim);font-weight:var(--k-weight-medium)}
  .svpanel .nomatch{padding:calc(var(--k-space-6) + var(--k-space-1));color:var(--k-text-faint);font-size:var(--k-text-md)}

  /* Gates panel: one group per stage, one row per resolved gate name. */
  #gates .blurb{padding:var(--k-space-5) var(--k-space-3);font-size:var(--k-text-sm);color:var(--k-text-dim)}
  .ggroup{margin-bottom:var(--k-space-4)}
  .gtitle{font-size:var(--k-text-2xs);color:var(--k-text-faint);text-transform:uppercase;
    margin-bottom:var(--k-space-2);padding:0 var(--k-space-3)}
  .gaterow{display:flex;align-items:center;gap:var(--k-space-4);
    padding:var(--k-space-2) var(--k-space-3);border-radius:var(--k-radius-md)}
  .gaterow:hover{background:var(--k-surface-hover)}
  .gaterow.off .gname{text-decoration:line-through;color:var(--k-text-faint)}
  .gaterow .gname{font-family:var(--k-font-mono);font-size:var(--k-text-sm);flex:1}
  .gaterow .gstate{font-size:var(--k-text-xs);color:var(--k-text-dim)}
</style>

    aria-label="Show ticket changes" title="Show ticket changes"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true" focusable="false"><use href="#i-diff"/></svg></button></div><div class="pbody" id="worktrees"></div></div>
