<!--
  Karst ticket dashboard webview (T3.2). Self-contained: no external assets
  (webview CSP forbids them). Renders from the `state` postMessage the host
  pushes (state.ts → DashboardState) and posts action messages back
  (messages.ts → WebviewMessage). Styles ported from design/orchestrator-mockup.html.
-->
<!--KARST_CSP-->
<style>
  /*KARST_DS_CSS*/
  /*KARST_XTERM_CSS*/
  /*KARST_AGENT_CSS*/
  /*KARST_AGENT_PICKER_CSS*/
  /*KARST_SERVER_LOGS_VIEW_CSS*/
  /*KARST_DASHBOARD_APP_CSS*/

  #root{display:contents}

  :root{
    /* Status colors come from the shared ramp (--k-pending|running|attention|
       passed|failed, injected via /*KARST_PALETTE*\/ below) and are consumed
       directly as var(--k-*) everywhere in this file (UI-R05/R06: one token
       per meaning, declared once, never redeclared or given a second name).
       --k-surface is the opaque mask the rail nodes fill with to hide the
       connector running under them — it used to be a local `--panel-bg` here
       with its own hex fallback; that fallback is now the one in
       designSystem.ts, so a theme without editorWidget.background still gets
       the same opaque floor. */

    /* One header height for every panel in the grid. The headers carry
       different contents — bare text, icon buttons, a text button — and
       letting each size itself put the Worktrees body 2px below the Servers
       body beside it, so the whole block read as drifted. Padding alone
       cannot fix that: the tallest control still sets the height. Composed
       from tokens (a large control + one padding step + the hairline)
       rather than a bare 39px literal (UI-R04). */
    --phead-h:calc(var(--k-control-h-lg) + var(--k-space-4) + var(--k-border-w));
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--k-bg);color:var(--k-text);font-family:var(--k-font-ui);font-size:var(--k-text-base);padding:var(--k-space-8) var(--k-space-9)}
  a{color:var(--k-link);text-decoration:none}
  /* Toggled by the render fns (blocked banner, impl phases, artifact panels) —
     without this rule the `hidden` class was a no-op and an empty box still
     drew its border. */
  .hidden{display:none}
  /* The header's staged controls (#confirmShip, #boardLink) toggle the `hidden`
     ATTRIBUTE — semantically the right tool (it drops them from the a11y tree
     and tab order, which the class cannot). But the component CSS
     (.k-btn/.k-iconbtn) sets display:inline-flex, and author CSS overrides
     the UA `[hidden]{display:none}` no matter its specificity — so without an
     author rule the attribute was a no-op and Confirm ship stayed visible the
     whole way through Implementation (869ehahjh-fu1). Same fix the diffs
     webview needed for its notice. Same specificity as the component rules,
     so it must sit AFTER the injected design-system CSS (which it does — the
     marker is at the top of this <style>) to win the cascade. */
  [hidden]{display:none}

  /* Shared with the Inside stage menu; the header menu's other rules live in app/Header.css. */
  .menuButton{width:100%;min-height:var(--k-control-h-lg);display:flex;align-items:center;gap:var(--k-space-4);border:0;border-radius:var(--k-radius-sm);background:transparent;color:var(--k-text);padding:0 var(--k-space-4);cursor:pointer;text-align:left}
  .menuButton:hover{background:var(--k-surface-hover)}
  .menuButton .k-icon{color:var(--k-text-dim);flex:none}
  /* Shared ticketing-provider badge (icon + brand name) — single source in
     src/model/providerIdentity.ts, injected here at load (CSP forbids a
     shared stylesheet). */
  /*KARST_PROVIDER_CSS*/

  .stepper{margin:var(--k-space-8) 0 var(--k-space-9);
    padding:calc(var(--k-space-6) + var(--k-space-1)) var(--k-space-4) var(--k-space-4);
    border:var(--k-border-w) solid var(--k-border);
    border-radius:calc(var(--k-radius-lg) + var(--k-border-w));background:var(--k-surface)}

  /* Running = a live spinner, not a glyph. ⟳ misreads as "reload/retry", which is
     the wrong affordance on a clickable segment. An animating ring is the one mark
     that reads as work in progress. Under reduced motion it stops as a broken ring
     — still shape-distinct from ✓ ✕ · –, so status never rides on colour alone. */
  .spin{display:block;border-radius:var(--k-radius-circle);
    border:calc(var(--k-border-w) * 2) solid currentColor;border-top-color:transparent;
    animation:spin var(--k-dur-spin) linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .spin{animation:none}
    /* The disclosure marker's rotation is motion; the open state itself is
       still visible in the marker's resting orientation. (UI-R30) */
    .pchev{transition:none}
  }

  /*KARST_INSIDE_PROTO_START*/
  /* The Inside block's rules are React-owned (app/Inside*.css). The one rule that shared its narrow-width media query and is
     not Inside's stays here, between the markers that exempt it from the literal budget (UI-R04: a media condition cannot read a custom property). */
  @media (max-width: 699px){
    .grid{grid-template-columns:1fr}
  }
  /*KARST_INSIDE_PROTO_END*/


  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--k-space-7)}
  .panel{border:var(--k-border-w) solid var(--k-border);border-radius:calc(var(--k-radius-lg) + var(--k-border-w));background:var(--k-surface);overflow:hidden}
  .panel.span{grid-column:1 / -1}
  .phead{display:flex;align-items:center;gap:var(--k-space-4);min-height:var(--phead-h);padding:var(--k-space-4) var(--k-space-7);
    border-bottom:var(--k-border-w) solid var(--k-border);font-size:var(--k-text-md);font-weight:var(--k-weight-semibold)}
  .phead .count{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-faint);font-weight:var(--k-weight-normal)}
  .pbody{padding:var(--k-space-3) var(--k-space-4) var(--k-space-5)}

  /* ===================== Shared helpers: .sr and .ib ====================
     The Servers panel's own rules live in app/ServersPanel.css. */
  /* Visually hidden, still announced — for labels the layout drops but a screen
     reader still needs (the dot-only Status header, the filter's label). */
  .sr{position:absolute;width:var(--k-border-w);height:var(--k-border-w);padding:0;margin:calc(var(--k-border-w) * -1);overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* Icon buttons — inline Tabler SVGs from the injected catalog (docs/ui/
     ICONS.md; no icon font, no external asset: the webview CSP forbids both).
     Icon-only is what lets four actions share a row without the action column
     outgrowing the data. The label is not lost, it moves to aria-label +
     title, so the word survives for both pointer and screen reader. Built on
     `.k-iconbtn` (UI-R07: sizing, hover surface, focus ring, and the
     disabled/pending states all come from the primitive); `.ib` stays a
     LAYOUT+colour-only local class — the glyph's own size, and each action's
     resting hue off the shared status ramp. */
  .ib svg{width:calc(var(--k-space-6) + var(--k-space-1));height:calc(var(--k-space-6) + var(--k-space-1));display:block;
    transition:transform var(--k-dur-fast) var(--k-ease-standard)}
  /* Each action carries its OWN resting colour, off the same status ramp the
     stepper uses — hue is the fastest way to tell Stop from Start before any
     label is read. The word is still on every button, so hue accelerates, it
     never carries. */
  .ib.t-open{color:var(--k-running)}
  .ib.t-copy{color:var(--k-series-2)}
  .ib.t-restart{color:var(--k-attention)}
  .ib.t-stop{color:var(--k-failed)}
  .ib.t-start{color:var(--k-passed)}
  /* The glyph grows slightly on hover/active — layered on top of the
     primitive's own surface+border hover, never replacing it. */
  .ib:hover:not(:disabled) svg{transform:scale(1.14)}
  .ib:active:not(:disabled) svg{transform:scale(.94)}
  @media (prefers-reduced-motion:reduce){
    .ib svg{transition:none}
    .ib:hover svg,.ib:active svg{transform:none}
  }


  /* Artifacts shelf + index + detail (§ docs/design/artifacts/README.md).
     The shelf's own rules live in app/ArtifactsPanels.css; the index and the detail REPLACE the
     dashboard body inside the SAME webview (spec §7: exactly three surfaces,
     no second tab/drawer), which is what body.art-nav hides below. */
  .artcard-summary{font-size:var(--k-text-sm);color:var(--k-text-dim);margin-top:var(--k-space-2)}
  .art-status{font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.4px;
    font-weight:var(--k-weight-semibold)}
  .art-status.passed{color:var(--k-passed)}
  .art-status.failed{color:var(--k-failed)}
  .art-status.attention{color:var(--k-attention)}
  .art-status.info{color:var(--k-pending)}
  .art-stale{font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.4px;color:var(--k-attention)}
  /* The detail's stale banner sits under the summary, not inline-styled. */
  .artdetail .art-stale-note{text-transform:none;letter-spacing:normal;margin-top:var(--k-space-3)}
  /* The origin chip: one closed shape on every artifact surface (UI-R28 — the
     mark is a SECONDARY carrier; the label is the identity). Built from the
     injected agent identity (core icon) + the karst brand mark. */
  .art-origin{display:inline-flex;align-items:center;gap:var(--k-space-2);
    font-size:var(--k-text-xs);color:var(--k-text-dim);white-space:nowrap}
  .art-origin .kmark{width:var(--k-space-6);height:var(--k-space-6);flex:none;color:var(--k-text-faint)}
  .art-origin .agenticon{width:var(--k-space-6);height:var(--k-space-6);flex:none}
  /* The in-webview index/detail surface: takes over the whole dashboard body
     while active, restoring it on Back/Esc. */
  body.art-nav .stepper,body.art-nav .grid{display:none}
  body.term-nav .stepper,body.term-nav .grid{display:none}
  body.log-nav .stepper,body.log-nav .grid{display:none}
  .artview{padding:var(--k-space-7) 0 var(--k-space-9);max-width:720px;color:var(--k-text)}
  .arthead{display:flex;align-items:center;gap:var(--k-space-4);margin-bottom:var(--k-space-6);flex-wrap:wrap}
  .arthead h2{margin:0;font-size:var(--k-text-lg);font-weight:var(--k-weight-semibold)}
  .arthead .artsub{font-size:var(--k-text-sm);color:var(--k-text-dim)}
  .artgroup{margin-bottom:var(--k-space-7)}
  .artgroup-title{font-size:var(--k-text-2xs);color:var(--k-text-faint);text-transform:uppercase;
    letter-spacing:.4px;margin-bottom:var(--k-space-3)}
  /* The index's own list: its rows are the `.artrow` buttons, which carry
     their own border/padding — wrapping them in `.artfiles li` (whose styling
     exists for the DETAIL's single-line file rows) drew a second border around
     each row. */
  .artrows{list-style:none;margin:0;padding:0}
  .artrows li{margin-bottom:var(--k-space-3)}
  .artrow{display:flex;align-items:center;gap:var(--k-space-5);width:100%;text-align:left;
    padding:var(--k-space-4) var(--k-space-5);border:var(--k-border-w) solid var(--k-border);
    border-radius:var(--k-radius-md);background:var(--k-surface);cursor:pointer;color:var(--k-text)}
  .artrow:hover{background:var(--k-surface-hover)}
  .artrow:focus-visible{outline:2px solid var(--k-focus);outline-offset:1px}
  .artrow .artrow-body{min-width:0;flex:1}
  .artrow-title{font-size:var(--k-text-md);font-weight:var(--k-weight-medium);color:var(--k-text)}
  .artrow-summary{font-size:var(--k-text-sm);color:var(--k-text-dim);margin-top:var(--k-space-1)}
  .artrow .arw{margin-left:auto;color:var(--k-text-faint);flex:none}
  .sa-bar{display:flex;gap:var(--k-space-3);margin-left:auto;flex-wrap:wrap}
  .sa-row{border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-md);background:var(--k-surface);
    padding:var(--k-space-4) var(--k-space-5)}
  .sa-main{display:flex;align-items:center;gap:var(--k-space-4);flex-wrap:wrap}
  .sa-path{min-width:0;flex:1;font-family:var(--k-font-mono);font-size:var(--k-text-sm);overflow-wrap:anywhere}
  .sa-meta{font-size:var(--k-text-sm);color:var(--k-text-dim)}
  .sa-chip{font-size:var(--k-text-2xs);padding:0 var(--k-space-3);border:var(--k-border-w) solid var(--k-border);
    border-radius:var(--k-radius-pill);color:var(--k-text-dim)}
  .sa-hist{margin-top:var(--k-space-3)}
  .sa-hist summary{cursor:pointer;font-size:var(--k-text-sm);color:var(--k-text-dim)}
  .sa-rev{display:flex;align-items:center;gap:var(--k-space-3);flex-wrap:wrap;padding:var(--k-space-2) 0;font-size:var(--k-text-sm)}
  .sa-skip{font-family:var(--k-font-mono);font-size:var(--k-text-sm);color:var(--k-text-dim);padding:var(--k-space-1) 0}
  .sa-empty{color:var(--k-text-dim);font-size:var(--k-text-sm)}
  .artdetail .artsection{margin-bottom:var(--k-space-7)}
  /* The section heading is a flex row so the console entry (the xterm view of
     a gate stage's log) can sit at its right edge without a second line. */
  .artdetail .artheading{display:flex;align-items:center;gap:var(--k-space-3);
    font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.4px;
    color:var(--k-text-faint);margin-bottom:var(--k-space-3)}
  .artdetail .artheading .sp{margin-left:auto}
  .arthero{display:flex;align-items:center;gap:var(--k-space-4);flex-wrap:wrap}
  .arthero .art-title{font-size:var(--k-text-lg);font-weight:var(--k-weight-semibold)}
  .artmetrics{display:flex;gap:var(--k-space-7);flex-wrap:wrap;margin:var(--k-space-5) 0 var(--k-space-7);
    padding:var(--k-space-4) var(--k-space-5);border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-md)}
  .artmetric{font-family:var(--k-font-mono);font-size:var(--k-text-lg);font-weight:var(--k-weight-semibold);color:var(--k-text)}
  .artmetric .am-label{display:block;font-family:var(--k-font-normal);font-size:var(--k-text-2xs);
    text-transform:uppercase;letter-spacing:.4px;color:var(--k-text-faint)}
  .artfinding{border-left:2px solid var(--k-border);padding:var(--k-space-2) var(--k-space-4);
    margin-bottom:var(--k-space-3)}
  /* Same ramp as the inside block's evidence rows (`--k-sev-*`,
     model/palette.ts). `critical` and `high` used to share one red here,
     which is precisely the divergence the shared tokens remove. The level
     word is printed in `.af-title`, so colour is not the only carrier
     (UI-R28). */
  .artfinding.critical{border-left-color:var(--k-sev-critical)}
  .artfinding.high{border-left-color:var(--k-sev-high)}
  .artfinding.medium{border-left-color:var(--k-sev-medium)}
  .artfinding.low{border-left-color:var(--k-sev-low)}
  .artfinding.info{border-left-color:var(--k-sev-info)}
  .artfinding .af-title{font-size:var(--k-text-sm);color:var(--k-text)}
  .artfinding .af-detail{font-size:var(--k-text-xs);color:var(--k-text-dim);margin-top:var(--k-space-1)}
  .art-scope{display:flex;flex-wrap:wrap;gap:var(--k-space-1);
    padding:var(--k-space-1) var(--k-space-4) var(--k-space-2)}
  .art-scope .sev-scope-chip{min-height:var(--k-hit-min);padding:0 var(--k-space-2);
    border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-sm);
    background:transparent;color:var(--k-text-dim);font-family:var(--k-font-mono);
    font-size:var(--k-text-xs);cursor:pointer}
  .art-scope .sev-scope-chip.active{color:var(--k-text);border-color:var(--k-running);
    background:var(--k-surface)}
  .blstate{font-size:var(--k-text-xs);font-weight:var(--k-weight-semibold)}
  .blstate.approved{color:var(--k-pass)}
  .blstate.rejected{color:var(--k-danger)}
  .blstate.pending{color:var(--k-text-dim)}
  .blline{display:flex;align-items:center;gap:var(--k-space-3);flex-wrap:wrap;padding:var(--k-space-2) 0}
  .artgate{display:flex;align-items:center;gap:var(--k-space-3);font-size:var(--k-text-sm);
    padding:var(--k-space-2) 0;border-bottom:var(--k-border-w) solid var(--k-border)}
  .artgate .ag-name{font-family:var(--k-font-mono);flex:1;color:var(--k-text)}
  .artgate .ag-code{font-size:var(--k-text-xs);color:var(--k-text-dim)}
  /* The plan artifact's task rows: the label carries the task, the dot the
     coloured state, and the kind/visit detail trails. Same pattern as the
     gate rows — one dot, one closed status vocabulary (UI-R28). */
  .arttask{display:flex;align-items:center;gap:var(--k-space-3);font-size:var(--k-text-sm);
    padding:var(--k-space-2) 0;border-bottom:var(--k-border-w) solid var(--k-border)}
  .arttask .at-state{display:inline-flex;flex:none}
  .arttask .at-state .at-dot{width:var(--k-space-3);height:var(--k-space-3);
    border-radius:var(--k-radius-circle);flex:none}
  .arttask .at-state.done .at-dot{background:var(--k-passed)}
  .arttask .at-state.doing .at-dot{background:var(--k-running)}
  .arttask .at-state.todo .at-dot{background:transparent;
    border:calc(var(--k-border-w) * 2) solid var(--k-pending)}
  .arttask .at-state.blocked .at-dot{background:var(--k-attention)}
  .arttask .at-state.cancelled .at-dot{background:var(--k-text-faint)}
  .arttask{flex-wrap:wrap}
  .arttask .at-files{flex-basis:100%;display:flex;flex-wrap:wrap;gap:var(--k-space-3);padding-left:var(--k-space-6)}
  .arttask .at-label{flex:1;color:var(--k-text)}
  .arttask .at-kind{font-size:var(--k-text-xs);color:var(--k-text-dim)}
  /* One gate's outcome as a COLOURED STATE, not a text label: the dot is the
     shipped `.k-dot` status primitive (gap G1 — hue is its current carrier),
     green for pass, red for fail; the state word rides only as the dot's
     accessible name (UI-R28), and the exit code stays as the row's detail. */
  .artgate .ag-state{display:inline-flex;flex:none}
  .artgate .ag-state .ag-dot{width:var(--k-space-3);height:var(--k-space-3);
    border-radius:var(--k-radius-circle);flex:none}
  .artgate .ag-state.pass .ag-dot{background:var(--k-passed)}
  .artgate .ag-state.fail .ag-dot{background:var(--k-failed)}
  .artgate .ag-state.note .ag-dot{background:transparent;
    border:calc(var(--k-border-w) * 2) solid var(--k-pending)}
  .artmeta{display:grid;grid-template-columns:auto 1fr;gap:var(--k-space-2) var(--k-space-5);
    font-size:var(--k-text-sm)}
  .artmeta .am-key{color:var(--k-text-faint)}
  .artmeta .am-origin{display:inline-flex;align-items:center;gap:var(--k-space-3)}
  .artfiles{list-style:none;margin:0;padding:0}
  .artfiles li{display:flex;align-items:center;gap:var(--k-space-4);
    padding:var(--k-space-3) var(--k-space-4);border:var(--k-border-w) solid var(--k-border);
    border-radius:var(--k-radius-md);margin-bottom:var(--k-space-3)}
  .artfiles .af-label{color:var(--k-text);font-weight:var(--k-weight-semibold);flex:none}
  .artfiles .af-name{font-family:var(--k-font-mono);font-size:var(--k-text-sm);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--k-text)}
  .artfiles .af-label + .af-name{color:var(--k-text-dim)}
  /* In-body object links (UI-R09c): the commit SHA, the PR number and a
     finding's file location ARE the controls — underlined, monospaced,
     keyboard-focusable — never inert text beside a duplicate button. */
  .artdetail .obj-link{display:inline-flex;align-items:center;color:var(--k-link);
    text-decoration-line:underline;text-decoration-thickness:var(--k-border-w);
    text-decoration-color:var(--k-border);text-underline-offset:var(--k-space-1);cursor:pointer;
    font-family:var(--k-font-mono);border-radius:var(--k-radius-xs)}
  .artdetail .obj-link:hover{color:var(--k-link);text-decoration-color:currentColor}
  .artdetail .obj-link:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  .artfiles .pr-link{color:var(--k-text);font-weight:var(--k-weight-semibold)}
  .artfiles .pr-status{display:inline-flex;align-items:center;border:var(--k-border-w) solid var(--k-border);
    border-radius:var(--k-radius-pill);padding:var(--k-space-0) var(--k-space-2);color:var(--k-text-dim);
    font-family:var(--k-font-mono);font-size:var(--k-text-2xs);text-transform:lowercase;white-space:nowrap}
  .artfiles .pr-status.open{color:var(--k-running);border-color:var(--k-border)}
  .artfiles .pr-status.merged{color:var(--k-passed);border-color:var(--k-border)}
  .artfiles .pr-status.closed{color:var(--k-failed);border-color:var(--k-border)}
  .artfiles .commit-sha{color:var(--k-text-dim)}
  .artfiles .af-repo{font-family:var(--k-font-mono);font-size:var(--k-text-sm);color:var(--k-text);flex:none}
  .artfiles .af-ref{flex:1}
  .artfiles .af-msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:var(--k-text-sm);color:var(--k-text)}
  .artfiles .af-msg--empty{color:var(--k-text-faint);font-style:italic}
  .artfiles li > .af-repo:not(:first-child){color:var(--k-text-dim)}
  .artfiles .commit-origin{border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-pill);
    padding:var(--k-space-0) var(--k-space-2);font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    color:var(--k-text-dim);white-space:nowrap}

  /* The terminal console surface (xterm "detailed mode"): a full-body swap via
     body.term-nav, exactly like the artifact surface — the SAME webview hosts
     the ticket dashboard and the console view, never a second tab. */
  .termview{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;background:var(--k-bg);color:var(--k-text);font-family:var(--k-font-mono)}
  /* The surface starts closed (class="termview hidden"): .termview and .hidden
     have EQUAL specificity, so the LATER declaration wins the cascade — this
     override must follow the .termview block or display:flex beats

  .logsview .loghost::-webkit-scrollbar-thumb{background:var(--k-border-strong);border-radius:var(--k-radius-sm)}
  .logsview .loghost::-webkit-scrollbar-thumb:hover{background:var(--k-text-dim)}

  /* The env-override editor: the SAME full-body swap as the logs view

  /* Full width, like the logs surface it mirrors: the sections are a form,

  .envview .elead{font-size:var(--k-text-sm);color:var(--k-text-dim);margin-bottom:var(--k-space-6)}
  .envscope{border:var(--k-border-w) solid var(--k-border);border-radius:var(--k-radius-lg);

  .envscope > header{display:flex;align-items:center;gap:var(--k-space-3);
    padding:var(--k-space-3) var(--k-space-4);background:var(--k-surface-sunken)}
  .envscope .ename{font-weight:var(--k-weight-semibold);font-family:var(--k-font-mono);font-size:var(--k-text-sm)}
  .envscope .ecount{font-size:var(--k-text-2xs);color:var(--k-text-faint)}
  .envscope .ehint{padding:0 var(--k-space-4);font-size:var(--k-text-2xs);color:var(--k-text-faint)}

  /* The ticket-data preview drawer (UI-R04: composed from tokens, no raw

<!-- React-owned header: app/Header.tsx renders the ticket identity, title, Detach / Close / Reopen, the agent popover,
     the ship and wait chips and the "..." menu into this static root (the region parity snapshot pins it without any
     id or data-*), so inReactIsland() also treats .dhead as an island (until Phase 12). -->
<div class="dhead"></div>
<!-- Second header row (DASHBOARD-HEADER-SHOW-ONLY-ROLE): the parent relation leads, then one chip per model that
     differs from implementation. React-owned (app/HeaderMeta.tsx), which also toggles this root's `hidden`. -->
<div id="headerMeta" class="headerMeta" hidden></div>

<div class="stepper">
  <!-- The main rail + the fix return channel + impl's approach chip. -->
  <div class="railwrap" id="rail"></div>
  <!-- What happens inside the SELECTED stage (defaults to the current one). -->
  <div id="inside"></div>
  <!-- The blocked banner: why the CURRENT stage could not ask its question,
       plus [Resume]. Shares the `.fault` visual language (DESIGN-SYSTEM.md
       maps `--k-failed` to "failed · blocked") — never both at once, since a
       blocked stage sits at running/pending, not failed. An `awaiting-merge`
       block renders NOTHING here: the wait is not a fault and already has its
       own surfaces — the header's Waiting-to-merge chip and the Inside ship
       view's merge rows — so the banner is reserved for resumable faults. -->
  <div class="fault blocked hidden" id="blocked"></div>
</div>

<div id="root"></div>

<div class="grid">
  <!-- The sub-tasks this ticket delegated (design NDL-70 §8). Rendered only
       while it has sub-tasks OR can still gain one (host-derived
       `canAddSubtask`); the button hides exactly when the writer would refuse
       (ship/done). Absence, never an empty card.
       React-owned: app/SubtasksPanel.tsx renders into #subtaskCount, the header after it (the Add button) and
       #subtasks, and toggles this root's `hidden`. The root stays static (the parity snapshot pins it without
       data-react-owned), so inReactIsland() also treats #subtaskPanel as an island. -->
  <div class="panel span hidden" id="subtaskPanel">
    <div class="phead">Sub-tasks<span class="count" id="subtaskCount"></span></div>
    <div class="pbody" id="subtasks"></div>
  </div>
  <!-- The Servers panel is React-owned: app/ServersPanel.tsx renders into #srvCount, #srvOps and #servers
       through RegionPortals. The root and its caption stay static (the parity snapshot pins the root without
       data-react-owned), so inReactIsland() also treats `.svpanel` as an island. -->
  <div class="panel svpanel"><div class="phead">Servers<span class="count" id="srvCount"></span><span class="pops" id="srvOps"></span></div><div class="pbody" id="servers"></div></div>
  <!-- The Worktrees panel (header + body) is React-owned: app/WorktreesPanel.tsx renders into this
       container through a RegionPortal, and data-react-owned makes the vanilla delegators skip it. -->
  <div class="panel" id="worktreesPanel" data-react-owned="true"></div>
  <!-- The Pull requests panel's count, refresh control and body are React-owned: app/PrsPanel.tsx renders into
       #prCount, #prOps and #prs through RegionPortals. `prpanel` marks the island for the vanilla delegators
       (inReactIsland), because the region parity snapshots pin #prs without any data-* attribute. -->
  <div class="panel span prpanel"><div class="phead">Pull requests<span class="count" id="prCount"></span><span class="pops" id="prOps"></span></div><div class="pbody" id="prs"></div></div>
  <!-- The artifacts shelf (docs/design/artifacts) is React-owned: app/ArtifactsShelf.tsx puts the "View all N"
       button into this header and renders the previews into #artifacts. It shows only while the ticket has at
       least one artifact (the zero state is ABSENCE, never an empty section, §4.1): React toggles .hidden on
       this root, which stays static because the region parity snapshot pins it without any data-* attribute, so

  <div class="panel span hidden" id="artPanel"><div class="phead">Artifacts</div><div class="pbody" id="artifacts"></div></div>

  <div class="panel span hidden" id="storedPanel"><div class="phead">Captured artifacts</div><div class="pbody" id="storedSummary"></div></div>
</div>

<!-- The ticket-data preview: a slide-over drawer over the dashboard, mirroring
     the ticket form's brief drawer (.k-scrim/.k-drawer supply the surface; the

     they can never inject. -->

<aside class="k-drawer tdDrawer" id="ticketDataDrawer" role="dialog" aria-modal="true"
