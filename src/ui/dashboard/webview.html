<script>
  /*KARST_DS_JS*/

  // Shared ticketing-provider identity (icon + brand) — single source in
  // src/model/providerIdentity.ts, injected here at load (CSP forbids a
  // shared script). Defines PROVIDER_LABELS, CLICKUP_SVG, providerBadgeHtml.
  /*KARST_PROVIDER_JS*/

  // Shared agent-core identity (icon + name) — single source in
  // src/model/agentIdentity.ts, injected here at load. Defines
  // AGENT_PROVIDER_LABELS, agentBadgeHtml, agentIconHtml. The inside ledger's
  // identity chip consumes agentIconHtml (B1), so the markers are load-bearing:
  // without them the chip would throw ReferenceError on the first process row.
  /*KARST_AGENT_JS*/

  const vscode = acquireVsCodeApi();
  const post = (msg) => vscode.postMessage(msg);

  // Stage status -> segment CSS class. Needs-you is NOT here: it OUTRANKS the
  // stage status, and it is applied from the segment's own `needsUser`, which the
  // host derives once (model/ticketGlyph.needsUser) for every surface. The old
  // rail showed stage status only, so a ticket parked on a human looked exactly
  // like one quietly running.
  // `pending` is a REAL class, not the empty string the old rail used: the
  // segment's own rule sets no colour (so the stage palette can), which leaves an
  // untravelled segment wearing its stage hue at full strength unless something
  // says otherwise.
  const SEG_CLASS = { passed: 'passed', running: 'running', failed: 'failed', pending: 'pending', skipped: 'skipped' };
  // Running renders a spinner ELEMENT, not a character — see the .spin rule for
  // why every glyph candidate misread on a clickable node.
  const SPINNER = '<span class="spin" aria-hidden="true"></span>';
  const SEG_GLYPH = { passed: '✓', running: SPINNER, failed: '✕', pending: '·', skipped: '–' };
  // A parked confirm stage carries a pause; a conflicted merge carries a warning.
  // Two glyphs, ONE state — merge has no failed edge, so a conflict is a wording
  // difference and must never render as something a retry could clear.
  const NEEDS_GLYPH = '❚❚';
  const CONFLICT_GLYPH = '⚠';
  const OP_GLYPH = { pass: '✓', fail: '✕', run: SPINNER, wait: '⏸', note: '↳', pending: '·', skip: '⊘' };
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const STAGE_TITLE = { uat: 'UAT', review: 'Review', fix: 'Fix', scope: 'Scope', impl: 'Implementation', ship: 'Ship', done: 'Done' };

  // The last snapshot the host pushed, and which stage the user is looking at.
  // Selection is LOCAL: it is not in DashboardState and is never posted back.
  // pushState fires on every driver progress tick, so anything that routed
  // selection through the host would snap the panel back mid-run.
  let lastState = null;
  let selectedStage = null;
  // What the user typed into the servers filter. Local for the same reason: a
  // state push lands on every server change, so a filter living in (or absent
  // from) DashboardState would be wiped out mid-typing.
  let srvFilter = '';
  // Live Git totals are supplemental filesystem facts. They stay beside the
  // host's store snapshot and are cleared whenever a newer snapshot arrives.
  let worktreeStats = {};
  // The gates a ticket's stages would actually run, and their disabled flags.
  // Resolved async, host-side (a filesystem probe), so like worktreeStats it
  // lives beside lastState rather than inside it. Deliberately NOT cleared on a
  // state push: a push is always followed by a gate-options message, and
  // blanking the list in between would flicker the section empty on every
  // unrelated refresh. The follow-up message replaces it wholesale — including
  // with an empty list when resolution fails — so it cannot go stale unnoticed.
  let gateOptions = { uat: [], review: [] };
  // `shipRequestId` / `mergeRequests` / `prRefreshId` below are the runtime's
  // pending bookkeeping (karstBeginPending/karstSettle) for the ship/merge/
  // refresh-prs controls. They are tracked SEPARATELY from the view state
  // because ship/merge/refresh-prs are the one place this file's full-innerHTML
  // re-render (§ render()) collides with the runtime's element-keyed pending
  // map: a `state` push mid-ship replaces the "Confirm ship" button with a
  // brand-new DOM node, so a pending flag living only on the OLD (now detached)
  // element would vanish from the redraw even though the request is still
  // outstanding. Keeping the requestId here — consulted by the render functions
  // below — is what survives that replacement; the runtime is still what emits
  // the toast and the `aria-busy`/`disabled` pair on whichever element is live
  // when a request begins or ends. `shipDone` is the brief post-success flash.
  let shipDone = null;
  let shipRequestId = null;
  // Per-repo merge-in-flight request ids, keyed by repo path. NOT persisted: a
  // merge is a one-shot host round trip, and an id restored from a reload
  // would claim a merge is underway that nobody is running. Cleared on every
  // state push — extension.ts's mergePr always refreshes in a `finally`
  // (success, refusal, cancel, or throw), so a push is guaranteed to arrive
  // and end the pending state; it is never left to a watchdog alone.
  let mergeRequests = {};
  // Which merge-check disclosures (`.mgd`) are open, keyed by repo. Local view
  // state, exactly like `selectedStage`: render() replaces #prs wholesale on
  // every `state` push AND every inside-progress tick, so a disclosure that is
  // open only in the DOM — and the reader's scroll position inside it — would
  // snap shut on the very next one. Never in DashboardState, never
  // round-tripped through the host; only the `toggle` listener below mutates
  // it, and render() itself must never reset it.
  let openMergeRepos = new Set();
  // Which inside process disclosures are open, keyed `stage:id`. Local view
  // state, exactly like `openMergeRepos`: render() replaces #inside wholesale
  // on every state push, so a disclosure open only in the DOM would snap shut
  // on the very next one. Never in DashboardState, never round-tripped
  // through the host; only the native `toggle` listener mutates it (B3), and
  // render() itself must never reset it.
  let openProcesses = new Set();
  // A user-requested PR re-probe is in flight. Set on the click, BEFORE the host
  // round trip, because that probe runs `gh` and a `git fetch` per repo — seconds
  // in which a button with no busy state looks inert and gets pressed again.
  // Cleared by the next state push (the host always sends one when the refresh
  // settles, including when nothing moved), so it can never stick.
  let prRefreshId = null;
  // Transient inside-progress overlays (the inside redesign): the live header
  // for one running operation (`active`) and the process row that replaces the
  // snapshot's row when it completes (`completed`). Keyed by stage. The FULL
  // snapshot remains authoritative — an overlay entry dies the moment a
  // snapshot that actually contains its process lands (see the state handler),
  // or on `cleared`; absence keeps it, because a snapshot that does not know
  // the process cannot be an answer about it. Deliberately NOT persisted: a
  // restored overlay would claim a process is running that nobody is.
  let liveOps = {};
  // The window's terminal binding. UNLIKE the view state above, this is NOT a
  // webview concern: it is one host-owned preference shared by every open
  // dashboard, so it is never persisted here — a stored copy could only go
  // stale against another panel's toggle. The host pushes it on every open.
  let bindEnabled = false;

  // "12:04:31 · 42s" — machine truth, so it is rendered in mono. Duration is
  // omitted while a stage is still running (no endedAt yet).
  function timingText(cell) {
    if (!cell.startedAt) return '';
    const started = new Date(cell.startedAt);
    if (Number.isNaN(started.getTime())) return '';
    const stamp = started.toLocaleTimeString();
    if (!cell.endedAt) return stamp;
    const ms = new Date(cell.endedAt).getTime() - started.getTime();
    if (!Number.isFinite(ms) || ms < 0) return stamp;
    return `${stamp} · ${(ms / 1000).toFixed(1)}s`;
  }

  // Under a rail node there is room for one number, not a sentence. The full
  // stamp belongs to the Inside header, which has a line to itself.
  function durationText(cell) {
    if (!cell.startedAt || !cell.endedAt) return '';
    const ms = new Date(cell.endedAt).getTime() - new Date(cell.startedAt).getTime();
    if (!Number.isFinite(ms) || ms < 0) return '';
    if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
    const mins = Math.round(ms / 60000);
    return mins < 60 ? `${mins}m` : `${Math.floor(mins / 60)}h ${mins % 60}m`;
  }

  // The track: ONE object the ticket travels through. The current segment is
  // wide and the rest compact — that is what fits seven stages in a narrow panel.
  //
  // No geometry is pushed from the host any more. The old rail positioned its
  // band from `--cols/--impl/--uat/--review` calc() inputs because it had a
  // second lane to bolt to specific columns; there is no second lane now, so the
  // only measurement left is `place()` below, and it POSITIONS NOTHING — it picks
  // one of three degradation classes.
  function renderTrack(rail, approach, sel) {
    const segs = rail.main.map((s) => {
      const cell = s.cell;
      const k = cell.stageKey;
      const status = cell.status;
      const needs = s.needsUser === true;
      // A conflict is a WORDING difference, not a new state: merge has no failed
      // edge, so it must never render as something a retry could clear. The host
      // already made that distinction when it worded the action.
      const conflict = needs && s.needs && s.needs.action === 'Resolve';
      const running = status === 'running' || (s.retry && s.retry.live);
      const cls = [
        needs ? 'needs' : (SEG_CLASS[status] || ''),
        s.current ? 'cur' : '',
        sel === k ? 'sel' : '',
      ].filter(Boolean).join(' ');

      const glyph = running ? SPINNER
        : conflict ? CONFLICT_GLYPH
        : needs ? NEEDS_GLYPH
        : (SEG_GLYPH[status] || '');

      // Both name forms ship and the CSS picks one: the current segment normally
      // shows the human title and falls back to the stage key at the narrowest
      // step. Swapping the text in JS would mean re-rendering on every resize.
      const title = STAGE_TITLE[k] || k;
      const name = s.current
        ? `<span class="full">${esc(title)}</span><span class="abbr">${esc(k)}</span>`
        : esc(k);

      // impl's approach is impl's own property, so it is drawn inside impl's own
      // segment — and only while the ticket is there, which is the only time the
      // segment has the room.
      const showsApproach = s.current && k === 'impl' && !needs && !!approach;

      let extra = '';
      if (s.current && needs) {
        extra = `<span class="mt">${esc(s.needs ? s.needs.detail : '')}</span>`
          + `<button type="button" class="go" data-goto`
          + `>${esc(s.needs ? s.needs.action : 'Open')}</button>`;
      } else if (showsApproach) {
        extra = renderPips(approach);
      } else {
        const d = durationText(cell);
        if (d) extra = `<span class="mt">${esc(d)}</span>`;
      }
      // The meter is APPENDED, never assigned into the same slot as the meta — a
      // retried gate has both a duration and a spent cap and must not have to
      // choose between saying them.
      if (s.retry) extra += renderMeter(s.retry);

      // The status is carried by colour and glyph, so the accessible name states
      // it outright — and states the retry loop too: a screen-reader user must
      // not have to infer a live retry from a meter they cannot see, nor lose the
      // return target when the narrowest step drops the `↩ uat`.
      // The approach rides in the name for the same reason: the pips and their
      // caption are its only visual form and the narrowest step drops both, and
      // the pips are `pointer-events:none` children of the segment, so their own
      // `title` never surfaces — this is where a reader gets the approach at all.
      const aria = (needs ? `${title}: needs you` : `${title}: ${status}`)
        + (showsApproach ? ` — approach ${approach.id}${phaseProgress(approach)}` : '')
        + (s.retry ? ` — fix ${s.retry.spent}/${s.retry.cap}${s.retry.live ? ' running' : ''}` : '')
        + (s.retry && s.retry.returnsTo ? `, revalidates from ${s.retry.returnsTo}` : '');

      return `<div class="seg stg-${esc(k)} ${cls}">`
        + `<button type="button" class="pick" data-stage="${esc(k)}" aria-pressed="${sel === k}"`
        + ` aria-label="${esc(aria)}" title="${esc(aria)}"></button>`
        + `<span class="g">${glyph}</span><span class="nm">${name}</span>${extra}</div>`;
    }).join('');

    el('rail').innerHTML = `<div class="track"><div class="lane">${segs}</div></div>`;
    place();
  }

  // impl's approach, inside impl's own segment: the approach's NAME, and one pip
  // per declared phase. DECLARED is not observed: a pip fills only for a phase
  // the agent actually reported by running a marker command, and a hollow pip
  // means "not reported" — never "not done".
  //
  // The name is rendered whether or not there are phases. An approach with an
  // empty `workflow` is the common case, not an edge one — the built-in `direct`
  // declares none, and so does any package that ships prompts only — and it is
  // still the thing driving impl. Returning early on an empty `phases` left the
  // widest segment on the track saying nothing at all about what is running in
  // it, which is the one place the panel names the approach.
  // "…, 3 of 4 phases reported" — or nothing at all when the approach declares
  // no workflow, because "0 of 0 phases" is a count of something that does not
  // exist. Counted against the DECLARED phases, so a mark for a phase the
  // approach no longer declares cannot push the tally past its own total.
  function phaseProgress(approach) {
    const phases = approach.phases || [];
    if (!phases.length) return '';
    const done = new Set(approach.reported || []);
    return `, ${phases.filter((p) => done.has(p)).length} of ${phases.length} phases reported`;
  }

  function renderPips(approach) {
    const phases = approach.phases || [];
    const done = new Set(approach.reported || []);
    const pips = phases.map((p) => {
      const on = done.has(p);
      return `<span class="p ${on ? 'on' : ''}"`
        + ` title="${esc(p)}${on ? ' — reported' : ' — not reported'}"></span>`;
    }).join('');
    const latest = (approach.reported || []).slice(-1)[0];
    const caption = latest ? `${latest} · ${approach.id}` : approach.id;
    // Nothing to say only when there is genuinely nothing: no name AND no phase.
    if (!caption && !pips) return '';
    return `<span class="pips">${pips}<span class="pn">${esc(caption)}</span></span>`;
  }

  // The retry meter IS the fix control: it is how `fix` stays selectable now that
  // the node is gone, and it sits on the gate the loop belongs to, which is where
  // a user would look for it. One tick per ALLOWED attempt, filled per attempt
  // spent — built from the cap the host resolved, never from a literal, or it
  // would misreport the budget the driver will actually spend.
  function renderMeter(retry) {
    const ticks = Array.from({ length: retry.cap }, (_, i) =>
      `<span class="tk ${i < retry.spent ? 'on' : ''}"></span>`).join('');
    const ret = retry.returnsTo ? `<span class="ret">↩ ${esc(retry.returnsTo)}</span>` : '';
    const label = `Fix loop on ${STAGE_TITLE[retry.gate] || retry.gate}: `
      + `attempt ${retry.spent} of ${retry.cap}${retry.live ? ', running' : ''}`;
    return `<button type="button" class="fixm ${retry.live ? '' : 'spent'}" data-stage="fix"`
      + ` aria-label="${esc(label)}" title="${esc(label)}">`
      + `<span class="ticks">${ticks}</span>`
      + `<span class="tx">fix ${retry.spent}/${retry.cap}</span>${ret}</button>`;
  }

  // THREE steps, measured rather than keyed to a breakpoint: the threshold
  // depends on the current stage's name length and on whether a meter is riding
  // along. This is the ONLY measurement in the track and it POSITIONS NOTHING —
  // it toggles one of three classes, so a measurement taken pre-layout can never
  // detach anything, only under-degrade for one frame.
  function place() {
    const track = document.querySelector('.track');
    if (!track) return;
    const lane = track.querySelector('.lane');
    if (!lane) return;
    const over = () => lane.scrollWidth > lane.clientWidth + 1;
    track.classList.remove('snug', 'tight', 'bare');
    if (!over()) return;
    track.classList.add('snug');
    if (!over()) return;
    track.classList.add('tight');
    if (over()) track.classList.add('bare');
  }

  // The needs-you button is NAVIGATIONAL. It scrolls the control that owns the
  // action into view and focuses it; it posts no host message and duplicates no
  // actor. merge is per-repo and its confirmation modal lives in the host
  // (workflow/mergePr.ts), so a rail-level Merge button could neither pick a repo
  // nor carry the confirmation — and making ship's an actor while merge's is a
  // pointer would be two rules where one will do.
  function gotoAction() {
    // The Now line's own primary action, when it has one (ship). Otherwise the PR
    // panel, where the per-repo Merge and Resolve buttons live (merge).
    const target = document.querySelector('#now [data-act]')
      || document.querySelector('#prs .mgbtn');
    const scrollTo = target || el('prs');
    if (!scrollTo) return;
    scrollTo.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    if (target && typeof target.focus === 'function') target.focus();
  }

  // ── the inside ledger (the inside redesign) ─────────────────────────────
  // The host ships ONE snapshot per stage (`InsideStageView`): ordered process
  // rows, each carrying pre-built status/detail/counts/identity/evidence and
  // an opaque action id. The webview renders rows and evidence rows
  // verbatim — it never parses prose, never formats a number, never derives a
  // verdict. Only the kind→label copy for the closed action vocabulary lives
  // here, exactly like NOW_TITLE: a presentation hint, not business logic.

  // kind → label, from the closed InsideActionKind vocabulary. Static control
  // copy (UI-R20), like NOW_TITLE — the host never ships these strings.
  const INSIDE_ACTION_LABEL = {
    'open-pr': 'Open PR',
    'open-commit': 'Open commit',
    'open-file': 'Open file',
    'open-stage-log': 'Open log',
    'resume-stage': 'Resume',
    'open-full-evidence': 'Show all',
    'open-bounded-evidence': 'Show all',
  };
  const INSIDE_ACTION_TITLE = {
    'open-pr': 'Open this pull request on the host',
    'open-commit': 'Open this commit on the host',
    'open-file': 'Open this file in an editor',
    'open-stage-log': "Open this stage's log file",
    'resume-stage': "Resume this ticket's stage",
    'open-full-evidence': 'Show every recorded row',
    'open-bounded-evidence': 'Show every repository row',
  };

  function insideActionBtnHtml(a) {
    if (!a || !INSIDE_ACTION_LABEL[a.kind]) return '';
    return `<button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="inside-action"`
      + ` data-action-id="${esc(a.actionId)}" title="${esc(INSIDE_ACTION_TITLE[a.kind])}">`
      + `${esc(INSIDE_ACTION_LABEL[a.kind])}</button>`;
  }

  // The recorded execution identity. `execution` = what RAN; `configured`
  // = what settings said WOULD run. One chip, whichever exists; the title
  // says which claim it is, so a pending process never reads as evidence.
  // The agent-core mark rides the injected identity API (B1) so the cluster
  // reads "[core icon] Agent · Codex · sol" per handoff §5.
  function identityChipHtml(p) {
    const e = p.execution || p.configuredExecution;
    if (!e) return '';
    const core = e.providerLabel || e.provider;
    const model = e.modelLabel || e.model;
    if (!core) return '';
    const label = [e.agentName, core, model && model !== core ? model : ''].filter(Boolean).join(' · ');
    const tip = p.execution ? 'Executed with this identity' : 'Configured to run — has not executed yet';
    const icon = agentIconHtml(e.provider);
    return `<span class="pchip${icon ? ' with-icon' : ''}" title="${esc(tip)}">${icon}${esc(label)}</span>`;
  }

  function tokensHtml(t) {
    if (!t) return '';
    // Absence is a first-class state (decision 8): a provider that reports no
    // per-session usage renders the handoff §6 wording with the host's title —
    // NEVER "0 tokens" (that would assert a measurement) and never "undefined".
    if (t.state === 'unavailable') {
      return `<span class="ptok" title="${esc(t.title)}">usage unavailable</span>`;
    }
    const tip = t.exact ? ` title="${esc(t.exact)}"` : '';
    return `<span class="ptok"${tip}>${esc(t.total)} tokens</span>`;
  }

  // ── per-kind evidence renderers (B2) ──────────────────────────────────
  // The closed ProcessEvidenceView union is dispatched here: one renderer per
  // kind, each emitting its own literal `pev-<kind>` container so the
  // kind-specific CSS hangs off one selector (UI-R10). The statuses, labels
  // and durations all arrive host-shipped; the only webview-local strings are
  // this closed status→word map and the glyph map above (UI-R31).
  const INSIDE_STATUS_LABEL = {
    pending: 'pending', run: 'running', wait: 'waiting',
    pass: 'passed', fail: 'failed', note: 'note', skip: 'skipped',
  };

  // The status WORD — the visible state, so status never rides colour alone
  // (UI-R06). The host ships the key; the word is closed control copy.
  function statusWordHtml(status) {
    return `<span class="estatus ${esc(status)}">${esc(INSIDE_STATUS_LABEL[status] || status)}</span>`;
  }

  function evidenceRowHtml(r) {
    const glyph = r.status ? `<span class="eglyph">${OP_GLYPH[r.status] || '·'}</span>` : '';
    // The timeline's relationship marker: this row continues the SAME
    // execution through a provider switch or a resume. Structural (the host
    // sets `connector`), never guessed from the label. Static tooltip copy
    // from the closed vocabulary, like the action titles above.
    const conn = r.connector === 'switch' || r.connector === 'resume'
      ? `<span class="econn" title="${r.connector === 'switch' ? 'Provider switched here' : 'Session resumed here'}">↳</span>`
      : '';
    const act = r.action ? insideActionBtnHtml(r.action) : '';
    return `<div class="erow${r.status ? ` ${esc(r.status)}` : ''}">${glyph}${conn}`
      + `<span class="elabel">${esc(r.label)}</span>`
      + (r.detail ? `<span class="edetail">${esc(r.detail)}</span>` : '')
      + (r.duration ? `<span class="edur">${esc(r.duration)}</span>` : '')
      + (act ? `<span class="eact">${act}</span>` : '')
      + `</div>`;
  }

  // Gates/findings/commits/prs rows carry a status WORD beside the glyph —
  // handoff §6's gate template ("lint  pass · 4.2s") and ship template
  // ("Commit  passed · created by Karst"). One shared row shape; the kind
  // class on the container is what differs.
  function statusRowHtml(r) {
    const glyph = r.status ? `<span class="eglyph">${OP_GLYPH[r.status] || '·'}</span>` : '';
    const act = r.action ? insideActionBtnHtml(r.action) : '';
    return `<div class="erow${r.status ? ` ${esc(r.status)}` : ''}">${glyph}`
      + `<span class="elabel">${esc(r.label)}</span>`
      + (r.status ? statusWordHtml(r.status) : '')
      + (r.detail ? `<span class="edetail">${esc(r.detail)}</span>` : '')
      + (r.duration ? `<span class="edur">${esc(r.duration)}</span>` : '')
      + (act ? `<span class="eact">${act}</span>` : '')
      + `</div>`;
  }

  // The timeline's row: the connector spine keeps its aligned cell and the
  // range reads as a right-aligned time column (handoff §6 impl).
  function timelineRowHtml(r) {
    const glyph = r.status ? `<span class="eglyph">${OP_GLYPH[r.status] || '·'}</span>` : '';
    const conn = r.connector === 'switch' || r.connector === 'resume'
      ? `<span class="econn" title="${r.connector === 'switch' ? 'Provider switched here' : 'Session resumed here'}">↳</span>`
      : '';
    const act = r.action ? insideActionBtnHtml(r.action) : '';
    return `<div class="erow${r.status ? ` ${esc(r.status)}` : ''}">${glyph}${conn}`
      + `<span class="elabel">${esc(r.label)}</span>`
      + (r.detail ? `<span class="edetail">${esc(r.detail)}</span>` : '')
      + (r.duration ? `<span class="etime">${esc(r.duration)}</span>` : '')
      + (act ? `<span class="eact">${act}</span>` : '')
      + `</div>`;
  }

  // The receipt is a list of delivered facts, not a status readout — the
  // process row's own status is the verdict, so per-row glyphs would double
  // it (handoff §6 done).
  function receiptRowHtml(r) {
    const act = r.action ? insideActionBtnHtml(r.action) : '';
    return `<div class="erow${r.status ? ` ${esc(r.status)}` : ''}">`
      + `<span class="elabel">${esc(r.label)}</span>`
      + (r.detail ? `<span class="edetail">${esc(r.detail)}</span>` : '')
      + (act ? `<span class="eact">${act}</span>` : '')
      + `</div>`;
  }

  function evidenceRowsHtml(ev) {
    return `<div class="pev pev-rows">${ev.rows.map(evidenceRowHtml).join('')}</div>`;
  }
  function evidenceGatesHtml(ev) {
    return `<div class="pev pev-gates">${ev.rows.map(statusRowHtml).join('')}</div>`;
  }
  function evidenceFindingsHtml(ev) {
    return `<div class="pev pev-findings">${ev.rows.map(statusRowHtml).join('')}</div>`;
  }
  function evidenceTimelineHtml(ev) {
    return `<div class="pev pev-timeline">${ev.rows.map(timelineRowHtml).join('')}</div>`;
  }
  function evidenceCommitsHtml(ev) {
    return `<div class="pev pev-commits">${ev.rows.map(statusRowHtml).join('')}</div>`;
  }
  function evidencePrsHtml(ev) {
    return `<div class="pev pev-prs">${ev.rows.map(statusRowHtml).join('')}</div>`;
  }
  function evidenceRecoveryHtml(ev) {
    return `<div class="pev pev-recovery">${ev.rows.map(evidenceRowHtml).join('')}</div>`;
  }
  function evidenceReceiptHtml(ev) {
    return `<div class="pev pev-receipt">${ev.rows.map(receiptRowHtml).join('')}</div>`;
  }

  // Kind → renderer. An unknown kind (a future host, an older snapshot) falls
  // back to the generic rows renderer — forward compatibility, never a throw.
  const EVIDENCE_RENDERERS = {
    rows: evidenceRowsHtml,
    gates: evidenceGatesHtml,
    findings: evidenceFindingsHtml,
    timeline: evidenceTimelineHtml,
    commits: evidenceCommitsHtml,
    prs: evidencePrsHtml,
    recovery: evidenceRecoveryHtml,
    receipt: evidenceReceiptHtml,
  };

  function evidenceBlockHtml(ev) {
    const render = EVIDENCE_RENDERERS[ev.kind] || evidenceRowsHtml;
    return render(ev);
  }

  function processRowHtml(p, key, open) {
    const glyph = OP_GLYPH[p.status] || '·';
    const meta = [p.count, p.duration].filter(Boolean)
      .map((m) => `<span class="pmeta">${esc(m)}</span>`).join('');
    const act = p.action ? insideActionBtnHtml(p.action) : '';
    const hasEv = p.evidence && p.evidence.rows.length;
    // A real <details>/<summary> (B3, decision 7): the row IS the summary, so
    // keyboard operability comes from the element, not a handler (UI-R09).
    // The composite `${key}` (stage:process, Task 0.1) rides the row's own
    // data-proc-id; the capture-phase `toggle` listener persists the open set
    // keyed by exactly that, so a disclosure survives the next re-render. The
    // marker is decorative; the summary text is the accessible name.
    const marker = hasEv ? '<span class="pchev" aria-hidden="true">›</span>' : '';
    const ev = hasEv && open ? evidenceBlockHtml(p.evidence) : '';
    return `<details class="proc ${esc(p.status)}" data-proc-id="${esc(key)}"${hasEv && open ? ' open' : ''}>`
      + `<summary><span class="prow"><span class="pglyph">${glyph}</span>`
      + `<span class="pname">${esc(p.label)}</span>${identityChipHtml(p)}${tokensHtml(p.tokens)}`
      + `<span class="pdetail">${esc(p.detail || '')}</span>`
      + `<span class="pright">${meta}${act}</span>${marker}</span></summary>${ev}</details>`;
  }

  // Live overlays, in order of precedence: a `completed` process row replaces
  // the snapshot's same-id row (or appends), and an `active` operation rides
  // the header without touching the rows. The snapshot that follows retires
  // both (see the state handler).
  function overlayProcesses(view) {
    const live = liveOps[view.stageKey];
    if (!live || !live.completed) return view.processes;
    const id = live.completed.id;
    if (!view.processes.some((p) => p.id === id)) return view.processes.concat(live.completed);
    // A live event is a STATUS update, not a snapshot. It carries no evidence,
    // so overwriting the row wholesale deleted evidence already on screen. Keep
    // every field the event does not speak to; the next snapshot is
    // authoritative and retires the overlay entirely.
    return view.processes.map((p) => (p.id === id ? { ...p, ...live.completed, evidence: live.completed.evidence ?? p.evidence } : p));
  }

  function renderInside(state, sel) {
    const view = (state.insideViews || {})[sel];
    if (!view) { el('inside').innerHTML = ''; return; }

    // "Not the current stage" is only meaningful when there IS one. On a ticket
    // that never started, every stage is equally uncurrent and the bar would be
    // noise offering a way back to nowhere.
    const viewing = state.stageCurrent && sel !== state.stageCurrent;
    const back = viewing ? STAGE_TITLE[state.stageCurrent] || state.stageCurrent : '';
    const vbar = viewing
      ? `<div class="vbar"><span>Viewing ${esc(view.title)} — not the current stage.</span>`
        + `<span class="sp"><button type="button" class="k-btn k-btn--ghost k-btn--sm" data-back`
        + ` title="Return the strip to the stage the ticket is actually on">Back to ${esc(back)}</button></span></div>`
      : '';

    // A live operation is run/wait/fail only (progress.ts) — never a verdict.
    // The spinner means RUNNING; a wait or a fail gets its own glyph, or the
    // header claims progress that is not happening.
    const live = liveOps[view.stageKey];
    const lstatus = live && live.active ? (live.active.status || 'run') : '';
    const lglyph = lstatus === 'run'
      ? '<span class="spin" aria-hidden="true"></span>'
      : `<span class="eglyph" aria-hidden="true">${OP_GLYPH[lstatus] || '·'}</span>`;
    const alive = live && live.active
      ? `<span class="alive ${esc(lstatus)}">${lglyph}${esc(live.active.label || 'Running')}`
        + (live.active.detail ? `<span class="adetail">${esc(live.active.detail)}</span>` : '')
        + (live.active.duration ? `<span class="adur">${esc(live.active.duration)}</span>` : '')
        + `</span>`
      : '';

    const procs = overlayProcesses(view);
    const body = procs.length
      ? `<div class="procs">${procs.map((p) => processRowHtml(p, `${view.stageKey}:${p.id}`, openProcesses.has(`${view.stageKey}:${p.id}`))).join('')}</div>`
      : `<div class="blurb">${esc(view.blurb)}</div>`;

    el('inside').innerHTML = `<div class="act ${viewing ? 'viewing' : ''}">${vbar}`
      + `<div class="ahead"><span class="adot ${esc(view.dot)}"></span>`
      + `<span class="aname">Inside ${esc(view.title.toLowerCase())}</span>${alive}`
      + `<span class="aclock">${esc(view.clock)}</span></div>${body}</div>`;
  }

  // The fault card: the reason a red node is red, the log behind it, and when it
  // ran. Shown only for a failed stage — everything else stays quiet.
  function renderFault(stepper) {
    const box = el('fault');
    const failed = (stepper || []).find((s) => s.status === 'failed');
    box.classList.toggle('hidden', !failed);
    if (!failed) { box.innerHTML = ''; return; }
    const title = `${STAGE_TITLE[failed.stageKey] || failed.stageKey} failed`;
    const timing = timingText(failed);
    const attempt = failed.attempt ? ` · attempt ${esc(failed.attempt)}` : '';
    box.innerHTML = `<div class="ftitle">${esc(title)}</div>`
      + `<div class="freason">${esc(failed.reason || 'No reason recorded.')}</div>`
      + (timing ? `<div class="fmeta">${esc(timing)}${attempt}</div>` : '')
      + (failed.artifactPath
        ? `<div class="facts"><button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="open-stage-log"`
          + ` data-path="${esc(failed.artifactPath)}" title="Open this stage's log file in an editor">Open log</button></div>`
        : '');
  }

  // The blocked banner: why karst could not ask the CURRENT stage's question
  // (`parkGateStage`/`clearStageBlock`, § blocked state visible), plus the one
  // recovery action. Reads `state.currentStage.blocked` only — a stage that
  // isn't the ticket's current one is never the thing a Resume click here
  // could act on, so there is nothing to show for it.
  function renderBlocked(state) {
    const box = el('blocked');
    const cell = state.currentStage;
    const blocked = cell && cell.blocked;
    box.classList.toggle('hidden', !blocked);
    if (!blocked) { box.innerHTML = ''; return; }
    // `awaiting-merge` is not a fault: ship's own work is done and the PRs are
    // open, and this reads as a normal wait for one of them to land, not a
    // stage karst failed to run. It also gets no Resume button — every OTHER
    // BlockerKind means "karst could not ask the question, retry it", but
    // `stageResume.ts`'s `resumeBlockedStage` REFUSES to clear this one (only
    // the merge gate observing the actual landing is entitled to), so a
    // Resume button here would be a dead affordance that always no-ops.
    if (blocked.kind === 'awaiting-merge') {
      box.innerHTML = `<div class="ftitle">Waiting to merge</div>`
        + `<div class="freason">${esc(blocked.reason)}</div>`;
      return;
    }
    const title = `${STAGE_TITLE[cell.stageKey] || cell.stageKey} is blocked`;
    box.innerHTML = `<div class="ftitle">${esc(title)}</div>`
      + `<div class="freason">${esc(blocked.reason)}</div>`
      + `<div class="facts"><button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="stage-resume"`
      // `data-stagekey`, NOT `data-stage`: the rail's view-selection click
      // handler matches ANY `[data-stage]` ancestor (closest()), and this
      // button living inside the blocked banner must never also reselect
      // which stage's Inside panel is showing.
      + ` data-stagekey="${esc(cell.stageKey)}"`
      + ` title="Clear the block and let karst try this stage again">Resume</button></div>`;
  }

  // One sentence + at most one button. The copy is built host-side (model/nowLine)
  // and shipped in the state, so it is unit-tested and lives in exactly one place.
  // `session` and `resume` both route to resume-ticket: the host's openSession
  // resolves --resume vs. a fresh (self-scoping) launch on its own, so the verb
  // is a label concern only — the button always reaches the one entry point.
  const NOW_MESSAGE = { 'open-log': 'open-stage-log', ship: 'ship-ticket', resume: 'resume-ticket', session: 'resume-ticket' };
  // Fixed, static tooltip text per action kind (UI-R19/R20) — the label alone
  // ("Ship", "Resume") is a bare verb whose object is not visible on the
  // button. These are structural UI copy, like every other static tooltip in
  // this file (sidebar's row actions are the precedent), not a host-derived
  // value — UI-R31 governs DATA, not fixed control copy.
  const NOW_TITLE = {
    'open-log': "Open the failed stage's log file",
    ship: 'Ship this ticket — commit, push, and open pull requests',
    resume: "Resume this ticket's agent session",
    session: "Resume this ticket's agent session",
  };

  function renderNow(now, agentSession) {
    // While a ship is in flight, the real per-step progress lives in the Inside
    // block; this line is a static sentence, never a spinner label — and no
    // button, since the confirm click already happened (no second one to make).
    // The in-flight marker is the pending requestId (the old `shipping` flag
    // is gone), so the hold survives every push until the stage resolves.
    if (shipRequestId) {
      el('now').innerHTML = `<span class="ntext">${esc('Now: shipping — committing, pushing, and opening PRs for each hot repo.')}</span>`;
      return;
    }
    const line = now || { text: '' };
    const a = line.action;
    const type = a && NOW_MESSAGE[a.kind];
    const title = a && NOW_TITLE[a.kind];
    const attrs = a && a.path ? ` data-path="${esc(a.path)}"` : '';
    const switchAction = agentSession && agentSession.canSwitch
      ? '<button type="button" class="k-btn k-btn--secondary k-btn--sm switch-agent" data-act="switch-agent"'
        + ' title="Switch this ticket\'s live agent session">Switch agent…</button>'
      : '';
    const identity = agentSession
      ? `${agentSession.providerLabel} · ${agentSession.modelLabel}`
      : '';
    // A brief success flash beside the settled line once a ship resolves — the
    // clear "it worked" beat before the dashboard shows the done state.
    const badge = shipDone === 'success' ? `<span class="shipbadge ok">✓ Shipped</span>` : '';
    const detail = a && a.kind === 'session' && a.detail ? a.detail : '';
    const subtitle = [detail, identity].filter(Boolean).join(' · ');
    const sub = subtitle
      ? `<div class="now-sub">${esc(subtitle)}</div>`
      : '';
    el('now').innerHTML = badge + `<span class="ntext">${esc(line.text)}</span>`
      + (type ? `<button type="button" class="k-btn k-btn--primary k-btn--sm" data-act="${type}"${attrs}`
        + `${title ? ` title="${esc(title)}"` : ''}>${esc(a.label)}</button>` : '')
      + switchAction
      + sub;
  }

  // Decide whether an incoming snapshot ends the in-flight ship. Keyed off host
  // truth (the ship stage's own status), never the copy: while the ship runs
  // the stage sits at `running`, so every push would otherwise rebuild the
  // plain "Confirm ship" line and wipe the spinner. Success = advanced past
  // ship; error = ship landed failed (the Now line + fault card then explain
  // it). The in-flight marker is `shipRequestId` — the old `shipping` flag is
  // gone with the legacy ship-progress overlay it drove (Finding 12).
  function resolveShipping(state) {
    const requestId = shipRequestId;
    if (!requestId) return;
    const atShip = state.stageCurrent === 'ship';
    const failed = atShip && state.currentStage && state.currentStage.status === 'failed';
    shipRequestId = null;
    if (failed) {
      // The failed Now line + fault card are the explicit error state.
      karstSettle(requestId, false);
    } else if (!atShip) {
      shipDone = 'success';
      karstSettle(requestId, true);
      setTimeout(() => { shipDone = null; render(lastState); }, 2400);
    }
    // else still at ship (running) → hold the sentence across this push, and
    // leave requestId in place (restored below) so a later push can still
    // settle it.
    if (!failed && atShip) shipRequestId = requestId;
  }

  // ---------------------------------------------------------------------
  // Servers panel
  // ---------------------------------------------------------------------
  const isOnline = (s) => s.status === 'running';
  const addrOf = (s) => `${s.host || 'localhost'}:${s.port}`;

  const svgIcon = (name) => (
    `<svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><use href="#i-${name}"/></svg>`
  );

  /**
   * An icon action. The visible label IS the icon, so the word survives as both
   * aria-label (screen readers) and title (hover) — nothing is conveyed by shape
   * alone, and the two carry the SAME string (UI-R21). A disabled button keeps
   * that string as WHY: a greyed icon with no explanation is a dead end the
   * user cannot tell from a broken one, for a screen-reader user exactly as
   * much as a sighted one.
   */
  const iact = (action, id, label, name, disabledWhy) => (
    `<button type="button" class="k-iconbtn ib t-${name}" data-act="${action}"`
    + `${id != null ? ` data-id="${id}"` : ''}`
    + `${name === 'copy' ? ' data-copy' : ''}`
    + `${disabledWhy ? ' disabled' : ''}`
    + ` aria-label="${esc(disabledWhy || label)}" title="${esc(disabledWhy || label)}">`
    + `${svgIcon(name)}</button>`
  );

  // Row actions come in two groups: Open and Copy operate on the ADDRESS and sit
  // flush against it; Restart and Stop operate on the PROCESS.
  const addrActions = (s) => (
    isOnline(s)
      ? iact('open-server', s.id, 'Open in browser', 'open')
        + iact('copy-server-url', s.id, 'Copy URL', 'copy')
      : ''
  );

  // An offline row is retained, not deleted, so it can be started again. Open,
  // Copy and Stop are all meaningless on it.
  const lifeActions = (s) => (
    isOnline(s)
      ? iact('restart-server', s.id, 'Restart', 'restart')
        + iact('stop-server', s.id, 'Stop', 'stop')
      : iact('spin-servers', null, 'Start service', 'start')
  );

  /**
   * Whole-ticket controls, rendered into the panel HEADER. They act on every
   * service, so they must survive the states where the body has no rows — the
   * empty body is exactly when Start matters most. Each disables itself when it
   * would be a no-op and explains that in its title.
   *
   * Start and Restart post different actions but the host binds both to a
   * re-spin (a spin already stops everything first); they stay distinct by
   * AVAILABILITY, which is what this function computes.
   */
  function panelOps(state) {
    // Nothing in scope can ever run: these would be permanent dead affordances,
    // so they are absent rather than disabled.
    if (state.hasRunnableRepos === false) return '';
    const list = state.servers;
    const none = list.length === 0;
    const anyOffline = list.some((s) => !isOnline(s));
    const anyRunning = list.some(isOnline);
    const startWhy = !none && !anyOffline ? 'Every service is already running' : null;
    const restartWhy = none ? 'No services to restart' : null;
    const stopWhy = !anyRunning ? 'No service is running' : null;
    return iact('spin-servers', null, 'Start all services', 'start', startWhy)
      + iact('restart-servers', null, 'Restart all services', 'restart', restartWhy)
      + iact('stop-servers', null, 'Stop all services', 'stop', stopWhy);
  }

  /**
   * The two empty states stay distinct, and the distinction is the point: one is
   * a PROMPT (nothing is running — the header's Start fixes that), the other a
   * STATEMENT of fact (nothing here can run, and the header controls are gone
   * with it). Neither carries a button; the action lives in the header.
   */
  function serversEmpty(state) {
    if (state.hasRunnableRepos === false) {
      return `<div class="estate dead"><span class="emark">${svgIcon('ban')}</span>`
        + `<div><div class="ehead">No runnable services in scope</div>`
        + `<div class="esub">This ticket scopes only repositories without a service`
        + ` block, so there is nothing here to run.</div></div></div>`;
    }
    return `<div class="estate"><span class="emark">${svgIcon('rack')}</span>`
      + `<div><div class="ehead">No servers running</div>`
      + `<div class="esub">Start the services in scope to get their local`
      + ` addresses here.</div></div></div>`;
  }

  function serverRow(s) {
    const on = isOnline(s);
    const status = on ? 'running' : 'offline';
    // role=img + aria-label is what keeps a bare dot from being invisible to a
    // screen reader now that the word is gone; title gives the pointer the same
    // word. Never colour alone: filled disc vs hollow ring still differ, and an
    // offline row reads "—" where an address would be.
    const dot = `<span class="glyph ${on ? 'on' : 'off'}" role="img"`
      + ` aria-label="${status}" title="${status}"></span>`;
    const addr = on
      ? `<span class="full">${esc(addrOf(s))}</span><span class="short">:${esc(s.port)}</span>`
      : '—';
    return `<tr><td class="c-dot">${dot}</td>`
      + `<td class="c-name" title="${esc(s.service)}">${esc(s.service)}</td>`
      + `<td class="c-addr${on ? '' : ' off'}"`
      + ` title="${on ? esc(addrOf(s)) : 'offline — no address'}">${addr}</td>`
      + `<td class="c-addrops"><span class="g">${addrActions(s)}</span></td>`
      + `<td class="c-acts"><span class="g">${lifeActions(s)}</span></td></tr>`;
  }

  function renderServers(state) {
    const servers = state.servers;
    el('srvCount').textContent = servers.length ? `${servers.length}` : '';
    el('srvOps').innerHTML = panelOps(state);
    if (!servers.length) {
      el('servers').innerHTML = serversEmpty(state);
      return;
    }
    // The filter earns its row only once scanning is actually hard.
    const needle = srvFilter.trim().toLowerCase();
    const filterable = servers.length > 6;
    const bar = filterable
      ? `<div class="filter"><label class="sr" for="srvFilter">Filter services</label>`
        + `<input id="srvFilter" class="k-input" type="search" placeholder="Filter ${servers.length} services…"`
        + ` value="${esc(srvFilter)}" data-filter></div>`
      : '';
    const shown = filterable && needle
      ? servers.filter((s) => s.service.toLowerCase().includes(needle))
      : servers;
    const rows = shown.map(serverRow).join('')
      || `<tr><td colspan="5"><div class="nomatch">No service matches`
        + ` “${esc(srvFilter)}”.</div></td></tr>`;
    // The address-ops column sits UNDER the Address header (colspan 2): Open and
    // Copy are part of the address, so the header says so.
    el('servers').innerHTML = `${bar}<div class="scroll"><table>`
      + `<thead><tr><th scope="col"><span class="sr">Status</span></th>`
      + `<th scope="col">Service</th><th scope="col" colspan="2">Address</th>`
      + `<th scope="col" style="text-align:right">Actions</th></tr></thead>`
      + `<tbody>${rows}</tbody></table></div>`;
  }

  function renderWorktrees(wts) {
    el('wtCount').textContent = wts.length ? `${wts.length}` : '';
    el('wtChanges').disabled = wts.length === 0;
    el('worktrees').innerHTML = wts.length ? wts.map((w) => {
      const stats = worktreeStats[w.repo];
      const totals = stats
        ? `<span class="wstats"><span class="wadd">+${stats.additions}</span> <span class="wdel">−${stats.deletions}</span></span>`
        : '';
      const branch = w.branch
        ? `<span class="wbranch"><span class="wbr">${esc(w.branch)}</span>`
          // Optimistic (UI-R15): the host does the clipboard write and cannot
          // fail in a way the user must act on, so flashCopied confirms
          // without waiting for a round trip — see flashCopied() below.
          + `<button type="button" class="k-iconbtn ib t-copy" data-act="copy-worktree-branch" data-branch="${esc(w.branch)}" data-copy aria-label="Copy branch name" title="Copy branch name">${svgIcon('copy')}</button></span>`
        : '';
      return `<div class="wt"><span class="wrepo">${esc(w.repoDisplay || w.repo)}</span>`
        + branch + totals + `<span class="wacts">`
        + `<button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="open-worktree-terminal" data-path="${esc(w.path)}"`
        + ` title="Open a terminal in this worktree">Open Terminal</button>`
        + `<button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="open-worktree-folder" data-path="${esc(w.path)}"`
        + ` title="Reveal this worktree in the file explorer">Reveal in Explorer</button>`
        + `</span></div>`;
    }).join('') : '<div class="empty">No worktrees.</div>';
  }

  // Mergeability under a PR row. Every string is the host's
  // (`buildMergeCheckPanelRows`) — the webview only places them. A repo with no
  // check renders NOTHING: never asked is not the same as clean, and the one
  // thing this panel must not do is reassure about a question nobody put.
  //
  // The headline is bounded (verdict, count, base ref, age), so it fits the line
  // it is given. Everything unbounded — the path list, git's own error prose —
  // lives in the disclosure, which is where it can wrap and be selected. A row
  // the host gave no `detailsLabel` renders no disclosure at all.
  function mergeLine(m) {
    if (!m) return '';
    const act = m.state === 'conflicted'
      ? `<button type="button" class="k-btn k-btn--secondary k-btn--sm mgbtn" data-act="resolve-conflicts" data-repo="${esc(m.repo)}"`
        + ` title="Hand this repo's conflict to an agent session">Resolve conflicts</button>`
      : '';
    // The relative age drifts between state pushes; the absolute stamp does not.
    const title = m.checkedTitle ? ` title="checked ${esc(m.checkedTitle)}"` : '';
    const body = m.reason
      ? `<div class="mgreason">${esc(m.reason)}</div>`
      : (m.files || []).map((f) => `<div class="mgfile">${esc(f)}</div>`).join('');
    // Re-open exactly the disclosures the user had open before this render —
    // see `openMergeRepos` above.
    const openAttr = openMergeRepos.has(m.repo) ? ' open' : '';
    const details = m.detailsLabel
      ? `<details class="mgd"${openAttr} data-repo="${esc(m.repo)}"><summary>${esc(m.detailsLabel)}</summary>`
        + `<div class="mgdbody">${body}</div></details>`
      : '';
    return `<div class="mgwrap mg-${esc(m.state)}">`
      + `<div class="mg"><span class="mgdot" aria-hidden="true"></span>`
      + `<span class="mgtext"${title}>${esc(m.headline)}</span>${act}</div>`
      + details
      + `</div>`;
  }

  // The merge control. Rendered from the host's verdict (`canMerge` +
  // `mergeBlockedReason`) — the webview never decides that a PR is mergeable, and
  // never phrases the reason it isn't.
  //
  // Merging is IRREVERSIBLE, so the click only asks: the host puts a modal in
  // front of the user (which also chooses the strategy) before anything runs.
  // `.k-btn--danger` (UI-R10b) marks it as the one irreversible action on this
  // panel. The pending state (aria-busy, via `mergeRequests`) exists so a click
  // on an irreversible action is never silent while that dialog is up, and it
  // is cleared by the next state push — including the one the host sends after
  // a cancel, so the button can never stick (see `mergeRequests`' own comment).
  function mergeButton(p) {
    if (p.status === 'merged') return '';
    if (mergeRequests[p.repo]) {
      return `<button type="button" class="k-btn k-btn--danger k-btn--sm mgbtn" aria-busy="true" disabled`
        + ` title="Confirm the merge in the dialog">Merge</button>`;
    }
    if (!p.canMerge) {
      return `<button type="button" class="k-btn k-btn--secondary k-btn--sm mgbtn" disabled title="${esc(p.mergeBlockedReason)}">Merge</button>`;
    }
    const num = p.number ? ` #${p.number}` : '';
    return `<button type="button" class="k-btn k-btn--danger k-btn--sm mgbtn" data-act="merge-pr" data-repo="${esc(p.repo)}"`
      + ` title="Merge PR${esc(num)} into ${esc(p.baseRef || 'its base')} — cannot be undone">Merge</button>`;
  }

  // The metadata line under a PR: from-to, when it was opened, when it merged, and
  // how many comments it carries. Every part is a host-rendered string that is ''
  // when the fact is absent, so a PR karst has not fully probed simply shows less
  // — never a blank field, a placeholder, or "Invalid Date".
  function prMetaLine(p) {
    const bits = [
      p.branches ? `<span class="pbranch">${esc(p.branches)}</span>` : '',
      p.opened ? `<span>${esc(p.opened)}</span>` : '',
      p.merged ? `<span class="pmerged">${esc(p.merged)}</span>` : '',
    ].filter(Boolean);
    if (!bits.length) return '';
    return `<div class="pmeta">${bits.join('<span class="psep">·</span>')}</div>`;
  }

  // Comments collapse by default: the count is the fact a reader scans for, the
  // bodies are what they open when it matters. A PR with none renders nothing at
  // all rather than an empty disclosure.
  function prComments(p) {
    if (!p.commentsLabel) return '';
    const rows = p.comments.map((c) => (
      `<div class="pcm"><span class="pcmwho">${esc(c.author || 'unknown')}</span>`
      + (c.when ? `<span class="pcmwhen">${esc(c.when)}</span>` : '')
      + `<div class="pcmbody">${esc(c.body)}</div></div>`
    )).join('');
    return `<details class="pcms"><summary>${esc(p.commentsLabel)}</summary>${rows}</details>`;
  }

  function renderPrs(prs, mergeChecks) {
    const byRepo = {};
    for (const m of (mergeChecks || [])) byRepo[m.repo] = m;
    el('prCount').textContent = prs.length ? `${prs.length}` : '';
    // The refresh stays live even with zero PRs: "none yet" is exactly the answer
    // a user wants to re-ask right after a ship.
    const refresh = el('prRefresh');
    const refreshing = !!prRefreshId;
    if (refreshing) refresh.setAttribute('aria-busy', 'true');
    else refresh.removeAttribute('aria-busy');
    refresh.disabled = refreshing;
    // aria-label and title stay the SAME string in both states (UI-R21) — an
    // icon-only control's accessible name and its tooltip must never diverge.
    const refreshName = refreshing
      ? 'Re-checking pull requests…'
      : 'Re-check pull request status and mergeability now';
    refresh.title = refreshName;
    refresh.setAttribute('aria-label', refreshName);
    el('prs').innerHTML = prs.length ? prs.map((p) => (
      `<div class="prrow"><div class="pr"><span class="k-chip pst pst-${esc(p.status || 'unknown')}">${esc(p.status || '')}</span>`
      // The DISPLAY path, per the worktree path-display preference — the same
      // string the worktree rows show for this repo.
      + `<span class="prepo">${esc(p.repoDisplay || p.repo)}</span>`
      + `<span class="ptitle">${esc(p.url || '')}</span>`
      + `<span class="pnum">#${esc(p.number)}</span>`
      + `<span class="pacts"><button type="button" class="k-btn k-btn--secondary k-btn--sm" data-act="open-pr" data-url="${esc(p.url)}" title="Open this pull request">Open</button>`
      + mergeButton(p)
      + `</span></div>`
      + prMetaLine(p)
      + mergeLine(byRepo[p.repo])
      + prComments(p)
      + `</div>`
    )).join('') : '<div class="empty">No pull requests.</div>';
  }

  // agent state -> pill color (uses the same chart vars as the stepper).
  const AGENT_COLOR = {
    running: 'var(--k-running)',
    waiting: 'var(--k-attention)',
    idle: 'var(--k-pending)',
    none: 'var(--k-pending)',
  };

  function renderAgent(agentState) {
    const st = agentState || 'none';
    const color = AGENT_COLOR[st] || 'var(--k-pending)';
    el('agent').innerHTML =
      `<span class="agent-pill"><span class="dot" style="background:${color}"></span>`
      + `agent: ${esc(st)}</span>`;
  }

  // The key pill, which doubles as the link to the source board (ClickUp, …)
  // when the ticket was fetched from one: provider mark + key + arrow, one
  // target. The board ref and the synthesized brief ride along as the hover —
  // printing the ref beside the key only echoed it (they name the same id).
  // Manual/unfetched → the same pill, dashed and inert.
  function renderKeyPill(state) {
    const label = state.key || `#${state.ticketId}`;
    if (!state.ticketUrl) {
      // Inert: a plain, non-interactive <span> (the `.k-chip` informational
      // form — no role, no tabindex) with a dashed border and default cursor,
      // so nothing about it implies a control that can be activated.
      el('keyPill').innerHTML =
        `<span class="k-chip keypill local" title="Manual ticket — not linked to a board">${esc(label)}</span>`;
      return;
    }
    const icon = providerIconHtml(state.provider);
    // Drop the ref when it IS the key (a fetched ticket usually keys on it) —
    // the tooltip would just repeat the pill.
    const ref = state.sourceRef === label ? null : state.sourceRef;
    const hover = [ref, state.brief].filter(Boolean).join(' — ');
    const tip = hover ? ` title="${esc(hover)}"` : '';
    el('keyPill').innerHTML =
      `<a class="k-chip keypill" href="#" data-act="open-ticket-link" data-url="${esc(state.ticketUrl)}"${tip}>`
      + `${icon}${esc(label)} <span class="arw" aria-hidden="true">↗</span></a>`;
  }

  function render(state) {
    lastState = state;
    // Selection defaults to the current stage; with none (nothing has run) it
    // falls back to scope — the one the user is about to start.
    const sel = selectedStage || state.presentedStage || state.stageCurrent || 'scope';
    el('title').textContent = state.title || '(untitled)';
    renderKeyPill(state);
    // Follow-up only makes sense once the work shipped — same gate the
    // createFollowUpTicket command enforces server-side.
    el('followUpBtn').classList.toggle('hidden', state.stageCurrent !== 'done');
    renderAgent(state.agentState);
    renderTrack(state.rail, state.approach, sel);
    renderInside(state, sel);
    // The fault card scans the FLAT stepper, so it still sees fix.
    renderFault(state.stepper);
    renderBlocked(state);
    renderNow(state.now, state.agentSession);
    renderServers(state);
    renderWorktrees(state.worktrees);
    renderPrs(state.prs, state.mergeChecks);
    renderGates();
  }

  // One toggle row for one resolved gate. A real <button> (UI-R09), never a
  // clickable div — data-stage/data-name/data-disabled carry everything the
  // click handler needs to post `set-disabled-gates` without guessing at the
  // ticket's current selection.
  function gateRow(stage, opt) {
    const label = (opt.disabled ? 'Enable ' : 'Disable ') + opt.name + ' for this ticket';
    return `<div class="gaterow${opt.disabled ? ' off' : ''}">`
      + `<span class="gname">${esc(opt.name)}</span>`
      + `<span class="gstate">${opt.disabled ? 'disabled' : 'runs'}</span>`
      + `<button type="button" class="k-btn k-btn--ghost k-btn--sm gtoggle"`
      + ` data-act="set-disabled-gates" data-stage="${esc(stage)}" data-name="${esc(opt.name)}"`
      + ` data-disabled="${opt.disabled ? '1' : '0'}"`
      + ` aria-pressed="${opt.disabled ? 'true' : 'false'}"`
      + ` aria-label="${esc(label)}" title="${esc(label)}">${opt.disabled ? 'Enable' : 'Disable'}</button>`
      + `</div>`;
  }

  // Resolved gate names arrive on their own message (§ gateOptions), never
  // inside `state` — so this reads the module-level `gateOptions`, not an
  // argument, and is safe to call from both the state push (clears to empty)
  // and the gate-options message handler (repopulates).
  function renderGates() {
    const uat = gateOptions.uat || [];
    const review = gateOptions.review || [];
    const countEl = el('gateCount');
    if (countEl) countEl.textContent = String(uat.length + review.length);
    const body = el('gates');
    if (!body) return;
    if (!uat.length && !review.length) {
      body.innerHTML = '<div class="blurb">No gates resolved for this ticket yet.</div>';
      return;
    }
    const group = (title, stage, opts) => opts.length
      ? `<div class="ggroup"><div class="gtitle">${esc(title)}</div>`
        + opts.map((o) => gateRow(stage, o)).join('') + '</div>'
      : '';
    body.innerHTML = group('UAT', 'uat', uat) + group('Review', 'review', review);
  }

  // The toggle's label stays "Bind terminal" in both states — a button that
  // renamed itself to the ACTION ("Unbind") reads, at a glance, as the state.
  // aria-pressed and the fill carry the state; the tooltip spells out what the
  // binding does, since the consequence lands on tabs elsewhere in the IDE.
  function renderBind() {
    const btn = el('bindBtn');
    if (!btn) return;
    btn.setAttribute('aria-pressed', String(bindEnabled));
    btn.title = bindEnabled
      ? 'Bind is on — opening this dashboard reveals the agent terminal, and opening the terminal reveals this dashboard. Click to unbind.'
      : 'Bind is off — this dashboard and the agent terminal move independently. Click to bind them.';
  }

  // Selection is view state: persisted BESIDE the host's snapshot, never inside
  // it. Inside `state` it would be dropped by the next push (the host builds
  // that from the DB) and would put a webview concern in a host-owned type.
  const persist = () => vscode.setState({ state: lastState, sel: selectedStage, srvFilter: srvFilter });

  function select(stage) {
    selectedStage = stage;
    render(lastState);
    persist();
  }

  // editBtn/followUpBtn post through the generic delegated `[data-act]`
  // handler below (data-act is set in their markup, above) — the same pending
  // lifecycle every other posting control gets, rather than a bespoke listener.

  // Filtering is local and never round-trips to the host. Re-rendering replaces
  // the input element, so focus and caret are restored explicitly — otherwise
  // the field loses focus after the first keystroke and typing stops dead.
  el('servers').addEventListener('input', (e) => {
    const box = e.target.closest('[data-filter]');
    if (!box) return;
    srvFilter = box.value;
    const caret = box.selectionStart;
    render(lastState);
    const next = el('servers').querySelector('[data-filter]');
    if (next) {
      next.focus();
      try { next.setSelectionRange(caret, caret); } catch { /* type=search may refuse */ }
    }
    persist();
  });

  // Clicking a stage re-points the strip. Purely local — no host round trip, so
  // it stays instant and survives every state push.
  document.addEventListener('click', (e) => {
    // The needs-you button navigates; it never acts. Checked BEFORE the stage
    // hook, because it lives inside a segment that also carries one.
    if (e.target.closest('[data-goto]')) { gotoAction(); return; }
    const node = e.target.closest('[data-stage]');
    if (node) { select(node.dataset.stage); return; }
    if (e.target.closest('[data-back]')) select(null);
  });

  // Tracks which merge disclosures (`.mgd`) are open, so the next render — fired
  // by a state push or an inside-progress tick, not by this click — restores
  // exactly the ones the user had open. Listens in the CAPTURE phase: `toggle`
  // does not bubble in every engine, so a bubble-phase delegate on `#prs` could
  // silently miss it.
  document.addEventListener('toggle', (e) => {
    const node = e.target && e.target.closest && e.target.closest('.mgd');
    if (!node || !node.dataset.repo) return;
    const next = new Set(openMergeRepos);
    if (node.open) next.add(node.dataset.repo);
    else next.delete(node.dataset.repo);
    openMergeRepos = next;
  }, true);

  // Optimistic feedback for the copy button (UI-R15) — the host does the actual
  // clipboard write, and a webview that cannot confirm a write is not something
  // the user needs to act on (the click is trivially repeatable), so this
  // confirms without waiting for a round trip. Never used for a mutation.
  function flashCopied(btn) {
    // An icon button has no text to swap, so the GLYPH is what flashes — and the
    // confirmation moves onto aria-label too, so it is not a purely visual beat
    // for anyone reading the button by name.
    if (btn.classList.contains('ib')) {
      const prevHtml = btn.innerHTML;
      const prevLabel = btn.getAttribute('aria-label');
      btn.innerHTML = svgIcon('check');
      btn.setAttribute('aria-label', 'Copied');
      btn.classList.add('ok');
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = prevHtml;
        btn.setAttribute('aria-label', prevLabel);
        btn.classList.remove('ok');
        btn.disabled = false;
      }, 1200);
      return;
    }
    const prev = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 1200);
  }

  // Delegate clicks (buttons + the ticket-link anchor) → action messages
  // (messages.ts routeAction). A no-payload action (e.g. spin-servers) posts
  // just its type.
  //
  // Rows here render by full innerHTML replacement (every `state` push and
  // every `inside-progress` tick calls render()), so a per-element `karstAction`
  // binding — which keys pending state to the ONE element it was bound to —
  // would go stale the instant a re-render swaps that element out from under
  // it. This delegated handler instead calls the runtime's underlying pieces
  // (karstRequestId / karstBeginPending / karstIsPending) directly, the same
  // fix `sidebar` and `diffs` already apply to the same problem, so every
  // control still gets the four required properties: pending on click,
  // non-re-triggerable, a terminal result, and a watchdog.
  //
  // ship-ticket / merge-pr / refresh-prs are the exception: extension.ts does
  // not await their inner promise (each fires a multi-second-to-multi-minute
  // network operation and returns immediately), so the generic host ack would
  // arrive and settle the control almost instantly — long before the real
  // work finishes. Those three carry NO requestId on the wire and settle
  // themselves from the next meaningful `state` push instead (§
  // DESIGN-SYSTEM.md 5.1: a mutating action "settles on the host's result, OR
  // THE NEXT state push") — see resolveShipping() and the `state` handler
  // below. merge-pr's payload also stays exactly `{type:'merge-pr', repo}`
  // regardless (UI-R37): the strategy is the host's question to the user, and
  // widening the wire payload here would be the same failure the omitted
  // `method` already guards against.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    e.preventDefault();
    const act = btn.dataset.act;

    // Confirm ship kicks off slow backend work (model call + gh pr create).
    // Guard against double-submit and show that the click registered BEFORE
    // the host is even asked — no window where the button looks inert with
    // work underway. The in-flight marker is the pending requestId, which
    // resolveShipping() settles from the next meaningful state push (the old
    // `shipping` flag is gone with the legacy ship-progress overlay).
    if (act === 'ship-ticket') {
      if (shipRequestId) return;
      shipDone = null;
      shipRequestId = karstRequestId();
      karstBeginPending(btn, shipRequestId);
      render(lastState);
      post({ type: act });
      return;
    }
    // Merging is irreversible and the host answers with a modal first, so the
    // button must both stop repeating the request and show that the click
    // landed. See resolveMergeOutcome() for how mergeRequests[repo] settles.
    if (act === 'merge-pr') {
      const repo = btn.dataset.repo;
      if (!repo || mergeRequests[repo]) return;
      const requestId = karstRequestId();
      karstBeginPending(btn, requestId);
      mergeRequests = { ...mergeRequests, [repo]: requestId };
      render(lastState);
      post({ type: act, repo });
      return;
    }
    // Same reason as the two above: the work is a slow host round trip (gh
    // per PR, git fetch per repo), so show it landed and stop it repeating.
    if (act === 'refresh-prs') {
      if (prRefreshId) return;
      prRefreshId = karstRequestId();
      karstBeginPending(btn, prRefreshId);
      if (lastState) render(lastState);
      post({ type: act });
      return;
    }

    // Pending is set locally on click (UI-R11): the round trip is the thing
    // being reported, so it can never also be the thing that starts the
    // report. The label never changes while pending — the spinner (via
    // karstBeginPending) carries that meaning, not a text swap.
    if (act === 'set-disabled-gates') {
      if (karstIsPending(btn) || btn.disabled) return;
      const requestId = karstRequestId();
      karstBeginPending(btn, requestId);
      post({
        type: act,
        stage: btn.dataset.stage,
        name: btn.dataset.name,
        disabled: btn.dataset.disabled !== '1',
        requestId,
      });
      return;
    }

    // Every other posting control settles on the host's genuine `action-result`
    // ack (UI-R11–R14): pending on click, dropped (not queued) on a repeat,
    // and the runtime's own watchdog covers a host that never answers.
    if (karstIsPending(btn) || btn.disabled) return;
    const requestId = karstRequestId();
    karstBeginPending(btn, requestId);
    if (btn.dataset.id) post({ type: act, serverId: Number(btn.dataset.id), requestId });
    else if (btn.dataset.branch) post({ type: act, branch: btn.dataset.branch, requestId });
    else if (btn.dataset.path) post({ type: act, path: btn.dataset.path, requestId });
    else if (btn.dataset.url) post({ type: act, url: btn.dataset.url, requestId });
    // The repo NAMES the conflict; the host resolves it to a worktree itself.
    else if (btn.dataset.repo) post({ type: act, repo: btn.dataset.repo, requestId });
    // stage-resume: the message carries ITS OWN ticketId/stageKey (the host
    // validates both against the ticket it actually owns before touching the
    // store — see messages.ts) rather than trusting the panel's notion of
    // "current", which a stale render could have gotten wrong.
    else if (btn.dataset.stagekey) {
      post({ type: act, ticketId: lastState.ticketId, stageKey: btn.dataset.stagekey, requestId });
    }
    // inside-action: the message carries ONLY the opaque actionId (messages.ts
    // drops any payload with a companion field) — never a path, URL, PR
    // number, repo, or stage as authority. The host resolves the id against
    // its snapshot-scoped allowlist.
    else if (btn.dataset.actionId) {
      post({ type: act, actionId: btn.dataset.actionId, requestId });
    }
    else post({ type: act, requestId });
    // Optimistic clipboard confirmation (UI-R15) rides ALONGSIDE the pending
    // state above, not instead of it — the button still reports whatever the
    // host's real ack says, same as every other control.
    if (btn.hasAttribute('data-copy')) flashCopied(btn);
  });

  // The inside ledger's disclosure state. A process row IS a native
  // <details>/<summary> (B3), so the browser discloses it and the `toggle`
  // event reports the change; persisting here — keyed by the row's OWN
  // data-proc-id, the composite `${stageKey}:${p.id}` the renderer looks up
  // (Task 0.1) — is what lets the next full re-render restore exactly the rows
  // the user had open. Capture phase: `toggle` does not bubble in every
  // engine, the same reason the .mgd listener below uses it.
  document.addEventListener('toggle', (e) => {
    const node = e.target && e.target.closest && e.target.closest('.proc');
    if (!node || !node.dataset.procId) return;
    const next = new Set(openProcesses);
    if (node.open) next.add(node.dataset.procId);
    else next.delete(node.dataset.procId);
    openProcesses = next;
  }, true);

  // Settle every outstanding merge request against the fresh PR list. `merged`
  // is the one outcome the webview can actually verify — the host reports
  // nothing else back over this channel — so a repo that came back merged
  // settles `true` (success flash + toast); anything else settles `null`
  // (unknown), never `false`. Claiming FAILED would misreport a user who
  // simply cancelled the host's confirmation dialog, which is not a failure;
  // distinguishing a real refusal from a cancel needs a host-side signal this
  // webview does not have (see the PR panel's own header comment).
  function resolveMergeOutcome(state) {
    if (!Object.keys(mergeRequests).length) return;
    const prByRepo = {};
    for (const p of (state.prs || [])) prByRepo[p.repo] = p;
    for (const [repo, requestId] of Object.entries(mergeRequests)) {
      const merged = prByRepo[repo] && prByRepo[repo].status === 'merged';
      karstSettle(requestId, merged ? true : null, merged ? 'Merged.' : undefined);
    }
    // A state push is the host's answer to every outstanding merge request —
    // success, refusal, or a cancelled confirmation (the host pushes either
    // way, via extension.ts's `finally`). Clearing here is what stops a
    // button sticking on "Merge" (pending) forever.
    mergeRequests = {};
  }

  // Re-measure the track when the DOM did not change but its available width
  // did. `renderTrack` calls place() itself on the render path; these three cover
  // the rest — a panel drag, the document finishing, and web fonts settling. A
  // track measured against pre-layout metrics reports no overflow and degrades
  // one step too late, which is why `load` and `fonts.ready` are here at all.
  window.addEventListener('resize', place);
  window.addEventListener('load', place);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg) return;
    // Transient inside-progress events (the inside redesign): the live header
    // for the ONE operation now running, and the completed process row that
    // replaces the snapshot's same-id row until the next full snapshot. Ship
    // rides this same union (Finding 12) — the legacy `ship-progress` stream
    // is gone. The host pushes a snapshot when the stage moves, which retires
    // the overlay (see the state handler below) — the overlay is a same-tick
    // update, never a state source. A `cleared` event covers
    // cancellation/supersession with no invented result.
    if (msg.type === 'inside-progress') {
      const e = msg.event;
      if (!e) return;
      if (e.kind === 'active') {
        liveOps[e.stage] = { active: e.live, processId: e.processId };
      } else if (e.kind === 'completed') {
        liveOps[e.stage] = { completed: e.process };
      } else if (e.kind === 'cleared') {
        delete liveOps[e.stage];
      }
      if (lastState) render(lastState);
      return;
    }
    // The window's terminal binding. Host-owned: it is one preference shared by
    // every open dashboard, so the webview renders what it is told and never
    // decides — the click posts `toggle-bind` and waits for this message back.
    if (msg.type === 'bind') {
      bindEnabled = msg.enabled === true;
      renderBind();
      return;
    }
    if (msg.type === 'worktree-stats') {
      worktreeStats = Object.fromEntries(
        (msg.stats || []).map((stats) => [stats.repo, stats]),
      );
      if (lastState) renderWorktrees(lastState.worktrees || []);
      return;
    }
    // The togglable gate names, resolved async/host-side like worktree-stats.
    // Overwrites the whole section (never merged) — the host recomputed it
    // from scratch, and a merge could keep a name the current manifest no
    // longer resolves.
    if (msg.type === 'gate-options') {
      gateOptions = msg.options || { uat: [], review: [] };
      renderGates();
      return;
    }
    // The terminal result of an async action (§ DESIGN-SYSTEM.md 5.3, UI-R13).
    // ship-ticket/merge-pr/refresh-prs never reach here (they carry no
    // requestId on the wire, by design — see the click handler above); every
    // other posting control settles through this one line.
    if (msg.type === 'action-result') {
      karstSettle(msg.requestId, msg.ok, msg.message);
      return;
    }
    if (msg.type === 'state') {
      // Resolve an in-flight ship FIRST, so render() draws either the held
      // spinner or the settled line — never a flash of the stale "Confirm ship".
      resolveShipping(msg.state);
      // Likewise merge — settle every outstanding request against the fresh
      // PR list before rendering, so the button's pending state and its
      // terminal toast land in the same frame.
      resolveMergeOutcome(msg.state);
      // Likewise the refresh icon: the host pushes state when the sweep settles
      // even if no verdict moved, precisely so the spin has an end. The result
      // is always reported ok:true — the webview cannot itself distinguish "PR
      // status changed" from "confirmed unchanged", and both are a successful
      // refresh (UI-R31: no verdict is invented here).
      if (prRefreshId) {
        karstSettle(prRefreshId, true);
        prRefreshId = null;
      }
      // The full snapshot supersedes the inside live overlay: progress.ts is
      // explicit that the snapshot is authoritative. A snapshot that actually
      // CONTAINS the process retires the overlay — for `completed`, any
      // presence (its row is the final one); for `active`, only a terminal
      // row, because an unrelated push mid-gate must not drop the live header
      // while the same row still reads `run` in the snapshot. Absence keeps
      // the overlay: a snapshot that does not know the process cannot answer
      // about it.
      const views = msg.state.insideViews || {};
      for (const stage of Object.keys(liveOps)) {
        const entry = liveOps[stage];
        const procs = (views[stage] || {}).processes || [];
        const id = entry.completed ? entry.completed.id : entry.processId;
        if (!id) continue;
        const row = procs.find((p) => p.id === id);
        if (row && (entry.completed || row.status !== 'run')) delete liveOps[stage];
      }
      // The matching async totals message follows this snapshot. Until then,
      // omit numbers rather than showing values for an older working tree.
      worktreeStats = {};
      // Never touches selectedStage, so a full re-render preserves the user's
      // selection for free — including during a run, when pushes are frequent.
      render(msg.state);
      persist(); // survive reload (retainContextWhenHidden)
    }
  });

  // Restore last state on reload before the host re-pushes. Tolerates the
  // pre-envelope shape a panel open across an upgrade may have persisted.
  const prev = vscode.getState();
  const restored = prev && prev.state ? prev : prev ? { state: prev, sel: null } : null;
  if (restored && restored.state) {
    selectedStage = restored.sel || null;
    srvFilter = restored.srvFilter || '';
    render(restored.state);
  }
</script>

<style>/*KARST_PALETTE*/</style>
