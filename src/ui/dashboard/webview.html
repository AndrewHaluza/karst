    #inside .evidence-row,#inside .gate-row,#inside .finding,#inside .done-line{padding-left:var(--k-space-1);padding-right:var(--k-space-1)}
    #inside .commit-repo-head,#inside .commit-list,#inside .pr-branch,#inside .pr-branch-note,
    #inside .receipt-block{padding-left:var(--k-space-1);padding-right:var(--k-space-1)}
    #inside .pr-path{flex-wrap:wrap}
  }
  @media (prefers-reduced-motion: reduce){
    #inside .glyph.run:before{animation:none}
    #inside .chev:before,#inside .done-details .done-chev:before{transition:none}
  }
  /* A live operation in the stage header: one current process, spinner +
     label, host-worded. Never a second process row and never a verdict. */
  #inside .alive{display:inline-flex;align-items:center;gap:var(--p-s1);min-width:0;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  #inside .alive .adetail,#inside .alive .adur{color:var(--p-muted2);margin-left:var(--p-s1);
    font-family:var(--p-mono);font-size:var(--p-xs)}
  /*KARST_INSIDE_PROTO_END*/

  /* The blocked banner — the one loud element on the page, because a wait for
     the user is the one moment the user MUST read. Machine truth (reason) is
     monospace. */
  .fault{margin:var(--k-space-7) var(--k-space-3) var(--k-space-1);padding:var(--k-space-5) var(--k-space-6);
    border-left:calc(var(--k-border-w) * 3) solid var(--k-failed);
    border-radius:0 var(--k-radius-md) var(--k-radius-md) 0;background:var(--vscode-inputValidation-errorBackground,transparent)}
  .fault .ftitle{font-size:var(--k-text-md);font-weight:var(--k-weight-semibold);margin-bottom:var(--k-space-3)}
  .fault .freason{font-family:var(--k-font-mono);font-size:var(--k-text-sm);white-space:pre-wrap;word-break:break-word}
  .fault .facts{margin-top:var(--k-space-6)}

  /* The header ship workflow-action slot (UI-R28b): Confirm ship / Shipping… is
     the primary action; Waiting to merge is the parked-wait chip. The two never
     render together — the host's ShipSlot union is mutually exclusive. The
     min-width is `calc`-composed so the label swap (Confirm ship / Retry ship /
     Shipping…) never shifts the neighbouring controls (UI-R18). */
  .shipAction{min-width:calc(var(--k-control-h-lg) * 3)}
  .shipWait{display:inline-flex;align-items:center;gap:var(--k-space-3);min-height:var(--k-control-h-lg);padding:0 var(--k-space-4);border-radius:var(--k-radius-sm);color:var(--k-attention);font-size:var(--k-text-xs);font-weight:var(--k-weight-semibold);white-space:nowrap}
  .shipWait.hidden{display:none}
  .attentionMark{width:var(--k-space-4);height:var(--k-space-4);border:calc(var(--k-border-w) * 2) solid currentColor;border-radius:var(--k-radius-circle);display:inline-flex;align-items:center;justify-content:center;font-size:var(--k-text-2xs);line-height:1}
  .toast{color:var(--k-success);font-size:var(--k-text-xs);opacity:0;transition:opacity var(--k-dur-fast) var(--k-ease-standard);white-space:nowrap}
  .toast.show{opacity:1}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--k-space-7)}
  .panel{border:var(--k-border-w) solid var(--k-border);border-radius:calc(var(--k-radius-lg) + var(--k-border-w));background:var(--k-surface);overflow:hidden}
  .panel.span{grid-column:1 / -1}
  .phead{display:flex;align-items:center;gap:var(--k-space-4);min-height:var(--phead-h);padding:var(--k-space-4) var(--k-space-7);
    border-bottom:var(--k-border-w) solid var(--k-border);font-size:var(--k-text-md);font-weight:var(--k-weight-semibold)}
  .phead .count{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-faint);font-weight:var(--k-weight-normal)}
  /* An icon-only panel control, built on `.k-iconbtn` (UI-R07) — quiet until
     hovered, since it sits in a header, not a row of actions, and a filled
     button there would read as the panel's subject. */
  .phead .iconbtn{margin-left:auto}
  .pbody{padding:var(--k-space-3) var(--k-space-4) var(--k-space-5)}
  .empty{padding:var(--k-space-7) var(--k-space-6);color:var(--k-text-faint);font-size:var(--k-text-md)}

  .wt,.pr{display:flex;align-items:center;gap:var(--k-space-5);padding:var(--k-space-4) var(--k-space-3);border-radius:var(--k-radius-md);min-width:0}
  .wt:hover,.pr:hover{background:var(--k-surface-hover)}
  /* 74px has no scale match — set by the longest repo label karst has shown in
     practice, not a spacing value. */
  .wt .wrepo{font-size:var(--k-text-md);min-width:74px;flex-shrink:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wt .wacts,.pr .pacts{margin-left:auto;display:flex;gap:var(--k-space-2);flex-shrink:0}
  .wt .wbranch{display:flex;align-items:center;gap:var(--k-space-1);min-width:0;flex:1}
  .wt .wbr{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .wt .wstats{display:flex;gap:var(--k-space-3);font-family:var(--k-font-mono);font-size:var(--k-text-xs);white-space:nowrap;flex-shrink:0}
  .wt .wadd{color:var(--k-passed)}
  .wt .wdel{color:var(--k-failed)}
  /* Built on `.k-chip` (UI-R08: the same pill primitive as keypill/fixtoggle/
     approach .aid); only the monospace uppercase treatment stays local. Every
     status renders one of the variants below, so the chip's own default fill
     never shows in practice. */
  .pr .pst{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.4px}
  /* Live PR state at a glance: open green, merged purple (the shared
     categorical token, UI-R08), closed red, draft muted — every fill is paired
     with the SAME "text on a filled surface" token the design system already
     defines for success/danger (UI-R29: paired tokens, never a hand-picked
     foreground). */
  .pr .pst-open{background:var(--k-success);color:var(--k-success-fg)}
  .pr .pst-merged{background:var(--k-series-2);color:var(--k-success-fg)}
  .pr .pst-closed{background:var(--k-danger);color:var(--k-danger-fg)}
  .pr .pst-draft,.pr .pst-unknown{background:var(--k-text-faint);color:var(--k-success-fg)}
  .pr .pnum{font-family:var(--k-font-mono);color:var(--k-link)}
  .pr .ptitle{flex:1;font-size:var(--k-text-md)}
  /* Merge verdict, indented under its PR so it reads as a fact ABOUT that PR and
     never as a second pull request. Shape (filled/hollow/ring) carries the state
     alongside colour, matching the servers panel's dot. */
  .mg{display:flex;align-items:center;gap:var(--k-space-4);margin:calc(var(--k-space-1) * -1) 0 var(--k-space-3) var(--k-space-6);
    padding:var(--k-space-1) var(--k-space-3);font-size:var(--k-text-sm);color:var(--k-text-dim)}
  .mg .mgdot{width:var(--k-space-4);height:var(--k-space-4);border-radius:var(--k-radius-circle);flex:none}
  .mg-clean .mgdot{background:var(--k-success)}
  .mg-conflicted .mgdot{background:var(--k-danger)}
  .mg-unknown .mgdot{border:calc(var(--k-border-w) * 2) solid var(--k-pending);width:var(--k-space-3);height:var(--k-space-3)}
  .mg-conflicted .mgtext{color:var(--k-danger)}
  .mg .mgtext{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mg .mgbtn{flex:none}
  /* The conflict list / the reason karst could not tell. Collapsed by default,
     like the PR comments thread further down this same panel — the count is what
     a reader scans, the detail is what they open. Capped and scrollable so a
     forty-file conflict cannot push the rest of the panel off screen. */
  .mgd{margin:calc(var(--k-space-2) * -1) 0 var(--k-space-3) var(--k-space-9);font-size:var(--k-text-sm)}
  .mgd summary{cursor:pointer;color:var(--k-link);width:fit-content}
  /* <summary> is not a <button>/<a>/<input>, so it gets no ring from the
     primitives' generic :focus-visible rule (same reasoning as the approach
     disclosure above). */
  .mgd summary:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  /* 180px has no scale match — a scroll cap sized to the panel, not a spacing
     value (same category as the servers panel's 288px below). */
  .mgdbody{max-height:180px;overflow-y:auto;margin-top:var(--k-space-2)}
  .mgfile{font-family:var(--k-font-mono);font-size:var(--k-text-xs);color:var(--k-text-dim);word-break:break-all}
  /* git's own words: `pre-wrap` keeps the line breaks a multi-line git error has. */
  .mgreason{white-space:pre-wrap;color:var(--k-text-dim);word-break:break-word}
  /* PR metadata: from-to, opened, merged. Indented under its PR like the merge
     verdict, so it reads as facts ABOUT that pull request. */
  .pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--k-space-3);margin:calc(var(--k-space-1) * -1) 0 var(--k-space-2) var(--k-space-6);padding:0 var(--k-space-3);
    font-size:var(--k-text-xs);color:var(--k-text-dim)}
  .pmeta .pbranch{font-family:var(--k-font-mono);color:var(--k-text)}
  .pmeta .pmerged{color:var(--k-series-2)}
  .pmeta .psep{color:var(--k-text-faint)}
  /* Comments collapse: the count is what a reader scans, the bodies are what they
     open. `pre-wrap` keeps a review comment's own line breaks. */
  .pcms{margin:0 0 var(--k-space-3) var(--k-space-6);padding:0 var(--k-space-3);font-size:var(--k-text-sm)}
  .pcms summary{cursor:pointer;color:var(--k-link);width:fit-content}
  .pcms summary:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  .pcm{margin:var(--k-space-3) 0 0;padding-left:var(--k-space-4);border-left:var(--k-space-1) solid var(--k-border)}
  .pcm .pcmwho{font-weight:var(--k-weight-semibold);font-size:var(--k-text-xs)}
  .pcm .pcmwhen{margin-left:var(--k-space-3);font-size:var(--k-text-sm);color:var(--k-text-faint)}
  .pcm .pcmbody{white-space:pre-wrap;color:var(--k-text-dim);font-size:var(--k-text-sm);margin-top:var(--k-space-1)}
  /* The merge control is `.k-btn--danger` (UI-R10b: the one irreversible action
     on this panel), built in markup — no bespoke color rule left here. */
  .mgbtn{flex:none}

  /* ===================== Servers panel ==================================
     One service is ONE LINE at every width. The panel reacts to its own grid
     column rather than the viewport, so containment is scoped to it — .panel
     is shared with Worktrees and Pull requests, which need none of this. */
  /* Visually hidden, still announced — for labels the layout drops but a screen
     reader still needs (the dot-only Status header, the filter's label). */
  .sr{position:absolute;width:var(--k-border-w);height:var(--k-border-w);padding:0;margin:calc(var(--k-border-w) * -1);overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .svpanel{container-type:inline-size}
  /* Whole-ticket controls live in the HEADER because they act on every service
     and must survive the states where the body has no rows to hang a button
     off — the empty body is exactly when Start matters most. The count
     therefore gives up the auto margin it keeps in the other panels. */
  .svpanel .phead{padding-right:var(--k-space-5)}
  .svpanel .phead .count{margin-left:0}
  .svpanel .phead .pops{margin-left:auto;display:flex;gap:var(--k-space-1)}
  .svpanel .pbody{padding:0}

  /* Icon buttons — inline Tabler SVGs from the injected catalog (docs/ui/
     ICONS.md; no icon font, no external asset: the webview CSP forbids both).
     Icon-only is what lets four actions share a row without the action column
     outgrowing the data. The label is not lost, it moves to aria-label +
     title, so the word survives for both pointer and screen reader. Built on
     `.k-iconbtn` (UI-R07: sizing, hover surface, focus ring, and the
     disabled/pending states all come from the primitive); `.ib` stays a
     LAYOUT+colour-only local class — the glyph's own size, and each action's
     resting hue off the shared status ramp. */
  .ib svg{width:calc(var(--k-space-6) + var(--k-space-1));height:calc(var(--k-space-6) + var(--k-space-1));display:block;
    transition:transform var(--k-dur-fast) var(--k-ease-standard)}
  /* Each action carries its OWN resting colour, off the same status ramp the
     stepper uses — hue is the fastest way to tell Stop from Start before any
     label is read. The word is still on every button, so hue accelerates, it
     never carries. */
  .ib.t-open{color:var(--k-running)}
  .ib.t-copy{color:var(--k-series-2)}
  .ib.t-restart{color:var(--k-attention)}
  .ib.t-stop{color:var(--k-failed)}
  .ib.t-start{color:var(--k-passed)}
  .ib.ok{color:var(--k-passed)}
  /* The glyph grows slightly on hover/active — layered on top of the
     primitive's own surface+border hover, never replacing it. */
  .ib:hover:not(:disabled) svg{transform:scale(1.14)}
  .ib:active:not(:disabled) svg{transform:scale(.94)}
  @media (prefers-reduced-motion:reduce){
    .ib svg{transition:none}
    .ib:hover svg,.ib:active svg{transform:none}
  }

  /* Status semantics. Colour is never the only carrier: each state has a
     distinct GLYPH (filled disc vs hollow ring), the address column reads "—"
     when offline, and the dot carries its word to pointer and screen reader. */
  .svpanel .glyph{flex:0 0 auto;display:inline-block;border-radius:var(--k-radius-circle)}
  .svpanel .glyph.on{width:var(--k-space-4);height:var(--k-space-4);background:var(--k-passed)}
  .svpanel .glyph.off{width:calc(var(--k-space-4) + var(--k-border-w));height:calc(var(--k-space-4) + var(--k-border-w));background:transparent;border:calc(var(--k-border-w) * 2) solid var(--k-pending)}

  .svpanel .filter{display:flex;align-items:center;gap:var(--k-space-4);padding:var(--k-space-4) var(--k-space-5);
    border-bottom:var(--k-border-w) solid var(--k-border)}
  /* Built on `.k-input` — the local rule is layout only (it fills the filter row). */
  .svpanel .filter input{flex:1;min-width:0}
  /* 288px has no scale match — a scroll cap sized to the panel, not a spacing
     value (same category as the merge-conflict list's 180px above). */
  .svpanel .scroll{max-height:288px;overflow-y:auto;overflow-x:hidden}
  .svpanel table{width:100%;border-collapse:collapse;font-size:var(--k-text-md)}
  .svpanel thead th{position:sticky;top:0;z-index:1;background:var(--k-surface);
    text-align:left;font-weight:var(--k-weight-semibold);font-size:var(--k-text-2xs);text-transform:uppercase;
    letter-spacing:.6px;color:var(--k-text-faint);padding:calc(var(--k-space-3) + var(--k-border-w)) var(--k-space-5);
    border-bottom:var(--k-border-w) solid var(--k-border);white-space:nowrap}
  .svpanel tbody tr:hover,.svpanel tbody tr:focus-within{background:var(--k-surface-hover)}
  .svpanel td{padding:var(--k-space-2) var(--k-space-5);vertical-align:middle}
  /* Status is the DOT only — no word. A word over a small dot only crowded the
     header, so that header is screen-reader-only. */
  .svpanel td.c-dot{width:1%;padding-right:0;line-height:0}
  /* The NAME column absorbs all the slack, which pushes the address and its two
     ops into one right-hand group. The address is right-aligned inside a
     shrink-wrapped column, and that is what makes Open/Copy sit flush against
     the value on EVERY row instead of after a ragged gap. */
  .svpanel td.c-name{font-size:var(--k-text-md);max-width:0;width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .svpanel td.c-addr{font-family:var(--k-font-mono);font-size:var(--k-text-sm);color:var(--k-text-dim);
    white-space:nowrap;width:1%;text-align:right;padding-right:calc(var(--k-space-3) - var(--k-border-w))}
  .svpanel td.c-addr.off{font-style:italic;color:var(--k-text-faint)}
  .svpanel td.c-addr .short{display:none}
  .svpanel td.c-addrops{width:1%;padding-left:0;padding-right:0}
  /* The gap between the address group and the lifecycle group is the only thing
     separating them — keep it wider than the gap inside each group. */
  .svpanel td.c-acts{text-align:right;white-space:nowrap;width:1%;padding-left:var(--k-space-6)}
  .svpanel td .g{display:inline-flex;gap:var(--k-space-1);justify-content:flex-end}

  /* Narrow COMPACTS, it does not restack: one service stays one line, which is
     the whole point of this design. 400px cannot be a token: @container
     conditions cannot read a custom property, so no --k-* applies here (same
     exception as a @media breakpoint). */
  @container (max-width: 400px){
    /* SPECIFICITY TRAP — do not simplify these back to bare `td`. A
       class-qualified `td.c-acts` (0,2,1) out-specifies a bare `td` (0,1,1)
       REGARDLESS of source order, so a reset written as `td{width:auto}` never
       lands: the 1% action column survived into narrow and wrapped every icon
       onto its own line. The re-qualification is the fix. */
    .svpanel td.c-acts{width:auto}
    .svpanel thead th{padding:var(--k-space-3);font-size:var(--k-text-2xs)}
    .svpanel td{padding:var(--k-space-2) var(--k-space-3)}
    /* At this width "localhost:5173" ellipsises to "localhost…" — showing the
       part that never varies and hiding the part that does. Both strings are in
       the DOM so the swap is CSS, not a JS width probe; the full address stays
       on the cell's title either way. */
    .svpanel td.c-addr{font-size:var(--k-text-xs)}
    .svpanel td.c-addr .full{display:none}
    .svpanel td.c-addr .short{display:inline}
  }

  /* Empty states. Dense: mark + headline on one line, the reason under it, and
     no button — Start lives in the header where it works in every state. */
  .svpanel .estate{display:flex;align-items:flex-start;gap:var(--k-space-5);
    padding:calc(var(--k-space-6) + var(--k-space-1)) calc(var(--k-space-6) + var(--k-space-1)) calc(var(--k-space-6) + var(--k-space-1) + var(--k-border-w))}
  .svpanel .estate .emark{display:flex;align-items:center;justify-content:center;
    width:var(--k-control-h-sm);height:var(--k-control-h-sm);border-radius:var(--k-radius-circle);flex:none;margin-top:calc(var(--k-border-w) * -1);
    background:var(--k-surface-hover);color:var(--k-text-faint)}
  .svpanel .estate .emark svg{width:var(--k-text-base);height:var(--k-text-base);display:block}
  .svpanel .estate .ehead{font-size:var(--k-text-md);font-weight:var(--k-weight-semibold);color:var(--k-text)}
  .svpanel .estate .esub{font-size:var(--k-text-sm);color:var(--k-text-dim);line-height:1.45;margin-top:var(--k-space-1)}
  /* The dead end gets no action anywhere, so it also gets no emphasis — the
     block stays at description weight to read as a statement, not a prompt. */
  .svpanel .estate.dead .ehead{color:var(--k-text-dim);font-weight:var(--k-weight-medium)}
  .svpanel .nomatch{padding:calc(var(--k-space-6) + var(--k-space-1));color:var(--k-text-faint);font-size:var(--k-text-md)}

  /* Artifacts shelf + index + detail (§ docs/design/artifacts/README.md).
     The shelf is a panel like any other; the index and the detail REPLACE the
     dashboard body inside the SAME webview (spec §7: exactly three surfaces,
     no second tab/drawer), which is what body.art-nav hides below. */
  .artcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--k-space-4)}
  /* The "View all N" button is the header's count now — it sits at the right
     edge exactly where the removed `.count` did. */
  .phead #artViewAll{margin-left:auto}
  .artcard{display:block;width:100%;text-align:left;border:var(--k-border-w) solid var(--k-border);
    border-radius:var(--k-radius-lg);background:var(--k-surface);cursor:pointer;
    padding:var(--k-space-5) var(--k-space-6);color:var(--k-text)}
  .artcard:hover{background:var(--k-surface-hover)}
  .artcard:focus-visible{outline:2px solid var(--k-focus);outline-offset:1px}
  .artcard-title{display:flex;align-items:center;gap:var(--k-space-3);font-size:var(--k-text-md);
    font-weight:var(--k-weight-semibold);color:var(--k-text)}
  .artcard-summary{font-size:var(--k-text-sm);color:var(--k-text-dim);margin-top:var(--k-space-2)}
  .artcard-meta{display:flex;align-items:center;gap:var(--k-space-3);margin-top:var(--k-space-4);flex-wrap:wrap}
  .art-status{font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.4px;
    font-weight:var(--k-weight-semibold)}
  .art-status.passed{color:var(--k-passed)}
  .art-status.failed{color:var(--k-failed)}
  .art-status.attention{color:var(--k-attention)}
  .art-status.info{color:var(--k-pending)}
  .art-stale{font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.4px;color:var(--k-attention)}
  /* The detail's stale banner sits under the summary, not inline-styled. */
  .artdetail .art-stale-note{text-transform:none;letter-spacing:normal;margin-top:var(--k-space-3)}
  /* The origin chip: one closed shape on every artifact surface (UI-R28 — the
     mark is a SECONDARY carrier; the label is the identity). Built from the
     injected agent identity (core icon) + the karst brand mark. */
  .art-origin{display:inline-flex;align-items:center;gap:var(--k-space-2);
    font-size:var(--k-text-xs);color:var(--k-text-dim);white-space:nowrap}
  .art-origin .kmark{width:var(--k-space-6);height:var(--k-space-6);flex:none;color:var(--k-text-faint)}
  .art-origin .agenticon{width:var(--k-space-6);height:var(--k-space-6);flex:none}
  /* The in-webview index/detail surface: takes over the whole dashboard body
     while active, restoring it on Back/Esc. */
  body.art-nav .stepper,body.art-nav .grid{display:none}
  body.term-nav .stepper,body.term-nav .grid{display:none}
  .artview{padding:var(--k-space-7) 0 var(--k-space-9);max-width:720px;color:var(--k-text)}
  .arthead{display:flex;align-items:center;gap:var(--k-space-4);margin-bottom:var(--k-space-6);flex-wrap:wrap}
  .arthead h2{margin:0;font-size:var(--k-text-lg);font-weight:var(--k-weight-semibold)}
  .arthead .artsub{font-size:var(--k-text-sm);color:var(--k-text-dim)}
  .artgroup{margin-bottom:var(--k-space-7)}
  .artgroup-title{font-size:var(--k-text-2xs);color:var(--k-text-faint);text-transform:uppercase;
    letter-spacing:.4px;margin-bottom:var(--k-space-3)}
  /* The index's own list: its rows are the `.artrow` buttons, which carry
     their own border/padding — wrapping them in `.artfiles li` (whose styling
     exists for the DETAIL's single-line file rows) drew a second border around
     each row. */
  .artrows{list-style:none;margin:0;padding:0}
  .artrows li{margin-bottom:var(--k-space-3)}
  .artrow{display:flex;align-items:center;gap:var(--k-space-5);width:100%;text-align:left;
    padding:var(--k-space-4) var(--k-space-5);border:var(--k-border-w) solid var(--k-border);
    border-radius:var(--k-radius-md);background:var(--k-surface);cursor:pointer;color:var(--k-text)}
  .artrow:hover{background:var(--k-surface-hover)}
  .artrow:focus-visible{outline:2px solid var(--k-focus);outline-offset:1px}
  .artrow .artrow-body{min-width:0;flex:1}
  .artrow-title{font-size:var(--k-text-md);font-weight:var(--k-weight-medium);color:var(--k-text)}
  .artrow-summary{font-size:var(--k-text-sm);color:var(--k-text-dim);margin-top:var(--k-space-1)}
  .artrow .arw{margin-left:auto;color:var(--k-text-faint);flex:none}
  .artdetail .artsection{margin-bottom:var(--k-space-7)}
  /* The section heading is a flex row so the console entry (the xterm view of
     a gate stage's log) can sit at its right edge without a second line. */
  .artdetail .artheading{display:flex;align-items:center;gap:var(--k-space-3);
    font-size:var(--k-text-2xs);text-transform:uppercase;letter-spacing:.4px;
    color:var(--k-text-faint);margin-bottom:var(--k-space-3)}
  .artdetail .artheading .sp{margin-left:auto}
  .arthero{display:flex;align-items:center;gap:var(--k-space-4);flex-wrap:wrap}
  .arthero .art-title{font-size:var(--k-text-lg);font-weight:var(--k-weight-semibold)}
  .artmetrics{display:flex;gap:var(--k-space-6);flex-wrap:wrap;margin-top:var(--k-space-3)}
  .artmetric{font-family:var(--k-font-mono);font-size:var(--k-text-md);color:var(--k-text)}
  .artmetric .am-label{display:block;font-family:var(--k-font-normal);font-size:var(--k-text-2xs);
    text-transform:uppercase;letter-spacing:.4px;color:var(--k-text-faint)}
  .artfinding{border-left:2px solid var(--k-border);padding:var(--k-space-2) var(--k-space-4);
    margin-bottom:var(--k-space-3)}
  .artfinding.high,.artfinding.critical{border-left-color:var(--k-failed)}
  .artfinding.medium{border-left-color:var(--k-attention)}
  .artfinding .af-title{font-size:var(--k-text-sm);color:var(--k-text)}
  .artfinding .af-detail{font-size:var(--k-text-xs);color:var(--k-text-dim);margin-top:var(--k-space-1)}
  .artgate{display:flex;align-items:center;gap:var(--k-space-3);font-size:var(--k-text-sm);
    padding:var(--k-space-2) 0;border-bottom:var(--k-border-w) solid var(--k-border)}
  .artgate .ag-name{font-family:var(--k-font-mono);flex:1;color:var(--k-text)}
  .artgate .ag-code{font-size:var(--k-text-xs);color:var(--k-text-dim)}
  /* The plan artifact's task rows: the label carries the task, the dot the
     coloured state, and the kind/visit detail trails. Same pattern as the
     gate rows — one dot, one closed status vocabulary (UI-R28). */
  .arttask{display:flex;align-items:center;gap:var(--k-space-3);font-size:var(--k-text-sm);
    padding:var(--k-space-2) 0;border-bottom:var(--k-border-w) solid var(--k-border)}
  .arttask .at-state{display:inline-flex;flex:none}
  .arttask .at-state .at-dot{width:var(--k-space-3);height:var(--k-space-3);
    border-radius:var(--k-radius-circle);flex:none}
  .arttask .at-state.done .at-dot{background:var(--k-passed)}
  .arttask .at-state.doing .at-dot{background:var(--k-running)}
  .arttask .at-state.todo .at-dot{background:transparent;
    border:calc(var(--k-border-w) * 2) solid var(--k-pending)}
  .arttask .at-state.blocked .at-dot{background:var(--k-attention)}
  .arttask .at-state.cancelled .at-dot{background:var(--k-text-faint)}
  .arttask .at-label{flex:1;color:var(--k-text)}
  .arttask .at-kind{font-size:var(--k-text-xs);color:var(--k-text-dim)}
  /* One gate's outcome as a COLOURED STATE, not a text label: the dot is the
     shipped `.k-dot` status primitive (gap G1 — hue is its current carrier),
     green for pass, red for fail; the state word rides only as the dot's
     accessible name (UI-R28), and the exit code stays as the row's detail. */
  .artgate .ag-state{display:inline-flex;flex:none}
  .artgate .ag-state .ag-dot{width:var(--k-space-3);height:var(--k-space-3);
    border-radius:var(--k-radius-circle);flex:none}
  .artgate .ag-state.pass .ag-dot{background:var(--k-passed)}
  .artgate .ag-state.fail .ag-dot{background:var(--k-failed)}
  .artgate .ag-state.note .ag-dot{background:transparent;
    border:calc(var(--k-border-w) * 2) solid var(--k-pending)}
  .artmeta{display:grid;grid-template-columns:auto 1fr;gap:var(--k-space-2) var(--k-space-5);
    font-size:var(--k-text-sm)}
  .artmeta .am-key{color:var(--k-text-faint)}
  .artfiles{list-style:none;margin:0;padding:0}
  .artfiles li{display:flex;align-items:center;gap:var(--k-space-4);
    padding:var(--k-space-3) var(--k-space-4);border:var(--k-border-w) solid var(--k-border);
    border-radius:var(--k-radius-md);margin-bottom:var(--k-space-3)}
  .artfiles .af-name{font-family:var(--k-font-mono);font-size:var(--k-text-sm);flex:1;color:var(--k-text)}
  /* In-body object links (UI-R09c): the commit SHA, the PR number and a
     finding's file location ARE the controls — underlined, monospaced,
     keyboard-focusable — never inert text beside a duplicate button. */
  .artdetail .obj-link{display:inline-flex;align-items:center;color:var(--k-link);
    text-decoration-line:underline;text-decoration-thickness:var(--k-border-w);
    text-decoration-color:var(--k-border);text-underline-offset:var(--k-space-1);cursor:pointer;
    font-family:var(--k-font-mono);border-radius:var(--k-radius-xs)}
  .artdetail .obj-link:hover{color:var(--k-link);text-decoration-color:currentColor}
  .artdetail .obj-link:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
  .artfiles .pr-link{color:var(--k-text);font-weight:var(--k-weight-semibold)}
  .artfiles .pr-status{display:inline-flex;align-items:center;border:var(--k-border-w) solid var(--k-border);
    border-radius:var(--k-radius-pill);padding:var(--k-space-0) var(--k-space-2);color:var(--k-text-dim);
    font-family:var(--k-font-mono);font-size:var(--k-text-2xs);text-transform:lowercase;white-space:nowrap}
  .artfiles .pr-status.open{color:var(--k-running);border-color:var(--k-border)}
  .artfiles .pr-status.merged{color:var(--k-passed);border-color:var(--k-border)}
  .artfiles .pr-status.closed{color:var(--k-failed);border-color:var(--k-border)}
  .artfiles .commit-sha{color:var(--k-text-dim)}

  /* The terminal console surface (xterm "detailed mode"): a full-body swap via
     body.term-nav, exactly like the artifact surface — the SAME webview hosts
     the ticket dashboard and the console view, never a second tab. */

  /* The surface starts closed (class="termview hidden"): .termview and .hidden
     have EQUAL specificity, so the LATER declaration wins the cascade — this
     override must follow the .termview block or display:flex beats
     .hidden{display:none} and the empty console box (position:fixed, inset:0,
     opaque) covers the whole dashboard on every open. */

  .termview .thead{display:flex;align-items:center;gap:var(--k-space-4);padding:var(--k-space-3) var(--k-space-4);border-bottom:var(--k-border-w) solid var(--k-border)}
  .termview .ttitle{font-weight:var(--k-weight-semibold)}
  .termview .tstatus{font-size:var(--k-text-xs);color:var(--k-text-dim);padding:var(--k-space-2) var(--k-space-4)}
  .termview .termhost{flex:1;min-height:0;overflow:hidden}
  .termview .blurb{padding:var(--k-space-6);color:var(--k-text-dim)}

  /* The ticket-data preview drawer (UI-R04: composed from tokens, no raw
     dimensions; width uses the same token step as the ticket form's drawer).
     `.k-scrim`/`.k-drawer` supply the surface, shadow and z-index; the open
     transform and the scrim's opacity fade stay local, like the ticket form. */
  .tdScrim{opacity:0;pointer-events:none;transition:opacity var(--k-dur-base) var(--k-ease-standard)}
  .tdScrim.open{opacity:1;pointer-events:auto}
  .tdDrawer{width:min(calc(var(--k-space-8) * 23),86vw);display:flex;flex-direction:column;transform:translateX(100%)}
  .tdDrawer.open{transform:translateX(0)}
  .tdDrawerHead{display:flex;align-items:center;gap:var(--k-space-5);padding:var(--k-space-7) var(--k-space-7) var(--k-space-5);border-bottom:var(--k-border-w) solid var(--k-border)}
  .tdDrawerHead h3{margin:var(--k-space-0);font-size:var(--k-text-lg);line-height:var(--k-leading-normal);flex:1;min-width:0}
  .tdDrawerBody{flex:1 1 auto;margin:var(--k-space-0);padding:var(--k-space-6) var(--k-space-7);overflow:auto;white-space:pre-wrap;font-family:var(--k-font-mono);font-size:var(--k-text-md);line-height:var(--k-leading-normal);color:var(--k-text)}
  @media (prefers-reduced-motion:reduce){
    .tdScrim,.tdDrawer{transition:none}
  }

<script>
  /*KARST_DS_JS*/

  // Shared ticketing-provider identity (icon + brand) — single source in
  // src/model/providerIdentity.ts, injected here at load (CSP forbids a
  // shared script). Defines PROVIDER_LABELS, CLICKUP_SVG, providerBadgeHtml.
  /*KARST_PROVIDER_JS*/

  // Shared agent-core identity (icon + name) — single source in
  // src/model/agentIdentity.ts, injected here at load. Defines
  // AGENT_PROVIDER_LABELS, agentBadgeHtml, agentIconHtml. The inside ledger's
  // identity chip consumes agentIconHtml (B1), so the markers are load-bearing:
  // without them the chip would throw ReferenceError on the first process row.
  /*KARST_AGENT_JS*/

  /*KARST_XTERM_JS*/

  const vscode = acquireVsCodeApi();
  const post = (msg) => vscode.postMessage(msg);

  // Stage status -> segment CSS class. Needs-you is NOT here: it OUTRANKS the
  // stage status, and it is applied from the segment's own `needsUser`, which the
  // host derives once (model/ticketGlyph.needsUser) for every surface. The old
  // rail showed stage status only, so a ticket parked on a human looked exactly
  // like one quietly running.
  // `pending` is a REAL class, not the empty string the old rail used: the
  // segment's own rule sets no colour (so the stage palette can), which leaves an
  // untravelled segment wearing its stage hue at full strength unless something
  // says otherwise.
  const SEG_CLASS = { passed: 'passed', running: 'running', failed: 'failed', pending: 'pending', skipped: 'skipped', blocked: 'blocked' };
  // Running renders a spinner ELEMENT, not a character — see the .spin rule for
  // why every glyph candidate misread on a clickable node. A blocked stage is
  // NOT running: it carries the same pause a parked confirm stage does.
  const SPINNER = '<span class="spin" aria-hidden="true"></span>';
  const SEG_GLYPH = { passed: '✓', running: SPINNER, failed: '✕', pending: '·', skipped: '–', blocked: '❚❚' };
  // A parked confirm stage carries a pause; a conflicted merge carries a warning.
  // Two glyphs, ONE state — merge has no failed edge, so a conflict is a wording
  // difference and must never render as something a retry could clear.
  const NEEDS_GLYPH = '❚❚';
  const CONFLICT_GLYPH = '⚠';
  // NOTE: the Inside block does NOT use a glyph character map — the ported
  // prototype draws each state with CSS on `.glyph` (a ring, a check, a cross,
  // a spinning arc), which is why its running state no longer renders the
  // rail's spinner element inside a row of text.
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const STAGE_TITLE = { uat: 'UAT', review: 'Review', fix: 'Fix', scope: 'Scope', impl: 'Implementation', ship: 'Ship', done: 'Done' };

  // The last snapshot the host pushed, and which stage the user is looking at.
  // Selection is LOCAL: it is not in DashboardState and is never posted back.
  // pushState fires on every driver progress tick, so anything that routed
  // selection through the host would snap the panel back mid-run.
  let lastState = null;
  let selectedStage = null;
  // What the user typed into the servers filter. Local for the same reason: a
  // state push lands on every server change, so a filter living in (or absent
  // from) DashboardState would be wiped out mid-typing.
  let srvFilter = '';
  // Live Git totals are supplemental filesystem facts. They stay beside the
  // host's store snapshot and are cleared whenever a newer snapshot arrives.
  let worktreeStats = {};
  // The gates a ticket's stages would actually run, and their disabled flags.
  // Resolved async, host-side (a filesystem probe), so like worktreeStats it
  // lives beside lastState rather than inside it. Deliberately NOT cleared on a
  // state push: a push is always followed by a gate-options message, and
  // blanking the list in between would flicker the section empty on every
  // unrelated refresh. The follow-up message replaces it wholesale — including
  // with an empty list when resolution fails — so it cannot go stale unnoticed.
  let gateOptions = { uat: [], review: [] };
  // `shipRequestId` / `mergeRequests` / `prRefreshId` below are the runtime's
  // pending bookkeeping (karstBeginPending/karstSettle) for the ship/merge/
  // refresh-prs controls. They are tracked SEPARATELY from the view state
  // because ship/merge/refresh-prs are the one place this file's full-innerHTML
  // re-render (§ render()) collides with the runtime's element-keyed pending
  // map: a `state` push mid-ship replaces the "Confirm ship" button with a
  // brand-new DOM node, so a pending flag living only on the OLD (now detached)
  // element would vanish from the redraw even though the request is still
  // outstanding. Keeping the requestId here — consulted by the render functions
  // below — is what survives that replacement; the runtime is still what emits
  // the toast and the `aria-busy`/`disabled` pair on whichever element is live
  // when a request begins or ends. `shipDone` is the brief post-success flash.
  let shipDone = null;
  let shipRequestId = null;
  // Per-repo merge-in-flight request ids, keyed by repo path. NOT persisted: a
  // merge is a one-shot host round trip, and an id restored from a reload
  // would claim a merge is underway that nobody is running. Cleared on every
  // state push — extension.ts's mergePr always refreshes in a `finally`
  // (success, refusal, cancel, or throw), so a push is guaranteed to arrive
  // and end the pending state; it is never left to a watchdog alone.
  let mergeRequests = {};
  // Which merge-check disclosures (`.mgd`) are open, keyed by repo. Local view
  // state, exactly like `selectedStage`: render() replaces #prs wholesale on
  // every `state` push AND every inside-progress tick, so a disclosure that is
  // open only in the DOM — and the reader's scroll position inside it — would
  // snap shut on the very next one. Never in DashboardState, never
  // round-tripped through the host; only the `toggle` listener below mutates
  // it, and render() itself must never reset it.
  let openMergeRepos = new Set();
  // Which inside process disclosures are open, keyed `stage:id`. Local view
  // state, exactly like `openMergeRepos`: render() replaces #inside wholesale
  // on every state push, so a disclosure open only in the DOM would snap shut
  // on the very next one. Never in DashboardState, never round-tripped
  // through the host; only the native `toggle` listener mutates it (B3), and
  // render() itself must never reset it.
  let openProcesses = new Set();
  // Which disclosures the user has explicitly COLLAPSED, keyed `stage:id`
  // (Task 3, Step 5). openProcesses holds open keys only, so absence cannot
  // tell "never opened" from "closed" — this set can. Only `toggle` mutates.
  let closedProcesses = new Set();
  // A user-requested PR re-probe is in flight. Set on the click, BEFORE the host
  // round trip, because that probe runs `gh` and a `git fetch` per repo — seconds
  // in which a button with no busy state looks inert and gets pressed again.
  // Cleared by the next state push (the host always sends one when the refresh
  // settles, including when nothing moved), so it can never stick.
  let prRefreshId = null;
  // The stage header's ⋯ menu: which stage's menu is OPEN, or null. Local view
  // state exactly like `openProcesses` — render() replaces #inside wholesale on
  // every state push, so an open menu would snap shut on the very next one.
  // Only the ⋯ button's click toggles it, and selecting a stage closes it.
  let stageMenuStage = null;
  // A "Send back to Implement" request is in flight (the host's confirmation
  // modal is up). Set on the click BEFORE the host round trip, cleared by the
  // next state push — extension.ts always refreshes in a `finally` (confirm,
  // dismiss, refusal, or throw), so a push is guaranteed to arrive and settle
  // the pending item (same contract as `mergeRequests`).
  let sendBackRequestId = null;
  // Transient inside-progress overlays (the inside redesign): the live header
  // for one running operation (`active`) and the process row that replaces the
  // snapshot's row when it completes (`completed`). Keyed by stage. The FULL
  // snapshot remains authoritative — an overlay entry dies the moment a
  // snapshot that actually contains its process lands (see the state handler),
  // or on `cleared`; absence keeps it, because a snapshot that does not know
  // the process cannot be an answer about it. Deliberately NOT persisted: a
  // restored overlay would claim a process is running that nobody is.
  let liveOps = {};
  // The window's terminal binding. UNLIKE the view state above, this is NOT a
  // webview concern: it is one host-owned preference shared by every open
  // dashboard, so it is never persisted here — a stored copy could only go
  // stale against another panel's toggle. The host pushes it on every open.
  let bindEnabled = false;
  // The in-webview artifact surface (spec §7): null = the ticket dashboard,
  // 'index' = the artifacts index, {id, from} = one artifact's detail. Local
  // view state exactly like selectedStage — never in DashboardState, never
  // round-tripped. `from` is what Back answers with: detail opened from the
  // dashboard returns to the ticket, from the index to the index (spec §7.3).
  let artView = null;
  // Per-surface scroll positions (spec §9): the dashboard is tall, so a
  // navigation round trip must not lose where the user was reading. Saved on
  // leaving a surface, restored on returning; detail keeps one entry per
  // artifact id. Survives reload via persist().
  let artScrolls = { ticket: 0, index: 0, detail: {} };

  // The terminal console surface (xterm "detailed mode"): which stage's console
  // is open (a gate-stage key, or null). NOT persisted — like `liveOps`, a
  // restored view would claim content that died with the Terminal instance on
  // reload. `termLoading` is the in-between state between the request and the
  // host's GUARANTEED answer (the stage-log message is always sent, ok or
  // error — UI-R13), which is also the terminal outcome.
  let termView = null;
  let termLoading = false;
  let term = null;
  let termFit = null;
  let termResize = null;
  // The console action is webview-LOCAL: it opens the terminal surface and
  // posts `stage-log-request`; it never reaches the host, so it has no
  // `routeAction` case. The literal is declared ONCE here and interpolated at
  // render — the webview pin ("emits no action the host does not validate")
  // scans the SOURCE for literal data-act values and would read a bare
  // console-valued one as an unvalidated host action, so the action name must
  // never be spelled as a data-act literal in this file. The rendered DOM
  // still carries the console data-act value (same pattern as any action name
  // the pin would otherwise flag as unvalidated).
  const CONSOLE_ACT = 'console';

  // Under a rail node there is room for one number, not a sentence. The full
  // stamp belongs to the Inside header, which has a line to itself.
  function durationText(cell) {
    if (!cell.startedAt || !cell.endedAt) return '';
    const ms = new Date(cell.endedAt).getTime() - new Date(cell.startedAt).getTime();
    if (!Number.isFinite(ms) || ms < 0) return '';
    if (ms < 60000) return `${(ms / 1000).toFixed(1)}s`;
    const mins = Math.round(ms / 60000);
    return mins < 60 ? `${mins}m` : `${Math.floor(mins / 60)}h ${mins % 60}m`;
  }

  // The track: ONE object the ticket travels through. The current segment is
  // wide and the rest compact — that is what fits seven stages in a narrow panel.
  //
  // No geometry is pushed from the host any more. The old rail positioned its
  // band from `--cols/--impl/--uat/--review` calc() inputs because it had a
  // second lane to bolt to specific columns; there is no second lane now, so the
  // only measurement left is `place()` below, and it POSITIONS NOTHING — it picks
  // one of three degradation classes.
  function renderTrack(rail, approach, sel) {
    const segs = rail.main.map((s) => {
      const cell = s.cell;
      const k = cell.stageKey;
      // The HOST resolves how the cell reads (displayStatus, model/stepper.ts):
      // a parked stage keeps its stored `running` but must not draw a spinner.
      // Fall back to the stored status for a snapshot restored from an older
      // build that predates the field.
      const status = s.status || cell.status;
      const needs = s.needsUser === true;
      // A conflict is a WORDING difference, not a new state: merge has no failed
      // edge, so it must never render as something a retry could clear. The host
      // already made that distinction when it worded the action.
      const conflict = needs && s.needs && s.needs.action === 'Resolve';
      const running = status === 'running' || (s.retry && s.retry.live);
      const cls = [
        needs ? 'needs' : (SEG_CLASS[status] || ''),
        s.current ? 'cur' : '',
        sel === k ? 'sel' : '',
      ].filter(Boolean).join(' ');

      const glyph = running ? SPINNER
        : conflict ? CONFLICT_GLYPH
        : needs ? NEEDS_GLYPH
        : (SEG_GLYPH[status] || '');

      // Both name forms ship and the CSS picks one: the current segment normally
      // shows the human title and falls back to the stage key at the narrowest
      // step. Swapping the text in JS would mean re-rendering on every resize.
      const title = STAGE_TITLE[k] || k;
      const name = s.current
        ? `<span class="full">${esc(title)}</span><span class="abbr">${esc(k)}</span>`
        : esc(k);

      // impl's approach is impl's own property, so it is drawn inside impl's own
      // segment — and only while the ticket is there, which is the only time the
      // segment has the room.
      const showsApproach = s.current && k === 'impl' && !needs && !!approach;

      let extra = '';
      if (s.current && needs) {
        extra = `<span class="mt">${esc(s.needs ? s.needs.detail : '')}</span>`
          + goButton(s.needs);
      } else if (showsApproach) {
        extra = renderPips(approach);
      } else {
        const d = durationText(cell);
        if (d) extra = `<span class="mt">${esc(d)}</span>`;
      }
      // The meter is APPENDED, never assigned into the same slot as the meta — a
      // retried gate has both a duration and a spent cap and must not have to
      // choose between saying them.
      if (s.retry) extra += renderMeter(s.retry);

      // The status is carried by colour and glyph, so the accessible name states
      // it outright — and states the retry loop too: a screen-reader user must
      // not have to infer a live retry from a meter they cannot see, nor lose the
      // return target when the narrowest step drops the `↩ uat`.
      // The approach rides in the name for the same reason: the pips and their
      // caption are its only visual form and the narrowest step drops both, and
      // the pips are `pointer-events:none` children of the segment, so their own
      // `title` never surfaces — this is where a reader gets the approach at all.
      const aria = (needs ? `${title}: needs you` : `${title}: ${status}`)
        + (showsApproach ? ` — approach ${approach.id}${phaseProgress(approach)}` : '')
        + (s.retry ? ` — fix ${s.retry.spent}/${s.retry.cap}${s.retry.live ? ' running' : ''}` : '')
        + (s.retry && s.retry.returnsTo ? `, revalidates from ${s.retry.returnsTo}` : '');

      return `<div class="seg stg-${esc(k)} ${cls}">`
        + `<button type="button" class="pick" data-stage="${esc(k)}" aria-pressed="${sel === k}"`
        + ` aria-label="${esc(aria)}" title="${esc(aria)}"></button>`
        + `<span class="g">${glyph}</span><span class="nm">${name}</span>${extra}</div>`;
    }).join('');

    el('rail').innerHTML = `<div class="track"><div class="lane">${segs}</div></div>`;
    place();
  }

  // The needs-you control, rendered from the host's `cta` verdict — never from
  // the action LABEL, which is prose. Two of the kinds ACT, posting the same
  // message as the header's Confirm ship / the PR panel's Merge (the host's
  // confirmation still guards the irreversible step, and the shared pending
  // markers — `shipRequestId` / `mergeRequests` — make the click report and
  // settle exactly like the owning controls'). The rest NAVIGATE to the control
  // that owns the action. A real actor carries `data-act` so the generic
  // delegated handler gives it the full pending lifecycle; a navigational one
  // carries `data-go` naming the kind for gotoAction().
  function goButton(needs) {
    const label = esc((needs && needs.action) || 'Open');
    const cta = needs && needs.cta;
    if (cta && cta.kind === 'ship-confirm') {
      const busy = !!shipRequestId;
      return `<button type="button" class="go" data-act="ship-ticket"${busy ? ' aria-busy="true" disabled' : ''}>${label}</button>`;
    }
    if (cta && cta.kind === 'merge') {
      const busy = !!mergeRequests[cta.repo];
      return `<button type="button" class="go" data-act="merge-pr" data-repo="${esc(cta.repo)}"${busy ? ' aria-busy="true" disabled' : ''}>${label}</button>`;
    }
    const kind = cta ? cta.kind : 'open-session';
    return `<button type="button" class="go" data-goto data-go="${kind}">${label}</button>`;
  }

  // impl's approach, inside impl's own segment: the approach's NAME, and one pip
  // per declared phase. DECLARED is not observed: a pip fills only for a phase
  // the agent actually reported by running a marker command, and a hollow pip
  // means "not reported" — never "not done".
  //
  // The name is rendered whether or not there are phases. An approach with an
  // empty `workflow` is the common case, not an edge one — the built-in `direct`
  // declares none, and so does any package that ships prompts only — and it is
  // still the thing driving impl. Returning early on an empty `phases` left the
  // widest segment on the track saying nothing at all about what is running in
  // it, which is the one place the panel names the approach.
  // "…, 3 of 4 phases reported" — or nothing at all when the approach declares
  // no workflow, because "0 of 0 phases" is a count of something that does not
  // exist. Counted against the DECLARED phases, so a mark for a phase the
  // approach no longer declares cannot push the tally past its own total.
  function phaseProgress(approach) {
    const phases = approach.phases || [];
    if (!phases.length) return '';
    const done = new Set(approach.reported || []);
    return `, ${phases.filter((p) => done.has(p)).length} of ${phases.length} phases reported`;
  }

  function renderPips(approach) {
    const phases = approach.phases || [];
    const done = new Set(approach.reported || []);
    const pips = phases.map((p) => {
      const on = done.has(p);
      return `<span class="p ${on ? 'on' : ''}"`
        + ` title="${esc(p)}${on ? ' — reported' : ' — not reported'}"></span>`;
    }).join('');
    const latest = (approach.reported || []).slice(-1)[0];
    const caption = latest ? `${latest} · ${approach.id}` : approach.id;
    // Nothing to say only when there is genuinely nothing: no name AND no phase.
    if (!caption && !pips) return '';
    return `<span class="pips">${pips}<span class="pn">${esc(caption)}</span></span>`;
  }

  // The retry meter IS the fix control: it is how `fix` stays selectable now that
  // the node is gone, and it sits on the gate the loop belongs to, which is where
  // a user would look for it. One tick per ALLOWED attempt, filled per attempt
  // spent — built from the cap the host resolved, never from a literal, or it
  // would misreport the budget the driver will actually spend.
  function renderMeter(retry) {
    const ticks = Array.from({ length: retry.cap }, (_, i) =>
      `<span class="tk ${i < retry.spent ? 'on' : ''}"></span>`).join('');
    const ret = retry.returnsTo ? `<span class="ret">↩ ${esc(retry.returnsTo)}</span>` : '';
    const label = `Fix loop on ${STAGE_TITLE[retry.gate] || retry.gate}: `
      + `attempt ${retry.spent} of ${retry.cap}${retry.live ? ', running' : ''}`;
    return `<button type="button" class="fixm ${retry.live ? '' : 'spent'}" data-stage="fix"`
      + ` aria-label="${esc(label)}" title="${esc(label)}">`
      + `<span class="ticks">${ticks}</span>`
      + `<span class="tx">fix ${retry.spent}/${retry.cap}</span>${ret}</button>`;
  }

  // THREE steps, measured rather than keyed to a breakpoint: the threshold
  // depends on the current stage's name length and on whether a meter is riding
  // along. This is the ONLY measurement in the track and it POSITIONS NOTHING —
  // it toggles one of three classes, so a measurement taken pre-layout can never
  // detach anything, only under-degrade for one frame.
  function place() {
    const track = document.querySelector('.track');
    if (!track) return;
    const lane = track.querySelector('.lane');
    if (!lane) return;
    const over = () => lane.scrollWidth > lane.clientWidth + 1;
    track.classList.remove('snug', 'tight', 'bare');
    if (!over()) return;
    track.classList.add('snug');
    if (!over()) return;
    track.classList.add('tight');
    if (over()) track.classList.add('bare');
  }

  // The NAVIGATIONAL needs-you cases. The acting kinds (ship-confirm, a single
  // mergeable merge) never reach here — they carry `data-act` and post through
  // the generic handler. What is left is exactly what the rail must not act on
  // itself: a multi-repo wait (no single repo to pick, each merge carries its
  // own host confirmation), a per-repo conflict session, and an open session.
  // It scrolls the control that owns the action into view and focuses it; it
  // posts no host message and duplicates no actor.
  function gotoAction(kind) {
    // merge-panel and resolve live on the PR panel, where each repo has its own
    // Merge / Resolve control. An open session is the agent header — the
    // dashboard's own session control (it names the live session and its
    // state).
    const target = kind === 'open-session'
      ? document.querySelector('#agentButton')
      : document.querySelector('#prs .mgbtn');
    const scrollTo = target || el('prs');
    if (!scrollTo) return;
    scrollTo.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    if (target && typeof target.focus === 'function') target.focus();
  }

  // ── the Inside block: the A37 prototype's renderer ──────────────────────
  // The host ships ONE snapshot per stage (`InsideStageView`): ordered process
  // rows, each carrying pre-built status/detail/counts/identity/evidence and
  // an opaque action id. The webview renders rows verbatim — it never parses
  // prose, never formats a number, never derives a verdict. What changed with
  // the port is only the GRAMMAR it renders into: the prototype's op ledger
  // (`.op` summary grid + `.op-body`), its drawn glyphs, its session card and
  // its per-kind evidence bodies.

  // kind → label, from the closed InsideActionKind vocabulary. Static control
  // copy (UI-R20), like every other fixed label — the host never ships these strings.
  const INSIDE_ACTION_LABEL = {
    'open-pr': 'Open PR',
    'open-commit': 'Open commit',
    'open-file': 'Open file',
    'open-stage-log': 'Open log',
    'resume-stage': 'Resume',
    'open-full-evidence': 'Show all',
    'open-bounded-evidence': 'Show all',
    'graph-open-session': 'Open session',
    'graph-stop': 'Stop',
    'graph-discard-node': 'Discard process',
    'graph-edit-override': 'Edit override',
  };
  const INSIDE_ACTION_TITLE = {
    'open-pr': 'Open this pull request on the host',
    'open-commit': 'Open this commit on the host',
    'open-file': 'Open this file in an editor',
    'open-stage-log': "Open this stage's log file",
    'resume-stage': "Resume this ticket's stage",
    'open-full-evidence': 'Show every recorded row',
    'open-bounded-evidence': 'Show every repository row',
    'graph-open-session': 'Focus this session\'s terminal — never spawns one',
    'graph-stop': 'Signal the graph coordinator to drain',
    // DANGER (UI-R10b): the process may still be running. The title names the
    // risk and the row's visible status (`launch-unknown`/`termination-unknown`)
    // states it again, so the explanation is never title-only (UI-R19).
    'graph-discard-node': 'Discard unknown process — it may still be running',
    // Slice 6 T4: the per-node override edit — an ORDINARY secondary control
    // (reversible editing, nothing lost on click), unlike the discard exit.
    'graph-edit-override': 'Edit this node\'s profile/provider/model/effort/prompt overrides before it claims',
  };
  // The DANGER variants among the inside actions (UI-R10b: irreversible loss).
  const INSIDE_ACTION_DANGER = {
    'graph-discard-node': true,
  };

  function insideActionBtnHtml(a) {
    if (!a || !INSIDE_ACTION_LABEL[a.kind]) return '';
    // The host may ship a count-bearing label ("Show 4 more" — handoff §10);
    // the static map is the fallback, never a webview-computed count.
    const label = a.label || INSIDE_ACTION_LABEL[a.kind];
    // A danger action gets the danger variant (UI-R10b), so an irreversible
    // control is never styled as an ordinary secondary button.
    const variant = INSIDE_ACTION_DANGER[a.kind] ? 'k-btn--danger' : 'k-btn--secondary';
    return `<button type="button" class="k-btn ${variant} k-btn--sm" data-act="inside-action"`
      + ` data-action-id="${esc(a.actionId)}" title="${esc(INSIDE_ACTION_TITLE[a.kind])}">`
      + `${esc(label)}</button>`;
  }

  // The status WORD — the visible state, so status never rides colour alone
  // (UI-R06). The host ships the key; the word is closed control copy.
  const INSIDE_STATUS_LABEL = {
    pending: 'pending', run: 'running', wait: 'waiting',
    pass: 'passed', fail: 'failed', note: 'note', skip: 'skipped',
  };
  function statusWord(status) {
    return INSIDE_STATUS_LABEL[status] || status || '';
  }

  // ── the prototype's shared primitives ──────────────────────────────────
  // The identity run: [agent name ·] core mark + core · model. Every part is
  // host-shipped (`AgentExecutionView`); the mark is the CANONICAL provider
  // icon from the injected identity renderer, so a provider with no mark
  // degrades to text alone.
  function agentIdHtml(x) {
    if (!x) return '';
    const name = x.agentName
      ? `<span class="agent-name">${esc(x.agentName)}</span><span class="agent-sep">·</span>` : '';
    const icon = x.provider ? agentIconHtml(x.provider) : '';
    const core = x.providerLabel ? `<span class="agent-core">${esc(x.providerLabel)}</span>` : '';
    const model = x.modelLabel
      ? `<span class="agent-sep">·</span><span class="agent-model">${esc(x.modelLabel)}</span>` : '';
    return `<span class="agent-id">${name}${icon}${core}${model}</span>`;
  }

  // The identity a row is entitled to show, in the §11 order: what RAN, else
  // what settings SAY will run, else the host's absence copy. Never invented.
  function identityHtml(p) {
    if (p.execution) return agentIdHtml(p.execution);
    if (p.configuredExecution) return agentIdHtml(p.configuredExecution);
    if (p.identityNote) return `<span class="identity-note">${esc(p.identityNote)}</span>`;
    return '';
  }

  // The token claim as the prototype's Σ pill. `unavailable` is NOT zero: it
  // renders as a titled absence marker, never "0 tokens" (decision 8).
  function tokenStatHtml(t, live) {
    if (!t) return '';
    if (t.state === 'unavailable') {
      return `<span class="token-stat" title="${esc(t.title)}">usage unavailable</span>`;
    }
    const tip = t.exact ? ` title="${esc(t.exact)}"` : '';
    return `<span class="token-stat${live ? ' live' : ''}"${tip}><span class="sigma">Σ</span>${esc(t.total)} tok</span>`;
  }

  // ── per-kind evidence bodies ───────────────────────────────────────────
  // The closed ProcessEvidenceView union is dispatched here, one body per
  // kind, each in the prototype's own container so the kind-specific CSS
  // hangs off one selector.
  // An evidence row's status is the GLYPH, not a word: the word repeated what
  // the row's own detail already said ("selected … passed") on every row of
  // every expanded body. The word survives as the glyph's accessible name, so
  // nothing that cannot see colour loses the status. A recorded duration is a
  // fact of its own and still renders beside it.
  function evStateHtml(r, cls) {
    if (!r.status) return `<span class="${cls}"></span>`;
    const time = r.time
      ? `<span class="ev-time" title="started ${esc(r.time)}">${esc(r.time)}</span>`
      : '';
    const dur = r.duration
      ? `<span class="ev-dur"${r.durationExact ? ` title="${esc(r.durationExact)}"` : ''}>${esc(r.duration)}</span>`
      : '';
    return `<span class="${cls} ${esc(r.status)}">${time}${dur}`
      + `<span class="glyph ${esc(r.status)}" aria-label="${esc(statusWord(r.status))}"></span></span>`;
  }
  function evActionHtml(r) {
    return r.action ? `<span class="ev-tail">${insideActionBtnHtml(r.action)}</span>` : '';
  }
  // A visible resource identifier IS its control (UI-R09c): a file path, a
  // commit hash or a PR number renders as the link that opens it, never as
  // inert text beside a duplicate button. With no action it stays plain text
  // — a link that opens nothing is worse than none.
  function objLinkHtml(text, action, cls, title) {
    if (!text) return '';
    if (!action) return `<span class="obj-link-plain ${cls}">${esc(text)}</span>`;
    return `<a class="obj-link ${cls}" href="#" data-act="inside-action"`
      + ` data-action-id="${esc(action.actionId)}" title="${esc(title)}">${esc(text)}</a>`;
  }

  // ── Slice 6 T4: the graph's status-grouped node list ─────────────────────
  // The host ships `nodes` on the graph process's rows evidence, ALREADY
  // ordered by the closed `group` vocabulary; the webview breaks a section when
  // `n.group` changes and concatenates nothing (UI-R31). Static section copy
  // (UI-R20), keyed by that closed vocabulary — the webview never parses a
  // group out of row prose. The composition is local and unprefixed
  // (UI-R07/R08): the shared `.k-btn`/`.glyph` primitives carry the control and
  // the status; only the list geometry is local.
  const GRAPH_NODE_GROUP_LABEL = {
    active: 'Active',
    ready: 'Ready',
    'resource-waiting': 'Resource waiting',
    completed: 'Completed',
    blocked: 'Blocked',
    stale: 'Stale',
    cancelled: 'Cancelled',
    other: 'Other',
  };
  function graphNodeGroupLabel(group) {
    return GRAPH_NODE_GROUP_LABEL[group] || group || '';
  }
  function graphNodeListHtml(nodes) {
    let lastGroup = null;
    return `<div class="graph-nodes">${nodes.map((n) => {
      const head = n.group !== lastGroup
        ? `<div class="graph-node-group">${esc(graphNodeGroupLabel(n.group))}</div>` : '';
      lastGroup = n.group;
      // The status word rides the glyph's accessible name; the raw node-run
      // status is the row's own verdict text and stays visible as meta.
      const glyph = `<span class="glyph ${esc(n.displayStatus)}"`
        + ` aria-label="${esc(statusWord(n.displayStatus))}"></span>`;
      return head + `<div class="graph-node">${glyph}`
        + `<span class="graph-node-name">${esc(n.nodeId)}</span>`
        + `<span class="graph-node-meta">${esc(n.nodeKind)} · ${esc(n.status)}</span>`
        + `<span class="graph-node-detail">`
        + (n.identity ? `<span class="graph-node-identity">${esc(n.identity)}</span>` : '')
        + `<span class="graph-node-visit">${esc(n.visit)}</span>`
        + (n.override ? `<span class="graph-node-override">${esc(n.override)}</span>` : '')
        + (n.outcome ? `<span class="graph-node-fact">${esc(n.outcome)}</span>` : '')
        + (n.reason ? `<span class="graph-node-reason">${esc(n.reason)}</span>` : '')
        + `</span>`
        + (n.action ? `<span class="ev-tail">${insideActionBtnHtml(n.action)}</span>` : '')
        + `</div>`;
    }).join('')}</div>`;
  }

  function evidenceRowsHtml(ev) {
    const nodes = ev.nodes && ev.nodes.length ? graphNodeListHtml(ev.nodes) : '';
    return nodes + ev.rows.map((r) => `<div class="evidence-row">`
      + `<span class="ev-key">${esc(r.label)}</span>`
      + `<span class="ev-detail">${esc(r.detail || '')}`
      + (r.prState ? `<span class="pr-status ${esc(r.prState)}">${esc(r.prState)}</span>` : '')
      + `</span>`
      + (r.action ? evActionHtml(r) : evStateHtml(r, 'ev-state'))
      + `</div>`).join('');
  }
  // The recorded repository is its own column. A body whose rows name none
  // (pre-v21 gate rows) drops the column instead of drawing it empty — an
  // empty cell would read as a repo with no name.
  function evidenceGatesHtml(ev) {
    const hasRepo = ev.rows.some((r) => !!r.repo);
    return `<div class="gates${hasRepo ? '' : ' no-repo'}">${ev.rows.map((r) => `<div class="gate-row${r.status === 'run' ? ' active' : ''}">`
      + (hasRepo ? `<span class="gate-repo">${esc(r.repo || '')}</span>` : '')
      + `<span class="gate-name">${esc(r.label)}</span>`
      + `<span class="gate-detail">${esc(r.detail || '')}</span>`
      + evStateHtml(r, 'gate-state')
      + `</div>`).join('')}</div>`;
  }
  // Findings — ONE blueprint for both the Review findings and the UAT
  // observations. The level is coloured from the host's closed `severity` key
  // (never from parsing the label, which is prose an agent wrote), and the
  // location is the row's own link rather than an "Open file" button beside
  // inert text (UI-R09c). The level word stays visible, so severity never
  // rides colour alone (UI-R28).
  function evidenceFindingsHtml(ev) {
    return `<div class="findings">${ev.rows.map((r) => `<div class="finding">`
      + `<span class="sev${r.severity ? ' sev-' + esc(r.severity) : ''}">${esc(r.label)}</span>`
      + `<span class="finding-title">${esc(r.detail || '')}</span>`
      + `<span class="finding-loc">`
      + objLinkHtml(r.location, r.action, 'file-link', INSIDE_ACTION_TITLE['open-file'])
      + `</span>`
      + `<span class="finding-time">${esc(r.time || r.duration || '')}</span>`
      + `</div>`).join('')}</div>`;
  }
  // The bounded remainder of a RICH body. The host owns both the count copy
  // and the continuation's label — the webview counts nothing (UI-R31).
  function evidenceOverflowHtml(o) {
    if (!o) return '';
    return `<div class="overflow-note"><span>${esc(o.detail || o.label || '')}</span>`
      + (o.action ? insideActionBtnHtml(o.action) : '') + `</div>`;
  }

  // Ship · Commit: one block per repository — its provenance pill and the
  // commits that pill speaks for. A snapshot with no `repos` (an older host)
  // still renders through the generic row path.
  function evidenceCommitsHtml(ev) {
    if (!ev.repos || !ev.repos.length) return evidenceRowsHtml(ev);
    const grid = ev.repos.map((r) => {
      const list = r.commits && r.commits.length
        ? `<div class="commit-list">${r.commits.map((c) => `<div class="commit-item">`
          + (c.action
            // The commit SHA IS the open control — a link, never a button
            // (the design's "click the hash").
            ? `<a class="obj-link commit-link" href="#" data-act="inside-action"`
              + ` data-action-id="${esc(c.action.actionId)}" title="Open this commit on the host">${esc(c.sha)}</a>`
            : `<span class="commit-sha">${esc(c.sha)}</span>`)
          + `<span class="commit-message">${esc(c.message)}</span>`
          + `</div>`).join('')}</div>`
        : '';
      return `<div class="commit-repo"><div class="commit-repo-head">`
        + `<span class="commit-repo-name">${esc(r.repo)}</span>`
        + `<span class="commit-repo-summary">${esc(r.summary)}</span>`
        + (r.time ? `<span class="commit-time" title="commit step started ${esc(r.time)}">${esc(r.time)}</span>` : '')
        + `<span class="commit-origin ${esc(r.originKind)}">${esc(r.origin)}</span>`
        + `</div>${list}</div>`;
    }).join('');
    return `<div class="commit-grid">${grid}</div>${evidenceOverflowHtml(ev.overflow)}`;
  }

  // Ship · Pull request: the PR object karst recorded, the recorded step path,
  // and the host's own sentence saying why the row reads as it does. A branch
  // with no recorded number renders the host's absence copy, never a number.
  function evidencePrsHtml(ev) {
    if (!ev.branches || !ev.branches.length) return evidenceRowsHtml(ev);
    const arrow = '<span class="pr-arrow" aria-hidden="true">→</span>';
    const rows = ev.branches.map((b) => {
      const object = b.number
        ? `<span class="pr-object">`
          + (b.action
            // The PR number IS the open-PR control — a link, never a button.
            ? `<a class="obj-link pr-link" href="#" data-act="inside-action"`
              + ` data-action-id="${esc(b.action.actionId)}" title="Open this pull request on the host">${esc(b.number)}</a>`
            : `<span class="pr-link">${esc(b.number)}</span>`)
          + (b.prState ? `<span class="pr-status ${esc(b.prState)}">${esc(b.prState)}</span>` : '')
          + `</span>`
        : `<span class="pr-empty">${esc(b.emptyLabel || '')}</span>`;
      const steps = (b.steps || []).map(
        (s) => `<span class="pr-step ${esc(s.state)}">${esc(s.label)}</span>`,
      ).join(arrow);
      return `<div><div class="pr-branch${b.current ? ' current' : ''}">`
        + `<span class="pr-repo">${esc(b.repo)}</span>`
        + `<div class="pr-path">${object}${steps ? arrow + steps : ''}</div>`
        // Every expanded row dates itself, like the commit blocks beside it.
        + (b.time ? `<span class="pr-time" title="pull-request step started ${esc(b.time)}">${esc(b.time)}</span>` : '')
        + `</div>`
        + `<div class="pr-branch-note">${esc(b.note || '')}</div></div>`;
    }).join('');
    return `<div class="pr-branches">${rows}</div>${evidenceOverflowHtml(ev.overflow)}`;
  }

  // Done: the hero line, the three-block receipt grid, the Timing strip, then
  // the delivery lines — the last of these behind the receipt's own inner
  // <details>, because the overview stats are always visible and only the
  // details expand (869egdr2u-fu1). Hero/blocks/timing are optional — a
  // receipt that carries only rows renders exactly what it always did, as the
  // plain line list behind the Details disclosure.
  function evidenceReceiptHtml(ev) {
    // A delivery line's PR number IS its link (UI-R09c) — the `open-pr` action
    // rides the number itself, so the row keeps its state chip and its stamp
    // instead of surrendering the tail to a duplicate button.
    const lines = ev.rows.map((r) => `<div class="done-line">`
      + `<span class="done-key">${esc(r.label)}</span>`
      + `<span class="done-copy">`
      + (r.action && r.action.kind === 'open-pr'
        ? objLinkHtml(r.detail, r.action, 'pr-link', INSIDE_ACTION_TITLE['open-pr'])
        : esc(r.detail || ''))
      + (r.prState ? `<span class="pr-status ${esc(r.prState)}">${esc(r.prState)}</span>` : '')
      + `</span>`
      + (r.action && r.action.kind !== 'open-pr' ? evActionHtml(r)
        : `<span class="done-state">${r.time ? `<span class="ev-time">${esc(r.time)}</span> · ` : ''}${esc(r.duration || statusWord(r.status))}</span>`)
      + `</div>`).join('');
    // "Details" is static control copy for the disclosure (UI-R20); the rows
    // themselves are the host's finished strings.
    const details = ev.rows.length
      ? `<details class="done-details"><summary><span class="done-chev" aria-hidden="true"></span>Details</summary>`
        + `<div class="done-detail-body"><div class="done-lines">${lines}</div></div></details>`
      : '';
    if (!ev.hero && !(ev.blocks && ev.blocks.length) && !ev.timing) return details;
    const hero = ev.hero
      ? `<div class="done-hero"><span class="done-check glyph pass" aria-label="delivered"></span>`
        + `<span class="done-hero-main">${esc(ev.hero.title)}</span>`
        + `<span class="done-hero-sub">${esc(ev.hero.summary)}</span>`
        + (ev.hero.time ? `<span class="done-hero-time">${esc(ev.hero.time)}</span>` : '')
        + `</div>`
      : '';
    const blocks = ev.blocks && ev.blocks.length
      ? `<div class="receipt-grid">${ev.blocks.map((b) => `<div class="receipt-block">`
        + `<div class="receipt-label">${esc(b.label)}</div>`
        + `<div class="receipt-value">${esc(b.value)}</div>`
        + (b.details && b.details.length
          ? `<div class="receipt-detail">${b.details.map((d) => esc(d)).join('<br>')}</div>` : '')
        + (b.breakdown && b.breakdown.length
          ? `<div class="ai-usage-breakdown">${b.breakdown.map((i) => `<span class="ai-usage-item">`
            + `<strong>${esc(i.amount)}</strong> ${esc(i.label)}</span>`).join('')}</div>` : '')
        + `</div>`).join('')}</div>`
      : '';
    // The Timing strip: the host ships label, total and the pre-joined item
    // line verbatim — the webview concatenates nothing (UI-R31), and the sum
    // of the stated durations IS the stated total by construction (host-side).
    const timing = ev.timing
      ? `<div class="done-timing"><span class="done-timing-label">${esc(ev.timing.label)}</span>`
        + `<span class="done-timing-value">${esc(ev.timing.total)}</span>`
        + `<span class="done-timing-items">${esc(ev.timing.items)}</span></div>`
      : '';
    return `<div class="done-receipt">${hero}${blocks}${timing}${details}</div>`;
  }
  function evidenceRecoveryHtml(ev) {
    return `<div class="recovery-history">${ev.rows.map((r) => `<div class="recovery-round">`
      + `<span class="recovery-num">${esc(r.label)}</span>`
      + `<span class="recovery-cause">${esc(r.detail || '')}</span>`
      + `<span class="recovery-result ${esc(r.status || '')}">`
      + (r.duration ? `<span class="ev-dur">${esc(r.duration)}</span>` : '')
      + `<span class="glyph ${esc(r.status || 'note')}" aria-label="${esc(statusWord(r.status || 'note'))}"></span>`
      + `</span>`
      + `</div>`).join('')}</div>`;
  }

  // The session timeline: ONE continuous rail, three row shapes. The shape
  // comes from `role`/`connector` — closed structural fields — NEVER from
  // parsing the label, which is prose.
  function timelineRowHtml(r) {
    const tail = `<span class="timeline-tail">${tokenStatHtml(r.tokens, r.status === 'run')}`
      // The start stamp renders BESIDE the duration in the tail — the same
      // right-aligned position the phase rows' own time cell occupies, so
      // every row dates at its end, next to the span it measures
      // (869egdr2u-fu1).
      + (r.time ? `<span class="segment-window">${esc(r.time)}</span>` : '')
      + (r.duration ? `<span class="segment-window">${esc(r.duration)}</span>` : '')
      + (r.action ? insideActionBtnHtml(r.action) : '')
      + `</span>`;
    // The identity cell states an identity ONLY when the row carries one: a
    // provider-keyed row shows its core icon and identity prose in the core's
    // own blue. A provider-less identity row (the run start) has no identity
    // to claim — its stamp is a plain time fact, and rendering it here would
    // borrow the identity chip's colour for something that is not an
    // identity (869egdr2u-fu1).
    const identity = r.provider
      ? `<span class="agent-id">${agentIconHtml(r.provider)}`
        + `<span class="agent-core">${esc(r.detail || '')}</span></span>`
      : '<span></span>';
    if (r.connector === 'switch' || r.connector === 'resume') {
      const word = r.connector === 'switch' ? 'Provider switched here' : 'Session resumed here';
      return `<div class="timeline-row switch-event">`
        + `<span class="timeline-slot switch-slot" aria-hidden="true"><span class="switch-branch"></span></span>`
        + `<span class="switch-label" title="${word}"><span class="switch-arrow" aria-hidden="true">↳</span>`
        + `<span>${esc(r.label)}</span></span>`
        + `<span class="switch-value">${identity}</span>${tail}</div>`;
    }
    if (r.role === 'identity') {
      // A completed session's start reads as part of the delivery: the grey
      // hollow node gives way to the same green check the done row carries
      // (the design's "started after done" fix). Anything else keeps the
      // hollow start node — the timeline's chronology marker, not a verdict.
      const node = r.status === 'pass'
        ? `<span class="glyph phase-status pass" aria-label="passed"></span>`
        : `<span class="timeline-node start" aria-hidden="true"></span>`;
      return `<div class="timeline-row timeline-start">`
        + `<span class="timeline-slot">${node}</span>`
        + `<span class="timeline-start-label">${esc(r.label)}</span>`
        + `<span class="switch-value">${identity}</span>${tail}</div>`;
    }
    const status = r.status || 'pending';
    return `<div class="timeline-row phase-row${status === 'run' ? ' current' : ''}">`
      + `<span class="timeline-slot phase-rail"><span class="glyph phase-status ${esc(status)}"`
      + ` aria-label="${esc(statusWord(status))}"></span></span>`
      + `<span class="phase-name">${esc(r.label)}</span>`
      + `<span class="phase-detail ${esc(status)}">${esc(r.detail || '')}</span>`
      + `<span class="phase-time">${esc(r.time || r.duration || '')}</span></div>`;
  }
  function evidenceTimelineHtml(ev) {
    return `<div class="session-segments">${ev.rows.map(timelineRowHtml).join('')}</div>`;
  }

  // Kind → body. An unknown kind (a future host, an older snapshot) falls back
  // to the generic rows body — forward compatibility, never a throw.
  const EVIDENCE_RENDERERS = {
    rows: evidenceRowsHtml,
    gates: evidenceGatesHtml,
    findings: evidenceFindingsHtml,
    timeline: evidenceTimelineHtml,
    commits: evidenceCommitsHtml,
    prs: evidencePrsHtml,
    recovery: evidenceRecoveryHtml,
    receipt: evidenceReceiptHtml,
  };
  function evidenceBodyHtml(ev) {
    return (EVIDENCE_RENDERERS[ev.kind] || evidenceRowsHtml)(ev);
  }

  // Does this evidence render anything? The generic `rows` array is only one
  // of its shapes — a `prs`/`commits`/`receipt` evidence renders from
  // `branches`/`repos`/`blocks`/`hero`, and testing `rows` alone made such a
  // row static: content behind a disclosure with no way to open it.
  function hasEvidenceBody(ev) {
    if (!ev) return false;
    return !!((ev.rows && ev.rows.length) || (ev.nodes && ev.nodes.length)
      || (ev.branches && ev.branches.length)
      || (ev.repos && ev.repos.length) || (ev.blocks && ev.blocks.length) || ev.hero);
  }

  // ── the process row ────────────────────────────────────────────────────
  // A process with evidence (or footer facts) is a native <details>: keyboard
  // operability comes from the element, never a handler (UI-R09). One with
  // nothing behind it is the prototype's `.op-static` — a row that states its
  // fact and offers no disclosure it cannot honour.
  function processRowHtml(p, key, open, consoleStage) {
    const ai = p.execution || p.configuredExecution ? '<span class="ai-mark">AI</span>' : '';
    // No status WORD in the tail: the prototype's row carries its state on the
    // glyph (which keeps the word as its accessible name) and in the detail's
    // colour class. A second textual "Completed" beside the duration was ours,
    // not the design's, and it crowded the tail out of the narrow widths.
    const tail = `<span class="op-tail">${identityHtml(p)}`
      + tokenStatHtml(p.tokens, p.status === 'run')
      + (p.aggregate ? `<span class="count">${esc(p.aggregate)}</span>` : '')
      + (p.count ? `<span class="count">${esc(p.count)}</span>` : '')
      + (p.time ? `<span class="op-time">${esc(p.time)}</span>` : '')
      + (p.duration ? `<span class="duration"${p.durationExact ? ` title="${esc(p.durationExact)}"` : ''}>${esc(p.duration)}</span>` : '')
      + (p.action ? insideActionBtnHtml(p.action) : '')
      + `</span>`;
    const name = `<span class="op-name">${esc(p.label)}${ai}</span>`;
    const glyph = `<span class="glyph ${esc(p.status)}" aria-label="${esc(p.statusLabel || statusWord(p.status))}"></span>`;
    // The console (terminal detailed mode) entry point: the GATES row's
    // description area, icon-only (869e7n906-fu1). The label is not lost — it
    // moves to aria-label + title, the SAME string on both (UI-R21/R24), and
    // `data-console` still carries the stage whose log this opens, so the
    // click handler is untouched. The gates row is the one row whose summary
    // IS the gate run, so this button shows the gates' test log (uat) or the
    // review gates' log (review) depending on which stage view is on screen.
    const consoleBtn = consoleStage && p.id === 'gates'
