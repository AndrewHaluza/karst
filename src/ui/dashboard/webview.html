<!--
  Karst ticket dashboard webview (T3.2). Self-contained: no external assets
  (webview CSP forbids them). Renders from the `state` postMessage the host
  pushes (state.ts → DashboardState) and posts action messages back
  (messages.ts → WebviewMessage). Styles ported from design/orchestrator-mockup.html.
-->
<style>
  :root{
    /* Theme-aware: inherit VS Code's palette so light + dark both read well.
       Stage colors map to the editor's chart colors (kept as --st-* so the
       inline style="" in the render fns keeps working). */
    --border:var(--vscode-panel-border);
    --hover:var(--vscode-list-hoverBackground);
    --text:var(--vscode-foreground);
    --text-dim:var(--vscode-descriptionForeground,var(--vscode-foreground));
    --text-faint:var(--vscode-disabledForeground,var(--vscode-descriptionForeground));
    --link:var(--vscode-textLink-foreground);
    --panel-bg:var(--vscode-editorWidget-background,transparent);
    --st-done:var(--vscode-charts-green,#4bb64b);
    --st-running:var(--vscode-charts-blue,#3794ff);
    --st-pending:var(--vscode-charts-lines,#6e7681);
    --st-input:var(--vscode-charts-yellow,#cca700);
    --st-failed:var(--vscode-charts-red,#f14c4c);
    --mono:var(--vscode-editor-font-family,"SF Mono",ui-monospace,Menlo,Monaco,Consolas,monospace);
    --ui:var(--vscode-font-family,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--vscode-editor-background);color:var(--text);font-family:var(--ui);font-size:var(--vscode-font-size,13px);padding:22px 26px}
  button{font-family:inherit;cursor:pointer;color:var(--vscode-button-foreground);background:var(--vscode-button-background);border:none;border-radius:5px;padding:3px 9px;font-size:11px}
  button:hover{background:var(--vscode-button-hoverBackground,var(--vscode-button-background))}
  button:focus-visible{outline:1px solid var(--vscode-focusBorder);outline-offset:1px}
  a{color:var(--link);text-decoration:none}
  /* Toggled by the render fns (fault card, impl phases) — without this rule the
     `hidden` class was a no-op and an empty box still drew its border. */
  .hidden{display:none}

  .dhead{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .dhead h1{font-size:17px;margin:0}
  .dhead .key{font-family:var(--mono);font-size:12px;color:var(--text-dim)}
  .dhead .agent{margin-left:auto;font-size:11px;color:var(--text-dim);font-family:var(--mono)}
  .dhead .ticketlink a{font-size:11px;display:inline-flex;align-items:center;gap:4px}
  .dhead .ticketlink a:hover{text-decoration:underline}
  .dhead .ticketlink .ref{font-family:var(--mono);color:var(--text-dim)}
  /* Shared ticketing-provider badge (icon + brand name) — single source in
     src/model/providerIdentity.ts, injected here at load (CSP forbids a
     shared stylesheet). */
  /*KARST_PROVIDER_CSS*/

  /* Stepper — the pipeline as an energized rail. The CONNECTORS carry state, not
     just the nodes: a segment the ticket actually passed through is lit, the
     segment into the active node is accented, unreached segments stay dim, and a
     failed node breaks its incoming segment in red. Status is never color alone —
     each node also carries a glyph and a distinct shape (filled / hollow /
     broken), so the rail survives colorblindness and high-contrast themes. */
  .stepper{margin:20px 0 26px;padding:20px 8px 8px;border:1px solid var(--border);border-radius:10px;background:var(--panel-bg)}
  /* The rail scrolls inside itself on a narrow panel; the page never scrolls sideways. */
  .railwrap{overflow-x:auto}
  .steps{display:flex;align-items:flex-start;min-width:460px}
  .step{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
  .step .line{position:absolute;top:15px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
  .step:first-child .line{display:none}
  .step .line.lit{background:var(--st-done);opacity:.5}
  .step .line.active{background:var(--st-running);opacity:.8}
  .step .line.broken{background:var(--st-failed)}
  .step .node{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel-bg);border:2px solid var(--st-pending);color:var(--text-faint);position:relative;z-index:1;font-size:13px;font-weight:700;line-height:1}
  .step .lbl{margin-top:9px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);text-align:center}
  .step.done .node{background:var(--st-done);border-color:var(--st-done);color:var(--vscode-editor-background)}
  .step.skipped .node{background:var(--st-pending);border-color:var(--st-pending);color:var(--vscode-editor-background);opacity:.6}
  .step.running .node{background:var(--st-running);border-color:var(--st-running);color:var(--vscode-editor-background);animation:node-pulse 1.7s ease-in-out infinite}
  .step.running .lbl{color:var(--text)}
  /* Failed reads as a break in the circuit: hollow + dashed, never filled. */
  .step.failed .node{background:transparent;border-color:var(--st-failed);border-style:dashed;color:var(--st-failed)}
  .step.failed .lbl{color:var(--st-failed)}
  @keyframes node-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.09);opacity:.72}}
  @media (prefers-reduced-motion:reduce){.step.running .node{animation:none}}

  /* The fault card — the one loud element on the page, because a failure is the
     one moment the user MUST read. Machine truth (reason, timings) is monospace. */
  .fault{margin:16px 6px 2px;padding:10px 12px;border-left:3px solid var(--st-failed);
    border-radius:0 6px 6px 0;background:var(--vscode-inputValidation-errorBackground,transparent)}
  .fault .ftitle{font-size:12px;font-weight:600;margin-bottom:6px}
  .fault .freason{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;word-break:break-word}
  .fault .fmeta{font-family:var(--mono);font-size:10.5px;color:var(--text-dim);margin-top:7px}
  .fault .facts{margin-top:9px}

  /* The "Now" line — one plain sentence naming what is happening and the next
     action the user controls. Built host-side (state.now) so the copy is tested. */
  .now{display:flex;align-items:center;gap:10px;margin:14px 6px 2px;padding-top:11px;
    border-top:1px solid var(--border);font-size:12px;color:var(--text)}
  .now .ntext{flex:1}
  /* Read-only impl-phase breakdown under the stepper. Informational: emphasis
     tracks the impl cell (.done / .active), no per-phase live state. */
  .substeps{display:flex;align-items:center;flex-wrap:wrap;gap:6px;
    margin:12px 6px 2px;padding-top:11px;border-top:1px solid var(--border);font-size:11px}
  .substeps .sslabel{text-transform:uppercase;letter-spacing:.05em;opacity:.5;
    font-weight:700;margin-right:4px}
  .substeps .ssphase{padding:2px 8px;border-radius:10px;border:1px solid var(--border);
    color:var(--text-dim);white-space:nowrap}
  .substeps .ssarrow{opacity:.35}
  .substeps.active .ssphase{border-color:var(--st-running);color:var(--text)}
  .substeps.done .ssphase{border-color:var(--st-done);color:var(--st-done)}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .panel{border:1px solid var(--border);border-radius:10px;background:var(--panel-bg);overflow:hidden}
  .panel.span{grid-column:1 / -1}
  .phead{display:flex;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:12.5px;font-weight:600}
  .phead .count{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-faint);font-weight:400}
  .pbody{padding:6px 8px 10px}
  .empty{padding:16px 14px;color:var(--text-faint);font-size:12px}

  .srv,.wt,.pr{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:6px}
  .srv:hover,.wt:hover,.pr:hover{background:var(--hover)}
  .srv .sdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--st-done)}
  /* offline reads as absence: a hollow ring, not a filled dot */
  .srv .sdot.off{background:transparent;border:2px solid var(--st-pending);width:9px;height:9px}
  .srv .snm,.wt .wrepo{font-size:12.5px;min-width:74px}
  .srv .addr{font-family:var(--mono);font-size:11.5px;color:var(--text-dim)}
  .srv .addr.off{font-style:italic;opacity:.7}
  .srv .sacts,.wt .wacts,.pr .pacts{margin-left:auto;display:flex;gap:4px}
  .wt .wbr{font-family:var(--mono);font-size:11px;color:var(--text-dim);flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .pr .pst{font-size:10px;font-family:var(--mono);padding:1px 7px;border-radius:9px;background:var(--vscode-badge-background);color:var(--vscode-badge-foreground)}
  .pr .pnum{font-family:var(--mono);color:var(--link)}
  .pr .ptitle{flex:1;font-size:12.5px}

  /* agent pill (colored by state) */
  .agent-pill{display:inline-flex;align-items:center;gap:6px}
  .agent-pill .dot{width:7px;height:7px;border-radius:50%}
</style>

<div class="dhead">
  <span class="key" id="key"></span>
  <h1 id="title"></h1>
  <span class="ticketlink" id="ticketLink"></span>
  <span class="agent" id="agent"></span>
  <button id="editBtn" title="Edit ticket">Edit</button>
</div>

<div class="stepper">
  <div class="railwrap"><div class="steps" id="steps"></div></div>
  <!-- Inline fault card for a failed stage: reason + timings + [Open log]. -->
  <div class="fault hidden" id="fault"></div>
  <!-- What is happening and what the user can do next (state.now). -->
  <div class="now" id="now"></div>
  <!-- Read-only impl-phase breakdown (approach workflow); hidden when none. -->
  <div class="substeps hidden" id="substeps"></div></div>

<div class="grid">
  <div class="panel"><div class="phead">Servers<span class="count" id="srvCount"></span></div><div class="pbody" id="servers"></div></div>
  <div class="panel"><div class="phead">Worktrees<span class="count" id="wtCount"></span></div><div class="pbody" id="worktrees"></div></div>
  <div class="panel span"><div class="phead">Pull requests<span class="count" id="prCount"></span></div><div class="pbody" id="prs"></div></div>
</div>

<script>
  // Shared ticketing-provider identity (icon + brand) — single source in
  // src/model/providerIdentity.ts, injected here at load (CSP forbids a
  // shared script). Defines PROVIDER_LABELS, CLICKUP_SVG, providerBadgeHtml.
  /*KARST_PROVIDER_JS*/

  const vscode = acquireVsCodeApi();
  const post = (msg) => vscode.postMessage(msg);

  // Stage status -> stepper CSS class. Amber/needs-you is an agent-level signal
  // (glyphFor precedence); the stepper shows stage status only.
  const STEP_CLASS = { passed: 'done', running: 'running', failed: 'failed', pending: '', skipped: 'skipped' };
  // Glyph per status, so status never rides on color alone.
  const STEP_GLYPH = { passed: '✓', running: '⟳', failed: '✕', pending: '·', skipped: '–' };
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  const STAGE_TITLE = { uat: 'UAT', review: 'Review', fix: 'Fix', scope: 'Scope', impl: 'Implementation', ship: 'Ship', done: 'Done' };

  // The connector INTO this node: lit once the previous stage passed, accented
  // into a running node, broken (red) into a failed one, dim when unreached.
  function lineClass(cell, prev) {
    if (cell.status === 'failed') return 'broken';
    const reached = prev && (prev.status === 'passed' || prev.status === 'skipped');
    if (!reached) return '';
    return cell.status === 'running' ? 'active' : 'lit';
  }

  function renderStepper(stepper) {
    el('steps').innerHTML = stepper.map((s, i) => {
      const cls = STEP_CLASS[s.status] || '';
      const glyph = STEP_GLYPH[s.status] || '';
      return `<div class="step ${cls}"><div class="line ${lineClass(s, stepper[i - 1])}"></div>`
        + `<div class="node" title="${esc(s.stageKey)}: ${esc(s.status)}">${glyph}</div>`
        + `<div class="lbl">${esc(s.stageKey)}</div></div>`;
    }).join('');
  }

  // "12:04:31 · 42s" — machine truth, so it is rendered in mono. Duration is
  // omitted while a stage is still running (no endedAt yet).
  function timingText(cell) {
    if (!cell.startedAt) return '';
    const started = new Date(cell.startedAt);
    if (Number.isNaN(started.getTime())) return '';
    const stamp = started.toLocaleTimeString();
    if (!cell.endedAt) return stamp;
    const ms = new Date(cell.endedAt).getTime() - started.getTime();
    if (!Number.isFinite(ms) || ms < 0) return stamp;
    return `${stamp} · ${(ms / 1000).toFixed(1)}s`;
  }

  // The fault card: the reason a red node is red, the log behind it, and when it
  // ran. Shown only for a failed stage — everything else stays quiet.
  function renderFault(stepper) {
    const box = el('fault');
    const failed = (stepper || []).find((s) => s.status === 'failed');
    box.classList.toggle('hidden', !failed);
    if (!failed) { box.innerHTML = ''; return; }
    const title = `${STAGE_TITLE[failed.stageKey] || failed.stageKey} failed`;
    const timing = timingText(failed);
    const attempt = failed.attempt ? ` · attempt ${esc(failed.attempt)}` : '';
    box.innerHTML = `<div class="ftitle">${esc(title)}</div>`
      + `<div class="freason">${esc(failed.reason || 'No reason recorded.')}</div>`
      + (timing ? `<div class="fmeta">${esc(timing)}${attempt}</div>` : '')
      + (failed.artifactPath
        ? `<div class="facts"><button data-act="open-stage-log" data-path="${esc(failed.artifactPath)}">Open log</button></div>`
        : '');
  }

  // One sentence + at most one button. The copy is built host-side (model/nowLine)
  // and shipped in the state, so it is unit-tested and lives in exactly one place.
  const NOW_MESSAGE = { 'open-log': 'open-stage-log', ship: 'ship-ticket', resume: 'resume-ticket' };

  function renderNow(now) {
    const line = now || { text: '' };
    const a = line.action;
    const type = a && NOW_MESSAGE[a.kind];
    const attrs = a && a.path ? ` data-path="${esc(a.path)}"` : '';
    el('now').innerHTML = `<span class="ntext">${esc(line.text)}</span>`
      + (type ? `<button data-act="${type}"${attrs}>${esc(a.label)}</button>` : '');
  }

  // Read-only impl-phase breakdown: what the single impl stage covers for this
  // approach (research → plan → implement …). No per-phase live state exists
  // (impl has no deterministic sub-signal), so emphasis tracks the impl cell:
  // done once impl passed, active while impl runs, muted otherwise.
  function renderSubsteps(phases, stepper) {
    const box = el('substeps');
    const show = Array.isArray(phases) && phases.length > 0;
    box.classList.toggle('hidden', !show);
    if (!show) return;
    const impl = (stepper || []).find((s) => s.stageKey === 'impl');
    const cls = impl && (impl.status === 'passed' || impl.status === 'skipped')
      ? 'done' : impl && impl.status === 'running' ? 'active' : '';
    box.className = `substeps ${cls}`;
    box.innerHTML = `<span class="sslabel">impl</span>`
      + phases.map((p) => `<span class="ssphase">${esc(p)}</span>`).join('<span class="ssarrow">→</span>');
  }

  function renderServers(servers) {
    el('srvCount').textContent = servers.length ? `${servers.length}` : '';
    el('servers').innerHTML = servers.length ? servers.map((s) => {
      // Online = filled green (status light); offline = hollow ring (see .sdot.off).
      const online = s.status === 'running';
      // Offline servers keep their row (retained, not deleted) so they can be
      // restarted; only a Restart affordance makes sense — Open/Copy/Stop don't.
      const addr = online
        ? `<span class="addr">${esc(s.host || 'localhost')}:${esc(s.port)}</span>`
        : `<span class="addr off">offline</span>`;
      const acts = online
        ? `<button data-act="open-server" data-id="${s.id}">Open</button>`
          + `<button data-act="copy-server-url" data-id="${s.id}" data-copy>Copy</button>`
          + `<button data-act="restart-server" data-id="${s.id}">Restart</button>`
          + `<button data-act="stop-server" data-id="${s.id}">Stop</button>`
        : `<button data-act="spin-servers">Restart</button>`;
      return `<div class="srv"><span class="sdot${online ? '' : ' off'}"></span>`
        + `<span class="snm">${esc(s.service)}</span>`
        + addr
        + `<span class="sacts">${acts}</span></div>`;
    }).join('')
      // No servers → a live affordance to spin them (todo-5: was a dead end).
      : `<div class="empty">No servers running.`
        + ` <button data-act="spin-servers">Start servers</button></div>`;
  }

  function renderWorktrees(wts) {
    el('wtCount').textContent = wts.length ? `${wts.length}` : '';
    el('worktrees').innerHTML = wts.length ? wts.map((w) => (
      `<div class="wt"><span class="wrepo">${esc(w.repoDisplay || w.repo)}</span>`
      + `<span class="wbr">${esc(w.branch || '')}</span>`
      + `<span class="wacts">`
      + `<button data-act="diff-worktree" data-path="${esc(w.path)}">Diff</button>`
      + `<button data-act="open-worktree-folder" data-path="${esc(w.path)}">Open folder</button>`
      + `</span></div>`
    )).join('') : '<div class="empty">No worktrees.</div>';
  }

  function renderPrs(prs) {
    el('prCount').textContent = prs.length ? `${prs.length}` : '';
    el('prs').innerHTML = prs.length ? prs.map((p) => (
      `<div class="pr"><span class="pst">${esc(p.status || '')}</span>`
      + `<span class="prepo">${esc(p.repo)}</span>`
      + `<span class="ptitle">${esc(p.url || '')}</span>`
      + `<span class="pnum">#${esc(p.number)}</span>`
      + `<span class="pacts"><button data-act="open-pr" data-url="${esc(p.url)}">Open</button></span></div>`
    )).join('') : '<div class="empty">No pull requests.</div>';
  }

  // agent state -> pill color (uses the same chart vars as the stepper).
  const AGENT_COLOR = {
    running: 'var(--st-running)',
    waiting: 'var(--st-input)',
    idle: 'var(--st-pending)',
    none: 'var(--st-pending)',
  };

  function renderAgent(agentState) {
    const st = agentState || 'none';
    const color = AGENT_COLOR[st] || 'var(--st-pending)';
    el('agent').innerHTML =
      `<span class="agent-pill"><span class="dot" style="background:${color}"></span>`
      + `agent: ${esc(st)}</span>`;
  }

  // A link to the source board (ClickUp, …) when the ticket was fetched from one.
  // The brief (if any) rides along as a hover title. Manual/unfetched → nothing.
  // Branded via the shared provider badge (icon + name) so this reads as a
  // distinct external-link chip, not a bare repeat of the key shown alongside it.
  function renderTicketLink(state) {
    if (!state.ticketUrl) { el('ticketLink').innerHTML = ''; return; }
    const badge = providerBadgeHtml(state.provider);
    const ref = state.sourceRef ? ` <span class="ref">· ${esc(state.sourceRef)}</span>` : '';
    const tip = state.brief ? ` title="${esc(state.brief)}"` : '';
    el('ticketLink').innerHTML =
      `<a href="#" data-act="open-ticket-link" data-url="${esc(state.ticketUrl)}"${tip}>↗ ${badge}${ref}</a>`;
  }

  function render(state) {
    el('key').textContent = state.key || `#${state.ticketId}`;
    el('title').textContent = state.title || '(untitled)';
    renderTicketLink(state);
    renderAgent(state.agentState);
    renderStepper(state.stepper);
    renderFault(state.stepper);
    renderNow(state.now);
    renderSubsteps(state.implPhases, state.stepper);
    renderServers(state.servers);
    renderWorktrees(state.worktrees);
    renderPrs(state.prs);
  }

  el('editBtn').addEventListener('click', () => post({ type: 'edit-ticket' }));

  // Optimistic feedback for the copy button — the host does the actual clipboard
  // write; the webview just confirms it so the click feels responsive.
  function flashCopied(btn) {
    const prev = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.disabled = true;
    setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 1200);
  }

  // Delegate clicks (buttons + the ticket-link anchor) → action messages
  // (messages.ts routeAction). A no-payload action (e.g. spin-servers) posts
  // just its type.
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    e.preventDefault();
    const act = btn.dataset.act;
    if (btn.dataset.id) post({ type: act, serverId: Number(btn.dataset.id) });
    else if (btn.dataset.path) post({ type: act, path: btn.dataset.path });
    else if (btn.dataset.url) post({ type: act, url: btn.dataset.url });
    else post({ type: act });
    if (btn.hasAttribute('data-copy')) flashCopied(btn);
  });

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (msg && msg.type === 'state') {
      render(msg.state);
      vscode.setState(msg.state); // survive reload (retainContextWhenHidden)
    }
  });

  // Restore last state on reload before the host re-pushes.
  const prev = vscode.getState();
  if (prev) render(prev);
</script>

<style>/*KARST_PALETTE*/</style>
