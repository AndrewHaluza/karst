<!-- The artifact index/detail surface: the SAME webview, never a second tab.
     While active it replaces the dashboard body (body.art-nav hides .stepper
     and .grid); Back and Esc return to the ticket dashboard (spec §7–8). -->
<div id="artView" class="artview hidden" tabindex="-1"></div>
<div id="termView" class="termview hidden" tabindex="-1"></div>
<div id="logsView" class="logsview hidden" tabindex="-1"></div>
<div id="envView" class="envview hidden" tabindex="-1"></div>

<script>
  /*KARST_DS_JS*/

  // Shared ticketing-provider identity (icon + brand) — single source in
  // src/model/providerIdentity.ts, injected here at load (CSP forbids a
  // shared script). Defines PROVIDER_LABELS, CLICKUP_SVG, providerBadgeHtml.
  /*KARST_PROVIDER_JS*/

  // Shared agent-core identity (icon + name) — single source in
  // src/model/agentIdentity.ts, injected here at load. Defines
  // AGENT_PROVIDER_LABELS, agentBadgeHtml, agentIconHtml. The inside ledger's
  // identity chip consumes agentIconHtml (B1), so the markers are load-bearing:
  // without them the chip would throw ReferenceError on the first process row.
  /*KARST_AGENT_JS*/

  /*KARST_AGENT_PICKER_JS*/

  // The shared in-dashboard/standalone server-logs surface. Defines
  // `window.createServerLogsView({ post, detached, onClose })` — the control
  // strip, search, run scoping and ANSI rendering both hosts include.
  /*KARST_SERVER_LOGS_VIEW_JS*/

  // Type-checked webview message senders (NDL-39). The bundle below is the ONE
  // caller of the VS Code webview API and defines the `vscode` + `karstSend`
  // globals; every control posts through a typed `karstSend.<name>(...)`
  // sender, so a renamed message field is a tsc error instead of a silent drop.
  /*KARST_WEBVIEW_SEND_DASHBOARD*/

  // Dashboard React app bundle (phase 1 foundation).
  /*KARST_DASHBOARD_APP*/

  // Single source for the copy-confirmation toast text — two call sites show
  // it (a floating toast and an inline button label), and both must say the
  // same thing.
  const COPIED_TOAST_TEXT = 'Copied ✓';

  // NOTE: the Inside block does NOT use a glyph character map — the ported
  // prototype draws each state with CSS on `.glyph` (a ring, a check, a cross,
  // a spinning arc). The stage rail's own glyphs live in app/railText.ts.
  const el = (id) => document.getElementById(id);
  const esc = karstEsc;
  const STAGE_TITLE = { uat: 'UAT', review: 'Review', fix: 'Fix', scope: 'Scope', impl: 'Implementation', ship: 'Ship', done: 'Done' };

  // The last snapshot the host pushed. The stage selection and the Ship wait it was auto-selected for are React's
  // (app/stageSelection.ts); the page only keeps the last values React announced (`karst:persistSel`) so it can write
  // them with the rest of the view state (A3), and restores them below for the React app to read once at mount.
  let lastState = null;
  let selectedStage = null;
  let shipWaitSeen = null;
  // What the user typed into the servers filter. Local for the same reason: a
  // state push lands on every server change, so a filter living in (or absent
  // from) DashboardState would be wiped out mid-typing.
  let srvFilter = '';
  // The in-flight operations the rail, the header, the PR panel and the Inside block share, the Inside overlays and the
  // stage selection are React state now (app/pendingOps.ts, app/dashboardStore.ts, app/stageSelection.ts); the page keeps none.
  // The in-webview artifact surface (spec §7): null = the ticket dashboard,
  // 'index' = the artifacts index, {id, from} = one artifact's detail. Local
  // view state like the stage selection — never in DashboardState, never
  // round-tripped. `from` is what Back answers with: detail opened from the
  // dashboard returns to the ticket, from the index to the index (spec §7.3).
  let artView = null;
  let artViewId = null;  // the artifact id currently rendered, for filter reset
  let artFindingRepo = null;  // artifacts-local findings repo filter
  // Per-surface scroll positions (spec §9): the dashboard is tall, so a
  // navigation round trip must not lose where the user was reading. Saved on
  // leaving a surface, restored on returning; detail keeps one entry per
  // artifact id. Survives reload via persist().
  let artScrolls = { ticket: 0, index: 0, detail: {} };

  // The terminal console surface (xterm "detailed mode"): which stage's console
  // is open (a gate-stage key, or null). NOT persisted — a
  // restored view would claim content that died with the Terminal instance on
  // reload. `termLoading` is the in-between state between the request and the
  // host's GUARANTEED answer (the stage-log message is always sent, ok or
  // error — UI-R13), which is also the terminal outcome.
  // `termProcess` narrows the surface to ONE gate-lane AI process's console
  // (tester/review) when a process console is open; null → the stage console.
  let termView = null;
  let termProcess = null;
  let termLoading = false;
  let term = null;
  let termFit = null;
  let termResize = null;
  // Live chunks that arrived while the agent console was still loading (before
  // the guaranteed agent-log answer rendered the persisted tail). Flushed into
  // the terminal right after that answer, so a chunk racing the answer is never
  // silently dropped from the open view.
  let termPending = '';
  // True while the console shows a refusal blurb INSTEAD of a terminal. A
  // mid-run stage console is refused (no artifact is recorded until the stage
  // finishes), so live gate output arriving afterwards must rebuild the
  // terminal rather than write into a host that is no longer on the page.
  let termBlurbed = false;
  // The xterm bundle is NOT part of this document: over Remote-SSH the whole
  // document crosses the network on every panel open, and ~490 KB of it would
  // be a library only the console uses. The first console open asks the host
  // for it (`xterm-request`); the answer runs as a nonce'd inline script, so the
  // CSP stays nonce-only. 'absent' → 'loading' → 'ready' | 'failed'.
  let xtermState = typeof Terminal !== 'undefined' ? 'ready' : 'absent';
  // The console action is webview-LOCAL: it opens the terminal surface and
  // posts `stage-log-request`; it never reaches the host, so it has no
  // `routeAction` case. The literal is declared ONCE here and interpolated at
  // render — the webview pin ("emits no action the host does not validate")
  // scans the SOURCE for literal data-act values and would read a bare
  // console-valued one as an unvalidated host action, so the action name must
  // never be spelled as a data-act literal in this file. The rendered DOM
  // still carries the console data-act value (same pattern as any action name
  // the pin would otherwise flag as unvalidated).
  const CONSOLE_ACT = 'console';

  // Combined server logs: `logsView` is the open/closed flag; the surface
  // itself (state, controls, ANSI rendering) lives in the shared
  // `window.createServerLogsView` runtime injected above, so the dashboard and
  // the standalone panel cannot drift.
  let logsView = null;
  let logsViewInstance = null;
  // The env-override editor's own state. `envDrafts` holds what the user has
  // TYPED, per scope, so a state push (a live tick, a server change) re-renders
  // the surface without discarding an unsaved edit — the same reason
  // `baseFormRebase` lives at module level. A scope is
  // dropped from the drafts once the host's push carries the saved value.
  let envView = null;
  let envDrafts = {};
  let envSaved = {};
  let envSaveRequests = {};

  // The Inside block (stage header, live operation, round switcher, process ledger, every evidence body, the graph,
  // the ship preview, the live clocks and the stage "..." menu) is React-owned: app/Inside.tsx renders the whole of
  // #inside. The stage selection it shares with the rail is React state (app/stageSelection.ts); this script only
  // persists it (see the `karst:persistSel` listener) and opens the console overlay it asks for.

  // The blocked banner (app/BlockedBanner.tsx, with the usage-limit park actions and the baseline review) and the
  // stage rail (app/Rail.tsx) are React-owned. The header's ship surface (app/ShipControls.tsx) is too; the ship
  // and merge requests they share with the rail and the PR panel live in app/pendingOps.ts and settle from the
  // host's state pushes there.

  // The Servers panel is React-owned (app/ServersPanel.tsx); see the `karst:*` seam listeners below.
  const svgIcon = (name, size) => (
    karstIcon(name, size)
  );

  // The Pull requests panel is React-owned (app/PrsPanel.tsx); its Send CI failure shares the Inside stage menu's in-flight
  // request through the `karst:prBegin` / `karst:prPending` seam below.

  // The header (identity, parent relations, agent popover, ship and wait chips, the "..." menu, Detach, Close and
  // Reopen) is React-owned: app/Header.tsx. The seam events it uses are listened to below.

  // TRANSITIONAL SEAM (removed in Phase 12): the header popovers are React's, so closing them is an event. Vanilla
  // controls and clicks inside the other React islands call this exactly as they called the old DOM version.
  function closePopovers() {
    window.dispatchEvent(new CustomEvent('karst:closePopovers'));
  }

  // Transition rule: the React island (#root, marked data-react-owned) owns its own
  // events. Every document-level delegator below must ignore events from inside it,
  // otherwise a control React already handled would be handled a second time here.
  // `.svpanel`, `.prpanel`, `#subtaskPanel`, `#artPanel`, `#storedPanel`, `.dhead`, `#headerMeta`, `#rail`, `#blocked` and `#inside` are
  // islands too: their regions' parity snapshots pin the roots without any data-* attribute, so they cannot carry
  // data-react-owned. All go with the vanilla script (Phase 12).
  function inReactIsland(e) {
    const t = e.target;
    return !!(t && t.closest && t.closest('[data-react-owned], .svpanel, .prpanel, #subtaskPanel, #artPanel, #storedPanel, .dhead, #headerMeta, #rail, #blocked, #inside'));
  }
  // A click inside another island is outside every header popover, so it dismisses them like any outside click. The
  // header decides its own clicks (a trigger toggles; a click inside a popover keeps it open).
  function closePopoversFromIsland(e) {
    if (inReactIsland(e) && !e.target.closest('.dhead, #headerMeta')) closePopovers();
  }
  document.addEventListener('click', (e) => {
    closePopoversFromIsland(e); if (inReactIsland(e)) return;
    closePopovers();
  });
  // The header's ticket-data preview button (React): the drawer is a page overlay (Phase 11); it remembers the focused trigger.
  window.addEventListener('karst:openTicketData', () => openTicketData());

  // ---- ticket-data preview drawer ----
  // A pure webview-local surface: the brief and description already ride
  // DashboardState, so opening it posts nothing and needs no host ack (UI-R31
  // — no verdict is invented, there is simply no round trip). Focus moves into
  // the dialog on open and returns to the trigger on close, per the
  // modal-dialog contract.
  let ticketDataTrigger = null;
  // Compose the drawer's body. The fetched brief is the rich provider context
  // (title/description/details) and wins verbatim when present. A manual
  // ticket has NO brief — even one bound to a provider via "Create in ClickUp"
  // (binding sets sourceRef/ticketUrl, never brief) — so fall back to the
  // ticket's own data: heading + the user's prompt. textContent, never
  // innerHTML: brief and description are user/provider-authored, so they are
  // data, not structure.
  function ticketDataText(state) {
    const brief = (state.brief || '').trim();
    if (brief) return brief;
    const heading = [state.key || `#${state.ticketId}`, state.title]
      .filter((v) => v)
      .join(' — ');
    const lines = [`# ${heading}`];
    const prompt = (state.description || '').trim();
    if (prompt) lines.push('', prompt);
    return lines.join('\n');
  }
  function openTicketData() {
    const state = lastState;
    if (!state) return;
    const body = el('ticketDataBody');
    body.textContent = ticketDataText(state);
    ticketDataTrigger = document.activeElement;
    el('ticketDataScrim').classList.add('open');
    el('ticketDataDrawer').classList.add('open');
    el('ticketDataDrawer').setAttribute('aria-hidden', 'false');
    el('ticketDataClose').focus();
  }
  function closeTicketData() {
    el('ticketDataScrim').classList.remove('open');
    el('ticketDataDrawer').classList.remove('open');
    el('ticketDataDrawer').setAttribute('aria-hidden', 'true');
    if (ticketDataTrigger && ticketDataTrigger.focus) ticketDataTrigger.focus();
  }
  el('ticketDataClose').addEventListener('click', closeTicketData);
  el('ticketDataScrim').addEventListener('click', closeTicketData);

  // ---------------------------------------------------------------------
  // Artifacts: shelf, index, detail (docs/design/artifacts/README.md)
  // ---------------------------------------------------------------------

  // The origin chip, ONE closed shape on every artifact surface (shelf card,
  // index row, detail's Produced-by row). The mark is a secondary carrier;
  // the LABEL is the identity (UI-R28) — never an icon alone. Native:
  // `<core icon> <Core> · Native`; karst: `<karst mark> Karst[ · <Core>]`.
  // The karst mark is the CURRENT monochrome silhouette (media/karst-mark.svg,
  // viewBox 0 0 215 215 — the old three-node graph is gone; see
  // brandAssets.test.ts), inlined because the webview CSP forbids external
  // assets. It is a PRODUCT-IDENTITY exception, not an interaction icon — it
  // stays outside the Tabler catalog (docs/ui/ICONS.md §5).
  const KARST_MARK =
    '<svg class="kmark" viewBox="0 0 215 215" aria-hidden="true" focusable="false">'
    + '<path d="M 96 20 L 25 67 L 25 156 L 98 203 L 98 180 L 44 145 L 44 78 L 97 44 Z" fill="currentColor"/>'
    + '<path d="M 151 42 L 138 58 L 170 78 L 170 144 L 138 165 L 150 180 L 188 156 L 188 67 Z" fill="currentColor"/>'
    + '<circle cx="106.5" cy="111.5" r="26.5" fill="currentColor"/></svg>';

  function originChip(origin) {
    const o = origin || { kind: 'karst', core: null };
    const coreLabel = o.core && AGENT_PROVIDER_LABELS[o.core]
      ? AGENT_PROVIDER_LABELS[o.core]
      : (o.core || '');
    if (o.kind === 'native') {
      return '<span class="art-origin"'
        + ` aria-label="${esc(coreLabel + ' native artifact')}">`
        + `${agentIconHtml(o.core)}<span>${esc(coreLabel)} · Native</span></span>`;
    }
    const label = o.core ? `Karst · ${coreLabel}` : 'Karst';
    return '<span class="art-origin"'
      + ` aria-label="${esc(o.core ? 'karst artifact for ' + coreLabel : 'karst artifact')}">`
      + `${KARST_MARK}<span>${esc(label)}</span></span>`;
  }

  // Workflow-state word, mirroring the rail's domain wording — never a
  // "status" label glued beside the semantic title (UI-R28b keeps the glyphs
  // icon-only; here the WORD is the carrier, so it is text).
  const ART_STATUS_WORD = {
    passed: 'Passed', failed: 'Failed', attention: 'Needs attention', info: 'In progress',
  };
  const ART_STATUS_CLASS = {
    passed: 'passed', failed: 'failed', attention: 'attention', info: 'info',
  };

  function artifactStatusHtml(a) {
    const word = ART_STATUS_WORD[a.status] || a.status;
    return `<span class="art-status ${ART_STATUS_CLASS[a.status] || 'info'}">${esc(word)}</span>`;
  }

  function artifactStaleHtml(a) {
    return a.freshness === 'stale'
      ? '<span class="art-stale" title="No longer validates the current implementation">Stale</span>'
      : '';
  }

  // The index: artifacts grouped by producing stage, empty groups omitted
  // (spec §10). Rows are real buttons (UI-R09), each carrying its semantic
  // name, one useful summary line, status/staleness and the origin chip.
  function renderArtIndex(state) {
    const all = state.artifacts || [];
    const groups = ['impl', 'uat', 'review', 'ship']
      .map((stage) => ({ stage, items: all.filter((a) => a.stage === stage) }))
      .filter((g) => g.items.length > 0);
    const rows = (g) => g.items.map((a) =>
      `<li><button type="button" class="artrow" data-art-open="${esc(a.id)}">`
      + `<span class="artrow-body"><span class="artrow-title">${esc(a.title)}</span>`
      + `<span class="artrow-summary">${esc(a.summary)}</span></span>`
      + `${artifactStatusHtml(a)}${artifactStaleHtml(a)}${originChip(a.origin)}`
      + `<span class="arw" aria-hidden="true">›</span></button></li>`).join('');
    const header = state.key ? `${esc(state.key)} · ${esc(state.title || '')}` : esc(state.title || '');
    return `<div class="arthead">`
      + `<button type="button" class="k-btn k-btn--ghost k-btn--sm" data-art="back" title="Return to the ticket dashboard">← Ticket</button>`
      + `<h2>${header}</h2>`
      + `<span class="artsub">Artifacts · ${all.length}</span></div>`
      + groups.map((g) =>
        `<section class="artgroup" aria-label="${esc((ART_STAGE_LABEL[g.stage] || g.stage))} artifacts">`
        + `<div class="artgroup-title">${esc(ART_STAGE_LABEL[g.stage] || g.stage)}</div>`
        + `<ul class="artrows">${rows(g)}</ul></section>`).join('');
  }

  // ---- Stored artifacts (T2 store) ---------------------------------------
  // Grouped kind → approach. Every action carries the STORE path and revision
  // shas only; the host re-resolves both (ops/storedArtifactOps.ts).
  function storedWhen(iso) {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? '' : d.toLocaleString();
  }

  function storedRowHtml(r) {
    const btn = (act, label, extra, title) =>
      `<button type="button" class="k-btn k-btn--ghost k-btn--sm" data-act="${act}" data-path="${esc(r.path)}"${extra || ''} title="${esc(title)}">${label}</button>`;
    const revs = r.history.map((h, i) => {
      const older = r.history[i + 1];
      return `<li class="sa-rev"><span class="sa-meta">${esc(storedWhen(h.at))}</span><span class="sa-chip">${esc(h.source)}</span>`
        + btn('stored-artifact-open', 'Open', ` data-sha="${esc(h.sha)}"`, 'Open this revision read-only')
        + (older ? btn('stored-artifact-diff', 'Diff vs previous', ` data-from="${esc(older.sha)}" data-to="${esc(h.sha)}"`, 'Show changes since the previous revision') : '')
        + `</li>`;
    }).join('');
    return `<li class="sa-row"><div class="sa-main"><span class="sa-path">${esc(r.repo)} / ${esc(r.relPath)}</span>`
      + `<span class="sa-chip">${esc(r.approach)}</span><span class="sa-chip">${esc(r.source)}</span>`
      + `<span class="sa-meta">${Number(r.revisions)} revision${Number(r.revisions) === 1 ? '' : 's'} · ${esc(storedWhen(r.lastAt))}</span></div>`
      + `<div class="sa-main">${btn('stored-artifact-open', 'Open latest', ` data-sha="${esc(r.latestSha)}"`, 'Open the latest revision read-only')}`
      + `${btn('stored-artifact-live', 'Open live file', '', 'Open the worktree file, if it still exists')}</div>`
      + `<details class="sa-hist"><summary>History</summary><ul class="artrows">${revs}</ul></details></li>`;
  }

  function renderStoredView(state) {
    const v = state.storedArtifacts;
    const header = state.key ? `${esc(state.key)} · ${esc(state.title || '')}` : esc(state.title || '');
    const head = `<div class="arthead">`
      + `<button type="button" class="k-btn k-btn--ghost k-btn--sm" data-art="back" title="Return to the ticket dashboard">← Ticket</button>`
      + `<h2>${header}</h2><span class="artsub">Artifacts · ${v ? Number(v.total) : 0}</span>`
      + `<span class="sa-bar"><button type="button" class="k-btn k-btn--ghost k-btn--sm" data-act="stored-artifact-reveal" title="Check out the latest files read-only and show the folder">Reveal folder</button>`
      + `<button type="button" class="k-btn k-btn--ghost k-btn--sm" data-act="stored-artifact-purge" title="Delete every stored revision for this ticket">Purge artifacts</button></span></div>`;
    if (!v) return head + `<p class="sa-empty">Loading…</p>`;
    const globs = v.globs.length
      ? `Watching: ${v.globs.map((g) => `<code>${esc(g)}</code>`).join(', ')}.`
      : 'No outputs globs are configured for the enabled approaches.';
    const groups = v.total === 0
      ? `<p class="sa-empty">No artifacts captured yet. ${globs}</p>`
      : v.groups.map((g) =>
        `<section class="artgroup" aria-label="${esc(g.kind)} artifacts"><div class="artgroup-title">${esc(g.kind)}</div>`
        + g.approaches.map((a) =>
          `<div class="sa-meta">${esc(a.approach)}</div><ul class="artrows">${a.rows.map(storedRowHtml).join('')}</ul>`).join('')
        + `</section>`).join('');
    const skips = v.skips.length
      ? `<section class="artgroup" aria-label="Skipped files"><div class="artgroup-title">Skipped files</div>`
        + v.skips.map((k) => `<div class="sa-skip">${esc(k.path)} — ${esc(k.reason)}</div>`).join('') + `</section>`
      : '';
    return head + groups + skips;
  }

  const ART_STAGE_LABEL = { impl: 'Implement', uat: 'UAT', review: 'Review', ship: 'Ship' };

  function artifactMetricsHtml(a) {
    if (!a.metrics || !a.metrics.length) return '';
    return `<div class="artmetrics">${a.metrics.map((m) =>
      `<span class="artmetric"><span class="am-label">${esc(m.label)}</span>${esc(m.value)}</span>`
    ).join('')}</div>`;
  }

  function artifactFindingsHtml(a) {
    if (!a.findings || !a.findings.length) return '';
    // Compute distinct repos from the unfiltered findings
    const repos = [];
    for (const f of a.findings) {
      if (f.repo && !repos.includes(f.repo)) repos.push(f.repo);
    }
    // Validate artFindingRepo against current findings
    if (artFindingRepo && !repos.includes(artFindingRepo)) artFindingRepo = null;
    const shown = artFindingRepo === null ? a.findings : a.findings.filter((f) => f.repo === artFindingRepo);
    // Chip row when 2+ repos
    let scope = '';
    if (repos.length >= 2) {
      const chip = (label, value, active, title) =>
        `<button type="button" class="sev-scope-chip${active ? ' active' : ''}"`
        + ` data-act="artifact-findings-repo"`
        + ` data-repo="${value === null ? '' : esc(value)}"`
        + ` aria-pressed="${active ? 'true' : 'false'}"`
        + ` title="${esc(title)}">${esc(label)}</button>`;
      scope = `<div class="findings-scope art-scope" role="group" aria-label="Scope findings to one repository">`
        + chip('All', null, artFindingRepo === null, 'Show findings from every repository')
        + repos.map((r) => {
          const name = r.split('/').pop() || r;
          return chip(name, r, artFindingRepo === r,
            'Show only findings recorded against ' + r);
        }).join('')
        + `</div>`;
    }
    const items = shown.map((f) =>
      `<div class="artfinding ${esc(f.severity || '')}">`
      + `<div class="af-title">${esc(f.severity.toUpperCase())} · ${esc(f.title)}</div>`
      + (f.detail ? `<div class="af-detail">${esc(f.detail)}</div>` : '')
      + (f.file
        ? `<div class="af-detail">${f.action
          ? `<a class="obj-link file-link" href="#" data-act="inside-action"`
            + ` data-action-id="${esc(f.action.actionId)}"`
            + ` title="Open this file in an editor">${esc(f.file)}${f.line != null ? `:${esc(String(f.line))}` : ''}</a>`
          : esc(f.file) + (f.line != null ? `:${esc(String(f.line))}` : '')}</div>`
        : '')
      + `</div>`).join('');
    return `<section class="artsection" aria-label="Findings"><div class="artheading">Findings</div>${scope}${items}</section>`;
  }

  const BASELINE_STATE_WORD = { pending: '○ Needs review', approved: '✓ Approved', rejected: '✕ Rejected' };
  const BASELINE_STATUS_WORD = { added: 'new file', modified: 'modified', deleted: 'deleted' };

  // The UAT report only LISTS the baselines and what was decided — read-only.
  function artifactBaselinesHtml(a) {
    if (!a.baselines || !a.baselines.length) return '';
    const items = a.baselines.map((r) =>
      `<li class="blline"><span class="bl-label">${esc(r.path)}</span>`
      + `<span class="bl-status">${esc(BASELINE_STATUS_WORD[r.status] || r.status)}</span>`
      + `<span class="blstate ${esc(r.decision)}">${esc(BASELINE_STATE_WORD[r.decision] || r.decision)}</span>`
      + (r.decision === 'rejected' && r.reason ? `<span class="bl-status">${esc(r.reason)}</span>` : '')
      + `</li>`).join('');
    return `<section class="artsection" aria-label="Visual baselines"><div class="artheading">Visual baselines</div>`
      + `<ul class="artfiles">${items}</ul></section>`;
  }

  function artifactGatesHtml(a) {
    if (!a.gates || !a.gates.length) return '';
    // The console (xterm) entry: a gate stage's artifact log is previewed in
    // the terminal "detailed mode" — the same data-console stage the inside
    // gates row carries, resolved host-side from the stage's artifactPath. Only
    // the gate stages (uat/review) record a log, so only they offer it.
    const consoleBtn = a.stage === 'uat' || a.stage === 'review'
      ? `<button type="button" class="k-iconbtn ib t-open" data-act="${CONSOLE_ACT}"`
        + ` data-console="${esc(a.stage)}"`
        + ` aria-label="View this stage's console output in the dashboard"`
        + ` title="View this stage's console output in the dashboard">${svgIcon('terminal-2')}</button>`
      : '';
    const rows = a.gates.map((g) => {
      // Each gate's outcome is a COLOURED STATE — green pass / red fail — not
      // a text label: the dot carries the state (UI-R28 keeps the word as its
      // accessible name), and the exit code stays as the row's detail.
      const state = g.exitCode === 0 ? 'pass' : g.exitCode === null ? 'note' : 'fail';
      const word = state === 'pass' ? 'passed' : state === 'fail' ? 'failed' : 'no script';
      return `<div class="artgate"><span class="ag-state ${state}">`
        + `<span class="ag-dot" role="img" aria-label="${esc(word)}"></span></span>`
        + `<span class="ag-name">${esc(g.name)}</span>`
        + `<span class="ag-code">${g.exitCode === null ? 'no script' : `exit ${esc(String(g.exitCode))}`}</span></div>`;
    }).join('');
    return `<section class="artsection" aria-label="Gate runs">`
      + `<div class="artheading">Gate runs${consoleBtn ? `<span class="sp">${consoleBtn}</span>` : ''}</div>`
      + `${rows}</section>`;
  }

  // A repo's display name: its last path segment (trailing slash ignored). The
  // full path stays available as the hover title — never dropped.
  function repoName(path) {
    const parts = String(path || '').split('/').filter(Boolean);
    return parts.length ? parts[parts.length - 1] : String(path || '');
  }
  function repoHtml(path) {
    return `<span class="af-repo" title="${esc(path)}">${esc(repoName(path))}</span>`;
  }

  function artifactPrsHtml(a) {
    if (!a.prs || !a.prs.length) return '';
    const rows = a.prs.map((p) => {
      // The PR number IS the open-PR control (UI-R09c) — a link, never inert
      // text beside a duplicate button, so the redundant "Open PR" button is
      // gone. With no url the number stays plain text and the status word
      // carries the row.
      const number = p.number
        ? (p.url
          ? `<a class="obj-link pr-link" href="#" data-act="open-pr" data-url="${esc(p.url)}"`
            + ` title="Open this pull request on the host">#${esc(String(p.number))}</a>`
          : `<span class="pr-link">#${esc(String(p.number))}</span>`)
        : '';
      return `<li>${repoHtml(p.repo)}${number ? `<span class="af-ref">${number}</span>` : ''}`
        + (p.status ? `<span class="pr-status ${esc(p.status)}">${esc(p.status)}</span>` : '')
        + `</li>`;
    }).join('');
    return `<section class="artsection" aria-label="Pull requests"><div class="artheading">Pull requests</div><ul class="artfiles">${rows}</ul></section>`;
  }

  function artifactCommitsHtml(a) {
    if (!a.commits || !a.commits.length) return '';
    const rows = a.commits.map((c) => {
      // The commit SHA IS the open-commit control (UI-R09c) — a link when the
      // host attached the capability, plain text when it did not.
      const sha = c.action
        ? `<a class="obj-link commit-link" href="#" data-act="inside-action"`
          + ` data-action-id="${esc(c.action.actionId)}" title="Open this commit on the host">${esc(c.sha.slice(0, 7))}</a>`
        : `<span class="commit-sha">${esc(c.sha.slice(0, 7))}</span>`;
      const msg = c.message
        ? `<span class="af-msg">${esc(c.message)}</span>`
        : `<span class="af-msg af-msg--empty">No message</span>`;
      const tag = c.origin === 'before-ship'
        ? `<span class="commit-origin" title="Already on the branch before ship ran">existing</span>` : '';
      return `<li>${sha}${msg}${repoHtml(c.repo)}${tag}</li>`;
    }).join('');
    return `<section class="artsection" aria-label="Commits"><div class="artheading">Commits</div><ul class="artfiles">${rows}</ul></section>`;
  }

  // The plan artifact's task list: each node of the plan with its current
  // progress. The status is a COLOURED STATE (the shipped `.k-dot` primitive,
  // gap G1) with the state word only as the dot's accessible name (UI-R28) —
  // the task LABEL is the visible carrier, exactly like the gate rows.
  const ART_TASK_STATUS = {
    todo: { cls: 'todo', word: 'to do' },
    doing: { cls: 'doing', word: 'in progress' },
    done: { cls: 'done', word: 'done' },
    blocked: { cls: 'blocked', word: 'blocked' },
    cancelled: { cls: 'cancelled', word: 'cancelled' },
  };

  // One resource's editor-open control: id + INDEX into a.resources, never a path.
  function artifactResourceBtnHtml(a, r, i, cls, text) {
    return `<button type="button" class="${cls}" data-act="artifact-open-resource"`
      + ` data-artifact-id="${esc(a.id)}" data-index="${i}"`
      + ` title="Open ${esc(r.label)} (${esc(r.name)}) in the editor">${text}</button>`;
  }

  function artifactTasksHtml(a) {
    if (!a.tasks || !a.tasks.length) return '';
    const rows = a.tasks.map((t) => {
      const state = ART_TASK_STATUS[t.status] || ART_TASK_STATUS.todo;
      const own = (a.resources || []).map((r, i) => (r.taskId === t.id
        ? artifactResourceBtnHtml(a, r, i, 'k-btn k-btn--secondary k-btn--sm', `${esc(r.label)} ↗`) : ''))
        .join('');
      return `<div class="arttask">`
        + `<span class="at-state ${state.cls}"><span class="at-dot" role="img" aria-label="${esc(state.word)}"></span></span>`
        + `<span class="at-label">${esc(t.label)}</span>`
        + `<span class="at-kind">${esc(t.kind)}${t.visits ? ` · ${esc(t.visits)}` : ''}</span>`
        + (own ? `<span class="at-files">${own}</span>` : '') + `</div>`;
    }).join('');
    return `<section class="artsection" aria-label="Plan tasks"><div class="artheading">Tasks</div>${rows}</section>`;
  }

  // The AI process's console entry on a report: the same terminal button the
  // inside ledger's Tester/Review row carries, beside the provenance that
  // names who produced the report. Availability is HOST-DERIVED — rendered
  // only from `a.agentConsole` (UI-R31), which names the process whose tail
  // the host can serve, and never guessed from the stage.
  const AGENT_CONSOLE_LABEL = { tester: 'Tester', review: 'Reviewer' };
  function agentConsoleBtnHtml(a) {
    const proc = a.agentConsole;
    if (!proc || (a.stage !== 'uat' && a.stage !== 'review')) return '';
    const label = `View the ${AGENT_CONSOLE_LABEL[proc] || proc}'s console output in the dashboard`;
    return `<button type="button" class="k-iconbtn ib t-open" data-act="${CONSOLE_ACT}"`
      + ` data-console="${esc(a.stage)}" data-console-proc="${esc(proc)}"`
      + ` aria-label="${esc(label)}" title="${esc(label)}">${svgIcon('terminal-2')}</button>`;
  }

  // Detail is SEMANTIC-FIRST, files LAST (spec §11): the result, the metrics,
  // artifact-specific content, then provenance, then the raw files with their
  // explicit "Open in editor" escape into VS Code (spec §12). Opening is a
  // host round trip through artifact-open-resource — never automatic.
  function artifactDetailHtml(a, from) {
    const backLabel = from === 'index' ? '← Artifacts' : '← Ticket';
    const backTitle = from === 'index'
      ? 'Return to the artifacts index' : 'Return to the ticket dashboard';
    const own = (a.resources || []).map((r, i) => ({ r, i })).filter((x) => x.r.taskId === null);
    const filesTitle = a.kind === 'plan' ? 'Plan files' : 'Underlying files';
    const files = own.length
      ? `<section class="artsection" aria-label="${filesTitle}"><div class="artheading">${filesTitle}</div><ul class="artfiles">`
        + own.map(({ r, i }) =>
          `<li><span class="af-label">${esc(r.label)}</span><span class="af-name">${esc(r.name)}</span>`
          + artifactResourceBtnHtml(a, r, i, 'k-btn k-btn--secondary k-btn--sm', 'Open in editor ↗')
          + `</li>`).join('')
        + `</ul></section>`
      : '';
    return `<div class="arthead">`
      + `<button type="button" class="k-btn k-btn--ghost k-btn--sm" data-art="back" title="${backTitle}">${backLabel}</button></div>`
      + `<div class="artdetail">`
      + `<div class="arthero"><span class="art-title">${esc(a.title)}</span>`
      + `${artifactStatusHtml(a)}${artifactStaleHtml(a)}</div>`
      + `<div class="artcard-summary">${esc(a.summary)}</div>`
      + (a.freshness === 'stale'
        ? `<p class="art-stale art-stale-note">Implementation changed after this verification — rerun the stage before treating this result as evidence for the current code.</p>`
        : '')
      + artifactMetricsHtml(a)
      + artifactTasksHtml(a)
      + artifactBaselinesHtml(a)
      + artifactFindingsHtml(a)
      + artifactGatesHtml(a)
      + artifactPrsHtml(a)
      + artifactCommitsHtml(a)
      + `<section class="artsection" aria-label="Details"><div class="artheading">Details</div><div class="artmeta">`
      + `<span class="am-key">Stage</span><span>${esc(ART_STAGE_LABEL[a.stage] || a.stage)}</span>`
      + `<span class="am-key">Produced by</span><span class="am-origin">${originChip(a.origin)}${agentConsoleBtnHtml(a)}</span>`
      + `<span class="am-key">Version</span><span>${esc(a.currentVersionLabel || '')} · ${a.freshness}</span>`
      + (a.createdAt
        ? `<span class="am-key">Created</span><span>${esc(new Date(a.createdAt).toLocaleString())}</span>` : '')
      + `</div></section>`
      + files
      + `</div>`;
  }

  // The index/detail surface: renders into #artView and swaps the dashboard
  // body via body.art-nav, so the SAME webview hosts all three surfaces (spec
  // §7 — no second Karst tab, no drawer, no split).
  function renderArtView() {
    const box = el('artView');
    if (!box) return;
    if (!artView || !lastState) {
      box.classList.add('hidden');
      box.innerHTML = '';
      document.body.classList.remove('art-nav');
      return;
    }
    box.classList.remove('hidden');
    document.body.classList.add('art-nav');
    if (artView === 'stored') {
      box.innerHTML = renderStoredView(lastState);
    } else if (artView === 'index') {
      box.innerHTML = renderArtIndex(lastState);
    } else {
      const a = (lastState.artifacts || []).find((x) => x.id === artView.id);
      // A stale view state (the artifact vanished — evidence was deleted):
      // fall back to the index rather than rendering a dead detail.
      if (!a) { artView = 'index'; box.innerHTML = renderArtIndex(lastState); return; }
      // Reset the findings repo filter when switching artifacts
      if (artViewId !== a.id) { artFindingRepo = null; artViewId = a.id; }
      box.innerHTML = artifactDetailHtml(a, artView.from);
    }
  }

  // The terminal's colors resolve the DESIGN TOKENS the host already injected
  // (UI-R04): background/foreground come from the editor's own colors, so
  // their contrast is the theme's contract (UI-R29). The ANSI 16 ramp stays
  // xterm's standard palette. `getComputedStyle` resolves the var(--vscode-*)
  // chains to concrete values inside the webview.
  function termTokens() {
    const cs = typeof getComputedStyle === 'function'
      ? getComputedStyle(document.documentElement)
      : null;
    const tok = (name, fallback) => (cs && cs.getPropertyValue(name).trim()) || fallback;
    return {
      bg: tok('--k-bg', '#1e1e1e'),
      fg: tok('--k-text', '#cccccc'),
      cursor: tok('--k-focus', '#3794ff'),
      selection: tok('--k-surface-selected', 'rgba(127,127,127,.4)'),
      font: tok('--k-font-mono', 'monospace'),
      size: parseFloat(tok('--k-text-base', '')) || 13,
    };
  }

  function termTheme(t) {
    return {
      background: t.bg,
      foreground: t.fg,
      cursor: t.cursor,
      selectionBackground: t.selection,
    };
  }

  // The console surface: full-body swap via body.term-nav, exactly like the
  // artifact surface. Rendered ONLY on open/close — render() never calls this,
  // so a state push (up to one a second while running) cannot recreate
  // #termHost out from under the live Terminal instance.
  function renderTermView() {
    const box = el('termView');
    if (!box) return;
    if (!termView) {
      box.classList.add('hidden');
      box.innerHTML = '';
      document.body.classList.remove('term-nav');
      return;
    }
    box.classList.remove('hidden');
    document.body.classList.add('term-nav');
    const title = termProcess ? (termProcess === 'tester' ? 'Tester' : 'Review') : (STAGE_TITLE[termView] || termView);
    box.innerHTML = `<div class="thead"><span class="ttitle">Console · ${esc(title)}</span>`
      + `<span class="sp"><button type="button" class="k-btn k-btn--ghost k-btn--sm" data-term="close"`
      + ` title="Close the console view">Close</button></span></div>`
      + `<div class="tstatus" id="tstatus" role="status">${esc(termLoading ? 'Loading console output…' : '')}</div>`
      + `<div id="termHost" class="termhost"></div>`;
    initTerminal();
  }

  // A real <button> Console entry (UI-R09) posting the closed-vocabulary
  // stage-log-request (or, for a process console, agent-log-request); the
  // host's answer is the outcome (UI-R13). `processId` (optional) narrows the
  // surface to ONE gate-lane AI process's console; absent → the stage console.
  function openTerminal(stage, processId) {
    if (termView === stage && termProcess === (processId || null) && term) return;
    if (termView) closeTerminal();
    termView = stage;
    termProcess = processId || null;
    termLoading = true;
    termBlurbed = false;
    if (xtermState === 'absent') {
      xtermState = 'loading';
      karstSend.xtermRequest();
    }
    renderTermView();
    if (processId) karstSend.agentLogRequest(processId);
    else karstSend.stageLogRequest(stage);
  }

  function closeTerminal() {
    if (term) { try { term.dispose(); } catch (e) { /* renderer teardown */ } term = null; }
    termFit = null;
    if (termResize) { termResize.disconnect(); termResize = null; }
    termView = null;
    termProcess = null;
    termLoading = false;
    termPending = '';
    termBlurbed = false;
    renderTermView();
  }

  // Replace a refusal blurb with a live terminal: the console was refused (no
  // recorded artifact yet) and output has since started arriving. Rebuilds the
  // view's host and a fresh Terminal; the refused answer's text is gone
  // because it described a record that did not exist.
  function restoreTerminal() {
    if (term) { try { term.dispose(); } catch (e) { /* renderer teardown */ } term = null; }
    termFit = null;
    if (termResize) { termResize.disconnect(); termResize = null; }
    termBlurbed = false;
    renderTermView();
  }

  // ---------------------------------------------------------------------
  // Env overrides: one editor for every service of the ticket
  // ---------------------------------------------------------------------
  // The all-services scope. Mirrors ALL_SERVICES in store/ticketEnvOverrides.ts
  // — a mirrored constant is behavior (UI-INVARIANTS), so the two must move
  // together: `*` cannot be a manifest repository name, which is what keeps a
  // shared entry from ever colliding with a per-service one.
  const ENV_ALL_SERVICES = '*';

  function openEnvOverrides() {
    if (envView) return;
    envView = 'open';
    envDrafts = {};
    envSaved = {};
    renderEnvView();
  }

  function closeEnvOverrides() {
    envView = null;
    envDrafts = {};
    envSaved = {};
    renderEnvView();
  }

  /** One scope's saved value, rendered back as the `.env` text it was typed as. */
  function envTextFor(state, scope) {
    const values = (state.envOverrides && state.envOverrides.values) || {};
    const entries = values[scope] || {};
    return Object.keys(entries).map((k) => k + '=' + entries[k]).join('\n');
  }

  function envScopeSection(state, scope, label, hint) {
    const saved = envTextFor(state, scope);
    const draft = envDrafts[scope];
    const text = draft === undefined ? saved : draft;
    const count = saved ? saved.split('\n').length : 0;
    const dirty = draft !== undefined && draft !== saved;
    const msg = dirty ? 'Unsaved changes' : (envSaved[scope] || '');
    return `<section class="envscope"><header>`
      + `<span class="ename">${esc(label)}</span>`
      + `<span class="ecount">${count ? count + ' variable' + (count === 1 ? '' : 's') : 'none set'}</span>`
      + `</header>`
      + `<div class="ehint">${esc(hint)}</div>`
      + `<label class="sr" for="env-ta-${esc(scope)}">Environment variables for ${esc(label)}</label>`
      + `<textarea id="env-ta-${esc(scope)}" class="k-input" rows="5" spellcheck="false"`
      + ` data-env-scope="${esc(scope)}" placeholder="APP_HISTORY_FEATURE=true">${esc(text)}</textarea>`
      + `<footer>`
      + `<button type="button" class="k-btn k-btn--primary k-btn--sm"`
      + ` data-env-save="${esc(scope)}" title="Save these variables for this ticket">Save</button>`
      + `<button type="button" class="k-btn k-btn--ghost k-btn--sm" data-env-revert="${esc(scope)}"`
      + ` title="Discard unsaved edits to this section">Revert</button>`
      + `<span class="msg" role="status">${esc(msg)}</span>`
      + `</footer></section>`;
  }

  function renderEnvView() {
    const box = el('envView');
    if (!box) return;
    if (!envView || !lastState) {
      box.classList.add('hidden');
      box.innerHTML = '';
      document.body.classList.remove('env-nav');
      return;
    }
    const state = lastState;
    const services = (state.envOverrides && state.envOverrides.services) || [];
    box.classList.remove('hidden');
    document.body.classList.add('env-nav');
    const sections = envScopeSection(
      state,
      ENV_ALL_SERVICES,
      'All services',
      'Applied to every service of this ticket. A service’s own section below wins where both name the same variable.',
    ) + (services.length
      ? services.map((name) => envScopeSection(state, name, name,
          'Applied to ' + name + ' only.')).join('')
      : `<div class="elead">This ticket scopes no runnable service, so only the shared`
        + ` section above applies.</div>`);
    box.innerHTML = `<div class="thead"><span class="ttitle">Environment variables</span>`
      + `<span class="sp"><button type="button" class="k-btn k-btn--ghost k-btn--sm" data-env-close`
      + ` title="Close the environment variables view">Close</button></span></div>`
      + `<div class="ebody"><div class="elead">One <code>KEY=value</code> per line. These`
      + ` extend each service’s own <code>.env</code> and override the keys they name —`
      + ` for this ticket only. The repository’s <code>.env</code> file is never written.`
      + ` Saved values apply the next time the services are started.</div>`
      + sections + `</div>`;
  }

  // Combined server logs: the surface itself (tabs, search, run scoping and
  // ANSI rendering) is the shared `window.createServerLogsView` runtime injected
  // above, included by both this dashboard and the standalone logs panel. The
  // dashboard owns only the open/closed flag and the host request; the view is
  // created once and reused.
  //
  // The shared runtime posts through the `post` it is handed. Route its two
  // messages to the typed senders rather than exposing a raw post: `onClose`
  // carries the normal close, and detach asks the host to open the standalone
  // logs panel.
  function postLogsViewMessage(msg) {
    if (msg && msg.type === 'server-logs-detach') karstSend.serverLogsDetach();
    else if (msg && msg.type === 'server-logs-close') karstSend.serverLogsClose();
  }

  function openServerLogs() {
    if (logsView) return;
    logsView = 'open';
    if (!logsViewInstance && typeof window.createServerLogsView === 'function') {
      logsViewInstance = window.createServerLogsView({
        post: postLogsViewMessage,
        onClose: () => { logsView = null; karstSend.serverLogsClose(); },
      });
    }
    if (!logsViewInstance) { logsView = null; return; }
    logsViewInstance.open();
    karstSend.serverLogsRequest();
  }

  function closeServerLogs() {
    if (logsViewInstance) {
      logsViewInstance.close();
    } else {
      logsView = null;
    }
  }

  // Create the Terminal only on first open of a view. Guarded for the test
  // harness (no real xterm in the VM): an absent library degrades to a visible
  // refusal, never a silent blank.
  function initTerminal() {
    if (term) return;
    if (typeof Terminal === 'undefined' || typeof FitAddon === 'undefined') {
      // Still arriving: the `xterm` answer re-runs this. Anything else is a
      // build without the bundle.
      if (xtermState === 'loading') return;
      const host = el('termHost');
      if (host) host.innerHTML = '<div class="blurb">Console rendering is unavailable in this build.</div>';
      return;
    }
    const t = termTokens();
    const host = el('termHost');
    if (!host) return;
    term = new Terminal({
      convertEol: true,        // the artifact log uses bare \n; xterm expects \r\n
      disableStdin: true,      // a log viewer, never an input surface
      cursorBlink: false,
      scrollback: 10000,       // 1 MiB of output is ~10k+ lines at common widths
      fontFamily: t.font,
      fontSize: t.size,
      theme: termTheme(t),
      allowProposedApi: true,  // FitAddon's addon lifecycle
    });
    termFit = new FitAddon.FitAddon();
    term.loadAddon(termFit);
    term.open(host);
    termFit.fit();
    if (typeof ResizeObserver !== 'undefined' && host) {
      // fit lives on the ADDON, not the terminal — `term.fit` does not exist.
      termResize = new ResizeObserver(() => termFit && termFit.fit());
      termResize.observe(host);
    }
  }

  // Console scrollback is only reachable by wheel otherwise: xterm takes no
  // stdin here (disableStdin), so the keys are free to drive its viewport.
  function scrollTermByKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return false;
    if (e.key === 'PageUp') { term.scrollPages(-1); return true; }
    if (e.key === 'PageDown') { term.scrollPages(1); return true; }
    if (e.key === 'Home') { term.scrollToTop(); return true; }
    if (e.key === 'End') { term.scrollToBottom(); return true; }
    return false;
  }

  function scrollLogsByKey(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return false;
    const host = el('logsHost');
    if (!host) return false;
    const page = Math.max(host.clientHeight - 40, 40);
    if (e.key === 'PageUp') { host.scrollTop -= page; return true; }
    if (e.key === 'PageDown') { host.scrollTop += page; return true; }
    if (e.key === 'Home') { host.scrollTop = 0; return true; }
    if (e.key === 'End') { host.scrollTop = host.scrollHeight; return true; }
    return false;
  }

  // Scroll preservation (spec §9): each surface keeps its own position.
  function artScrollTop() {
    const root = document.documentElement || document.body;
    return typeof root.scrollTop === 'number' ? root.scrollTop : 0;
  }

  function artSaveScroll() {
    if (!artView) artScrolls.ticket = artScrollTop();
    else if (artView === 'index' || artView === 'stored') artScrolls.index = artScrollTop();
    else artScrolls.detail[artView.id] = artScrollTop();
  }

  function artRestoreScroll() {
    const key = !artView ? 'ticket' : (artView === 'index' || artView === 'stored') ? 'index' : 'detail';
    const target = key === 'detail' ? (artScrolls.detail[artView.id] || 0) : artScrolls[key] || 0;
    const root = document.documentElement || document.body;
    root.scrollTop = target;
  }

  function openArtifactIndex() {
    artSaveScroll();
    artView = 'index';
    renderArtView();
    renderEnvView();
    artRestoreScroll();
    persist();
  }

  function openStoredArtifacts() {
    artSaveScroll();
    artView = 'stored';
    renderArtView();
    artRestoreScroll();
    persist();
  }

  function openArtifact(id, from) {
    artSaveScroll();
    artView = { id, from };
    renderArtView();
    artRestoreScroll();
    persist();
  }

  // TRANSITIONAL seam (removed in Phase 12 with the vanilla script): the React Artifacts shelf and Captured
  // artifacts panels are islands the click delegator skips, so they announce what to open as `karst:openArt`
  // and this does what the delegator's data-art / data-art-open branches do for the vanilla surfaces.
  window.addEventListener('karst:openArt', (e) => {
    const d = e.detail;
    if (d.kind === 'index') openArtifactIndex();
    else if (d.kind === 'stored') openStoredArtifacts();
    else if (d.kind === 'artifact') openArtifact(d.id, artView === 'index' ? 'index' : 'ticket');
  });

  // Back is deterministic (spec §7.3): detail→its origin, index→ticket.
  function artifactBack() {
    artSaveScroll();
    if (!artView) return;
    artView = artView === 'index' || artView === 'stored' ? null : (artView.from === 'index' ? 'index' : null);
    renderArtView();
    artRestoreScroll();
    persist();
  }

  // Keyboard focus across a repaint. The host re-pushes the snapshot once a
  // second while a stage is running, and every section is rebuilt by innerHTML
  // assignment, which blurs whatever the user had focused. The action ids are
  // snapshot-scoped, so they cannot identify the same control across two
  // renders — its POSITION among the page's controls plus its own `data-act`
  // can. Restoring only on an exact match is the point: a page whose shape
  // changed must never move focus onto a DIFFERENT control than the one the
  // user was on.
  // An element's own `id` is preferred and is what covers the controls that
  // carry no action at all (the env editor's textarea, for one). Its caret
  // offsets ride along.
  function focusMark() {
    const active = document.activeElement;
    if (!active || !active.getAttribute) return null;
    const id = active.id || '';
    const act = active.getAttribute('data-act') || '';
    if (!id && !act) return null;
    const mark = { id: id, act: act, index: -1, start: null, end: null };
    if (!id) {
      const controls = Array.prototype.slice.call(document.querySelectorAll('[data-act]'));
      mark.index = controls.indexOf(active);
      if (mark.index < 0) return null;
    }
    if (typeof active.selectionStart === 'number') {
      mark.start = active.selectionStart;
      mark.end = active.selectionEnd;
    }
    return mark;
  }

  function restoreFocus(mark) {
    if (!mark) return;
    let target = null;
    if (mark.id) {
      target = document.getElementById(mark.id);
      // An id that came back on a control with a DIFFERENT action is not the
      // same control.
      if (target && mark.act && target.getAttribute('data-act') !== mark.act) target = null;
    } else {
      const controls = Array.prototype.slice.call(document.querySelectorAll('[data-act]'));
      const candidate = controls[mark.index];
      if (candidate && candidate.getAttribute('data-act') === mark.act) target = candidate;
    }
    if (!target) return;
    target.focus();
    if (mark.start !== null && typeof target.setSelectionRange === 'function') {
      try { target.setSelectionRange(mark.start, mark.end); } catch (err) { /* not a text field */ }
    }
  }

  function render(state) {
    const mark = focusMark();
    lastState = state;
    renderArtView();
    restoreFocus(mark);
  }

  const persist = () => vscode.setState({ state: lastState, sel: selectedStage, shipWait: shipWaitSeen, srvFilter: srvFilter, artView: artView, artScrolls: artScrolls });

  // TRANSITIONAL SEAM (removed in Phase 12): React owns the stage selection (the rail and the Inside block share it), but
  // persistence (`vscode.setState`, A3) stays here until the switch-over. React announces the explicit selection and the
  // Ship wait after every change, one way, and the page writes them with the rest of the view state.
  window.addEventListener('karst:persistSel', (e) => {
    selectedStage = e.detail.sel;
    shipWaitSeen = e.detail.shipWait;
    if (lastState) persist();
  });
  // TRANSITIONAL SEAM (removed in Phase 12): the Inside "view console" buttons open the console overlay, which is still
  // a page surface (Phase 11). The page posts the log request, as the old delegated click did.
  window.addEventListener('karst:openTerminal', (e) => openTerminal(e.detail.stage, e.detail.processId));
  // TRANSITIONAL SEAM (removed in Phase 12): the Inside stage menu is React's. The Escape chain below is ordered (drawer,
  // stage menu, console, logs, env, artifact view), so React says whether its menu is open and the chain yields to it.
  let stageMenuOpen = false;
  window.addEventListener('karst:stageMenuOpen', (e) => {
    stageMenuOpen = e.detail === true;
  });

  // The … menu's Edit ticket / Create follow-up items post through the generic
  // delegated `[data-act]` handler below (data-act is set in their markup,
  // above) — the same pending lifecycle every other posting control gets,
  // rather than a bespoke listener.

  // Typing in the env editor is remembered per scope: a state push (a live
  // tick, a server change) re-renders this surface, and a re-render that read
  // only the SAVED value would silently discard an unsaved edit.
  // Delegated from the document, not from `#envView`: the surface is rendered
  // into an element that a partial-DOM host (the render harness) need not have,
  // and a listener bound to a missing element would take the whole script down.
  document.addEventListener('input', (e) => {
    if (inReactIsland(e)) return;
    const ta = e.target.closest && e.target.closest('[data-env-scope]');
    if (!ta) return;
    envDrafts = { ...envDrafts, [ta.dataset.envScope]: ta.value };
    // No re-render: the textarea IS the draft's live rendering, and repainting
    // it under the cursor would move the caret.
  });

  // TRANSITIONAL SEAM (removed in migration Phase 12, with the rest of this script): the React Servers
  // panel (app/ServersPanel.tsx) owns the filter input but never writes vscode.setState, so vanilla keeps
  // `srvFilter` current and persists it. No render: React already shows the value.
  window.addEventListener('karst:srvFilter', (e) => {
    srvFilter = String(e.detail);
    persist();
  });
  // The panel header's Logs and Env buttons open surfaces that still live in this script.
  window.addEventListener('karst:openServerLogs', () => openServerLogs());
  window.addEventListener('karst:openEnvOverrides', () => openEnvOverrides());
  // The artifact view's Back and its row opens, and the console/env surfaces' own buttons. Every Inside control is React's
  // (app/Inside.tsx), as is the stage rail; a control that names a stage no longer exists in the page.
  document.addEventListener('click', (e) => {
    if (inReactIsland(e)) return;
    // Artifact navigation: Back (detail→origin, index→ticket) and opening an artifact from an index row. Local,
    // like stage selection. The shelf and Captured artifacts panels (React) open theirs through karst:openArt.
    const artNav = e.target.closest('[data-art]');
    if (artNav && artNav.dataset.art === 'back') { artifactBack(); return; }
    const artOpen = e.target.closest('[data-art-open]');
    if (artOpen) {
      const from = artView === 'index' ? 'index' : 'ticket';
      openArtifact(artOpen.dataset.artOpen, from);
      return;
    }
    const termBtn = e.target.closest('[data-term]');
    if (termBtn) {
      if (termBtn.dataset.term === 'close') closeTerminal();
      return;
    }
    const envClose = e.target.closest('[data-env-close]');
    if (envClose) {
      closeEnvOverrides();
      return;
    }
    // Revert is purely local: drop the draft and let the saved value render.
    const envRevert = e.target.closest('[data-env-revert]');
    if (envRevert) {
      const scope = envRevert.dataset.envRevert;
      const next = { ...envDrafts };
      delete next[scope];
      envDrafts = next;
      envSaved = { ...envSaved, [scope]: '' };
      renderEnvView();
      return;
    }
    // Save posts the scope and the textarea's body, and settles on the host's
    // own `action-result` like every other mutating control (UI-R13). The draft
    // is kept until the host's state push carries the saved value back, so a
    // refusal never silently discards what the user typed.
    const envSave = e.target.closest('[data-env-save]');
    if (envSave) {
      if (karstIsPending(envSave) || envSave.disabled) return;
      const scope = envSave.dataset.envSave;
      const ta = document.querySelector('[data-env-scope="' + CSS.escape(scope) + '"]');
      const text = ta ? ta.value : '';
      const requestId = karstRequestId();
      karstBeginPending(envSave, requestId);
      envSaveRequests = { ...envSaveRequests, [scope]: requestId };
      karstSend.envOverridesSave(scope, text, requestId);
      return;
    }
  });

  // Esc mirrors one Back step (spec §8): detail → its origin, index → ticket,
  // ticket → no artifact-navigation action. The stage header's ⋯ menu (React) also
  // dismisses on Esc, like any dialog: the chain yields to it at its place in the order.
  document.addEventListener('keydown', (e) => {
    if (inReactIsland(e)) return;
    if (e.key === 'Escape' && el('ticketDataDrawer').classList.contains('open')) { closeTicketData(); e.preventDefault?.(); return; }
    if (e.key === 'Escape' && stageMenuOpen) return;
    if (e.key === 'Escape' && termView) { closeTerminal(); e.preventDefault?.(); return; }
    if (e.key === 'Escape' && logsView) { closeServerLogs(); e.preventDefault?.(); return; }
    if (termView && term && scrollTermByKey(e)) { e.preventDefault?.(); return; }
    if (logsView && scrollLogsByKey(e)) { e.preventDefault?.(); return; }
    if (e.key === 'Escape' && envView) { closeEnvOverrides(); e.preventDefault?.(); return; }
    if (e.key === 'Escape' && artView) { artifactBack(); e.preventDefault?.(); return; }
    // Gate switch keyboard toggle (Space/Enter)
    if ((e.key === ' ' || e.key === 'Enter') && e.target && e.target.closest && e.target.closest('.gateSwitch')) {
      e.preventDefault();
      e.target.closest('.gateSwitch').click();
    }
  });

  // Optimistic feedback for the copy button (UI-R15) — the host does the actual
  // clipboard write, and a webview that cannot confirm a write is not something
  // the user needs to act on (the click is trivially repeatable), so this
  // confirms without waiting for a round trip. Never used for a mutation.
  function flashCopied(btn) {
    const prev = btn.textContent;
    btn.textContent = COPIED_TOAST_TEXT;
    btn.disabled = true;
    setTimeout(() => { btn.textContent = prev; btn.disabled = false; }, 1200);
  }

  /**
   * Typed senders for every action that reaches the generic [data-act] path.
   * Each value posts through a named `karstSend.<name>` constructor from
   * webviewSend.ts — the wire field names live THERE, checked against the host
   * `WebviewMessage` union, so this HTML never spells a message field at all.
   * The map is keyed by the exact `data-act` the renderer emitted.
   */
  const SEND_BY_ACT = {
    'open-pr': (btn, requestId) => karstSend.openPr(btn.dataset.url, requestId),
    'inside-action': (btn, requestId) => karstSend.insideAction(btn.dataset.actionId, requestId),
    'stored-artifact-open': (btn, requestId) => karstSend.storedArtifactOpen(btn.dataset.path, btn.dataset.sha, requestId),
    'stored-artifact-diff': (btn, requestId) => karstSend.storedArtifactDiff(btn.dataset.path, btn.dataset.from, btn.dataset.to, requestId),
    'stored-artifact-live': (btn, requestId) => karstSend.storedArtifactLive(btn.dataset.path, requestId),
    'stored-artifact-reveal': (btn, requestId) => karstSend.storedArtifactReveal(requestId),
    'stored-artifact-purge': (btn, requestId) => karstSend.storedArtifactPurge(requestId),
    'artifact-open-resource': (btn, requestId) => karstSend.artifactOpenResource(btn.dataset.artifactId, Number(btn.dataset.index), requestId),
  };

  // Delegate clicks (buttons + the ticket-link anchor) → action messages
  // (messages.ts routeAction). A no-payload action (e.g. spin-servers) posts
  // just its type.
  //
  // Rows here render by full innerHTML replacement (every `state` push and
  // every `inside-progress` tick calls render()), so a per-element `karstAction`
  // binding — which keys pending state to the ONE element it was bound to —
  // would go stale the instant a re-render swaps that element out from under
  // it. This delegated handler instead calls the runtime's underlying pieces
  // (karstRequestId / karstBeginPending / karstIsPending) directly, the same
  // fix `sidebar` and `diffs` already apply to the same problem, so every
  // control still gets the four required properties: pending on click,
  // non-re-triggerable, a terminal result, and a watchdog.
  //
  // Ship, merge, the PR refresh and the Inside stage menu's recovery actions are the exception, and are React's now
  // (app/pendingOps.ts, app/PrsPanel.tsx, app/InsideMenu.tsx): extension.ts does not await their inner promise (each
  // fires a multi-second-to-multi-minute network operation and returns immediately), so the generic host ack would
  // arrive and settle the control almost instantly — long before the real work finishes. They carry NO requestId on
  // the wire and settle themselves from the next meaningful `state` push instead (§ DESIGN-SYSTEM.md 5.1: a mutating
  // action "settles on the host's result, OR THE NEXT state push").
  document.addEventListener('click', (e) => {
    if (inReactIsland(e)) return;
    const btn = e.target.closest('[data-act]');
    if (!btn) return;
    e.preventDefault();
    const act = btn.dataset.act;

    // The terminal console view: open it and post the closed-vocabulary
    // stage-log-request (or agent-log-request for a process console). No
    // requestId — the host answers with the `stage-log`/`agent-log` message
    // itself (ok or error), which is the terminal outcome (UI-R13).
    // Reads `data-console`: the artifact view's console buttons come through here, the Inside ones through the
    // `karst:openTerminal` seam. A `data-console-proc` narrows the surface to ONE gate-lane AI process's console.
    if (act === CONSOLE_ACT) {
      const stage = btn.dataset.console;
      if (!stage) return;
      openTerminal(stage, btn.dataset.consoleProc);
      return;
    }

    if (act === 'artifact-findings-repo') {
      artFindingRepo = btn.dataset.repo || null;
      renderArtView();
      return;
    }

    // Every other posting control settles on the host's genuine `action-result`
    // ack (UI-R11–R14): pending on click, dropped (not queued) on a repeat,
    // and the runtime's own watchdog covers a host that never answers.
    if (karstIsPending(btn) || btn.disabled) return;
    const requestId = karstRequestId();
    karstBeginPending(btn, requestId);
    // Every posting control on this generic path is one of SEND_BY_ACT's
    // typed senders — the message shape (which fields, what types) is decided
    // in webviewSend.ts, never here. An unmapped act posts nothing rather
    // than a message the host could not parse anyway.
    const send = SEND_BY_ACT[act];
    if (send) send(btn, requestId);
    // Optimistic clipboard confirmation (UI-R15) rides ALONGSIDE the pending
    // state above, not instead of it — the button still reports whatever the
    // host's real ack says, same as every other control.
    if (btn.hasAttribute('data-copy')) flashCopied(btn);
  });

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg) return;
    // The terminal console answer. The host ALWAYS answers a stage-log-request
    // (ok or error) — this message is the terminal outcome (UI-R13). A stale
    // answer for a view that has since closed (or moved to another stage) is
    // dropped, not rendered.
    // The lazily delivered xterm bundle (see `xtermState`). Appended as an
    // inline script carrying this page's nonce — the only script the CSP runs.
    // `js: null` means the host has no bundle: the console degrades to its
    // visible refusal. A console still open gets its terminal now, with any
    // output that arrived while the bundle was in flight.
    if (msg.type === 'xterm') {
      if (typeof msg.js === 'string' && msg.js) {
        const script = document.createElement('script');
        const tagged = document.querySelector('script[nonce]');
        script.nonce = tagged ? tagged.nonce : '';
        script.textContent = msg.js;
        document.head.appendChild(script);
      }
      xtermState = typeof Terminal !== 'undefined' ? 'ready' : 'failed';
      if (termView && !termBlurbed) {
        initTerminal();
        if (term && termPending) {
          term.write(termPending);
          termPending = '';
        }
      }
      return;
    }
    if (msg.type === 'stage-log') {
      if (!termView || termView !== msg.stage || termProcess) return;
      termLoading = false;
      const status = el('tstatus');
      if (msg.result.kind === 'ok') {
        if (status) status.textContent = msg.result.truncated ? 'Console output truncated' : '';
        if (term) term.write(msg.result.content);
        else if (xtermState === 'loading') termPending = msg.result.content + termPending;
      } else {
        if (status) status.textContent = '';
        const host = el('termHost');
        if (host) host.innerHTML = `<div class="blurb">${esc(msg.result.message)}</div>`;
        termBlurbed = true;
      }
      // Flush live gate chunks that raced this answer (buffered below), so the
      // open console never skips output that arrived while it was in flight.
      if (termPending && term) {
        term.write(termPending);
        termPending = '';
      }
      return;
    }
    // The AGENT console answer (the UAT Tester / Review findings lane): same
    // contract as stage-log, matched against the open PROCESS — a stale answer
    // for a console that closed or switched processes is dropped.
    if (msg.type === 'agent-log') {
      if (!termView || !termProcess || termProcess !== msg.processId) return;
      termLoading = false;
      const status = el('tstatus');
      if (msg.result.kind === 'ok') {
        if (status) status.textContent = msg.result.truncated ? 'Console output truncated' : '';
        if (term) term.write(msg.result.content);
        else if (xtermState === 'loading') termPending = msg.result.content + termPending;
      } else {
        if (status) status.textContent = '';
        const host = el('termHost');
        if (host) host.innerHTML = `<div class="blurb">${esc(msg.result.message)}</div>`;
        // The refusal REPLACED the terminal, exactly as the stage console's
        // does: recorded so a later live chunk can swap it back for a real
        // terminal instead of writing into a host that is off the page.
        termBlurbed = true;
      }
      // Flush chunks that raced the persisted tail (buffered above), so the
      // open console never silently skips live output that arrived while the
      // answer was in flight.
      if (termPending && term) {
        term.write(termPending);
        termPending = '';
      }
      return;
    }
    // A live chunk of the open agent console's output: appended to the terminal
    // ONLY while that process's console is the open surface. The text is
    // already sanitized and bounded host-side. While the initial tail is still
    // loading (termLoading), the chunk is buffered — writing before the answer
    // would interleave live text beneath the persisted tail it will render.
    if (msg.type === 'agent-output') {
      if (!termView || !termProcess || termProcess !== msg.processId) return;
      if (termLoading) { termPending += msg.text; return; }
      // The console may be showing a refusal ("no recorded console output"):
      // the process was running and had persisted nothing yet. Output has now
      // started, so the blurb gives way to a live terminal — the same recovery
      // the stage console does.
      if (termBlurbed) restoreTerminal();
      if (term) term.write(msg.text);
      else if (xtermState === 'loading') termPending += msg.text;
      return;
    }
    // A live chunk of the open STAGE console's deterministic gate output:
    // appended ONLY while that stage's own console is the open surface (never
    // while a process console is), and buffered while the stage-log answer is
    // still in flight — same contract as agent-output. Sanitized host-side.
    if (msg.type === 'stage-output') {
      if (!termView || termProcess || termView !== msg.stage) return;
      if (termLoading) { termPending += msg.text; return; }
      if (termBlurbed) restoreTerminal();
      if (term) term.write(msg.text);
      else if (xtermState === 'loading') termPending += msg.text;
      return;
    }
    // The combined server logs initial answer: all server log contents for this
    // ticket. The shared surface renders the initial content and starts the
    // merged view; the host request and the open flag stay the dashboard's.
    if (msg.type === 'server-logs') {
      if (!logsView || !logsViewInstance) return;
      logsViewInstance.handleInitial(msg.servers || []);
      return;
    }
    // A live chunk of one server's log output: appended to that server's lines
    // and, if the merged view is active, interleaved chronologically.
    if (msg.type === 'server-log-output') {
      if (!logsView || !logsViewInstance) return;
      logsViewInstance.handleOutput(msg.service, msg.text);
      return;
    }
    // The terminal result of an async action (§ DESIGN-SYSTEM.md 5.3, UI-R13).
    // ship-ticket/merge-pr/refresh-prs never reach here (they carry no
    // requestId on the wire, by design — see the click handler above); every
    // other posting control settles through this one line.
    if (msg.type === 'action-result') {
      // An env-override SAVE that succeeded drops its draft, so the section
      // re-renders from what was actually STORED — keys the host's parser
      // dropped included. A refusal keeps the draft: the reason lands via
      // karstSettle's error toast, and nothing the user typed is discarded.
      const envScope = Object.keys(envSaveRequests).find(
        (scope) => envSaveRequests[scope] === msg.requestId,
      );
      if (envScope !== undefined) {
        const rest = { ...envSaveRequests };
        delete rest[envScope];
        envSaveRequests = rest;
        if (msg.ok === true) {
          const drafts = { ...envDrafts };
          delete drafts[envScope];
          envDrafts = drafts;
          envSaved = { ...envSaved, [envScope]: 'Saved — applies at the next start.' };
          renderEnvView();
        }
      }
      karstSettle(msg.requestId, msg.ok, msg.message);
      return;
    }
    // Transient `inside-progress` events and `clocks` repaints are folded into the React store (app/dashboardStore.ts),
    // which renders the Inside block; the page keeps no copy of them.
    if (msg.type === 'state') {
      // The page keeps the snapshot only to persist it and to draw the artifact view from it. A LIVE repaint (the same
      // snapshot re-read so the running rows' clocks stay current) carries no news for either, so it only refreshes the
      // held copy; a real push renders and persists. (Everything that settles an in-flight action, the Inside overlays and
      // the Inside block itself are React's: app/pendingOps.ts, app/dashboardStore.ts, app/Inside.tsx.)
      if (msg.live) {
        lastState = msg.state;
        return;
      }
      render(msg.state);
      persist();
    }
  });

  // Restore last state on reload before the host re-pushes. Tolerates the
  // pre-envelope shape a panel open across an upgrade may have persisted.
  const prev = vscode.getState();
  const restored = prev && prev.state ? prev : prev ? { state: prev, sel: null } : null;
  if (restored && restored.state) {
    selectedStage = restored.sel || null;
    shipWaitSeen = restored.shipWait || null;
    srvFilter = restored.srvFilter || '';
    // The artifact surface + scrolls are view state like selection; an old
    // build's persisted state simply has none.
    artView = restored.artView || null;
    artScrolls = restored.artScrolls || { ticket: 0, index: 0, detail: {} };
    render(restored.state);
    artRestoreScroll();
  }
</script>
