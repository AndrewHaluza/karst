<!--
  Karst ticket-list sidebar webview (§14 redesign). Replaces the native TreeView.
  Self-contained (webview CSP forbids external assets). Themed with VS Code's
  `--vscode-*` variables (via the shared design system) so it inherits light/dark.
  Renders from the `state` postMessage the host pushes (state.ts → SidebarState)
  and posts action messages back (messages.ts → SidebarWebviewMessage). Row
  actions carry a numeric ticketId; the host routes them to the existing karst.*
  commands. Every posting control carries a `requestId` and settles through the
  shared design-system runtime (docs/ui/DESIGN-SYSTEM.md §5, UI-R11–R14).
-->
<!--KARST_CSP-->
<style>
  /*KARST_DS_CSS*/

  *{box-sizing:border-box}
  /* The view is an app shell, not a scrolling document: html/body fill the
     view, body is a non-scrolling column, and the ONLY thing that scrolls is
     the ticket list (UI-R38). The toolbar/search/facets stay pinned — on a
     long list they used to scroll away with the rows, leaving the filters
     and controls unreachable at the bottom. */
  body{
    margin:0;padding:0;
    display:flex;flex-direction:column;overflow:hidden;
    background:var(--vscode-sideBar-background,var(--vscode-editor-background));
    color:var(--k-text);
    font-family:var(--k-font-ui);
    font-size:var(--k-text-base);
  }
  html,body{height:100%}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:var(--k-space-1);padding:var(--k-space-3) var(--k-space-4);
    border-bottom:var(--k-border-w) solid var(--k-border);flex:0 0 auto}
  .toolbar .sp{flex:1}

  /* search */
  .search{position:relative;margin:var(--k-space-4) var(--k-space-4) var(--k-space-3);flex:0 0 auto}
  .search-icon{position:absolute;left:var(--k-space-3);top:50%;transform:translateY(-50%);
    color:var(--k-text-faint)}
  .search-input{width:100%;padding-left:var(--k-space-9)}

  /* facets */
  .facets{display:flex;gap:var(--k-space-3);flex-wrap:wrap;padding:0 var(--k-space-4) var(--k-space-4);
    border-bottom:var(--k-border-w) solid var(--k-border);flex:0 0 auto}
  .facets .n{font-family:var(--k-font-mono);font-size:var(--k-text-2xs);opacity:.8}

  /* rows */
  /* flex:1 + min-height:0: the list is the one flex child allowed to shrink
     below its content, which is what makes overflow-y scroll instead of
     growing the body past the viewport. */
  .list{flex:1;min-height:0;overflow-y:auto;padding:var(--k-space-1) 0}
  .ticket{margin:0 var(--k-space-2);border-radius:var(--k-radius-md)}
  .ticket.arch{opacity:.6}
  .row{display:flex;align-items:center;gap:var(--k-space-3);
    padding:var(--k-space-2) var(--k-space-3) var(--k-space-2) var(--k-space-2);
    border-radius:var(--k-radius-md);position:relative;overflow:hidden}
  .row:hover{background:var(--k-surface-hover)}
  /* Opening a ticket is a handoff — the dashboard panel IS the answer — so the
     success flash only has to say "that one". `.k-btn--row` already replaces the
     check badge with the selection wash, but `.rowopen` is only the middle of
     the row (the chevron sits left of it, the hover actions overlay its right),
     so tinting the BUTTON alone would paint a bar across part of a row. The
     wash moves to the row and the button stays clear of it — one surface, no
     second translucent layer stacking on top of the first. */
  .row:has(.rowopen.is-success){background:var(--k-surface-selected)}
  .rowopen.is-success{background:transparent}
  /* The row whose ticket view (dashboard/edit/diffs) is the window's ACTIVE
     view. "Currently active" is its own meaning, deliberately NOT the
     selection wash (STYLE-GUIDE §10): `--k-surface-selected` says "this item
     is selected", so the active row instead uses the focus color — a left
     rail as the shape carrier (the state is never color-only) over a faint
     focus tint. Outranks the transient open-flash wash (same specificity,
     later in the file) and `.row:hover` (higher specificity), so the
     highlight survives both. */
  .ticket.active .row{background:color-mix(in srgb,var(--k-focus) 9%,transparent)}
  .ticket.active .row::before{content:"";position:absolute;left:0;top:var(--k-space-2);
    bottom:var(--k-space-2);width:calc(var(--k-border-w) * 2);
    border-radius:var(--k-radius-pill);background:var(--k-focus)}
  /* The pending spinner replaces only the status dot — not the whole glyph —
     so the karst mark stays visible and the row never shifts. The dot hides
     and a same-size spinner takes its place (same absolute position). */
  .glyph .sdot-spin{
    display:none;position:absolute;right:calc(-1 * var(--k-space-2));bottom:calc(-1 * var(--k-space-2));
    width:var(--k-space-3);height:var(--k-space-3);
    border:var(--k-spinner-w) solid currentColor;border-top-color:transparent;
    border-radius:var(--k-radius-circle);animation:k-spin var(--k-dur-spin) linear infinite}
  /* The rowopen control IS the button that carries aria-busy (karstBeginPending),
     and the glyph lives inside it — so the spinner swap is pure CSS on that
     state, no MutationObserver needed. */
  .rowopen[aria-busy="true"] .glyph .sdot{display:none}
  .rowopen[aria-busy="true"] .glyph .sdot-spin{display:block}
  /* The sidebar's rows spin their OWN dot — the generic `.k-btn[aria-busy]::before`
     spinner (a leading flex icon) must not push the glyph aside as well. Scoped
     to `.rowopen`, never `.k-btn--row`: the diffs view's file rows share that
     class and their ONLY pending indicator is the generic ::before spinner. */
  .rowopen[aria-busy="true"]::before{content:none}

  /* Override .k-iconbtn padding — the prototype chevron has zero inset. The
     min-width/min-height stay at the .k-iconbtn defaults (--k-hit-min) so the
     expand/collapse target keeps its WCAG 2.5.8 size (UI-R29). */
  .chev{transition:transform var(--k-dur-fast) var(--k-ease-standard);
    padding:0}
  .ticket.open .chev{transform:rotate(90deg)}

  /* The row's main click target — opens the ticket dashboard. A real <button>
     wrapping only decorative content (glyph/name/stage), never another
     interactive control, so it never nests inside another button (UI-R09).
     `.rowacts` is its SIBLING, absolutely positioned over the row's right edge
     on hover — not nested inside this button. Built on `.k-btn--link` (zero
     chrome already) with only layout + colour overridden locally (UI-R07 does
     not restrict colour). */
  .rowopen{display:flex;align-items:center;gap:var(--k-space-4);flex:1;min-width:0;
    text-align:left;color:inherit}
  .rowopen:hover,.rowopen:focus-visible{color:inherit;text-decoration:none}

  /* The row marker is the karst logo tinted by the status glyph: the mark is
     drawn with stroke="currentColor", so the g-* classes below set `color` and
     the palette stays the single source (no per-view hex). Sized by the SVG's
     own width/height attributes, not CSS. */
  .glyph{position:relative;display:inline-flex;align-items:center;flex:0 0 auto}
  .glyph svg{display:block}
  /* Status dot on the mark: the tint alone is easy to miss at this size against
     a themed sidebar, so the state also gets a shape. Ringed in the sidebar
     background so it reads as an overlay, not part of the logo. */
  .glyph .sdot{position:absolute;right:calc(-1 * var(--k-space-2));bottom:calc(-1 * var(--k-space-2));
    width:var(--k-space-3);height:var(--k-space-3);border-radius:var(--k-radius-circle);
    background:currentColor;
    box-shadow:0 0 0 calc(var(--k-border-w) * 1.5) var(--vscode-sideBar-background,var(--vscode-editor-background))}
  /* Pending reads as absence: a hollow ring, not a filled dot. */
  .glyph.g-gray .sdot{background:transparent;
    box-shadow:0 0 0 calc(var(--k-border-w) * 1.5) var(--vscode-sideBar-background,var(--vscode-editor-background));
    border:calc(var(--k-border-w) * 1.5) solid currentColor}
  .g-blue{color:var(--k-running)}
  .g-amber{color:var(--k-attention)}
  .g-red{color:var(--k-failed)}
  .g-green{color:var(--k-passed)}
  .g-gray{color:var(--k-pending)}

  .name{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:var(--k-text-md)}
  /* Follow-up marker: says "this is a sub-task of <key>" without stealing row
     width. Capped at a share of the row with its own ellipsis — a long parent
     key must trim itself (full key stays in the tooltip), never starve the
     title's flex:1 remainder to near zero. */
  .parentref{font-size:var(--k-text-2xs);color:var(--k-text-dim);flex:0 1 auto;max-width:40%;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:var(--k-space-2)}
  /* The stage pill carries the shared stg-<stage> token (model/stagePalette),
     so its text IS the stage color and its fill is that color washed out — the
     same token the dashboard rail paints with. Uppercase + tracking so the chip
     text matches the rail's stage label letter-for-letter. */
  .stage{font-size:var(--k-text-2xs);padding:var(--k-space-1) var(--k-space-4);border-radius:var(--k-radius-lg);
    flex:0 0 auto;font-weight:var(--k-weight-semibold);text-transform:uppercase;letter-spacing:.06em;
    background:color-mix(in srgb, currentColor 16%, transparent)}
  /* An unclassified stage (newer schema, or none yet) reads as a dashed outline
     rather than a solid chip, so "unknown" never masquerades as a real stage. */
  .stage.stg-unknown{border:var(--k-border-w) dashed currentColor}
  /* Actions overlay the row's right edge on hover so showing them never reflows
      the row. The stage pill hides under them (same slot) to avoid overlap. The
      cluster backs itself with the SOLID --k-surface (not the translucent
      --k-surface-hover wash the row uses): the row's own text passes underneath
      on narrow rows, and a translucent backdrop would let it show through the
      icon buttons and read as a UI defect (UI-R05). The row's overflow:hidden
      clips the name text at the row boundary so it never bleeds under the
      actions overlay on narrow rows. */
  .rowacts{display:flex;gap:var(--k-space-1);position:absolute;right:var(--k-space-3);top:50%;
    transform:translateY(-50%);background:var(--k-surface);border-radius:var(--k-radius-sm);
    padding-left:var(--k-space-2);opacity:0;pointer-events:none}
  .row:hover .rowacts{opacity:1;pointer-events:auto}
  .row:hover .stage{opacity:0}

  /* expanded body */
  .body{display:none;padding:var(--k-space-2) var(--k-space-4) var(--k-space-5) var(--k-space-9)}
  .ticket.open .body{display:block}

  .nextact{font-size:var(--k-text-sm);margin:var(--k-space-2) 0 var(--k-space-1);color:var(--k-text)}
  .nextact.warn{color:var(--k-failed)}
  .nextact .att{color:var(--k-text-dim);font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    margin-left:var(--k-space-2)}

  .activity{font-size:var(--k-text-xs);color:var(--k-text-dim);margin:var(--k-space-1) 0}
  .sess-sub{color:var(--k-text)}

  .meta{font-size:var(--k-text-2xs);color:var(--k-text-dim);
    font-family:var(--k-font-mono);margin:var(--k-space-2) 0 var(--k-space-1);word-break:break-word}

  .actions{display:flex;gap:var(--k-space-3);margin-top:var(--k-space-4)}

  /* Section headers (CURRENT · N / RECENTLY DONE · N): lightweight uppercase
     labels, not cards — the list reads as one continuous scroll surface. */
  .sec{display:flex;align-items:baseline;gap:var(--k-space-2);
    margin:var(--k-space-4) var(--k-space-4) var(--k-space-1);
    font-size:var(--k-text-2xs);font-weight:var(--k-weight-semibold);letter-spacing:.08em;
    text-transform:uppercase;color:var(--k-text-faint)}
  .sec-n{font-family:var(--k-font-mono);color:var(--k-text-faint);opacity:.8}

  /* Completed rows (Recently Done / Older Completed / the Done facet) are
     quieter than Current: tighter padding, muted title, check indicator, and
     NO stage pill — the section header already says these are done, so a
     second DONE badge would only add weight. */
  .ticket.done .row{padding-top:var(--k-space-1);padding-bottom:var(--k-space-1)}
  .ticket.done .name{font-size:var(--k-text-sm);color:var(--k-text-dim)}
  /* Older Completed is the quietest level: even tighter row, fainter title. */
  .ticket.older .row{padding-top:0;padding-bottom:0}
  .ticket.older .name{color:var(--k-text-faint)}
  /* Relative completion time on Recently Done rows ("4m ago"). */
  .time{flex:0 0 auto;font-size:var(--k-text-2xs);color:var(--k-text-faint);white-space:nowrap}
  /* The completed-row marker: a check inside a ring, tinted by the shared
     status class (g-green). The CHECK SHAPE is the non-color carrier for
     Done (UI-R28) — decoration only, the section header carries the meaning,
     so it is aria-hidden in the template. */
  .glyph.chk svg{display:block}

  /* The Older Completed disclosure — the whole row is the control (UI-R09).
     Built on the ghost variant (hairline border, dim text) with the row
     geometry applied locally: a bordered quiet row like the prototype's
     "› 37 more completed · history", not a large saturated card. */
  .hist{display:flex;align-items:center;gap:var(--k-space-2);margin:var(--k-space-2);
    padding:var(--k-space-2) var(--k-space-3);border-radius:var(--k-radius-md);
    background:var(--k-surface);font-weight:var(--k-weight-semibold)}
  .hist:hover{background:var(--k-surface-hover);color:var(--k-text-dim);text-decoration:none}
  .hist .sp{flex:1}
  .hist-side{font-size:var(--k-text-2xs);color:var(--k-text-faint);text-transform:uppercase;letter-spacing:.06em}
  .hist-chev{display:inline-flex;flex:0 0 auto;transition:transform var(--k-dur-fast) var(--k-ease-standard)}
  .hist[aria-expanded="true"] .hist-chev{transform:rotate(90deg)}
</style>

<div class="toolbar">
  <button type="button" class="k-iconbtn" data-act="create" aria-label="Create ticket" title="Create ticket"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg></button>
  <span class="sp"></span>
  <button type="button" class="k-iconbtn" data-act="open-settings" aria-label="Open settings" title="Open settings"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M9.1 1l.35 1.9c.42.14.82.31 1.19.53l1.6-1.08 1.42 1.42-1.08 1.6c.22.37.39.77.53 1.19L15 6.9v2l-1.9.35c-.14.42-.31.82-.53 1.19l1.08 1.6-1.42 1.42-1.6-1.08c-.37.22-.77.39-1.19.53L9.1 15h-2l-.35-1.9a5.5 5.5 0 0 1-1.19-.53l-1.6 1.08-1.42-1.42 1.08-1.6a5.5 5.5 0 0 1-.53-1.19L1 8.9v-2l1.9-.35c.14-.42.31-.82.53-1.19L2.35 3.76l1.42-1.42 1.6 1.08c.37-.22.77-.39 1.19-.53L6.9 1h2zM8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg></button>
</div>

<div class="search">
  <svg aria-hidden="true" class="search-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
  <input type="text" id="search" class="k-input search-input" aria-label="Search tickets" placeholder="Search tickets…"/>
</div>
<div class="facets" id="facets"></div>
<div class="list" id="list"></div>

<script>
  /*KARST_DS_JS*/

  const vscode = acquireVsCodeApi();
  const post = (m) => vscode.postMessage(m);
  const el = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

  // `dotVariant` names a `.k-dot--<variant>` suffix (model/designComponents),
  // not the facet's own key — "input" (needs you) maps to the shared
  // "attention" status meaning, "done" to "passed".
  const FACET_META = [
    { key:'all', label:'All', dotVariant:null },
    { key:'running', label:'In progress', dotVariant:'running' },
    { key:'input', label:'Needs you', dotVariant:'attention' },
    { key:'failed', label:'Blocked', dotVariant:'failed' },
    { key:'done', label:'Done', dotVariant:'passed' },
    { key:'archived', label:'Archived', dotVariant:null },
  ];

  // Status word for the glyph's role="img" aria-label — colour is never the
  // only carrier of the ticket's state (UI-R28).
  const GLYPH_WORD = { gray:'Pending', blue:'Running', amber:'Needs you', green:'Done', red:'Failed' };

  // Current state snapshot + which rows are expanded (kept across re-renders).
  // `facets` is the multi-select selection (lit chips); `['all']` = no filter.
  // The All view renders `sections` (Current / Recently Done / Older
  // Completed); the Done facet renders `done`; every other facet renders the
  // flat `rows`. A pre-upgrade snapshot has no `sections` — `renderAll` falls
  // back to `rows` until the fresh state lands.
  let state = { facets:['all'], filter:'', counts:{}, sections:{current:[],recentlyDone:[],olderDone:[]}, done:[], rows:[] };
  const open = new Set();
  // The Older Completed disclosure is VIEW state, never ticket data: the host
  // neither knows nor persists it. `histUser` separates an explicit click
  // (which sticks across searches and re-renders) from the automatic search
  // reveal (which must reset to the default collapsed state when the query
  // clears — the doc's "unless the user explicitly expanded history" rule).
  let histOpen = false;
  let histUser = false;

  const chev = '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4l4 4-4 4"/></svg>';
  const ic = {
    dash:'<svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3" width="12" height="10" rx="1.5"/></svg>',
    sess:'<svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2" y="3.5" width="12" height="9" rx="1.5"/><path d="M4.5 7l2 1.5-2 1.5"/></svg>',
    spin:'<svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M5 3.5l7 4.5-7 4.5z"/></svg>',
    edit:'<svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M11 2.5l2.5 2.5L6 12.5 3 13l.5-3z"/></svg>',
    arch:'<svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="2.5" y="4" width="11" height="3"/><path d="M3.5 7v5.5h9V7M6.5 9.5h3"/></svg>',
    unarch:'<svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M8 12.5V6M5.5 8L8 5.5 10.5 8"/><rect x="2.5" y="11.5" width="11" height="2"/></svg>',
    // The karst mark (media/karst.svg at 24×24) — the status-tinted row marker.
    mark:'<svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.4"/><circle cx="18" cy="6" r="2.4"/><circle cx="12" cy="18" r="2.4"/><path d="M7.6 7.6 10.7 15.6"/><path d="M16.4 7.6 13.3 15.6"/><path d="M8 6h8"/></svg>',
    del:'<svg aria-hidden="true" width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4.5h10M6 4.5V3h4v1.5M4.5 4.5l.5 8.5h6l.5-8.5"/></svg>',
  };

  function renderFacets() {
    // Multi-select: any number of status chips can be lit at once (their union).
    // `all` is lit only when nothing else is; `aria-pressed` mirrors the toggle
    // AND drives the chip's "on" look via the primitive's own
    // `[aria-pressed="true"]` rule — no local `.on` class needed anymore.
    const sel = new Set(state.facets || ['all']);
    el('facets').innerHTML = FACET_META.map((f) => {
      const n = state.counts[f.key] ?? 0;
      const pressed = sel.has(f.key);
      const dot = f.dotVariant
        ? `<span class="k-dot k-dot--${f.dotVariant}" aria-hidden="true"></span>`
        : '';
      return `<button type="button" class="k-chip" data-facet="${f.key}" aria-pressed="${pressed}">${dot}${esc(f.label)} <span class="n">${n}</span></button>`;
    }).join('');
  }

  // Compact "4m ago" / "2h ago" from an ISO timestamp, against the viewer's
  // clock (the host stores UTC; formatting here keeps the model host-clock-free).
  function relTime(iso) {
    if (!iso) return '';
    const t = Date.parse(iso);
    if (Number.isNaN(t)) return '';
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 45) return 'just now';
    const m = Math.round(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + 'h ago';
    return Math.round(h / 24) + 'd ago';
  }

  // The activity line: runtime state of the ticket's session, plus when it last
  // moved. The second line explains what the session action will do.
  function activityLine(row) {
    const label = row.activityLabel || 'No active session';
    const rel = relTime(row.lastActiveAt);
    const head = rel ? `${esc(label)} · ${esc(rel)}` : esc(label);
    const detail = row.sessionAction && row.sessionAction.detail;
    return detail ? `${head}<br><span class="sess-sub">${esc(detail)}</span>` : head;
  }

  function metaLine(row) {
    const ports = (row.servers || []).map((s) => s.port).filter(Boolean);
    const repos = (row.worktrees || []).map((w) => w.repoDisplay || w.repo).filter(Boolean);
    const prs = (row.prs || []).map((p) => p.number).filter((n) => n != null);
    const tokens = [];
    if (row.model) tokens.push(esc(row.model));
    if (repos.length) tokens.push(esc(repos.join('+')));
    if (ports.length) tokens.push(esc(ports.map((p) => ':' + p).join(', ')));
    if (prs.length) tokens.push(esc(prs.map((n) => 'PR #' + n).join(', ')));
    return tokens.join(' · ');
  }

  // One ticket row. `compact` switches to the completed-row treatment: check
  // indicator instead of the status glyph, muted title, no stage pill (the
  // section context already says "done"), and — for Recently Done only —
  // the relative completion time. The expanded body, the hover actions and
  // the open/active marks are identical either way: selecting a completed
  // ticket behaves exactly like selecting a Current one.
  function rowHtml(row, opts) {
    opts = opts || {};
    const compact = !!opts.compact;
    const isOpen = open.has(row.ticketId);
    // A restored snapshot (vscode.getState) can predate stageLabel, so fall
    // back rather than render an empty pill on the first paint after upgrade.
    const stageText = row.stageLabel || row.description || '—';
    // The chip states the STAGE (colored by the shared stg-* token, matching
    // the dashboard rail); the full phrase moves to the tooltip. A pre-upgrade
    // snapshot lacks stageChip/stageClass, so fall back to the phrase + a
    // neutral class rather than render blank.
    const stageChip = row.stageChip || stageText;
    const stageClass = row.stageClass || 'stg-unknown';
    // The session button states which of the two it does — "Continue" a
    // captured interactive session, or "Start" a fresh one. A pre-upgrade
    // snapshot has no sessionAction, so fall back to "Start" rather than an
    // empty verb. The single, always-visible returning-user entry point.
    const sessVerb = (row.sessionAction && row.sessionAction.label) || 'Start';
    const glyphWord = GLYPH_WORD[row.glyph] || 'Unknown';
    const toggleLabel = isOpen ? 'Collapse ticket details' : 'Expand ticket details';

    const acts = row.archived
      ? `<button type="button" class="k-iconbtn" data-act="unarchive" data-id="${row.ticketId}" aria-label="Restore ticket to the active list" title="Restore ticket to the active list">${ic.unarch}</button>`
        + `<button type="button" class="k-iconbtn k-iconbtn--danger" data-act="delete" data-id="${row.ticketId}" aria-label="Delete ticket permanently" title="Delete ticket permanently">${ic.del}</button>`
      : `<button type="button" class="k-iconbtn" data-act="spin" data-id="${row.ticketId}" aria-label="Spin up worktree and dev servers" title="Spin up worktree and dev servers">${ic.spin}</button>`
        + `<button type="button" class="k-iconbtn" data-act="open-session" data-id="${row.ticketId}" aria-label="${sessVerb} session" title="${sessVerb} session">${ic.sess}</button>`
        + `<button type="button" class="k-iconbtn" data-act="edit" data-id="${row.ticketId}" aria-label="Edit ticket" title="Edit ticket">${ic.edit}</button>`
        + `<button type="button" class="k-iconbtn k-iconbtn--danger" data-act="archive" data-id="${row.ticketId}" aria-label="Archive ticket, hiding it from the active list" title="Archive ticket, hiding it from the active list">${ic.arch}</button>`;
    const bodyActs = row.archived
      ? `<button type="button" class="k-btn k-btn--secondary" data-act="unarchive" data-id="${row.ticketId}" title="Restore ticket to the active list">${ic.unarch} Unarchive</button>`
        + `<button type="button" class="k-btn k-btn--danger" data-act="delete" data-id="${row.ticketId}" title="Delete ticket permanently">${ic.del} Delete</button>`
      : `<button type="button" class="k-btn k-btn--primary" data-act="open-dashboard" data-id="${row.ticketId}" title="Open the ticket dashboard">${ic.dash} Open dashboard</button>`
        + `<button type="button" class="k-btn k-btn--secondary" data-act="open-session" data-id="${row.ticketId}" title="${sessVerb} the ticket session">${ic.sess} ${sessVerb} session</button>`;

    // Decorative content of the row's main click target — never another
    // interactive control (UI-R09; see the `.rowopen` comment in <style>).
    // Completed rows swap the karst mark + status dot for a check-in-ring
    // (aria-hidden — the section header carries the "done" meaning) and
    // drop the stage pill; the check SHAPE is the non-color carrier
    // (UI-R28) and `g-<glyph>` keeps the shared status color.
    const glyphHtml = compact
      ? `<span class="glyph chk g-${esc(row.glyph)}" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.2"/><path d="M5.1 8.3l2 2 3.8-4.4"/></svg></span>`
      : `<span class="glyph g-${esc(row.glyph)}" role="img" aria-label="${esc(glyphWord)}" title="${esc(row.description)}">${ic.mark}<span class="sdot" aria-hidden="true"></span><span class="sdot-spin" aria-hidden="true"></span></span>`;
    const rowContent = glyphHtml
      + `<span class="name">${esc(row.label)}</span>`
      + (row.parentKey ? `<span class="parentref" title="Follow-up of ${esc(row.parentKey)}">↳ ${esc(row.parentKey)}</span>` : '')
      + (compact
        ? (opts.time ? `<span class="time">${esc(relTime(row.lastActiveAt))}</span>` : '')
        : `<span class="stage ${esc(stageClass)}" title="${esc(stageText)}">${esc(stageChip)}</span>`);
    // Archived tickets have no dashboard action, so the wrapper is a plain,
    // non-interactive span rather than a button with nothing to do.
    const openControl = row.archived
      ? `<span class="rowopen">${rowContent}</span>`
      : `<button type="button" class="k-btn k-btn--link k-btn--row rowopen" data-open="${row.ticketId}" title="Open ticket dashboard">${rowContent}</button>`;

    return `<div class="ticket${isOpen ? ' open' : ''}${row.archived ? ' arch' : ''}${row.isActive ? ' active' : ''}${compact ? ' done' : ''}${opts.older ? ' older' : ''}" data-id="${row.ticketId}">`
      + `<div class="row">`
      + `<button type="button" class="k-iconbtn chev" data-toggle="${row.ticketId}" aria-expanded="${isOpen}" aria-label="${toggleLabel}" title="${toggleLabel}">${chev}</button>`
      + openControl
      + `<span class="rowacts">${acts}</span>`
      + `</div>`
      + `<div class="body">`
      + (() => { const b = row.blocker; if (!b) return '';
          // Only the failure REASON is new — the status ("failed") is already the
          // row's left glyph color, so we never repeat it here.
          const txt = b.reason ? esc(b.reason) : '';
          const att = b.attempt ? `<span class="att">attempt ${b.attempt}</span>` : '';
          if (!txt && !att) return '';
          return `<div class="nextact warn">⚠ ${txt}${att}</div>`; })()
      + `<div class="activity">${activityLine(row)}</div>`
      + (() => { const m = metaLine(row); return m ? `<div class="meta">${m}</div>` : ''; })()
      + `<div class="actions">${bodyActs}</div>`
      + `</div></div>`;
  }

  // Lightweight section header: "CURRENT · 7" (uppercased + letter-spaced in
  // CSS). The count is what is rendered BELOW it — the host already filtered
  // each section by the query, so the header never promises hidden rows.
  function secHtml(name, count) {
    return `<div class="sec" role="presentation"><span class="sec-name">${esc(name)}</span><span class="sec-n">· ${count}</span></div>`;
  }

  // The Older Completed disclosure. The whole row is the button (UI-R09); the
  // chevron rotates to ⌄ when open (a separate state model from the ticket
  // chevrons — it controls only this section). `aria-controls` names the
  // expanded list only while it exists.
  function histToggle(expanded, n) {
    return `<button type="button" class="k-btn k-btn--ghost hist" data-history="1" aria-expanded="${expanded}"${expanded ? ' aria-controls="histlist"' : ''}><span class="hist-chev">${chev}</span><span>${n} more completed</span><span class="sp"></span><span class="hist-side">history</span></button>`;
  }

  function emptyHtml(view) {
    if (state.filter) return '<div class="k-empty"><div class="k-empty-title">No tickets match</div></div>';
    if (view === 'archived') return '<div class="k-empty"><div class="k-empty-title">No archived tickets</div></div>';
    if (view === 'done') return '<div class="k-empty"><div class="k-empty-title">No done tickets</div></div>';
    return '<div class="k-empty"><div class="k-empty-title">No tickets yet</div>'
      + '<div class="k-empty-hint"><button type="button" class="k-btn k-btn--link" data-act="create">Create ticket</button></div></div>';
  }

  // The All view: Current (full treatment, canonical order) → Recently Done
  // (≤3, compact) → Older Completed behind the disclosure. Empty sections are
  // omitted entirely (a list with no Current tickets starts at Recently Done
  // rather than promoting history into primary weight), and the section
  // headers render only where their section does.
  function renderAll(L) {
    const cur = (state.sections && state.sections.current) || state.rows || [];
    const recent = (state.sections && state.sections.recentlyDone) || [];
    const older = (state.sections && state.sections.olderDone) || [];
    if (!cur.length && !recent.length && !older.length) {
      L.innerHTML = emptyHtml('');
      return;
    }
    const q = (state.filter || '').trim();
    // Auto-reveal: a query that matches Older Completed expands the section so
    // the match is visible, but that is NOT the user's explicit choice —
    // clearing the search restores the default collapsed state (histUser).
    const expanded = histUser ? histOpen : (q !== '' && older.length > 0);
    const html = [];
    if (cur.length) {
      html.push(secHtml('Current', cur.length));
      html.push(cur.map((r) => rowHtml(r, {})).join(''));
    }
    if (recent.length) {
      html.push(secHtml('Recently done', recent.length));
      html.push(recent.map((r) => rowHtml(r, { compact: true, time: true })).join(''));
    }
    if (older.length) {
      html.push(histToggle(expanded, older.length));
      if (expanded) {
        html.push(`<div class="histlist" id="histlist">${older.map((r) => rowHtml(r, { compact: true, older: true })).join('')}</div>`);
      }
    }
    L.innerHTML = html.join('');
  }

  // The Done facet: the user explicitly asked for completed work, so no
  // hierarchy and no history control — every completed ticket at once,
  // newest first (Recently Done and Older Completed are conceptually merged).
  function renderDone(L) {
    const rows = state.done || [];
    if (!rows.length) { L.innerHTML = emptyHtml('done'); return; }
    L.innerHTML = secHtml('Done', rows.length)
      + rows.map((r) => rowHtml(r, { compact: true, time: true })).join('');
  }

  function renderList() {
    const L = el('list');
    const sel = new Set(state.facets || ['all']);
    if (sel.size === 1 && sel.has('all')) { renderAll(L); return; }
    if (sel.size === 1 && sel.has('done')) { renderDone(L); return; }
    // Archived facet + derived-status unions: the flat list, as before.
    const rows = state.rows || [];
    if (!rows.length) { L.innerHTML = emptyHtml(sel.has('archived') ? 'archived' : ''); return; }
    L.innerHTML = rows.map((r) => rowHtml(r, {})).join('');
  }

  // ---- interactions ----
  let searchTimer;
  el('search').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value;
    searchTimer = setTimeout(() => post({ type:'set-filter', query:q }), 150);
  });

  // Every posting control is delegated here — rows render by full innerHTML
  // replacement, so a per-element `karstAction` binding would go stale on the
  // next render. `data-act`/`data-open` controls use the runtime's pending
  // primitives directly (karstRequestId + karstBeginPending, the same pieces
  // `karstAction` uses internally) so they get the same four properties:
  // pending on click, non-re-triggerable, terminal result via `action-result`,
  // and the watchdog (UI-R11–R14). `data-facet`/`data-toggle` stay immediate —
  // their "settlement" is simply the next `state` push, not a tracked request.
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act],[data-open],[data-facet],[data-toggle],[data-history]');
    if (!t) return;
    if (t.dataset.act || t.dataset.open) {
      e.stopPropagation();
      if (karstIsPending(t) || t.disabled) { e.preventDefault(); return; }
      const type = t.dataset.act || 'open-ticket';
      const requestId = karstRequestId();
      karstBeginPending(t, requestId);
      const idRaw = t.dataset.act ? t.dataset.id : t.dataset.open;
      post(idRaw !== undefined ? { type, ticketId: Number(idRaw), requestId } : { type, requestId });
      return;
    }
    if (t.dataset.facet) {
      // Report only WHICH chip was clicked; the host owns the toggle/union logic.
      post({ type:'toggle-facet', facet: t.dataset.facet });
      return;
    }
    if (t.dataset.history) {
      // Explicit click: this choice STICKS (survives searches and re-renders);
      // the automatic search reveal never sets this flag.
      histUser = true;
      histOpen = !histOpen;
      renderList();
      return;
    }
    if (t.dataset.toggle) {
      e.stopPropagation();
      const id = Number(t.dataset.toggle);
      if (open.has(id)) open.delete(id); else open.add(id);
      renderList();
    }
  });

  window.addEventListener('message', (e) => {
    const msg = e.data;
    if (!msg) return;
    if (msg.type === 'state') {
      state = msg.state;
      vscode.setState(state);
      // Prune expanded ids that no longer exist so the set can't grow
      // unbounded — across every section (current, recently/older done, the
      // done facet and the flat views).
      const ids = new Set((state.rows || []).map((r) => r.ticketId));
      for (const r of state.done || []) ids.add(r.ticketId);
      const secs = state.sections || {};
      for (const list of [secs.current, secs.recentlyDone, secs.olderDone]) {
        for (const r of list || []) ids.add(r.ticketId);
      }
      for (const id of [...open]) if (!ids.has(id)) open.delete(id);
      // Keep the search box in sync only when the host changed the filter.
      if (el('search').value !== state.filter) el('search').value = state.filter;
      renderFacets();
      renderList();
    } else if (msg.type === 'action-result') {
      karstSettle(msg.requestId, msg.ok, msg.message);
    }
  });

  // Restore last snapshot immediately (view re-resolve), then ask for fresh.
  const prev = vscode.getState();
  if (prev) { state = prev; renderFacets(); renderList(); }
  post({ type:'request-state' });
</script>

<style>/*KARST_PALETTE*/</style>
