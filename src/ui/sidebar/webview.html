<!--
  Karst ticket-list sidebar webview (§14 redesign). Replaces the native TreeView.
  The page is the React app in src/ui/sidebar/app/** (bundled to app.webview.js
  by scripts/build-webview-send.mjs) and injected here by injectSidebarApp in
  place of the KARST_SIDEBAR_APP marker below; it owns #root. This file keeps
  the shared runtime (design-system CSS/JS, agent identity, palette) and the
  view's stylesheet.
  Self-contained (webview CSP forbids external assets). Themed with VS Code's
  `--vscode-*` variables (via the shared design system) so it inherits light/dark.
  Renders from the `state` postMessage the host pushes (state.ts → SidebarState)
  and posts action messages back (messages.ts → SidebarWebviewMessage). Row
  actions carry a numeric ticketId; the host routes them to the existing karst.*
  commands. Every posting control carries a `requestId` and settles through the
  shared design-system runtime (docs/ui/DESIGN-SYSTEM.md §5, UI-R11–R14).
-->
<!--KARST_CSP-->
<style>
  /*KARST_DS_CSS*/
  /*KARST_AGENT_CSS*/

  *{box-sizing:border-box}
  /* The view is an app shell, not a scrolling document: html/body fill the
     view, body is a non-scrolling column, and the ONLY thing that scrolls is
     the two pane bodies (UI-R38). The toolbar/search stay pinned — on a
     long list they used to scroll away with the rows, leaving the filters
     and controls unreachable at the bottom. */
  body{
    margin:0;padding:0;
    display:flex;flex-direction:column;overflow:hidden;
    background:var(--vscode-sideBar-background,var(--vscode-editor-background));
    color:var(--k-text);
    font-family:var(--k-font-ui);
    font-size:var(--k-text-base);
  }
  html,body{height:100%}
  /* The React mount point adds no box: the toolbar, search and panes stay
     direct flex children of body, exactly as the page laid them out before. */
  #root{display:contents}

  /* The resize edge line (SIDEBAR-SUPER-THIN-EDGE-LINE-SO). VS Code owns the
     sidebar's own border and drag sash, but a theme with a transparent
     sideBar.border leaves the handle invisible — so karst paints one
     super-thin line INSIDE the webview, on the edge that faces the editor.
     An INSET box-shadow takes no layout width and never catches pointer events;
     it spans the full height because body does. The host resolves the side
     (karst.sidebar.edge, 'auto' = opposite workbench.sideBar.location) and
     stamps data-edge on <html>; 'none' removes the attribute and matches no
     rule, so there is no line. */
  html[data-edge="right"] body{box-shadow:inset calc(-1 * var(--k-border-w)) 0 0 0 var(--k-border)}
  html[data-edge="left"] body{box-shadow:inset var(--k-border-w) 0 0 0 var(--k-border)}

  /* toolbar */
  .toolbar{display:flex;align-items:center;gap:var(--k-space-1);padding:var(--k-space-3) var(--k-space-4);
    border-bottom:var(--k-border-w) solid var(--k-border);flex:0 0 auto}
  .toolbar .sp{flex:1}

  /* search */
  .search{position:relative;margin:var(--k-space-4) var(--k-space-4) var(--k-space-3);flex:0 0 auto}
  .search-icon{position:absolute;left:var(--k-space-3);top:50%;transform:translateY(-50%);
    color:var(--k-text-faint)}
  .search-input{width:100%;padding-left:var(--k-space-9)}

  /* panes: Planning and Tickets share the height under the search box. Each
     header is always visible; each body scrolls on its own. Planning is capped
     at ~40% while open with content, Tickets takes the rest, and a collapsed
     pane gives its height to the other. */
  .panes{flex:1;min-height:0;display:flex;flex-direction:column}
  .pane{display:flex;flex-direction:column;min-height:0;flex:0 0 auto}
  .pane[data-pane="planning"]:not([data-collapsed="true"]){flex:0 1 auto;max-height:40%}
  .pane[data-pane="tickets"]:not([data-collapsed="true"]){flex:1 1 0}
  .panes:has(.pane[data-pane="tickets"][data-collapsed="true"]) .pane[data-pane="planning"]:not([data-collapsed="true"]){flex:1 1 0;max-height:none}
  .pane + .pane{border-top:var(--k-border-w) solid var(--k-border);margin-top:var(--k-space-4)}
  .pane-head{display:flex;align-items:center;gap:var(--k-space-1);padding:0 var(--k-space-2) 0 var(--k-space-2);flex:0 0 auto;
    min-height:calc(var(--k-space-8) + var(--k-space-2))}
  .pane-toggle{flex:1;min-width:0;display:flex;align-items:center;gap:var(--k-space-2);background:none;border:0;
    padding:var(--k-space-2) var(--k-space-2);color:var(--k-text-dim);font:inherit;font-size:var(--k-text-2xs);
    font-weight:var(--k-weight-semibold);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-align:left}
  .pane-toggle:focus-visible,.pane-attention:focus-visible,.pt-accepted-toggle:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:calc(-1 * var(--k-focus-w))}
  .pane-chev{display:inline-flex;transition:transform .12s}
  .pane-toggle[aria-expanded="true"] .pane-chev{transform:rotate(90deg)}
  .k-empty-hint .k-btn--link{min-height:var(--k-hit-min)}
  .pane-count{font-family:var(--k-font-mono)}
  .pane-acts{display:flex;gap:var(--k-space-1);align-items:center}
  .pane-acts .k-iconbtn{width:var(--k-space-8);height:var(--k-space-8)}
  .pane-body{flex:1 1 auto;min-height:0;overflow-y:auto;padding:var(--k-space-1) 0}
  .pane-empty{padding:var(--k-space-2) var(--k-space-4);color:var(--k-text-faint);font-size:var(--k-text-xs)}
  .pane-attention{min-height:var(--k-hit-min);display:block;width:calc(100% - 2 * var(--k-space-4));margin:0 var(--k-space-4) var(--k-space-2);padding:var(--k-space-1) var(--k-space-3);
    background:none;border:0;text-align:left;font:inherit;font-size:var(--k-text-xs);color:var(--k-text-dim);cursor:pointer;
    border-radius:var(--k-radius-md)}
  .pane-attention:hover{background:var(--vscode-list-hoverBackground)}
  .filter-menu{position:relative;display:inline-flex}
  .filter-menu .k-iconbtn{position:relative}
  .filter-dot{position:absolute;top:var(--k-space-1);right:var(--k-space-1);width:var(--k-space-3);height:var(--k-space-3);border-radius:var(--k-radius-pill);background:var(--k-attention)}
  .filter-pop{position:absolute;right:0;top:100%;z-index:var(--k-z-tooltip);min-width:calc(var(--k-space-8) * 7);display:flex;flex-direction:column;padding:var(--k-space-2);
    background:var(--k-surface);border:var(--k-border-w) solid var(--k-border-strong);
    border-radius:var(--k-radius-md);box-shadow:var(--k-elev-3)}
  .filter-pop [role="menuitemradio"]{text-align:left;padding-left:var(--k-space-8);position:relative}
  .filter-pop [role="menuitemradio"][aria-checked="true"]::before{content:"\2713";position:absolute;left:var(--k-space-3)}
  .pt-accepted-toggle{min-height:var(--k-hit-min);background:none;border:0;padding:0 var(--k-space-2);color:var(--k-text-dim);font:inherit;font-size:var(--k-text-2xs);cursor:pointer;white-space:nowrap}
  .pt-accepted-toggle:hover{color:var(--k-text)}

  /* rows */
  /* flex:1 + min-height:0: the list is the one flex child allowed to shrink
     below its content, which is what makes overflow-y scroll instead of
     growing the body past the viewport. */
  .list{padding:0}
  .ticket{margin:0 var(--k-space-2);border-radius:var(--k-radius-md)}
  .ticket.arch{opacity:.6}
  .row{display:flex;align-items:center;gap:var(--k-space-3);
    padding:var(--k-space-2) var(--k-space-3) var(--k-space-2) 0;
    border-radius:var(--k-radius-md);position:relative;overflow:hidden}
  .row:hover{background:var(--k-surface-hover)}
  /* The row whose ticket view (dashboard/edit/diffs) is the window's ACTIVE
     view. "Currently active" is its own meaning, deliberately NOT the
     selection wash (STYLE-GUIDE §10): `--k-surface-selected` says "this item
     is selected", so the active row instead uses the focus color — a left
     rail as the shape carrier (the state is never color-only) over a faint
     focus tint. Outranks the transient open-flash wash (same specificity,
     later in the file) and `.row:hover` (higher specificity), so the
     highlight survives both. */
  .ticket.active .row{background:color-mix(in srgb,var(--k-focus) 9%,transparent)}
  .ticket.active .row::before{content:"";position:absolute;left:0;top:var(--k-space-2);
    bottom:var(--k-space-2);width:calc(var(--k-border-w) * 2);
    border-radius:var(--k-radius-pill);background:var(--k-focus)}
  /* The pending spinner replaces only the status dot — not the whole glyph —
     so the karst mark stays visible and the row never shifts. The dot hides
     and a same-size spinner takes its place (same absolute position). */
  .glyph .sdot-spin{
    display:none;position:absolute;right:calc(-1 * var(--k-space-2));bottom:calc(-1 * var(--k-space-2));
    width:var(--k-space-3);height:var(--k-space-3);
    border:var(--k-spinner-w) solid currentColor;border-top-color:transparent;
    border-radius:var(--k-radius-circle);animation:k-spin var(--k-dur-spin) linear infinite}
  /* The rowopen control IS the button that carries aria-busy (karstBeginPending),
     and the glyph lives inside it — so the spinner swap is pure CSS on that
     state, no MutationObserver needed. */
  .rowopen[aria-busy="true"] .glyph .sdot{display:none}
  .rowopen[aria-busy="true"] .glyph .sdot-spin{display:block}
  /* The sidebar's rows spin their OWN dot — the generic `.k-btn[aria-busy]::before`
     spinner (a leading flex icon) must not push the glyph aside as well. Scoped
     to `.rowopen`, never `.k-btn--row`: the diffs view's file rows share that
     class and their ONLY pending indicator is the generic ::before spinner. */
  .rowopen[aria-busy="true"]::before{content:none}

  /* Override .k-iconbtn padding — the prototype chevron has zero inset. The
     min-width/min-height stay at the .k-iconbtn defaults (--k-hit-min) so the
     expand/collapse target keeps its WCAG 2.5.8 size (UI-R29). The negative
     right margin tightens the gap between the chevron and the status glyph
     (the mini-dashboard redesign) WITHOUT shrinking the hit target — the
     glyph pulls closer while the control keeps its full box. The follow-up
     tightened it further (--k-space-2 instead of --k-space-1): the collapsed
     row keeps the chevron and the status icon visually adjacent.

     The left margin lines the chevron's centre up with the Planning tree
     twistie's centre (SIDEBAR-ALIGN-TICKET-ROW-CHEVRON). Both rows sit at the
     same list inset; the ticket row's padding-left is 0, so the chevron needs
     `--k-space-1 - (--k-hit-min - --k-space-7) / 2` to centre its --k-hit-min
     box one twistie half-width from the row edge — the same centre the
     twistie's half-width box produces. The row's `overflow:hidden` clips a
     hair of the hit box's left edge; nothing interactive sits left of the
     chevron, so the WCAG 2.5.8 spacing exception holds (no adjacent target
     within the target circle). */
  .chev{transition:transform var(--k-dur-fast) var(--k-ease-standard);
    padding:0;margin-right:calc(-1 * var(--k-space-2));
    margin-left:calc(var(--k-space-1) - (var(--k-hit-min) - var(--k-space-7)) / 2)}
  .ticket.open .chev{transform:rotate(90deg)}

  /* The row's main click target — opens the ticket dashboard. A real <button>
     wrapping only decorative content (glyph/name/stage), never another
     interactive control, so it never nests inside another button (UI-R09).
     `.rowacts` is its SIBLING, absolutely positioned over the row's right edge
     on hover — not nested inside this button. Built on `.k-btn--link` (zero
     chrome already) with only layout + colour overridden locally (UI-R07 does
     not restrict colour). */
  .rowopen{min-height:var(--k-hit-min);display:flex;align-items:center;gap:var(--k-space-4);flex:1;min-width:0;
    text-align:left;color:inherit}
  .rowopen:hover,.rowopen:focus-visible{color:inherit;text-decoration:none}

  /* The row marker is the karst logo tinted by the status glyph: the mark is
     drawn with fill="currentColor", so the g-* classes below set `color` and
     the palette stays the single source (no per-view hex). Sized by the SVG's
     own width/height attributes, not CSS. */
  .glyph{position:relative;display:inline-flex;align-items:center;flex:0 0 auto}
  .glyph svg{display:block}
  /* Status dot on the mark: the tint alone is easy to miss at this size against
     a themed sidebar, so the state also gets a shape. Ringed in the sidebar
     background so it reads as an overlay, not part of the logo. */
  .glyph .sdot{position:absolute;right:calc(-1 * var(--k-space-2));bottom:calc(-1 * var(--k-space-2));
    width:var(--k-space-3);height:var(--k-space-3);border-radius:var(--k-radius-circle);
    background:currentColor;
    box-shadow:0 0 0 calc(var(--k-border-w) * 1.5) var(--vscode-sideBar-background,var(--vscode-editor-background))}
  /* Pending reads as absence: a hollow ring, not a filled dot. */
  .glyph.g-gray .sdot{background:transparent;
    box-shadow:0 0 0 calc(var(--k-border-w) * 1.5) var(--vscode-sideBar-background,var(--vscode-editor-background));
    border:calc(var(--k-border-w) * 1.5) solid currentColor}
  .g-blue{color:var(--k-running)}
  .g-amber{color:var(--k-attention)}
  .g-red{color:var(--k-failed)}
  .g-green{color:var(--k-passed)}
  .g-gray{color:var(--k-pending)}

  .name{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:var(--k-text-md)}
  /* Follow-up marker: says "this is a sub-task of <key>" without stealing row
     width. Capped at a share of the row with its own ellipsis — a long parent
     key must trim itself (full key stays in the tooltip), never starve the
     title's flex:1 remainder to near zero. */
  .parentref{font-size:var(--k-text-2xs);color:var(--k-text-dim);flex:0 1 auto;max-width:40%;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-left:var(--k-space-2)}
  /* Sub-task relation marker. Same slot as the follow-up ref but a DIFFERENT
     relation (model/subtask.ts): `⊂` reads "is part of", `↳` reads "continues
     after". Slightly stronger ink than the dim follow-up ref so the two are
     distinguishable at a glance, never only by the glyph. */
  .parentref.subtaskref{color:inherit;opacity:.75}
  /* Sub-task nesting: the row indents by its depth (nestSubtasks) so a
     sub-task reads as belonging to the row above it. Whole-row indent (the
     expanded body and hover actions move with it), a fixed step of one
     --k-space-6 repeated per level. The classes stop at MAX_SUBTASK_INDENT
     (4), which `ui/sidebar/items.ts` sets to the writer's MAX_SUBTASK_DEPTH
     (4 levels below a root); the host clamps `subtaskDepth` to it, so there is
     no nest5. */
  .ticket.nest1>.row{padding-left:calc(var(--k-space-6) * 1)}
  .ticket.nest2>.row{padding-left:calc(var(--k-space-6) * 2)}
  .ticket.nest3>.row{padding-left:calc(var(--k-space-6) * 3)}
  .ticket.nest4>.row{padding-left:calc(var(--k-space-6) * 4)}
  /* Tree guides: one hairline per ancestor indent slot plus an elbow/tee into
     the row. The host stamps the arithmetic (`subtaskGuides`/`subtaskIsLast`);
     the view paints, CSS-only and decorative (`aria-hidden`), so the guides
     never enter the accessibility tree. Each slot sits at the CENTRE of its
     indent step (left = k * --k-space-6 + --k-space-3) and reaches the next
     step's edge (--k-space-3 wide), so the horizontal arm lands exactly on the
     indented content. Consecutive rows paint abutting segments with no gap, so
     a run of `.guide--line`/`.guide--tee` reads as one continuous line. */
  .guides{position:absolute;left:0;top:0;bottom:0;width:0;pointer-events:none}
  .guide{position:absolute;top:0;bottom:0;width:var(--k-space-3)}
  .guide::before{content:"";position:absolute;left:0;top:0;bottom:0;
    border-left:var(--k-border-w) solid var(--k-border)}
  .guide::after{content:"";position:absolute;left:0;top:50%;width:var(--k-space-3);
    border-top:var(--k-border-w) solid var(--k-border)}
  /* A continuing ancestor: vertical only, no arm. */
  .guide--line::after{content:none}
  /* The elbow into a last child: vertical stops at the arm. */
  .guide--elbow::before{bottom:50%}
  /* A slot with no continuing ancestor draws nothing (structure preserved so
     the nth-child positions stay stable). */
  .guide--off::before,.guide--off::after{content:none}
  .guides>.guide:nth-child(1){left:calc(var(--k-space-6) * 0 + var(--k-space-3))}
  .guides>.guide:nth-child(2){left:calc(var(--k-space-6) * 1 + var(--k-space-3))}
  .guides>.guide:nth-child(3){left:calc(var(--k-space-6) * 2 + var(--k-space-3))}
  .guides>.guide:nth-child(4){left:calc(var(--k-space-6) * 3 + var(--k-space-3))}
  /* The collapse control for a row that has sub-tasks. Sits at the row's right
     edge (after the open control), its OWN sub-tree glyph (Tabler `list-tree`,
     or the flat-list glyph when collapsed) — never the row's expand chevron, so
     the two disclosures never look alike. Still a SEPARATE control (UI-R09:
     two independent disclosures are two buttons). */
  .subchev{margin-left:auto;flex:0 0 auto}
  /* Actions overlay the row's right edge on hover so showing them never reflows
      the row. The stage pill hides under them (same slot) to avoid overlap. The
      cluster backs itself with the SOLID --k-surface (not the translucent
      --k-surface-hover wash the row uses): the row's own text passes underneath
      on narrow rows, and a translucent backdrop would let it show through the
      icon buttons and read as a UI defect (UI-R05). The row's overflow:hidden
      clips the name text at the row boundary so it never bleeds under the
      actions overlay on narrow rows. */
  .rowacts{display:none;gap:var(--k-space-1);position:absolute;right:var(--k-space-3);top:50%;
    transform:translateY(-50%);background:var(--k-surface);border-radius:var(--k-radius-sm);
    padding-left:var(--k-space-2);opacity:0;pointer-events:none}
  /* display:none until the row is hovered or holds focus: the overlay must not
     sit over the row's open button in the resting layout (layout-sanity
     sibling-overlap), and focus-within keeps it keyboard-reachable. */
  .row:hover .rowacts,.row:focus-within .rowacts{display:flex;opacity:1;pointer-events:auto}
  /* On a row that carries a sub-tree collapse control, the hover strip starts
     one control-width further left. Both live in the row's right-edge slot —
     the strip is absolute, `.subchev` is in flow — so without the shift the
     strip's solid surface and hit area cover the chevron on hover, leaving the
     collapse control unclickable with a pointer (NDL-86). */
  .row:has(.subchev) .rowacts{right:calc(var(--k-space-3) + var(--k-hit-min))}
  .row:hover .stage{opacity:0}
  /* Cloud-session icon links (arch:CLOUD-01): in flow at the row's right edge,
     always visible; the absolute hover strip starts that many controls further
     left (--cloud-n is the session count, stamped on the row) so it never covers them. */
  .cloudlinks{display:flex;flex:0 0 auto}
  .row:has(.cloudlinks) .rowacts{right:calc(var(--k-space-3) + var(--k-hit-min) * var(--cloud-n,1))}
  .row:has(.cloudlinks):has(.subchev) .rowacts{right:calc(var(--k-space-3) + var(--k-hit-min) * (var(--cloud-n,1) + 1))}
  /* A session with no ticket has no expanded body to carry its actions, so its strip is also keyboard-reachable. */
  .cloudrow .row:focus-within .rowacts{opacity:1;pointer-events:auto}
  /* An expanded row's actions live in the mini-dashboard toolbar below, so the
     collapsed hover strip is suppressed and the stage stays the right anchor —
     never two copies of the same quick actions visible at once. */
  .ticket.open .rowacts{display:none}
  .ticket.open .row:hover .stage{opacity:1}

  /* expanded body — the compact mini-dashboard. Left padding matches the
     collapsed row's own left padding (now 0 after the chevron alignment), so
     the minidashboard starts at the chevron's visible left edge rather than
     indented under the glyph. */
  .body{display:none;padding:var(--k-space-1) var(--k-space-4) var(--k-space-5) 0}
  .ticket.open .body{display:block}

  .nextact{font-size:var(--k-text-sm);margin:var(--k-space-2) 0 var(--k-space-1);color:var(--k-text)}
  .nextact.warn{color:var(--k-failed)}
  .nextact .att{color:var(--k-text-dim);font-family:var(--k-font-mono);font-size:var(--k-text-2xs);
    margin-left:var(--k-space-2)}

  /* The stage-aware summary (peek.ts): the strongest current-state headline
     plus one small context line. Host-derived, so the standalone webview never
     phrases domain state (UI-R31). The head row puts the quick-action tools at
     the top right (the prototype's peek-tools) and the contextual CTA at the
     bottom, right-aligned — the action surface follows the prototype, not the
     card-footer bar this view shipped with. */
  .peek{margin:var(--k-space-2) 0 var(--k-space-1)}
  .peek-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--k-space-3)}
  .peek-copy{min-width:0;flex:1}
  .peek-title{font-size:var(--k-text-sm);color:var(--k-text);font-weight:var(--k-weight-medium)}
  .peek-detail{font-size:var(--k-text-xs);color:var(--k-text-dim);margin-top:var(--k-space-1)}
  /* The stable toolbar — Spin / Terminal / Dashboard / ⋯. Same quick actions
     as the collapsed hover strip, moved to the mini-dashboard's top-right so
     expanding never duplicates them (the hover strip is suppressed while open).
     The head row's justify-content:space-between pins it to the right edge. */
  .peek-tools{display:flex;align-items:center;gap:var(--k-space-1);flex:none;
    margin-top:calc(-1 * var(--k-space-1))}

  /* Gate progress (prototype progress): a thin local composition — a track +
     a fill whose width is set inline from the host-derived passed/total.
     Sits in the top zone (below the title/detail, above the separator). */
  .peek-progress{height:var(--k-space-1);border-radius:var(--k-radius-lg);overflow:hidden;
    margin-top:var(--k-space-3);
    background:color-mix(in srgb,var(--k-running) 18%,transparent)}
  .peek-progress>span{display:block;height:100%;border-radius:var(--k-radius-lg);
    background:var(--k-running)}

  /* Divider between the summary zone (title + detail + tools + progress) and
     the metadata zone (agent identity / repos / meta). The rule is always
     present when the expanded body has content — it is structural to the card,
     not conditional on any one context row. */
  .peek-sep{height:var(--k-border-w);background:var(--k-border);margin:var(--k-space-2) 0}

  /* Agent identity (prototype agentline): who is working on the ticket — the
     canonical [icon] Core · Model identity (UI-R10c), compact variant. */
  .peek-agent{margin-top:0}

  /* Ship landing rows (prototype repo-list): PR number + ready/conflict per
     repo. The state word is the non-color carrier (UI-R28), color reinforces. */
  .peek-repos{margin-top:var(--k-space-2);display:grid;gap:var(--k-space-2)}
  .peek-artifacts{margin-top:var(--k-space-2);padding:0 var(--k-space-3);font-size:var(--k-text-2xs);
    color:var(--k-text-dim);background:none;border:var(--k-border-w) solid var(--k-border);
    border-radius:var(--k-radius-pill);cursor:pointer}
  .peek-artifacts:hover{background:var(--k-surface-hover)}
  .peek-artifacts:focus-visible{outline:var(--k-focus-w) solid var(--k-focus);outline-offset:var(--k-focus-offset)}
