<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--KARST_CSP-->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
  /*KARST_DS_CSS*/

      body {
        font-family: var(--k-font-ui);
        color: var(--k-text);
        padding: var(--k-space-8) var(--k-space-9);
        max-width: 58ch;
        line-height: var(--k-leading-normal);
      }
      h1 { font-size: var(--k-text-xl); margin: 0 0 var(--k-space-2); }
      p.lede { margin: 0 0 var(--k-space-8); color: var(--k-text-dim); }
      section { margin-bottom: var(--k-space-9); }
      h2 {
        font-size: var(--k-text-lg);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--k-text-dim);
      }
      ul { list-style: none; padding: 0; margin: 0; }
      li { padding: var(--k-space-5) 0; border-bottom: var(--k-border-w) solid var(--k-border); }
      .item-head { display: flex; align-items: center; gap: var(--k-space-4); }
      .detail {
        margin: var(--k-space-2) 0 0 var(--k-space-9);
        font-size: var(--k-text-sm);
        color: var(--k-text-dim);
        white-space: pre-wrap;
      }
      .item-action, .step-action { margin-top: var(--k-space-3); }
      .steps { counter-reset: step; }
      .steps li { display: flex; gap: var(--k-space-6); align-items: baseline; }
      .steps li::before {
        counter-increment: step;
        content: counter(step);
        font-weight: var(--k-weight-semibold);
        min-width: var(--k-space-8);
        color: var(--k-link);
      }
      .step-body { flex: 1; }
      .step-desc { font-size: var(--k-text-sm); color: var(--k-text-dim); }
      .toolbar { display: flex; gap: var(--k-space-4); margin-top: var(--k-space-4); }
      footer { margin-top: var(--k-space-9); color: var(--k-text-dim); }
    </style>
  </head>
  <body>
    <h1>Welcome to Karst</h1>
    <p class="lede">Orchestrate AI-agent ticket workflows across your repos. Finish setup below.</p>

    <section>
      <h2>Setup checklist</h2>
      <ul id="checklist"></ul>
      <div class="toolbar">
        <button type="button" class="k-btn k-btn--secondary" id="recheck"
          title="Re-run the setup checklist against disk and PATH">Re-check</button>
      </div>
    </section>

    <section>
      <h2>How Karst works</h2>
      <ul class="steps" id="tutorial"></ul>
    </section>

    <footer>
      <button type="button" class="k-btn k-btn--ghost" id="dismiss">Don't show this again</button>
    </footer>

    <script>
  /*KARST_DS_JS*/

      const vscode = acquireVsCodeApi();
      const post = (type, requestId) => vscode.postMessage(requestId ? { type, requestId } : { type });

      function renderChecklist(items) {
        const ul = document.getElementById('checklist');
        ul.innerHTML = '';
        for (const it of items) {
          const li = document.createElement('li');
          const head = document.createElement('div');
          head.className = 'item-head';
          const dot = document.createElement('span');
          dot.className = 'k-dot ' + (it.done ? 'k-dot--passed' : 'k-dot--failed');
          dot.setAttribute('role', 'img');
          dot.setAttribute('aria-label', it.done ? 'Done' : 'Not done');
          const label = document.createElement('span');
          label.textContent = it.label;
          head.append(dot, label);
          li.append(head);
          if (it.detail) {
            const d = document.createElement('div');
            d.className = 'detail';
            d.textContent = it.detail;
            li.append(d);
          }
          if (it.id === 'manifest' && !it.done) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'k-btn k-btn--primary item-action';
            b.textContent = 'Create karst.yml';
            b.title = 'Write a starter karst.yml to the workspace root';
            karstAction(b, (requestId) => post('create-manifest', requestId));
            li.append(b);
          }
          ul.append(li);
        }
      }

      function renderTutorial(steps) {
        const ul = document.getElementById('tutorial');
        ul.innerHTML = '';
        for (const s of steps) {
          const li = document.createElement('li');
          const body = document.createElement('div');
          body.className = 'step-body';
          const label = document.createElement('div');
          label.textContent = s.label;
          const desc = document.createElement('div');
          desc.className = 'step-desc';
          desc.textContent = s.description;
          body.append(label, desc);
          if (s.action === 'settings' || s.action === 'create-ticket') {
            const isSettings = s.action === 'settings';
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'k-btn k-btn--secondary k-btn--sm step-action';
            b.textContent = isSettings ? 'Open Settings' : 'Create Ticket';
            b.title = isSettings ? 'Open the Karst settings panel' : 'Open the create-ticket panel';
            karstAction(b, (requestId) => post(isSettings ? 'open-settings' : 'create-ticket', requestId));
            body.append(b);
          }
          li.append(body);
          ul.append(li);
        }
      }

      window.addEventListener('message', (event) => {
        const msg = event.data;
        if (msg.type === 'state') {
          renderChecklist(msg.state.checklist);
          renderTutorial(msg.state.tutorial);
        } else if (msg.type === 'action-result') {
          karstSettle(msg.requestId, msg.ok, msg.message);
        }
      });

      karstAction(document.getElementById('recheck'), (requestId) => post('recheck-deps', requestId));
      karstAction(document.getElementById('dismiss'), (requestId) => post('dismiss', requestId));
      post('request-state');
    </script>
  </body>
</html>
