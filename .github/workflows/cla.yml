name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

# pull_request_target runs against the BASE repo with write access, so it must
# never check out or execute PR-authored code. This workflow only reads PR
# metadata and writes the signature file — no checkout of the head ref.
permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: Check CLA signature
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check or record CLA signature
        if: >
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/AndrewHaluza/karst/blob/main/CLA.md
          path-to-signatures: signatures/v1/cla.json
          branch: cla-signatures
          allowlist: AndrewHaluza,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >
            Thanks for the pull request.


            Karst requires a signed [Contributor License
            Agreement](https://github.com/AndrewHaluza/karst/blob/main/CLA.md)
            before any contribution can be merged. You keep the copyright in
            your work — the CLA grants permission to use it, including under
            the Apache 2.0 conversion promised in the LICENSE.


            To sign, post a comment on this pull request containing exactly:
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: >
            All contributors have signed the CLA. Thanks!
