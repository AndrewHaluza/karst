name: CI

on:
  pull_request:
    branches: [main, develop]
    # `edited` re-runs docs-gate when the PR body changes (a citation can be added there).
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, develop]
  # Daily backstop for the branch-drift job. `push` only fires when main
  # actually moves, so a promotion that silently drifts (or a reverted one)
  # could otherwise go unchecked for days. Note the scheduled run checks out
  # the repository default branch — which is why branch-drift compares the
  # explicit `origin/main` and `origin/develop` refs instead of `HEAD`.
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build, unit
    # The scheduled run exists only for branch-drift; the test suite must not
    # run on a timer.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # A fresh runner has no global git identity and no init.defaultBranch.
      # Most test fixtures configure a repo-local identity themselves, but any
      # that commit without one fail with "Author identity unknown", which is
      # an opaque failure to diagnose from a CI log.
      - name: Configure git for test fixtures
        run: |
          git config --global user.name "karst-ci"
          git config --global user.email "ci@karst.invalid"
          git config --global init.defaultBranch main

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # R-X4 (NDL-126 §9.4): `react-hooks` is scoped to src/ui/settings/app.
      # It only enforces anything if it runs in CI — an advisory local script
      # lets a derived-state-in-effect slip through to review.
      - name: Lint React app
        run: npm run lint:react

      - name: Docs keyed-block lint and index
        run: npm run -s docs:check

      - name: Architecture import map check
        run: npm run -s docs:graph -- --check

      - name: Mermaid diagram check
        run: npm run -s docs:mermaid

      # The generated map is only useful if the rules it documents actually
      # hold. .dependency-cruiser.cjs is the enforcement (docs @arch:MAP-03).
      - name: Layer rules
        run: npx depcruise src --config .dependency-cruiser.cjs

      - name: Build
        run: npm run build

      # docs:schema applies src/store/migrations.ts to an in-memory SQLite
      # database. It answers through better-sqlite3 when the addon is built
      # for this Node and through node:sqlite otherwise, so the rebuild below
      # only decides WHICH driver answers — the store's own. Build/typecheck do
      # not load the addon; this job never launches the extension host, so
      # there is no Electron ABI to restore afterwards (@arch:ABI-01).
      # pretest:unit below repeats the rebuild as a no-op.
      - name: Rebuild better-sqlite3 for the Node ABI
        run: npm run rebuild:node

      - name: Live schema ER check
        run: npm run -s docs:schema -- --check

      # `pretest:unit` rebuilds better-sqlite3 for the Node ABI. This job runs
      # the unit suite only; the integration job below is self-sufficient.
      - name: Unit tests
        run: npm run test:unit

  # Runs the `*.integration.test.*` and `*.e2e.test.*` suites as a parallel job.
  # They used to share the verify job with the unit suite (and the e2e files ran
  # twice, since the unit include matched them). Splitting by filename suffix
  # means each file runs in exactly one suite, and the two jobs no longer have
  # an ordering dependency: `pretest:integration` gives this job its own
  # better-sqlite3 rebuild.
  integration:
    name: Integration and e2e
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Several integration suites create real git repos and commit in temp
      # dirs, so the same global identity the unit job configures is required.
      - name: Configure git for test fixtures
        run: |
          git config --global user.name "karst-ci"
          git config --global user.email "ci@karst.invalid"
          git config --global init.defaultBranch main

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Integration and e2e tests
        run: npm run test:integration

  # Non-blocking (advisory): records the ST2B Linux verdict for the docker
  # sandbox backend live (arch:AC-32) — image build, bind-mount uid behaviour,
  # loopback port publish, `--network none` isolation. Credential-free.
  docker-sandbox-linux:
    name: Docker sandbox (Linux, advisory)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure git for the spike fixtures
        run: |
          git config --global user.name "karst-ci"
          git config --global user.email "ci@karst.invalid"
          git config --global init.defaultBranch main
      - name: Linux docker sandbox checks
        run: bash spikes/docker-sandbox/opencode/linux-ci.sh

  # Blocking (arch:DOC-03): a PR whose diff touches a symbol listed in a docs
  # block's `covers:` must cite that block in the PR body or edit it. The body
  # reaches the script through `env:` only — never interpolate it into `run:`
  # (script injection). The script has no npm dependencies, so no `npm ci`.
  docs-gate:
    name: Docs gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check covered symbols are cited or documented
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/docsGate.mjs

  mutation:
    name: Mutation score
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 so the "changed files" step below can three-dot diff
      # against origin/<base>; the default shallow clone has no merge base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Stryker runs vitest, which loads better-sqlite3, and `test:mutation`
      # has no pre-hook of its own. Rebuild explicitly.
      - name: Rebuild better-sqlite3 for the Node ABI
        run: npm run rebuild:node

      # Blocking gate (CI-MAKE-MUTATION-SCORE-JOB): the score is global
      # across src/extension/**, but it is a contract. No `continue-on-error`
      # here — a run below thresholds.break (85) exits 1 and fails the job.
      # Incremental: Stryker re-tests only mutants whose source or covering
      # tests changed since the cached run, and reuses the rest. Reused results
      # still count, so the score stays global. Restore the newest cache from
      # any run (restore-keys); save a fresh one per commit.
      - name: Restore the Stryker incremental cache
        uses: actions/cache@v4
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Run Stryker
        id: stryker
        # Local config is silent (html+json only); CI wants the per-file table in the log.
        run: npm run test:mutation -- --logLevel info --reporters clear-text,html,json --incremental --incrementalFile reports/stryker-incremental.json

      # The changed-file list powers the inline annotations, so compute it
      # before the report. `|| true` (and the `if: always()`) keep a diff
      # failure from failing the job on its own — the report degrades to no
      # annotations instead.
      - name: Compute the PR's changed files
        if: always()
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "$BASE_REF" || true
          git diff --name-only "origin/$BASE_REF...HEAD" > changed-files.txt || true
          echo "Changed files:"; cat changed-files.txt

      # Replaces the old "exit code 1 and nothing else" publish step: turn the
      # JSON reporter's output into a run-summary table and inline warnings on
      # the PR's touched lines. The script exits 0 even when the report is
      # missing, so this step never masks the Stryker verdict — the job's
      # pass/fail is the Stryker step alone, and a failing run still shows the
      # report here.
      - name: Publish the mutation mini report
        if: always()
        run: |
          node scripts/mutationSummary.mjs \
            --report reports/mutation/mutation.json \
            --config stryker.config.json \
            --changed changed-files.txt \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: Visual regression (blocks new breaks)
    # Scheduled runs only carry branch-drift; skip the visual sweep on a timer.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # github-script lists develop's runs to find the red-set artifact.
    permissions:
      contents: read
      actions: read
    # The baselines under tests/visual/__baselines__/ carry no {platform} token
    # (see playwright.config.ts's snapshotPathTemplate), so they are valid for
    # exactly ONE rendering environment. This image is that environment, and its
    # tag must stay in lockstep with the pinned @playwright/test version —
    # a different tag ships a different Chromium and invalidates all 82 PNGs.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 20
    steps:
      # Depth 2, not the default 1: on a pull_request the checkout is the merge
      # commit, and scripts/visual-sweep-gate.mjs diffs HEAD^1..HEAD (the base
      # tip against the merge) to learn which baselines THIS PR added or
      # changed. Their failures are blocking, as is any screenshot that is red here
      # but not in develop's red set; screenshots already red on develop stay
      # advisory.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # No actions/setup-node here on purpose: the Playwright image ships its
      # own Node, and layering setup-node over a container image is a known
      # source of PATH and npm-cache confusion. The image must satisfy .nvmrc.
      - name: Report the container's Node version
        run: |
          node --version
          echo "expected major: $(cat .nvmrc)"

      # The image ships browsers, not this repository's node_modules. tsx (used
      # by tests/visual/serve.mjs to generate fixture pages) and the TypeScript
      # toolchain both come from here. install:visual-browsers is deliberately
      # NOT run — the image already provides Chromium.
      - run: npm ci

      # The webview sender bundles (gitignored esbuild output of
      # scripts/build-webview-send.mjs) must exist before the sweep: fixture
      # generation hydrates webview.html through the REAL injector chain, which
      # readFileSync's `webviewSend.webview.js`. Until NDL-218 only vitest's
      # globalSetup built them, so this job died on startup with
      # ENOENT webviewSend.webview.js — masked by `continue-on-error: true`.
      # serve.mjs now also builds them on demand (it is the path the docker
      # script takes); doing it here as well fails fast and names the
      # prerequisite in the job log.
      - name: Build the webview bundles
        run: node scripts/build-webview-send.mjs

      # tests/visual is excluded from the main tsconfig, so its type errors are
      # only visible through this config — and they belong to this job, not to
      # the blocking verify job.
      - name: Typecheck the visual sweep
        run: npm run typecheck:visual

      # On a PR: fetch develop's red set (visual-red-develop.json, uploaded by
      # every develop push run) so the gate can tell new breaks from inherited
      # drift. Use the run for the PR's base sha, else the closest completed develop run
      # NEWER than the base (never an older one: it would blame the PR for
      # breaks already on develop; a red unrelated job must not switch the gate off). Any failure here leaves the set absent and the
      # gate falls back to the own-baseline rule; a missing artifact never fails.
      - name: Find develop's red set
        id: develop-red
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const base = context.payload.pull_request.base.sha;
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'ci.yml', branch: 'develop',
              event: 'push', status: 'completed', per_page: 30,
            });
            // Newest first. Only the run for the base sha or a DESCENDANT of it
            // is usable: an older run predates breaks already on develop and
            // would blame this PR for them. Of the descendants take the oldest
            // (closest to base). Once a run is older than base, all later are.
            let nearest;
            for (const run of data.workflow_runs) {
              const { data: arts } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id, name: 'visual-red-develop',
              });
              if (arts.artifacts.length === 0 || arts.artifacts[0].expired) continue;
              if (run.head_sha === base) { nearest = run.id; break; }
              const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `${base}...${run.head_sha}`,
              });
              if (cmp.status !== 'ahead') break;
              nearest = run.id;
            }
            if (nearest) core.setOutput('run-id', nearest);

      - name: Download develop's red set
        id: develop-red-download
        if: github.event_name == 'pull_request' && steps.develop-red.outputs.run-id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: visual-red-develop
          path: develop-red
          run-id: ${{ steps.develop-red.outputs.run-id }}
          github-token: ${{ github.token }}

      # Blocking rules live in scripts/visual-sweep-gate.mjs, hence no
      # `continue-on-error` here: it fails the job for a run that executed zero
      # tests (NDL-218), a baseline the PR itself added or changed that does not
      # match its own screenshot (#769), and on a PR a screenshot that fails
      # here but is not red on develop. Screenshots red on develop stay
      # advisory, and so does everything when no develop red set was fetched.
      - name: Run the visual sweep
        id: visual
        run: |
          rm -f tests/visual/.results.json
          set +e
          npm run test:visual
          code=$?
          set -e
          echo "playwright-exit-code=${code}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.develop-red-download.outcome }}" = "success" ]; then
            export VISUAL_RED_DEVELOP="$PWD/develop-red/visual-red-develop.json"
          fi
          node scripts/visual-sweep-gate.mjs

      - name: Publish the outcome to the run summary
        if: always()
        run: |
          {
            echo '## Visual regression'
            echo
            echo "Sweep step outcome: \`${{ steps.visual.outcome }}\`"
            echo "Playwright exit code: \`${{ steps.visual.outputs.playwright-exit-code }}\` (screenshots already red on develop are advisory; the gate fails the job when zero tests ran, this PR's own added/changed baseline fails, or a screenshot is red here but not on develop)"
            echo
            if [ -f tests/visual/.results.json ]; then
              executed="$(node -e "const s = require('./tests/visual/.results.json').stats || {}; console.log((s.expected || 0) + (s.unexpected || 0) + (s.flaky || 0))" 2>/dev/null || echo 0)"
              echo "Tests executed: \`${executed}\`"
              if [ "$executed" -gt 0 ]; then
                echo 'See the uploaded `visual-report` artifact for the diff viewer.'
              else
                echo 'Zero tests executed — the sweep never started. That is a hard failure, not an advisory diff.'
              fi
            else
              echo 'No Playwright results — the sweep did not run. That is a hard failure, not an advisory diff.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # `.report` is a DOT-prefixed directory, and upload-artifact@v4 drops
      # every path that passes through a hidden segment unless
      # `include-hidden-files` is on — with the default the step "succeeds"
      # while silently uploading nothing (the missing `visual-report` artifact
      # in NDL-218, which read as a healthy job). `if-no-files-found: error`
      # so a report that should exist can never vanish quietly again.
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: tests/visual/.report/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      # Develop's red set (failed + flaky screenshots), consumed by PR runs (see "Find develop's red set").
      # The gate writes it on every run; only develop pushes publish it.
      - name: Upload develop's red set
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: visual-red-develop
          path: tests/visual/visual-red-develop.json
          if-no-files-found: ignore
          retention-days: 30

  # Branch policy guard (NDL-52 phase 4.4): `main` is the release branch, so it
  # must only advance by promoting `develop` or by a `hotfix/*` branch. Any
  # other PR into main is redirected to develop before it can merge.
  main-source-guard:
    name: main-source-guard
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # The head ref is author-controlled (anyone can name a branch), so it is
      # handed to the step through `env:` and read as a shell variable. Splicing
      # `${{ github.head_ref }}` directly into `run:` would interpolate the
      # branch name into the script and allow command injection.
      - name: Reject PRs into main from anything but develop or hotfix/*
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          case "$HEAD_REF" in
            develop|hotfix/*)
              echo "OK: '$HEAD_REF' may target main."
              ;;
            *)
              echo "::error::PRs into main must come from 'develop' (or a 'hotfix/*' branch), not '$HEAD_REF'. Retarget this PR: gh pr edit ${PR_NUMBER} --base develop"
              exit 1
              ;;
          esac

  # Invariant: main never carries a non-merge commit that develop lacks. If it
  # does, a promotion was skipped or a hotfix was not back-merged, and the two
  # branches keep re-diverging until a merge commit pulls main into develop.
  branch-drift:
    name: branch-drift
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 is required: the check walks the full history of both
      # branches. actions/checkout only guarantees the triggering ref, so both
      # branches are also fetched explicitly below.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if main has commits missing from develop
        run: |
          git fetch --no-tags origin main develop
          # Compare origin/main against origin/develop, never HEAD. The default
          # branch is develop, so a scheduled run checks out develop and HEAD
          # would hide exactly the drift this job exists to catch.
          drift="$(git rev-list --no-merges origin/main --not origin/develop)"
          if [ -n "$drift" ]; then
            echo "main has $(printf '%s\n' "$drift" | wc -l) non-merge commit(s) missing from develop:"
            git log --oneline --no-merges origin/main --not origin/develop
            echo "::error::main is ahead of develop. Open a main→develop back-merge PR (merge commit)."
            exit 1
          fi
          echo "OK: develop contains every non-merge commit on main."
